name: Deploy to GitHub Pages

# Publishes https://zero-hour.sunken.dev/ every time main changes. The build rebuilds the PDF manual
# from the manual's own source, so the published PDF always matches the published manual.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time. Queued runs wait rather than cancelling a deployment in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: browser-actions/setup-chrome@v2
        id: chrome

      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Test
        run: npm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Build the site
        run: npm run build
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
