name: CI

# Runs the tests and a full site build for pull requests and for branches other than main.
# Nothing is published from here.

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Test
        run: npm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Build the site
        run: npm run build
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Keep the built site for review
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
