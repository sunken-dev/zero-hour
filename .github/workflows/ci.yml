name: CI

# Tests and builds the site for pull requests and for branches other than main.
# Nothing is published from here; main is deployed by deploy.yml.

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: browser-actions/setup-chrome@v2
        id: chrome


      - name: Test
        run: npm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Build the site
        run: npm run build
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Keep the built site for review
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          include-hidden-files: true
          retention-days: 7
