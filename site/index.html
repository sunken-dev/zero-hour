<style id="css">
:root{
  --abyss:#060b10; --deep:#0a1319; --plate:#0b141a;
  --ice:#d6eef3; --mute:#7f98a3;
  --cyan:#43dfff; --amber:#ffb224; --red:#ff3b5c; --mint:#4dffb0;
  --ui:'Chakra Petch',system-ui,sans-serif;
  --mono:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;
  --cut:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  --cut8:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
*{box-sizing:border-box}
/* Scrollbars: themed everywhere. Styled with ::-webkit-scrollbar they stay visible in Chrome and Safari, also where the
   system would hide them; setting scrollbar-color or scrollbar-width would switch that styling off, so those are only
   for browsers without ::-webkit-scrollbar (Firefox). */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#06111a}
::-webkit-scrollbar-thumb{background:#43dfff55;border:2px solid #06111a;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#43dfff99}
::-webkit-scrollbar-corner{background:#06111a}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:#43dfff88 #06111a}}
html,body{margin:0}
body{
  font-family:var(--ui);color:var(--ice);min-height:100vh;
  background:
    radial-gradient(900px 600px at 78% -5%,#113344 0,#0000 62%),
    radial-gradient(800px 620px at 0% 100%,#1c1238 0,#0000 60%),
    var(--abyss);
}
body.manual-page{background:var(--deep)}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
::selection{background:transparent}
body.manual-page,body.manual-page *{-webkit-user-select:text;user-select:text}   /* only the stand-alone manual page can be selected */
body.manual-page ::selection{background:#43dfff55}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
svg{display:block}

/* ================= start page ================= */
.start{max-width:1560px;margin:0 auto;padding:34px 24px 48px;min-height:100vh;display:grid;
  grid-template-columns:minmax(300px,510px) minmax(0,1fr);gap:clamp(40px,7vw,140px);align-items:center}
.lockup{display:flex;align-items:center;gap:22px;margin-bottom:22px}
.word{width:226px}
.word b,.word span{display:block;font-size:54px;line-height:.92;text-align:justify;text-align-last:justify;letter-spacing:.05em}
.word b{font-weight:700}
.word span{font-weight:300}
.tagline{margin:0 0 22px;color:var(--mute);font-size:15px;letter-spacing:.04em}
.start p{max-width:52ch;font-size:17px;line-height:1.55;color:#b4cbd2;margin:0 0 12px}
.opts{margin:26px 0 26px;display:grid;gap:18px}
.opt b{display:block;font-weight:500;margin-bottom:8px;font-size:14px;color:var(--ice)}
.seg-ctl{display:flex;gap:6px;flex-wrap:wrap}
.seg-ctl button{padding:8px 16px;background:#43dfff10;border:1px solid #43dfff44;clip-path:var(--cut8)}
.seg-ctl button[aria-pressed=true]{background:var(--cyan);color:#021117;border-color:var(--cyan);font-weight:600}
.arm{padding:11px 16px;font-weight:700;font-size:15px;letter-spacing:.04em;border:1px solid var(--amber);background:var(--amber);color:#1b1200;white-space:nowrap;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.arm.diff-easy{background:var(--mint);border-color:var(--mint);color:#021117}.arm.diff-hard{background:var(--red);border-color:var(--red);color:#fff}
.arm:hover{filter:brightness(1.1)}
.arm:active{transform:translateY(1px)}
.start a{color:var(--cyan);margin-left:20px;font-size:15px}
.demo{height:min(76vh,680px);min-height:380px}
.demo-cap{position:absolute;left:14px;bottom:12px;font-size:13px;color:var(--mute);z-index:3;pointer-events:none}
.logo-mark .tk{animation:tk .3s both}
@keyframes tk{from{opacity:0}to{opacity:1}}

/* ================= game chrome ================= */
.game{display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #43dfff1f;position:relative;z-index:6}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;font-weight:700;letter-spacing:.16em;font-size:15px}
.hud{display:flex;align-items:center;gap:12px;padding:3px 12px;background:#06111699;border:1px solid #43dfff33;clip-path:var(--cut8)}
.hud .t{font:22px/1 var(--mono);color:var(--cyan);min-width:74px;text-align:center;text-shadow:0 0 10px #43dfff66}
.hud .t.low{color:var(--red);text-shadow:0 0 10px #ff3b5c88}
.hud .s{display:flex;gap:4px}
.hud .s i{width:10px;height:20px;border:1px solid #43dfff44}
.hud .s i.on{background:var(--red);border-color:var(--red);box-shadow:0 0 8px var(--red)}
.tbtn{color:var(--ice);padding:6px 14px;font-size:14px;background:#43dfff10;border:1px solid #43dfff44;clip-path:var(--cut8)}
.tbtn:hover{background:#43dfff24}

/* ================= 3D stage ================= */
.stage{position:relative;overflow:hidden;perspective:1700px;perspective-origin:50% 42%;
  user-select:none;-webkit-user-select:none;cursor:grab;touch-action:none;
  background:radial-gradient(60% 55% at 50% 48%,#12313f66 0,#0000 70%)}
.game .stage{flex:1;min-height:440px}
.stage.narrow{touch-action:pan-y}
.stage.drag{cursor:grabbing}
.stage button,.stage [role=button]{cursor:pointer}
.floor{position:absolute;left:50%;bottom:-14%;width:170%;height:62%;transform:translateX(-50%) perspective(760px) rotateX(70deg);
  background:linear-gradient(#43dfff1c 1px,#0000 1px) 0 0/60px 60px,linear-gradient(90deg,#43dfff1c 1px,#0000 1px) 0 0/60px 60px;
  -webkit-mask:radial-gradient(closest-side,#000 25%,#0000 85%);mask:radial-gradient(closest-side,#000 25%,#0000 85%);pointer-events:none}
.pool{position:absolute;left:50%;bottom:8%;width:62%;height:46px;transform:translateX(-50%);
  background:radial-gradient(closest-side,#000c,#0000);pointer-events:none}
.bomb3d{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.bomb3d.blast .face{opacity:0;transition:opacity .45s ease-in .08s}

.face{position:absolute;left:50%;top:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:
    linear-gradient(135deg,#ffffff10 0,#0000 38%),
    repeating-linear-gradient(90deg,#fff0 0,#ffffff05 2px,#fff0 4px),
    linear-gradient(180deg,#2b3b47,#16212a);
  border:5px solid;border-color:#4a5e6e #2d3d49 #1a2630 #364955;
  box-shadow:inset 0 0 0 1px #000b,inset 0 0 0 7px #111b22,inset 0 0 0 8px #43dfff38,inset 0 0 70px #000b}
/* The shading of a face turned away from the light: a dark film lying just on the plate, below every part mounted on
   it. Higher up it would cut through the parts (bezels are 4px tall) and their edges would flicker as the case turns. */
.face::after{content:"";position:absolute;inset:0;background:#02060a;opacity:var(--dim,0);pointer-events:none;z-index:30;transform:translateZ(.15px);backface-visibility:hidden}
/* Smooth the edges of 3D facets (a transparent outline makes the browser anti-alias them) */
.cb>*,.fz,.fc,.cz-top,.disc{outline:1px solid transparent}
.face,.face *{transform-style:preserve-3d;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.f-front,.f-back{width:var(--W);height:var(--H);margin:calc(var(--H)/-2) 0 0 calc(var(--W)/-2)}
.f-left,.f-right{width:var(--D);height:var(--H);margin:calc(var(--H)/-2) 0 0 calc(var(--D)/-2)}
.f-top,.f-bottom{width:var(--W);height:var(--D);margin:calc(var(--D)/-2) 0 0 calc(var(--W)/-2)}
.f-front{transform:translateZ(calc(var(--D)/2))}
.f-back{transform:rotateY(180deg) translateZ(calc(var(--D)/2))}
.f-right{transform:rotateY(90deg) translateZ(calc(var(--W)/2))}
.f-left{transform:rotateY(-90deg) translateZ(calc(var(--W)/2))}
.f-top{transform:rotateX(90deg) translateZ(calc(var(--H)/2))}
.f-bottom{transform:rotateX(-90deg) translateZ(calc(var(--H)/2))}
.fi{position:absolute;inset:0;padding:var(--P)}

/* front band: clock + strikes */
.band{height:var(--TB);margin-bottom:14px}
.f-front .band{display:grid;grid-template-columns:1fr auto auto;gap:12px}
.diff-plate{width:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(#cfdadf,#8da0aa);border-radius:3px;box-shadow:0 2px 4px #000a,inset 0 1px 0 #fff8;--dc:var(--amber)}
.diff-plate.diff-easy{--dc:var(--mint)}.diff-plate.diff-hard{--dc:var(--red)}
.diff-plate b{writing-mode:vertical-rl;transform:rotate(180deg);font:700 12px var(--mono);letter-spacing:.14em;color:#0b141a}
.screen{position:relative;background:linear-gradient(#04141a,#08212a);border:1px solid #43dfff55;padding:8px 18px 10px;overflow:hidden;
  box-shadow:inset 0 0 44px #000d,0 0 26px #43dfff1a;display:flex;flex-direction:column;justify-content:center;
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
.screen::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#fff0 0,#ffffff06 2px,#fff0 4px);pointer-events:none}
.clock{position:relative;font:78px/1 var(--mono);text-align:center;color:var(--cyan);text-shadow:0 0 24px #43dfff66;letter-spacing:.03em}
.clock .ghost{position:absolute;inset:0;color:#43dfff14;text-shadow:none}
.clock .live{position:relative}
.clock.low{color:var(--red);text-shadow:0 0 24px #ff3b5c77}
.clock.low .ghost{color:#ff3b5c18}
.bar{height:8px;margin-top:10px;background:#43dfff18;
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,#0000 6px 8px);mask:repeating-linear-gradient(90deg,#000 0 6px,#0000 6px 8px)}
.bar i{display:block;height:100%;background:var(--cyan)}
.bar.low-bar{background:#ff3b5c26}
.bar.low-bar i{background:var(--red)}
.strikecol{display:flex;flex-direction:column;gap:7px;justify-content:center}
.strike{position:relative;width:56px;height:34px}
.strike .cb{--c:#14232b;--top:linear-gradient(#10202a,#0a151c)}
.strike .t{display:grid;place-items:center;font:22px var(--mono);color:#43dfff44;box-shadow:inset 0 0 0 1px #43dfff33}
.strike.on .cb{--c:#7a1228;--top:radial-gradient(#ff8aa0,#ff3b5c 60%,#a01430)}
.strike.on .t{color:#fff;box-shadow:inset 0 0 0 1px #ffb0bd,0 0 18px var(--red),0 0 40px #ff3b5c88}

/* back band: service hatch */
.service{display:flex;align-items:center;gap:20px;padding:0 22px;border:1px solid #43dfff2a;
  background:repeating-linear-gradient(90deg,#05090c 0 7px,#22313c 7px 9px),#0b1319;position:relative}
.service::before{content:"";position:absolute;inset:14px 0 14px 0;background:#0b1319e6}
.service>*{position:relative}
.svc-txt b{display:block;font-size:18px;letter-spacing:.08em}
.svc-txt span{font-size:13px;color:var(--mute)}
.hazard{margin-left:auto;width:170px;height:34px;background:repeating-linear-gradient(135deg,var(--amber) 0 12px,#10181d 12px 24px);opacity:.9}

/* bays */
.bays{display:grid;grid-template-columns:repeat(var(--cols),var(--SW));grid-template-rows:repeat(var(--rows),var(--SH));gap:14px;justify-content:center}
.bay{position:relative;min-width:0;min-height:0}
.blank{position:relative;height:100%;background:
    repeating-linear-gradient(0deg,#04080b 0 7px,#1e2b35 7px 9px),#0a1117;border:1px solid #43dfff1f;box-shadow:inset 0 0 40px #000c}
.blank::before{content:"";position:absolute;inset:18px 26px;background:#0a1117e8;border:1px solid #43dfff14}
.blank i{position:absolute;width:12px;height:13px;background:radial-gradient(circle,#05090c 24%,#4a5e6e 26%);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.blank i:nth-child(1){left:8px;top:8px}.blank i:nth-child(2){right:8px;top:8px}
.blank i:nth-child(3){left:8px;bottom:8px}.blank i:nth-child(4){right:8px;bottom:8px}

/* side faces + widgets */
.side{position:absolute;inset:0;padding:16px;display:grid;gap:8px}
.side.v{grid-template-rows:repeat(var(--wr),1fr)}
.side.hz{grid-template-columns:repeat(var(--wc),1fr)}
.cell{position:relative;display:grid;place-items:center;min-width:0;min-height:0}
.cell.empty::before{content:"";width:62%;height:56%;opacity:.8}
.cell.d0::before{background:repeating-linear-gradient(0deg,#04080b 0 6px,#25343f 6px 8px)}
.cell.d1::before{background:repeating-linear-gradient(135deg,#ffb22499 0 9px,#10181d 9px 18px);height:22%}
.cell.d2::before{border:1px solid #43dfff2a;background:radial-gradient(circle at 20% 30%,#43dfff22 0 2px,#0000 3px),radial-gradient(circle at 80% 70%,#43dfff22 0 2px,#0000 3px)}
.w-serial{width:152px;--c:#b4c3ca;--top:linear-gradient(180deg,#ffffff,#dbe5e9)}
.w-serial>.t{padding:8px 11px 9px;color:#0b141a;box-shadow:inset 0 0 0 1px #0b141a55,inset 0 0 0 3px #ffffff}
.w-serial small{display:block;font-size:11px;letter-spacing:.1em;opacity:.65}
.w-serial b{display:block;font:27px/1.15 var(--mono);letter-spacing:.08em}
.w-serial .bc{margin-top:4px;height:17px}
.bar-code{width:100%;height:100%}
.w-batt{--c:#18262e;--top:linear-gradient(#0d171d,#070d11)}
.w-batt>.t{padding:16px 9px;display:flex;flex-direction:column;align-items:center;gap:18px;border:1px solid #43dfff33;box-shadow:inset 0 0 18px #000}
.bcell{position:relative;flex:none}
.bcell .sh{position:absolute;left:3px;right:3px;top:3px;bottom:3px;background:#000;opacity:.5;border-radius:12px;filter:blur(3px);transform:translateZ(.5px)}
.bcell .tube{position:absolute;top:0}
.bcell .disc{position:absolute;border-radius:50%;background:radial-gradient(circle,#e3ebee,#8a99a1)}
.tube.banded .fc{background:
  linear-gradient(rgb(0 0 0 / calc((1 - var(--b)) * .78)),rgb(0 0 0 / calc((1 - var(--b)) * .78))),
  linear-gradient(rgb(255 255 255 / calc((var(--b) - .7) * 1.7)),rgb(255 255 255 / calc((var(--b) - .7) * 1.7))),
  linear-gradient(90deg,var(--k1) 0 var(--p1),var(--k2) var(--p1) var(--p2),var(--k3) var(--p2) 100%)}
.bcell .tube.spring .fc{background:repeating-linear-gradient(90deg,#d6dde1 0 1.1px,#323a40 1.1px 2.2px)}
.w-ind{width:148px;--c:#18262e;--top:linear-gradient(#0d171d,#070d11)}
.w-ind>.t{height:70px;padding:0 14px;display:flex;align-items:center;gap:14px;border:1px solid #43dfff33;box-shadow:inset 0 0 18px #000}
.w-ind .lens{position:relative;flex:none;width:30px;height:30px}
.w-ind .lens i{position:absolute;border-radius:50%}
.w-ind .lens i:nth-child(1){inset:0;background:#3a4a55;transform:translateZ(1px)}
.w-ind .lens i:nth-child(2){inset:2px;background:#0b141a;transform:translateZ(2px)}
.w-ind .lens i:nth-child(3){inset:3px;background:#1a2831;transform:translateZ(3.2px)}
.w-ind .lens i:nth-child(4){inset:4px;background:#22333e;transform:translateZ(4.4px)}
.w-ind .lens i:nth-child(5){inset:5px;background:#2b3e4a;transform:translateZ(5.6px)}
.w-ind .lens i:nth-child(6){inset:6px;background:radial-gradient(circle at 36% 30%,#46596a,#0d161c 75%);transform:translateZ(6.8px)}
.w-ind b{font:28px/1 var(--mono);letter-spacing:.1em;color:#6b838e}
.w-ind.lit .lens i:nth-child(3){background:#0a5668}
.w-ind.lit .lens i:nth-child(4){background:#0c7a92}
.w-ind.lit .lens i:nth-child(5){background:#12a4c2}
.w-ind.lit .lens i:nth-child(6){background:radial-gradient(circle at 36% 30%,#fff,var(--cyan) 40%,#0a6a80);box-shadow:0 0 16px var(--cyan),0 0 36px #43dfff88}
.w-ind.lit b{color:var(--cyan);text-shadow:0 0 8px #43dfff88}

/* view dock */
.dock{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3px;
  padding:5px;max-width:calc(100% - 16px);background:#07111add;border:1px solid #43dfff33;cursor:default}
.dock button{padding:6px 12px;border:0;background:transparent;color:var(--mute);font-size:13px}
.dock button:hover{color:var(--ice)}
.dock button[aria-pressed=true]{background:var(--cyan);color:#021117;font-weight:600}
.dock .hint{font-size:12px;color:var(--mute);padding:0 8px}
.dock .sep{width:1px;height:18px;background:#43dfff33;margin:0 4px}
.stage.narrow .dock .hint{display:none}
.stage.narrow .dock button{padding:6px 9px}

/* ================= 3D parts =================
   Everything inside a face can stand proud of it. Boxes (.cb) are built from
   a top and four walls; round things are stacks of thin slices. */
.cb{position:relative;--d:8px;--c:#17303a}
.cb>*{position:absolute;display:block}
.cb>.t{position:relative;transform:translateZ(var(--d));background:var(--top,var(--c));box-sizing:border-box}
.cb.fill{width:100%;height:100%}
.cb.fill>.t{height:100%}
.cb>.n{left:0;top:0;width:100%;height:var(--d);transform-origin:50% 0;transform:rotateX(90deg);background:color-mix(in srgb,var(--c) 70%,#fff)}
.cb>.s{left:0;bottom:0;width:100%;height:var(--d);transform-origin:50% 100%;transform:rotateX(-90deg);background:color-mix(in srgb,var(--c) 40%,#000)}
.cb>.w{left:0;top:0;width:var(--d);height:100%;transform-origin:0 50%;transform:rotateY(-90deg);background:color-mix(in srgb,var(--c) 60%,#fff)}
.cb>.b{left:0;top:0;width:100%;height:100%;transform:rotateY(180deg);background:color-mix(in srgb,var(--c) 45%,#000)}

.fuse .holder{position:relative;width:100%;flex:1}
.fuse-amp{font:700 12px var(--mono);color:#0b141a;background:linear-gradient(#eef3f5,#c9d3d8);padding:1px 4px;border-radius:2px;box-shadow:0 1px 3px #000a}
.fuse .bed{position:absolute;left:3px;right:3px;top:12px;bottom:12px;border-radius:5px;background:linear-gradient(90deg,#05090b,#121c22,#05090b);box-shadow:inset 0 2px 6px #000,0 0 0 1px #43dfff1f}
.fuse .stand{position:absolute;left:50%;top:50%;width:0;height:0;transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.fuse3d{position:absolute;left:-57px;top:-10px;transform:rotateZ(90deg)}
.fuse3d .clip-base{position:absolute;top:-3px;width:8px;height:26px}
.fuse3d .clip-base .cb{--c:#26323a;--top:linear-gradient(90deg,#1a252c,#33424c)}
.fuse3d .sh{position:absolute;left:4px;right:4px;top:3px;bottom:-1px;background:#000;opacity:.55;border-radius:8px;filter:blur(3px);transform:translateZ(.5px)}
.fuse3d .tube.glass .fc{background:
  linear-gradient(rgb(255 255 255 / calc((var(--b) - .62) * 1.6)),rgb(255 255 255 / calc((var(--b) - .62) * 1.6))),
  rgb(150 205 225 / calc(.04 + (1 - var(--b)) * .22))}
.fuse3d .disc{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 35%,#eef3f5,#8a99a1)}
.fuse:hover .tube.glass .fc{background:
  linear-gradient(rgb(255 255 255 / calc((var(--b) - .62) * 1.6)),rgb(255 255 255 / calc((var(--b) - .62) * 1.6))),
  rgb(120 230 255 / calc(.14 + (1 - var(--b)) * .3))}
.fuse.out .stand{transform:translateZ(22px) translateY(-14px) rotateZ(-6deg)}
.fuse.out .bed{box-shadow:inset 0 2px 6px #000,0 0 0 1px #ff3b5c55}
.thr{display:flex;justify-content:center;align-items:stretch;gap:30px;height:156px}
.thr-gate{position:relative;width:64px;height:100%;--travel:126px;cursor:grab;touch-action:none}
.thr-gate .cb{--c:#1c2a32;--top:linear-gradient(90deg,#24323a,#3a4a54 50%,#24323a)}
.thr-gate .cb>.t{border-radius:4px;box-shadow:inset 0 0 0 1px #43dfff22}
.thr-slot{position:absolute;left:24px;top:10px;bottom:10px;width:16px;border-radius:8px;background:linear-gradient(90deg,#000,#0b1216 40%,#000);box-shadow:inset 0 3px 8px #000,0 1px 0 #ffffff22}
.thr-det{position:absolute;left:-14px;width:10px;height:2px;background:#9fb0b9;bottom:calc((var(--n) - 1) * (100% - 0px) / 4.6 + 3px)}
.thr-lever{position:absolute;left:32px;width:0;height:0;bottom:calc(13px + (var(--drag,var(--pos)) - 1) * var(--travel) / 4);transition:bottom .25s cubic-bezier(.3,1.3,.5,1);transform:translateZ(5px)}
.thr-grip{position:absolute;left:-23px;top:0;width:0;height:0;transform:translateZ(38px)}
.thr-grip .tube.rib .fc{background:
  repeating-linear-gradient(90deg,#0000 0 3px,#0006 3px 4.5px),
  linear-gradient(rgb(255 255 255 / calc((var(--b) - .6) * 1.2)),rgb(255 255 255 / calc((var(--b) - .6) * 1.2))),
  color-mix(in srgb,var(--c) calc(16% + var(--b) * 84%),#000)}
.notches{display:flex;flex-direction:column;justify-content:space-between;padding:1px 0}
.notch{width:38px;height:28px;cursor:pointer}
.crank-wheel{position:relative;width:76px;height:76px;cursor:grab}
.crank-rot{position:absolute;left:38px;top:38px;width:0;height:0;transform:rotateZ(var(--ang,0deg));transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.crank-arm{position:absolute;left:-5px;top:-34px;width:10px;height:34px;transform:translateZ(6px)}
.crank-arm .cb{--c:#3a464d;--top:linear-gradient(90deg,#4a5860,#8d9ca4,#4a5860)}
.crank-handle{position:absolute;left:0;top:-29px;width:0;height:0;transform:translateZ(11px)}
.train3d{position:relative;width:230px;height:150px;margin:0 auto}
.train3d .gear{position:absolute;width:0;height:0}
.gear3d{position:absolute;left:0;top:0;width:0;height:0}
.g-shadow{position:absolute;border-radius:50%;background:#000;opacity:.35;filter:blur(3px)}
.g-tooth{position:absolute;left:-2.5px;top:-2.5px;width:5px;height:5px}
.g-tooth .cb{--c:#8d9ca4;--top:#b8c4cb}
.g-bore{position:absolute;border-radius:50%;background:radial-gradient(circle,#05090b 55%,#3a464d);transform:translateZ(7.6px)}
.g-rope{position:absolute;border-radius:50%;background:repeating-radial-gradient(circle,#c9a36a 0 1.5px,#7a5426 1.5px 3px);transform:translateZ(22.6px)}
.train-lbl{position:absolute;top:116px;transform:translateX(-50%);font:600 11px var(--mono);color:#2b3b45}
.jp .hdr{position:relative;width:22px;height:52px}
.jp .hdr>.cb{--c:#14181b;--top:linear-gradient(90deg,#1c2226,#2b3338 50%,#1c2226)}
.jp .pin{position:absolute;left:8px;width:6px;height:6px;transform:translateZ(4px)}
.jp .pin .cb{--c:#a8781e;--top:linear-gradient(135deg,#ffe7a3,#c9932a)}
.jp .jcap{position:absolute;left:2px;top:3px;width:18px;height:29px;transform:translateZ(4px);transition:top .18s cubic-bezier(.3,1.3,.5,1)}
.jp .jcap .cb{--c:#0b0e10;--top:linear-gradient(#2a3136,#101417)}
.jp .jcap .t i{position:absolute;left:4px;right:4px;top:10px;height:9px;border-radius:2px;background:repeating-linear-gradient(#0003 0 1px,#ffffff14 1px 3px)}
.jp.on .jcap{top:18px}
.jp:hover .jcap .cb{--top:linear-gradient(#3a454c,#161c20)}
.tag-row{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);color:#2b3b45}
.tag-row b{font-size:22px;color:#0b141a}
.mt{gap:4px}
.mt-meter{position:relative;width:186px;height:96px;margin:0 auto}
.mt-meter>.cb{--c:#14181b;--top:linear-gradient(#2b3136,#191d20)}
.mt-meter>.cb>.t{border-radius:6px;box-shadow:inset 0 1px 0 #ffffff22}
.mt-bezel{position:absolute;inset:6px;border-radius:5px 5px 3px 3px;background:#0b0d0f;box-shadow:inset 0 2px 6px #000}
.mt-dial{position:absolute;left:3px;top:3px;width:168px;height:78px;border-radius:4px 4px 2px 2px;background:radial-gradient(ellipse at 50% 110%,#fbf7ea,#e6ddc2);transform-style:preserve-3d}
.mt-dial svg{position:absolute;left:0;top:0}
.mt-dial .mirror{fill:none;stroke:url(#mt-mirror);stroke-width:5}
.mt-dial .ticks line{stroke:#1b262c;stroke-width:1.3}
.mt-dial .ticks line.mn{stroke-width:.8}
.mt-dial .ticks text{fill:#1b262c;font:700 9px var(--mono);text-anchor:middle}
.mt-needle,.mt-shade{position:absolute;left:84px;top:92px;width:0;height:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.22,1.45,.42,1)}
.mt-needle{transform:translateZ(2.5px) rotate(calc(-48deg + var(--v) * 8deg))}
.mt-blade{position:absolute;left:-1px;top:-66px;width:2px;height:40px}
.mt-blade .cb{--c:#11161a;--top:#1b2226}
.mt-tip{position:absolute;left:-.6px;top:-81px;width:1.2px;height:16px}
.mt-tip .cb{--c:#8a1d14;--top:#e5412d}
.mt-shade{width:0;height:0;transform:translate(2px,2px) rotate(calc(-48deg + var(--v) * 8deg))}
.mt-shade::before{content:"";position:absolute;left:-1px;top:-80px;width:2.4px;height:52px;border-radius:1px;background:#0003;filter:blur(1px)}
.mt-cover{position:absolute;left:0;right:0;bottom:0;height:17px;transform:translateZ(.5px);transform-style:preserve-3d}
.mt-cover>.cb{--c:#0e1113;--top:linear-gradient(#262b2f,#15191c)}
.mt-cover>.cb>.t{display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 12px;border-radius:0 0 2px 2px}
.mt-cover span{font:700 8px var(--mono);letter-spacing:.14em;color:#c9b98e}
.mt-zero{position:relative;width:0;height:0;transform-style:preserve-3d;margin-right:4px}
.mt-zero>i{position:absolute;left:-3.5px;top:-.6px;width:7px;height:1.2px;background:#2b3438;transform:translateZ(1.6px) rotate(35deg)}
.mt-glass{position:absolute;inset:0;transform:translateZ(9px);pointer-events:none;border-radius:4px 4px 2px 2px;background:linear-gradient(115deg,#ffffff00 30%,#ffffff40 38%,#ffffff10 46%,#ffffff00 52%,#ffffff00 70%,#ffffff22 76%,#ffffff00 82%);box-shadow:inset 0 0 0 1px #ffffff26}
.mt-row{position:relative;display:flex;justify-content:space-around;padding:12px 2px 0;transform-style:preserve-3d}
.mt-port{display:flex;flex-direction:column;align-items:center;gap:15px;width:30px;cursor:pointer;transform-style:preserve-3d}
.mt-port small{font:700 11px var(--mono);color:var(--ice)}
.mt-port:hover small{color:var(--cyan)}
.mt-jack{position:relative;width:0;height:0;top:9px;transform-style:preserve-3d}
.mt-hole{position:absolute;left:-2.6px;top:-2.6px;width:5.2px;height:5.2px;border-radius:50%;background:radial-gradient(#000 40%,#3a4248);transform:translateZ(10.6px)}
.mt-probe{position:absolute;top:21px;width:0;height:0;transform-style:preserve-3d;pointer-events:none;transition:left .35s cubic-bezier(.4,0,.2,1),opacity .4s}
.mt-probe-body{transform-style:preserve-3d;transform:translateZ(11px) rotateZ(calc(-128deg + var(--k) * 76deg)) rotateY(-38deg)}   /* tip in the hole, handle leaning out and up */
.mt-probe.drop .mt-probe-body{animation:probe-drop .45s cubic-bezier(.3,1.3,.5,1)}
.mt-probe.away{opacity:0}
@keyframes probe-drop{from{transform:translateZ(30px) rotateZ(calc(-128deg + var(--k) * 76deg)) rotateY(-38deg)}}
.mt-cable{position:absolute;left:0;top:9px;transform:translateZ(10px);transform-style:preserve-3d;pointer-events:none;transition:transform .6s cubic-bezier(.5,0,.8,.4),opacity .6s}
.mt-cable svg{position:absolute;left:0;top:0;overflow:visible}
.mt-cable path{fill:none;stroke-linecap:round;stroke-dasharray:400;animation:cable-in .5s ease-out}
.mt-cable .sh{stroke:#0008;stroke-width:6;transform:translate(2px,4px);filter:blur(1.5px)}
.mt-cable .lead{stroke:#ff8a1e;stroke-width:4.5}
.mt-cable .hi{stroke:#ffd29a;stroke-width:1.2;transform:translate(-.6px,-1px)}
.mt-cable.bad .lead{stroke:#ff3b5c}
.mt-cable.fall{transform:translateZ(10px) translateY(40px);opacity:0}
.mt-plug{position:absolute;top:12px;width:0;height:0;transform-style:preserve-3d}
@keyframes cable-in{from{stroke-dashoffset:400}}
.psu3d{display:flex;justify-content:center}
.psu{display:flex;flex-direction:column;gap:6px;width:170px;padding:12px 14px;background:linear-gradient(#f6f2e4,#d9d2bb);border:2px solid #2b3b45;border-radius:3px;box-shadow:0 3px 6px #0006;transform:translateZ(2px)}
.psu small{font:600 10px var(--mono);letter-spacing:.12em;color:#2b3b45;text-align:center;text-transform:uppercase;border-bottom:1px solid #2b3b4566;padding-bottom:4px}
.psu .tag-row b{font-size:18px;white-space:nowrap}
.sem{position:relative;height:122px}
.sem-dial{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.sem-face{position:absolute;left:-52px;top:-52px;width:104px;height:104px;border-radius:50%;transform:translateZ(5.1px);background:radial-gradient(circle at 50% 40%,#1d2a31,#0b1216 75%);box-shadow:inset 0 0 0 2px #0008,inset 0 3px 8px #000}
.sem-face svg{width:100%;height:100%;fill:#e9eef0}
.sem-ptr{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform:translateZ(var(--z)) rotateZ(var(--a,0deg));transition:transform .6s cubic-bezier(.3,1.25,.5,1)}
.sem-shaft{position:absolute;left:-2px;top:0;width:4px;height:31px}
.sem-shaft .cb{--c:#5e6b73;--top:linear-gradient(90deg,#aebcc4,#eef3f5,#aebcc4)}
.sem-flag{position:absolute;left:-6.5px;top:29px;width:13px;height:13px}
.sem-flag .cb{--c:#8a1d14;--top:linear-gradient(135deg,#e5412d 0 50%,#f2c230 50%)}
.sem-tail{position:absolute;left:-3px;top:-11px;width:6px;height:11px}
.sem-tail .cb{--c:#3a4248;--top:linear-gradient(90deg,#5e6b73,#8a969d,#5e6b73)}
.sem-hub{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.sem-glass{position:absolute;left:-52px;top:-52px;width:104px;height:104px;border-radius:50%;transform:translateZ(15px);pointer-events:none;background:linear-gradient(125deg,#ffffff00 28%,#ffffff33 36%,#ffffff0d 44%,#ffffff00 50%);box-shadow:inset 0 0 0 1px #ffffff1f}
.sem-ctl{display:flex;align-items:center;justify-content:center;gap:12px}
.sem-ctl .sk{width:44px;height:30px}
.sem-ctl .sk svg{width:14px;height:14px}
.sem-count{font:700 14px var(--mono);color:var(--cyan);min-width:46px;text-align:center}
.cs3d{display:flex;justify-content:center}
.cs{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 22px;background:linear-gradient(#1b2c38,#0b1419);border:2px solid #c9d3d8;border-radius:4px;box-shadow:0 3px 6px #0008;transform:translateZ(2px)}
.cs small{font:600 10px var(--mono);letter-spacing:.14em;color:#c9d3d8;text-transform:uppercase}
.cs-letters{font:700 30px var(--mono);letter-spacing:.24em;color:#f4f4ef;padding-left:.24em}
.dip{display:flex;justify-content:center}
.dip-block{position:relative;width:178px;height:108px}
.dip-block>.cb{--c:#8a1d14;--top:linear-gradient(170deg,#e5412d,#b82a1c)}
.dip-block>.cb>.t{border-radius:5px;box-shadow:inset 0 1px 0 #ff8a7a88,inset 0 -2px 0 #0004}
.dip-face{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px}
.dip-on{align-self:flex-start;font:700 11px var(--mono);color:#fff;letter-spacing:.08em}
.dip-row{display:flex;gap:14px}
.dip-sw{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.dip-sw small{font:700 11px var(--mono);color:#fff}
.dip-slot{position:relative;width:22px;height:52px;border-radius:2px;background:#1b0705;box-shadow:inset 0 2px 5px #000}
.dip-slider{position:absolute;left:3px;width:16px;height:22px;top:27px;transition:top .18s cubic-bezier(.3,1.3,.5,1)}
.dip-sw.on .dip-slider{top:3px}
.dip-slider .cb{--c:#b8c4cb;--top:linear-gradient(#ffffff,#d3dce1)}
.dip-sw:hover .dip-slider .cb{--top:linear-gradient(#ffffff,#eef3f5)}
.dipb3d{display:flex;justify-content:center}
.dipb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 18px;border:2px solid #2b3b45;border-radius:4px;color:#2b3b45;font-family:var(--mono)}
.dipb small{font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.dip-base{font-size:34px;color:#0b141a}
.dipb span{font-size:10px}
.sf{gap:8px}
.sf-door{display:flex;align-items:center;justify-content:center;gap:16px}
.sf-dial{position:relative;width:128px;height:128px;transform-style:preserve-3d}
.sf-dial>.cz{left:64px;top:64px;position:absolute}
.sf-index{position:absolute;left:58px;top:-1px;width:0;height:0;border:6px solid transparent;border-top:9px solid #e5412d;transform:translateZ(3.2px)}
.sf-wheel{position:absolute;left:64px;top:64px;width:0;height:0;transform-style:preserve-3d;transform:rotate(var(--ang));transition:transform .12s ease-out}
.sf-face{position:absolute;left:-56px;top:-56px;width:112px;height:112px;transform:translateZ(10.1px);pointer-events:none}
.sf-face svg{width:100%;height:100%}
.sf-face line{stroke:#e9eef0;stroke-width:1.2}
.sf-face text{fill:#e9eef0;font:700 9px var(--mono);text-anchor:middle}
.sf-cap{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;transform:translateZ(21.2px);background:radial-gradient(circle at 35% 30%,#8a969d,#2b3136 70%)}
.sf-hit{position:absolute;inset:0;display:flex;border-radius:50%;transform:translateZ(22px);cursor:grab}
.sf-hit.turning{cursor:grabbing}
.sf-ccw,.sf-cw{flex:1}
.sf-lamps{display:flex;flex-direction:column;gap:9px}
.sf-lamps>div{display:flex;align-items:center;gap:6px}
.sf-lamps small{font:700 10px var(--mono);color:var(--ice);width:16px}
.sf-handle{position:relative;width:150px;height:30px;margin:0 auto;cursor:pointer;transform-style:preserve-3d;transform-origin:50% 0;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.sf-post{position:absolute;top:2px;width:14px;height:22px}
.sf-post .cb{--c:#5e6b73;--top:linear-gradient(#c9d3d8,#8a969d)}
.sf-bar{position:absolute;left:15px;top:14px;transform:translateZ(14px);transform-style:preserve-3d}
.sf-handle:hover .sf-bar .fc{filter:brightness(1.15)}
.sf-handle.pull{animation:safe-pull .5s ease-out}
.sf-handle.open{animation:none;transform:rotateX(-40deg)}
@keyframes safe-pull{30%{transform:rotateX(-28deg)}60%{transform:rotateX(4deg)}}
.sf-plate3d{display:flex;justify-content:center}
.sf-plate{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 18px;background:linear-gradient(#e4c77c,#b8954a);border:2px solid #6a5226;border-radius:3px;color:#3a2c12;font-family:var(--mono);box-shadow:0 3px 6px #0006}
.sf-plate small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.sf-plate span{font-size:10px}
.sf-sum{font-size:32px;color:#1f170a}
.tl{gap:8px}
.tl-tray{position:relative;width:156px;height:156px;margin:0 auto}
.tl-tray>.cb{--c:#1d2226;--top:linear-gradient(#323a40,#20262a)}
.tl-tray>.cb>.t{border-radius:5px}
.tl-floor{position:absolute;inset:7px;border-radius:3px;background:#0b0e10;box-shadow:inset 0 2px 6px #000;transform-style:preserve-3d}
.tl-tile{position:absolute;left:calc(2px + var(--x) * 47px);top:calc(2px + var(--y) * 47px);width:44px;height:44px;cursor:pointer;transform-style:preserve-3d;transition:left .16s ease-out,top .16s ease-out}
.tl-tile .cb{--c:#a99f82;--top:linear-gradient(150deg,#f6f1e1,#ddd3b6)}
.tl-tile .cb>.t{display:grid;place-items:center;border-radius:4px;box-shadow:inset 0 1px 0 #fff8,inset 0 -2px 0 #0002}
.tl-tile b{font:800 22px var(--mono);color:#1f262b}
.tl-tile:hover .cb{--top:linear-gradient(150deg,#fffaf0,#e8dfc5)}
.tl-plate3d{display:flex;justify-content:center}
.tl-plate{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 26px;border:2px solid #2b3b45;border-radius:4px;color:#2b3b45;font-family:var(--mono)}
.tl-plate small{font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.tl-no{font-size:40px;color:#0b141a}
.plug3d,.speaker3d,.backup3d{display:flex;flex-direction:column;align-items:center;gap:10px}
.plug3d small,.speaker3d small,.backup3d small,.trip-row small{font-size:12px;letter-spacing:.08em;color:#2b3b45}
.plug{display:grid;grid-template-columns:repeat(5,22px);gap:8px;padding:12px 14px;background:linear-gradient(#20292f,#11171b);border-radius:6px 6px 14px 14px;box-shadow:inset 0 2px 6px #000c,0 2px 0 #fff6}
.plug i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#05080a 45%,#2a353c 50%)}
.plug i.pin{background:radial-gradient(circle at 40% 35%,#ffe7a3,#c9932a 55%,#6b4a10 75%,#2a353c 78%)}
.loom{display:flex;gap:6px}
.loom i{width:14px;height:26px;background:linear-gradient(90deg,#1b1f22,#3a444b,#1b1f22);border-radius:0 0 4px 4px}
.speaker{position:relative;width:150px;height:150px}
.spk{position:absolute;left:75px;top:75px;width:0;height:0}
.spk-grille{position:absolute;left:-62px;top:-62px;width:124px;height:124px;border-radius:50%;transform:translateZ(5.2px);
  background:radial-gradient(circle,#05090b 1.3px,#0000 1.7px) 0 0/6px 6px,radial-gradient(circle at 35% 30%,#d3dce1,#6f7d86 75%,#4a5860);box-shadow:inset 0 0 0 2px #3a464d,inset 0 3px 8px #0008}
.spk-dome{position:absolute;left:0;top:0;width:0;height:0;transform:translateZ(9px)}
.spk-dome i{position:absolute;left:calc(-34px + var(--k) * 1.6px);top:calc(-34px + var(--k) * 1.6px);width:calc(68px - var(--k) * 3.2px);height:calc(68px - var(--k) * 3.2px);border-radius:50%;
  background:color-mix(in srgb,#c9d3d8 calc(40% + var(--k) * 9%),#3a464d);transform:translateZ(calc(var(--k) * 1.4px))}
.spk-dome i.top{display:grid;place-items:center;background:radial-gradient(circle at 38% 32%,#f4f7f8,#b8c4cb 70%,#8d9ca4);box-shadow:inset 0 -3px 6px #0003}
.cone-lbl{font:700 17px var(--mono);letter-spacing:.18em;color:#0b141a}
.backup-win{padding:12px 16px;background:#0c1418;border-radius:4px;box-shadow:inset 0 3px 8px #000c,0 1px 0 #fff8}
.backup{font:600 16px var(--mono);letter-spacing:.1em;color:var(--red)}
.backup-win.fitted .backup{color:var(--mint)}
.rating3d{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 18px;border:2px solid #2b3b45;border-radius:4px;color:#2b3b45;font-family:var(--mono)}
.rating3d>b{font-size:15px;letter-spacing:.12em}
.rating3d>span{font-size:12px;letter-spacing:.06em}
.trip-row{display:flex;align-items:center;gap:12px;margin-top:4px}
.trip{font:700 32px var(--mono);color:#0b141a;background:linear-gradient(#cfdadf,#8da0aa);padding:0 12px;border-radius:3px}

/* wires: real round cable, built from facets, lying on the plate */
.wires{display:flex;flex-direction:column;gap:6px;padding:8px 0}
.wire{position:relative;display:flex;align-items:center;width:100%;height:24px;cursor:pointer}
.wire .shd{position:absolute;left:14px;right:14px;top:6px;height:12px;background:#000;opacity:.5;border-radius:6px;filter:blur(2.5px);transform:translateZ(.6px)}
.wire .glow{position:absolute;left:14px;right:14px;top:8px;height:9px;background:var(--g);opacity:.38;border-radius:6px;filter:blur(6px);transform:translateZ(.8px)}
.wire .peg{position:relative;flex:none;width:17px;height:19px}
.wire .peg i{position:absolute;inset:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.wire .peg .p1{background:#222f38;transform:translateZ(2px)}
.wire .peg .p2{background:#4b5f6c;transform:translateZ(4px) scale(.9)}
.wire .peg .p3{background:radial-gradient(circle,#05090c 22%,#92a9b7 24%,#5a6e7b);transform:translateZ(6px) scale(.74)}
.wire .seg{position:relative;flex:1;height:9px;transition:flex .1s}
.wire .seg .tube{position:absolute;inset:0}
.wire .tube .fc{background:
  repeating-linear-gradient(90deg,#0000 0 13px,#0003 13px 15px),
  linear-gradient(rgb(255 255 255 / calc((var(--b) - .72) * 1.6)),rgb(255 255 255 / calc((var(--b) - .72) * 1.6))),
  color-mix(in srgb,var(--c) calc(18% + var(--b) * 82%),#000)}
@property --sway{syntax:'<angle>';inherits:true;initial-value:0deg}
@keyframes wire-sway{from{--sway:-1.5deg}to{--sway:1.5deg}}
.wire{animation:wire-sway 3.2s ease-in-out var(--sd,0s) infinite alternate}
.wire .seg.l{transform-origin:0 50%;transform:rotateY(calc(var(--sway) * -1))}
.wire .seg.r{transform-origin:100% 50%;transform:rotateY(var(--sway))}
.wire .gap{flex:0}
.wire:not(.cut) .seg .disc{visibility:hidden}
.wire:not(.cut):hover .tube .fc{filter:brightness(1.3)}
.wire.cut .seg{flex:0 0 38%}
.wire.cut .glow{opacity:.12}
.wire.cut .gap{flex:1}
.wire.cut .seg.l{transform:rotate(-8deg) rotateY(-7deg);transform-origin:left center}
.wire.cut .seg.r{transform:rotate(8deg) rotateY(7deg);transform-origin:right center}
.seg .disc{position:absolute;top:0;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle,#f0b27a,#a8602c)}
.seg.l .disc{right:-4.5px;transform:translateZ(5.5px) rotateY(90deg)}
.seg.r .disc{left:-4.5px;transform:translateZ(5.5px) rotateY(-90deg)}
.spark{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;opacity:0;pointer-events:none;transform:translateZ(11px);
  background:radial-gradient(#fff 0,#ffe27a 28%,#ff8a3d 48%,#0000 70%)}
.wire.cut .spark{animation:spark .5s ease-out}
.wire.cut{animation:none}
@keyframes spark{0%{opacity:1;scale:.3}100%{opacity:0;scale:2.8}}

/* generic facet cylinder (wires, batteries): the axis lies along x */
.tube{position:relative}
.tube .fc{position:absolute;left:0;width:100%;
  background:
    linear-gradient(rgb(255 255 255 / calc((var(--b) - .72) * 1.6)),rgb(255 255 255 / calc((var(--b) - .72) * 1.6))),
    color-mix(in srgb,var(--c) calc(18% + var(--b) * 82%),#000)}

/* keys: a steel bezel around a two-step cap that sinks when pressed */
.b3{position:relative;width:100%;height:100%}
.bz{--c:#33454f}
.bz>.t{padding:var(--bp,5px);background:linear-gradient(160deg,#5a7181,#26343d);box-shadow:inset 0 1px 0 #ffffff55,inset 0 0 0 1px #0007}
.b3 .well{position:relative;width:100%;height:100%;background:#03070a;box-shadow:inset 0 2px 6px #000,0 1px 0 #ffffff22}
.b3 .cap{transition:transform .06s}
.b3 .cap>.t{box-shadow:inset 0 1px 0 #ffffff44,inset 0 0 0 1px #00000066}
.cap1{position:relative;width:100%;height:100%}
.cap2{position:absolute;inset:3px}
.cap2>.t{height:100%;display:grid;place-items:center;box-shadow:inset 0 1px 0 #ffffff77,inset 0 -3px 0 #0006,inset 0 0 0 1px #00000044}
.b3:active .cap{transform:translateZ(calc(var(--press,5px) * -1))}

/* button: a real arcade button in a collar */
.btnmod{display:flex;gap:16px;align-items:center;justify-content:center}
.socket{position:relative;width:152px;height:152px;border-radius:50%;
  background:conic-gradient(from 200deg,#34444f,#0a1217,#34444f,#0a1217,#34444f);
  box-shadow:inset 0 0 0 2px #000a,0 0 0 1px #43dfff44,0 0 24px #43dfff1f}
.socket .well{position:absolute;inset:11px;border-radius:50%;background:#04080b;box-shadow:inset 0 0 16px #000;transform:translateZ(1px)}
.socket .ring{position:absolute;inset:5px;border-radius:50%}
.socket .ring.r1{background:radial-gradient(closest-side,#0000 0 90%,#3d5260 91%);transform:translateZ(3px)}
.socket .ring.r2{background:radial-gradient(closest-side,#0000 0 90%,#9db3c0 91% 97%,#5b7080 98%);transform:translateZ(7px)}
.bigbtn{position:absolute;inset:15px;border-radius:50%;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;outline-offset:6px}
.cap3{position:absolute;inset:0;transition:transform .06s}
.cap3 i{position:absolute;inset:0;border-radius:50%;font-style:normal;
  background:color-mix(in srgb,var(--bc) calc(10% + var(--k) * 4.4%),#000);transform:translateZ(calc(var(--k) * 1px + 2px))}
.cap3 i.top{display:grid;place-items:center;color:var(--bt);font:700 14px var(--ui);letter-spacing:.08em;
  background:radial-gradient(circle at 36% 28%,color-mix(in srgb,var(--bc) 62%,#fff) 0,var(--bc) 48%,color-mix(in srgb,var(--bc) 60%,#000) 100%);
  box-shadow:0 0 18px color-mix(in srgb,var(--bc) 45%,#0000),inset 0 -8px 14px #0005,inset 0 4px 6px #fff6}
.cap3 i.top::before{content:"";position:absolute;inset:9px;border-radius:50%;border:1px solid #ffffff55;box-shadow:inset 0 0 14px #0003,0 0 0 1px #0002}
.bigbtn.down .cap3{transform:translateZ(-9px)}
.strip{width:20px;height:124px;--c:#0f1a20}
.strip>.t{height:100%;background:repeating-linear-gradient(180deg,#0e171d 0 8px,#080e12 8px 10px);box-shadow:inset 0 0 0 1px #43dfff33}
.strip.on{--c:var(--sc)}
.strip.on>.t{background:repeating-linear-gradient(180deg,var(--sc) 0 8px,color-mix(in srgb,var(--sc) 25%,#000) 8px 10px);
  box-shadow:0 0 22px var(--sc),inset 0 0 0 1px #fff6;animation:glow .7s ease-in-out infinite alternate}
@keyframes glow{from{filter:brightness(.8)}to{filter:brightness(1.25)}}

/* glyph keycaps */
.keys{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:4px 2px}
.key{position:relative;height:82px;cursor:pointer}
.key .cap{--c:#0e2832}
.key .cap>.t{background:#0c222b}
.key .cap2{--c:#1b4558}
.key .cap2>.t{color:#8fe9ff;background:linear-gradient(165deg,#24607a,#0f2c3a 72%)}
.key .gl svg{width:38px;height:38px;filter:drop-shadow(0 0 5px #43dfffaa)}
.key:hover .cap2>.t{background:linear-gradient(165deg,#2c7391,#123446 72%)}
.key.ok .cap{--c:#0b3a30;transform:translateZ(-6px)}
.key.ok .cap>.t{background:#082a23}
.key.ok .cap2>.t{color:var(--mint);background:linear-gradient(165deg,#1a8068,#0b4034 72%)}
.key.ok .gl svg{filter:drop-shadow(0 0 8px var(--mint))}
.key.bad{animation:nudge .3s}
.key.bad .cap{--c:#4a0c1a}
.key.bad .cap>.t{background:#2e0710}
.key.bad .cap2>.t{color:#ffc2cc;background:linear-gradient(165deg,#9a2040,#400c1a 72%)}

/* simon: a thick reactor ring built from stacked layers */
.simon3d{position:relative;width:196px;height:196px;margin:0 auto}
.sl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transform:translateZ(calc(var(--k) * 1.4px))}
.sl.top{pointer-events:auto}
.sl .sring{fill:none;stroke:#43dfff33;stroke-width:1;stroke-dasharray:2 4}
.sl .pad{fill:color-mix(in srgb,var(--pc) calc(8% + var(--k) * 2%),#0a1217);stroke:none;outline:none}
.sl.top .pad{stroke:var(--pc);stroke-opacity:.55;stroke-width:1.4;cursor:pointer;transition:fill .06s}
.sl .pad.lit{fill:color-mix(in srgb,var(--pc) calc(35% + var(--k) * 7.2%),#000)}
.sl.top .pad.lit{stroke-opacity:1;filter:drop-shadow(0 0 9px var(--pc))}
.sl.top .pad:focus-visible{stroke:#fff;stroke-opacity:1}
.sl .core{fill:#08131a;stroke:#43dfff55;stroke-width:1}
.sl .dot{fill:#43dfff2a}
.sl .dot.done{fill:var(--cyan);filter:drop-shadow(0 0 4px var(--cyan))}
.sl.solved .dot{fill:var(--mint);filter:drop-shadow(0 0 4px var(--mint))}

/* password: LCD windows stay flat, the keys are real keys */
.pw{display:flex;gap:7px}
.pw .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.arr{position:relative;height:30px;cursor:pointer;--bp:3px}
.arr .cap{--c:#0c2029}
.arr .cap>.t{background:#0a1a21}
.arr .cap2{inset:2px}
.arr .cap2>.t{color:var(--cyan);background:linear-gradient(#1e5870,#0c2833)}
.arr svg{width:16px;height:16px}
.arr:hover .cap2>.t{background:linear-gradient(#276f8c,#0e303d)}
.lcd{height:62px;overflow:hidden;display:grid;place-items:center;color:var(--cyan);font:34px var(--mono);
  background:linear-gradient(#04141a,#0a212a);border:1px solid #43dfff55;box-shadow:inset 0 0 18px #000;text-shadow:0 0 12px #43dfff}
.lcd .roll{animation:roll .16s ease-out}
@keyframes roll{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.go{position:relative;height:46px;margin-top:12px;cursor:pointer}
.go .bz{--c:#4a3a14}
.go .bz>.t{background:linear-gradient(160deg,#8d7a4a,#3b2e10)}
.go .cap{--c:#6a4700}
.go .cap>.t{background:#4a3200}
.go .cap2>.t{font-weight:700;letter-spacing:.14em;color:#1b1200;background:linear-gradient(#ffd067,#e09a00)}
.go:hover .cap2>.t{background:linear-gradient(#ffdc8c,#eaa512)}

/* ================= new modules ================= */
.mini-lcd{height:62px;display:grid;place-items:center;color:var(--cyan);font:700 44px var(--mono);
  background:linear-gradient(#04141a,#0a212a);border:1px solid #43dfff55;box-shadow:inset 0 0 18px #000;text-shadow:0 0 12px #43dfff}
.mini-lcd.sm{height:40px;font-size:24px}
.stack{display:flex;flex-direction:column;gap:12px;align-items:stretch}
/* An action button (Lock, Latch, Submit, Measure ...) always sits at the bottom of its module; the rest is centred above it */
.mod-body>.stack,.mod-body>.brk,.mod-body>.morse{flex:1}
.mod-body>.go,.stack>.go,.brk>.go,.morse>.go{margin-top:auto}
.mod-body:has(>.go)>:first-child,.stack:has(>.go)>:first-child,.brk>:first-child,.morse>:first-child{margin-top:auto}
.lamprow{display:flex;gap:10px;justify-content:center;align-items:center;min-height:20px}
.tgrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;justify-items:center;padding-top:2px}
.tgcol{display:flex;flex-direction:column;align-items:center;gap:9px}
.tgcol small{font:11px var(--mono);color:var(--mute)}
.tg{position:relative;width:34px;height:62px;cursor:pointer}
.tg .well{position:relative;width:100%;height:100%;background:#03070a;box-shadow:inset 0 2px 6px #000}
.tg .stick{position:absolute;left:50%;top:50%;width:0;height:0;transform:translateZ(5px) rotateX(var(--tilt));transition:transform .12s cubic-bezier(.3,1.4,.5,1)}
.tg .tg-base{position:absolute;left:50%;top:50%;width:0;height:0}
.tg .mk{position:absolute;left:50%;width:10px;height:2px;margin-left:-5px;background:#43dfff66}
.tg .mk.up{top:4px}.tg .mk.dn{bottom:4px}
.tg.up .mk.up,.tg.dn .mk.dn{background:var(--cyan);box-shadow:0 0 5px #43dfff}
.tg.up{--tilt:34deg}
.tg.dn{--tilt:-34deg}
.morse{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.morse .lampwrap{display:grid;place-items:center;height:60px}
.freqrow{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center}
.sk{position:relative;height:36px;cursor:pointer;--bp:3px}
.sk .cap{--c:#0c2029}
.sk .cap>.t{background:#0a1a21}
.sk .cap2{inset:2px}
.sk .cap2>.t{color:var(--cyan);background:linear-gradient(#1e5870,#0c2833)}
.sk svg{width:16px;height:16px}
.sk:hover .cap2>.t{background:linear-gradient(#276f8c,#0e303d)}
.memkeys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.mk{position:relative;height:56px;cursor:pointer}
.mk .cap{--c:#0e2832}
.mk .cap>.t{background:#0c222b}
.mk .cap2>.t{font:700 26px var(--mono);color:#8fe9ff;background:linear-gradient(165deg,#24607a,#0f2c3a 72%)}
.mk:hover .cap2>.t{background:linear-gradient(165deg,#2c7391,#123446 72%)}
.knobmod{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.pat{display:grid;grid-template-columns:repeat(3,auto);gap:9px 8px;justify-items:center}
.kwrap{position:relative;width:128px;height:128px;cursor:pointer;justify-self:center}
.kring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 200deg,#34444f,#0a1217,#34444f,#0a1217,#34444f);box-shadow:inset 0 0 0 2px #000a,0 0 0 1px #43dfff44}
.kring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:#04080b;box-shadow:inset 0 0 14px #000;transform:translateZ(1px)}
.ktick{position:absolute;left:50%;top:50%;width:0;height:0;transform:translateZ(2px) rotate(var(--a))}
.ktick::before{content:"";position:absolute;left:-4px;top:-62px;border:4px solid transparent;border-bottom:7px solid var(--amber);border-top:0}
.kn{position:absolute;inset:20px;transition:transform .22s cubic-bezier(.3,1.3,.5,1);transform:rotate(var(--ang))}
.kn i{position:absolute;inset:0;border-radius:50%;background:color-mix(in srgb,#aab8c0 calc(14% + var(--k) * 7%),#000);transform:translateZ(calc(var(--k) * 1.3px + 2px))}
.kn i.top{background:conic-gradient(from 20deg,#e8eef1,#8d9ca5,#e8eef1,#8d9ca5,#e8eef1,#8d9ca5,#e8eef1);box-shadow:inset 0 0 0 3px #00000022,inset 0 0 0 4px #ffffff55}
.kn i.top::before{content:"";position:absolute;left:50%;top:5px;width:7px;height:30px;margin-left:-3.5px;border-radius:4px;background:#ff3b5c;box-shadow:0 0 8px #ff3b5c99}
.kn i.top::after{content:"";position:absolute;inset:34% ;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fff,#9aa8b0 70%);opacity:.9}
.brk{display:flex;flex-direction:column;gap:12px}
.brkrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}

/* coin cell in its holder: sizes follow the real cells (CR2032 20 x 3.2 mm, LR44 11.6 x 5.4 mm) */
.w-coin{--c:#10181d;--top:linear-gradient(#141f26,#0a1015)}
.w-coin>.t{position:relative;border:1px solid #43dfff2a;box-shadow:inset 0 0 18px #000}
.w-coin .seat{position:absolute;border-radius:50%;background:#04080b;box-shadow:inset 0 0 0 2px #2a3a44;transform:translateZ(.6px)}
.w-coin .tab{position:absolute;height:9px;border-radius:2px;background:linear-gradient(#d9e2e6,#8e9ca4);transform:translateZ(.9px)}
.w-coin .plus{position:absolute;font:700 15px var(--mono);color:#43dfff88;transform:translateZ(.9px)}
.coin{position:absolute}
.coin .cf{position:absolute;background:color-mix(in srgb,#d5dfe4 calc(26% + var(--b) * 74%),#000)}
.coin .lip{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8eff2,#97a5ad 75%)}
.coin .cap{position:absolute;inset:1.5px;border-radius:50%;display:grid;align-content:center;justify-items:center;gap:1px;text-align:center;
  color:#52626b;font:600 11px/1.15 var(--mono);text-shadow:0 1px 0 #ffffffaa;
  background:radial-gradient(circle at 35% 30%,#fbfdfd,#cdd7dc 55%,#93a1a9);box-shadow:inset 0 0 0 2px #00000018,inset 0 0 0 3.5px #ffffff66}
.coin .cap b{font-size:16px;line-height:1}
.coin.sm .cap{font-size:7.5px}
.coin.sm .cap b{font-size:11px}
.mclip{--c:#aab8bf;--top:linear-gradient(#e6edf0,#8d9ca4)}

/* rotary encoder: knurled aluminium knob on a numbered dial, ten detents. All parts are solid (closed) cylinders. */
.cz{position:absolute;left:0;top:0;width:0;height:0}
.cz .fz{position:absolute;background:color-mix(in srgb,var(--fc) calc(16% + var(--b) * 84%),#000)}
.cz .cz-top{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--fc) 60%,#fff),var(--fc) 72%)}
.cz .cz-top.hex{border-radius:0;clip-path:polygon(25% 6.7%,75% 6.7%,100% 50%,75% 93.3%,25% 93.3%,0 50%)}
.w-enc{--c:#1b2a33;--top:linear-gradient(160deg,#27373f,#111b21)}
.w-enc>.t{position:relative;width:140px;height:164px;box-shadow:inset 0 0 0 1px #43dfff33,inset 0 1px 0 #ffffff22}
.enc-ctr{position:absolute;left:70px;top:76px;width:0;height:0}
.enc-ctr .dg{position:absolute;left:0;top:0;width:0;height:0;transform:rotate(var(--a))}
.enc-ctr .dg span{position:absolute;left:0;top:-48px;transform:translate(-50%,-50%) rotate(calc(var(--a) * -1));font:600 10.5px var(--mono);color:#a9c3cd;text-shadow:0 0 6px #43dfff55}
.enc-ctr .dg i{position:absolute;left:-1px;top:-40px;width:2px;height:5px;background:#43dfff99}
.enc-knob{position:absolute;left:0;top:0;width:0;height:0;transform:translateZ(9.1px)}
.enc-top{position:absolute;left:-19px;top:-19px;width:38px;height:38px;border-radius:50%;
  transform:translateZ(11.3px) rotate(var(--ang));transition:transform .18s cubic-bezier(.3,1.6,.5,1);
  background:conic-gradient(from 10deg,#f0f4f6,#97a6ae,#f0f4f6,#97a6ae,#f0f4f6,#97a6ae,#f0f4f6);
  box-shadow:inset 0 0 0 2px #00000022,inset 0 0 0 3px #ffffff66}
.enc-top::before{content:"";position:absolute;left:50%;top:3px;width:3.5px;height:16px;margin-left:-1.75px;border-radius:2px;background:#ff3b5c;box-shadow:0 0 6px #ff3b5c88}
.enc-top::after{content:"";position:absolute;inset:11px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,color-mix(in srgb,var(--cc) 40%,#fff),var(--cc) 55%,color-mix(in srgb,var(--cc) 55%,#000));box-shadow:0 1px 3px #0008}
.enc-hit{position:absolute;left:-34px;top:-34px;width:68px;height:68px;border-radius:50%;transform:translateZ(28px);cursor:pointer}
.enc-lbl{position:absolute;left:10px;top:7px;display:flex;align-items:center;gap:6px;font:700 15px var(--mono);color:var(--ice)}
.enc-dot{width:10px;height:10px;border-radius:50%;background:var(--cc);box-shadow:0 0 6px var(--cc)}
.enc-hint{position:absolute;left:0;right:0;bottom:4px;text-align:center;font:10px var(--mono);letter-spacing:.2em;color:#6b838e}

/* double-throw knife switch, modern: graphite base, silver blades on a centre hinge, socket-head screws, ribbed handle with a signal collar.
   Thrown up (blades in the top contacts) = ON. Thrown a full half turn down (blades in the bottom contacts) = OFF. */
.w-jb{--c:#6f808c;--top:linear-gradient(135deg,#252e35,#11171b)}
.w-jb>.t{position:relative;width:152px;height:300px;box-shadow:inset 0 0 0 1px #000a,inset 0 1px 0 #ffffff22,inset 0 0 36px #0009}
.w-jb>.t::before{content:"";position:absolute;inset:6px;border:1px solid #43dfff2a;pointer-events:none}
.jb-metal{position:absolute}
.jb-metal .cb{--c:#8fa2b0;--top:linear-gradient(135deg,#dbe5ec,#8497a5)}
.jb-steel .cb{--c:#b9c6ce;--top:linear-gradient(180deg,#f6f9fa,#9aaab3)}
.jb-poly .cb{--c:#2b343b;--top:linear-gradient(135deg,#3d4852,#1c2328)}
.jb-cross .cb>.t::after{content:"";position:absolute;left:8%;right:8%;top:40%;height:20%;background:var(--amber)}
.jb-sc{position:absolute;border-radius:50%;transform:translateZ(8px);background:radial-gradient(circle at 35% 30%,#e9f0f3,#8a9aa4 62%,#4a5963);box-shadow:0 1px 2px #0008}
.jb-sc::after{content:"";position:absolute;inset:27%;background:#0a0f13;clip-path:polygon(25% 6.7%,75% 6.7%,100% 50%,75% 93.3%,25% 93.3%,0 50%)}
.jb-frame .jb-sc{transform:translateZ(4.8px)}
.jb-slot{position:absolute;background:#04070a;box-shadow:inset 0 2px 4px #000;transform:translateZ(7.4px)}
.jb-leg{position:absolute;font:700 11px var(--mono);letter-spacing:.1em;color:#c4d0d6;text-shadow:0 1px 0 #000;transform:translateZ(1px)}
.jb-leg.on{left:34px;top:12px}
.jb-leg.off{left:34px;top:276px}
.jb-lamp{position:absolute;left:10px}
.jb-lamp.on{top:10px}
.jb-lamp.off{top:274px}
.jb-rod{position:absolute;height:16px}
.jb-rod .tube{position:absolute;inset:0;--c:#aab8c0}
.jb-frame{position:absolute;left:0;top:150px;width:152px;height:0;transform:translateZ(13px) rotateX(var(--open));transition:transform .6s cubic-bezier(.35,1.12,.45,1)}
.lathe{position:absolute;left:0;top:0;width:0;height:0}
.jb-handle{position:absolute;left:76px;top:-112px;width:0;height:0;transform:rotateZ(-90deg)}
.jb-handle .tube.rib .fc{background:
  repeating-linear-gradient(90deg,#0000 0 3px,#000a 3px 5px),
  linear-gradient(rgb(255 255 255 / calc((var(--b) - .6) * 1.2)),rgb(255 255 255 / calc((var(--b) - .6) * 1.2))),
  color-mix(in srgb,var(--c) calc(16% + var(--b) * 84%),#000)}
.jb-hcap{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e8eef1,#8797a1)}
.jb-hit{position:absolute;left:30px;top:-30px;width:92px;height:360px;transform:translateZ(70px);cursor:grab;touch-action:none}
.jb-hit:active{cursor:grabbing}
.w-jb.up{--open:0deg}
.w-jb.dn{--open:-180deg}

/* plain name plates (the only thing the bottom ever carries besides the serial plate) */
.w-np{--c:#9aa9b0;--top:linear-gradient(160deg,#dde5e8,#a8b6bd)}
.w-np>.t{width:152px;padding:9px 12px;color:#26323a;font:600 10px/1.5 var(--mono);letter-spacing:.06em;box-shadow:inset 0 0 0 1px #0b141a44,inset 0 0 0 3px #ffffffaa}
.w-np b{display:block;font-size:12px}
.w-np span{display:block}

.combo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.combo .cd{display:grid;gap:4px;justify-items:center}
.combo small{font:600 12px var(--mono);color:var(--mute)}
.combo .mini-lcd{width:100%;font-size:40px}

/* ================= settings, seed ================= */
input,textarea{-webkit-user-select:text;user-select:text}
.startrow{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.setbtn{padding:11px 16px;font-size:15px;white-space:nowrap}
.seedrow{display:flex;gap:8px;align-items:center}
.seedin{flex:0 1 230px;min-width:0;height:36px;padding:0 12px;font:16px var(--mono);letter-spacing:.06em;color:var(--ice);background:#06111a;border:1px solid #43dfff55;outline:none;border-radius:0}
.seedin:focus{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.seedin::placeholder{color:#5d7782;letter-spacing:0;font-size:14px}
.seedhint{display:block;margin-top:6px;font-size:13px;color:var(--mute);line-height:1.4}
.seedchip{font-family:var(--mono);letter-spacing:.04em}
.settings{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;overflow:auto;background:#02060ad9}
.sp{width:min(580px,100%);padding:18px 22px 20px;background:var(--deep);border:1px solid #43dfff66;clip-path:var(--cut);box-shadow:0 30px 80px #000}
.sp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sp-head b{letter-spacing:.16em;font-size:16px}
.sp h4{margin:18px 0 6px;font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--cyan);border-bottom:1px solid #43dfff33;padding-bottom:6px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:7px 0}
.srow>b{font-weight:500;font-size:15px}
.sctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.slider{display:flex;align-items:center;gap:10px}
.slider output{min-width:4ch;text-align:right;font:13px var(--mono);color:var(--cyan)}
.slider input[type=range]{-webkit-appearance:none;appearance:none;width:170px;height:6px;margin:0;background:#43dfff22;border:1px solid #43dfff44;outline:none}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:22px;background:var(--cyan);border:0;border-radius:2px;cursor:pointer}
.slider input[type=range]::-moz-range-thumb{width:14px;height:22px;background:var(--cyan);border:0;border-radius:2px;cursor:pointer}
.slider input[type=range]:focus-visible{box-shadow:0 0 0 2px var(--cyan)}
.sp .seg-ctl button{padding:5px 12px;font-size:14px}
.sp-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.sp-foot small{color:var(--mute)}
.overlay .seedline{margin:-12px 0 22px;font-size:15px;opacity:.85}
.overlay .seedline b{font-family:var(--mono);letter-spacing:.06em}

.settings.confirm{z-index:75}
.sp.cf{width:min(440px,100%)}
.cf-text{margin:12px 0 18px;line-height:1.5;color:#b4cbd2;font-size:16px}
.cf-row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.cf-row .tbtn{padding:9px 22px;font-size:15px}
.tbtn.danger{border-color:var(--red);background:#ff3b5c22;color:#ffd6dd}
.tbtn.danger:hover{background:#ff3b5c44}

/* ================= module viewer (debug) ================= */
.bench{position:fixed;inset:0;z-index:80;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--abyss)}
.bench-head{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid #43dfff33}
.bench-head b{letter-spacing:.16em}
.bench-head small{flex:1;color:var(--mute);font-size:13px}
.bench-body{display:grid;grid-template-columns:250px minmax(0,1fr) 400px;min-height:0}
.bench-list{overflow-y:auto;padding:10px 6px 10px 10px;border-right:1px solid #43dfff22;display:flex;flex-direction:column;gap:5px}
.bench-item{flex:none;text-align:left;padding:6px 12px;background:#43dfff10;border:1px solid #43dfff33;clip-path:var(--cut8);font-size:14.5px;line-height:1.3;color:var(--ice);display:flex;flex-direction:column;gap:2px}
.bench-item .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;gap:4px;flex-wrap:nowrap}
.badge{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:0 5px;border:1px solid currentColor;border-radius:2px;color:var(--mute);white-space:nowrap}
.badge.diff-easy{color:var(--mint)}.badge.diff-medium{color:var(--amber)}.badge.diff-hard{color:var(--red)}
.bench-item.is-off{opacity:.42;filter:grayscale(1)}
.bench-item.is-off .ttl{text-decoration:line-through}
.badge.rear{color:#b9c6ce}.badge.needy{color:#ff8a3d}
.bench-item:hover{background:#43dfff22}
.bench-item[aria-pressed=true]{background:#43dfff2e;border-color:var(--cyan)}
.bench-main{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.bench-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px}
.bench-sp{flex:1}
.bench-tools .tbtn[aria-pressed=true]{background:var(--cyan);color:#021117;border-color:var(--cyan);font-weight:600}
.bench-stages{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px 10px;min-height:0}
.bench-stage.stage{height:100%;min-height:0;border:1px solid #43dfff22}
.bench-cap{position:absolute;left:10px;top:8px;z-index:3;font:600 12px var(--mono);letter-spacing:.08em;color:var(--cyan);pointer-events:none}
.bench-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 0;font-size:20px}
.bench-desc{margin:0;line-height:1.5;color:var(--ice)}
.bench-feedback{margin:0;padding:6px 10px;border-left:3px solid #43dfff55;color:var(--mute);font-size:13.5px}
.bench-feedback.ok{border-color:var(--mint);color:var(--mint)}.bench-feedback.bad{border-color:var(--red);color:#ff8fa3}
.bench-box{border:1px solid #43dfff2a;background:#08121a;padding:6px 10px}
.bench-box summary{cursor:pointer;font-weight:600;letter-spacing:.05em}
.bench-box h4{margin:2px 0 6px;font-size:13px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.bench-fact{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;font-size:13.5px}
.bench-fact>span:first-child{color:var(--mute)}
.seg-ctl button.diff-easy{color:var(--mint);border-color:#4dffb066;background:#4dffb012}.seg-ctl button.diff-medium{color:var(--amber);border-color:#ffb22466;background:#ffb22412}.seg-ctl button.diff-hard{color:var(--red);border-color:#ff3b5c66;background:#ff3b5c12}
.seg-ctl button.diff-easy[aria-pressed=true]{background:var(--mint);border-color:var(--mint);color:#021117}.seg-ctl button.diff-medium[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#021117}.seg-ctl button.diff-hard[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.seg-ctl button:not([aria-pressed=true]):hover{background:#43dfff24}
.seg-ctl button.diff-easy:not([aria-pressed=true]):hover{background:#4dffb02a}.seg-ctl button.diff-medium:not([aria-pressed=true]):hover{background:#ffb2242a}.seg-ctl button.diff-hard:not([aria-pressed=true]):hover{background:#ff3b5c2a}
.seg-ctl button[aria-pressed=true]:hover{filter:brightness(1.12)}
.bench-side{overflow:auto;padding:10px;border-left:1px solid #43dfff22;display:flex;flex-direction:column;gap:8px;font-size:14px;min-height:0}
.bench-enc{display:inline-flex;align-items:center;gap:4px}
.bench-enc .tbtn{padding:2px 9px}
.bench .manual{padding:0;max-width:none;font-size:14px}
@media(max-width:1000px){.bench-body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;overflow:auto}.bench-list{flex-direction:row;overflow-x:auto;border-right:0}.bench-stages{grid-template-columns:1fr;height:70vh}.bench-side{border-left:0}}

/* ================= feedback ================= */
body.hit::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;box-shadow:inset 0 0 150px var(--red);animation:hit .5s forwards}
@keyframes hit{from{opacity:1}to{opacity:0}}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-9px,4px)}40%{transform:translate(8px,-6px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(5px,5px)}}
.overlay{position:fixed;inset:0;display:grid;place-items:center;z-index:50;padding:20px;text-align:center}
.overlay>div{max-width:660px;display:grid;justify-items:center}
.overlay h2{font-size:clamp(46px,11vw,108px);margin:14px 0 12px;line-height:.95;letter-spacing:.03em}
.overlay p{font-size:20px;margin:0 0 26px}
.overlay .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.overlay button{padding:12px 24px;border:1px solid currentColor;background:#0003;font-weight:600;clip-path:var(--cut8)}
.overlay button:hover{background:#fff2}
.overlay.boom{background:radial-gradient(circle at 50% 42%,#ff3b5cf7,#6e0720fa 72%);color:#fff;animation:flash .9s}
.overlay.boom h2{text-shadow:3px 0 var(--cyan),-3px 0 var(--amber)}
.overlay.boom .logo-mark line{stroke:#ffd5dc}
.overlay.win{background:radial-gradient(circle at 50% 42%,#0b3d49f7,#050d12fa 75%);color:var(--cyan)}
.overlay.win h2{text-shadow:0 0 30px #43dfff77}
@keyframes flash{0%{background:#fff}100%{background:radial-gradient(circle at 50% 42%,#ff3b5cf7,#6e0720fa 72%)}}

/* ================= manual ================= */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--deep);color:var(--ice);z-index:40;
  transform:translateX(102%);transition:transform .25s;overflow:auto;border-left:1px solid #43dfff55;box-shadow:-20px 0 60px #000a}
.drawer.open{transform:none}
.dhead{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:10px 16px;background:#0d1a22;border-bottom:1px solid #43dfff33;z-index:2}
.dhead b{margin-right:auto;letter-spacing:.1em}
.dhead button{background:#43dfff10;border:1px solid #43dfff44;padding:5px 12px;font-size:14px;clip-path:var(--cut8)}
.manual{padding:22px 24px 70px;line-height:1.55;max-width:74ch;font-family:var(--ui);color:var(--ice)}
body.manual-page .manual{margin:0 auto}
.manual .mh{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.manual h1{font-size:30px;margin:0;letter-spacing:.04em}
.manual h2{position:relative;font-size:22px;margin:38px 0 10px;padding-top:16px;border-top:1px solid #43dfff44}
.manual h2::before{content:"";position:absolute;top:-2px;left:0;width:56px;height:3px;background:var(--cyan)}
.manual h3{font-size:16px;margin:18px 0 6px;color:var(--cyan)}
.manual nav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.manual nav a{color:var(--ice);background:#43dfff14;border:1px solid #43dfff44;padding:4px 12px;text-decoration:none;font-size:14px;clip-path:var(--cut8)}
.manual nav a:hover{background:#43dfff2c}
.manual ol,.manual ul{padding-left:22px}
.manual li{margin:6px 0}
.chip{display:inline-block;padding:0 8px;font-weight:600;font-size:.92em}
.c-red{background:#e5412d;color:#fff}.c-blue{background:#2f6bff;color:#fff}
.c-yellow{background:#f2c230;color:#161c1f}.c-white{background:#fff;color:#161c1f}
.c-black{background:#05080a;color:#fff;box-shadow:inset 0 0 0 1px #43dfff66}.c-green{background:#2fbf63;color:#161c1f}
.tbl{border-collapse:collapse;width:100%;margin:8px 0 14px;font-size:15px}
.tbl th,.tbl td{border:1px solid #43dfff33;padding:6px 8px;text-align:left}
.tbl th{background:#43dfff14}
.gcols{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.gcol{background:#0a1a21;border:1px solid #43dfff33;color:var(--cyan);padding:8px 4px;display:flex;flex-direction:column;gap:8px;align-items:center}
.gcol svg{width:34px;height:34px;filter:drop-shadow(0 0 4px #43dfff88)}
.gcol b{font:600 14px var(--mono);color:var(--amber)}
.mchart{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 10px;font-family:var(--mono);margin:10px 0}
.mchart b{color:var(--cyan)}
.pat-c{font-size:18px;letter-spacing:.15em;color:var(--cyan);line-height:1.3}
.words{columns:5 90px;font-family:var(--mono);font-size:18px;margin:10px 0;color:var(--cyan)}
.manual figure.schem{margin:12px 0 16px}
.manual figure.schem svg{display:block;max-width:100%;height:auto;color:var(--ice)}
.manual figcaption{margin-top:6px;font-size:13px;color:var(--mute)}

/* ================= manual: actions and print (a fresh print is the fallback while the stored PDF is out of date) ================= */
.mact{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 2px}
.mbtn{padding:6px 14px;font-size:14px;background:#43dfff10;border:1px solid #43dfff44;color:var(--ice);cursor:pointer;clip-path:var(--cut8)}
.mbtn:hover{background:#43dfff24}
.seedlast{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--mute)}
.seedlast b{display:inline;margin:0;font:inherit;font-family:var(--mono);color:var(--ice);letter-spacing:.06em}
.seedlast .tbtn{color:var(--ice)}
@media print{
  @page{size:A4;margin:15mm 14mm 18mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body,body.manual-page{background:#fff!important;color:#14191c!important;min-height:0}
  .no-print,.manual nav,.dhead{display:none!important}
  .drawer{position:static;transform:none;width:auto;overflow:visible;background:#fff;border:0;box-shadow:none}
  .manual{max-width:none;padding:0;color:#14191c;font:10.5pt/1.5 Carlito,Calibri,"Liberation Sans",Arial,sans-serif}
  .manual h1{font-size:24pt;color:#06222b}
  .manual h2{break-after:avoid;border-top:1.5pt solid #0b7a94;color:#06222b;margin-top:22pt}
  .manual h2::before{background:#0b7a94}
  .manual h3{break-after:avoid;color:#0b6f87}
  .manual p,.manual li{orphans:3;widows:3}
  .tbl th{background:#e3eef2;color:#14191c}
  .tbl th,.tbl td{border-color:#8aa3ad}
  .tbl,.gcols,.words,.mchart,.manual figure,.manual .gates{break-inside:avoid}
  .manual .gate{background:#fff;border-color:#8aa3ad}
  .manual .gate svg{color:#0b4b5e}
  .manual .gate b{color:#8a5600}
  .manual figure.schem svg{color:#14191c}
  .manual figcaption{color:#3d4c53}
  .tbl tr,.manual li,.gcol,.mchart>div{break-inside:avoid}
  .gcol{background:#fff;border-color:#8aa3ad;color:#0b4b5e}
  .gcol svg{filter:none}
  .gcol b{color:#8a5600}
  .words,.mchart,.pat-c{font-family:"DejaVu Sans Mono",Consolas,"Courier New",monospace;color:#0b4b5e}
  .mchart b{color:#0b6f87}
  .chip.c-white{box-shadow:inset 0 0 0 1px #8a8a8a}
  .chip.c-black{box-shadow:none}
  .manual .logo-mark ellipse{stroke:#06222b}
}

@media(max-width:900px){.start{grid-template-columns:1fr;padding-top:24px;min-height:0}.demo{height:360px;min-height:300px}}
@media(prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(() => {
'use strict';

/* =====================================================================
   0. SMALL HELPERS
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const pdfNode = document.getElementById('manual-pdf');   // the embedded PDF of the manual, if one was built
const pad = n => String(n).padStart(2, '0');

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return e;
}
const html = (tag, attrs, markup) => { const e = h(tag, attrs); e.innerHTML = markup; return e; };

// Seeded RNG (mulberry32) so every bomb is reproducible from its seed.
function rng(seed) {
  let a = seed >>> 0;
  const f = () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.int = n => Math.floor(f() * n);
  f.pick = arr => arr[f.int(arr.length)];
  f.shuffle = arr => { arr = arr.slice(); for (let i = arr.length - 1; i > 0; i--) { const j = f.int(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  return f;
}

function fmt(ms) {
  ms = Math.max(0, ms);
  const s = ms / 1000;
  if (s >= 60) return pad(Math.floor(s / 60)) + ':' + pad(Math.floor(s % 60));
  return pad(Math.floor(s)) + '.' + pad(Math.floor((ms % 1000) / 10));   // from whole milliseconds, so 7430 shows 07.43
}

// Warning beep: how often it sounds at `msLeft` on the clock, and whether the clock just passed a beep.
function beepInterval(msLeft, mode) {
  if (mode === '60') return 60000;
  if (mode === '30') return 30000;
  if (mode === 'dynamic') return msLeft < 60000 ? 10000 : msLeft < 180000 ? 30000 : 60000;
  return null;
}
function beepDue(prevMs, nowMs, mode) {
  const i = beepInterval(nowMs, mode);
  return !!i && nowMs > 0 && Math.ceil(prevMs / i) !== Math.ceil(nowMs / i);
}

const chip = c => `<span class="chip c-${c}">${c}</span>`;

// A solid box: top face plus four walls. `d` is its height in px.
