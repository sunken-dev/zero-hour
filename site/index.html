    if (!this.ctx || !music.on) return;
    const t = this.ctx.currentTime;
    [[music.bus.gain, Math.max(music.level(), .0001)], [music.send.gain, m ? 0 : 1]].forEach(([p, v]) => {
      p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); p.linearRampToValueAtTime(v, t + .08);
    });
  },
  applyVolumes() {                                     // after a volume setting changes
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.value = settings.master;
    this.fx.gain.value = this.muted ? 0 : settings.fx;
    this.fxSend.gain.value = this.muted ? 0 : settings.fx;
    if (music.on) [[music.bus.gain, Math.max(music.level(), .0001)], [music.send.gain, this.musicMuted ? 0 : 1]].forEach(([p, v]) => {
      p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); p.linearRampToValueAtTime(v, t + .08);
    });
  },
  ok() { return !!this.ctx && !this.muted; },
  now() { return this.ctx.currentTime; },

  /* ---- voices ---- */
  // tone with envelope. o: type vol attack hold detune slideTo slideTime lp lpEnd q dest send sendDest
  note(f, t, d, o = {}) {
    const c = this.ctx;
    const g = c.createGain(), osc = c.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.slideTo) osc.frequency.exponentialRampToValueAtTime(o.slideTo, t + (o.slideTime || d));
    if (o.detune) osc.detune.value = o.detune;
    const v = o.vol ?? .1, a = Math.min(o.attack ?? .004, d * .5);
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(v, t + a);
    if (o.hold) g.gain.setValueAtTime(v, t + a + o.hold);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    let node = osc;
    if (o.lp) {
      const f2 = c.createBiquadFilter(); f2.type = 'lowpass'; f2.Q.value = o.q || .7;
      f2.frequency.setValueAtTime(o.lp, t);
      if (o.lpEnd) f2.frequency.exponentialRampToValueAtTime(o.lpEnd, t + d);
      osc.connect(f2); node = f2;
    }
    node.connect(g); g.connect(o.dest || this.fx);
    if (o.send) { const s = c.createGain(); s.gain.value = o.send; g.connect(s); s.connect(o.sendDest || this.fxSend); }
    osc.start(t); osc.stop(t + d + .05);
  },
  // filtered noise burst. o: type f fEnd q vol attack dest send sendDest
  burst(t, d, o = {}) {
    const c = this.ctx, src = c.createBufferSource();
    src.buffer = this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = o.type || 'lowpass'; f.Q.value = o.q || .7;
    f.frequency.setValueAtTime(o.f || 2000, t);
    if (o.fEnd) f.frequency.exponentialRampToValueAtTime(o.fEnd, t + d);
    const g = c.createGain(), v = o.vol ?? .2, a = Math.min(o.attack ?? .002, d - .005);
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    src.connect(f); f.connect(g); g.connect(o.dest || this.fx);
    if (o.send) { const s = c.createGain(); s.gain.value = o.send; g.connect(s); s.connect(o.sendDest || this.fxSend); }
    src.start(t, Math.random() * 1.5); src.stop(t + d + .05);
  },
  bellAt(f, t, d = .8, vol = .12) {
    this.note(f, t, d, { vol, send: .4 });
    this.note(f * 2.76, t, d * .45, { vol: vol * .3, send: .3 });
    this.note(f * 5.4, t, d * .2, { vol: vol * .1 });
  },

  /* ---- interface sounds ---- */
  click() {
    if (!this.ok()) return; const t = this.now();
    this.burst(t, .025, { type: 'bandpass', f: 3000, q: 1.4, vol: .16 });
    this.note(210, t, .07, { vol: .14, slideTo: 110 });
  },
  press() {
    if (!this.ok()) return; const t = this.now();
    this.note(150, t, .14, { vol: .35, slideTo: 62 });
    this.burst(t, .06, { type: 'lowpass', f: 1100, vol: .2 });
  },
  release() {
    if (!this.ok()) return; const t = this.now();
    this.note(300, t, .06, { vol: .12, slideTo: 200 });
    this.burst(t, .03, { type: 'bandpass', f: 2600, q: 1.4, vol: .14 });
  },
  detent() {
    if (!this.ok()) return; const t = this.now();
    this.burst(t, .02, { type: 'bandpass', f: 2600, q: 2, vol: .2 });
    this.note(1700, t, .03, { type: 'square', vol: .04, lp: 3500 });
  },
  beep(f = 700, d = .18, vol = .06) {
    if (!this.ok()) return;
    this.note(f, this.now(), d, { type: 'sine', vol, attack: .01, lp: 3000 });
  },
  lever() {
    if (!this.ok()) return; const t = this.now();
    this.note(120, t, .22, { vol: .5, slideTo: 55 });
    this.burst(t, .06, { type: 'bandpass', f: 1800, q: 1.2, vol: .28 });
    this.note(900, t + .17, .05, { type: 'square', vol: .05, lp: 3000 });
  },
  turn() {
    if (!this.ok()) return; const t = this.now();
    this.burst(t, .35, { type: 'bandpass', f: 300, fEnd: 1600, q: 1.2, vol: .1, attack: .12 });
    this.note(90, t, .3, { vol: .12, slideTo: 60 });
  },
  snip() {
    if (!this.ok()) return; const t = this.now();
    this.burst(t, .05, { type: 'highpass', f: 4500, vol: .3 });
    this.note(2600, t, .06, { type: 'square', vol: .05, slideTo: 900 });
    this.burst(t + .03, .2, { type: 'highpass', f: 6500, vol: .05 });
  },
  bell(f, d = .6, vol = .12) { if (this.ok()) this.bellAt(f, this.now(), d, vol); },
  step(n) {
    if (!this.ok()) return;
    const scale = [523, 587, 659, 784, 880, 988];
    this.click(); this.bellAt(scale[n % scale.length], this.now(), .5, .1);
  },
  tick(level = 0) {
    if (!this.ok()) return; const t = this.now();
    if (level === 0) {
      this.note(1250, t, .04, { vol: .05 });
    } else if (level === 1) {
      this.note(1700, t, .035, { type: 'square', vol: .04, lp: 4000 });
    } else {
      this.note(2100, t, .03, { type: 'square', vol: .06, lp: 5000 });
      this.note(210, t, .12, { vol: .2, slideTo: 120 });
    }
  },

  /* ---- outcomes ---- */
  solve() {
    if (!this.ok()) return; const t = this.now();
    this.note(180, t, .09, { vol: .3, slideTo: 90 });
    this.burst(t, .03, { type: 'bandpass', f: 2400, q: 1.2, vol: .2 });
    [784, 988, 1175, 1568].forEach((f, i) => this.bellAt(f, t + .08 + i * .085, .9, .1));
  },
  strike() {
    if (!this.ok()) return; const t = this.now();
    this.note(120, t, .6, { type: 'sawtooth', vol: .25, lp: 2200, lpEnd: 260, slideTo: 62, send: .25 });
    this.note(127, t, .6, { type: 'square', vol: .12, lp: 1800, lpEnd: 250, slideTo: 66 });
    this.note(95, t, .35, { vol: .55, slideTo: 38 });
    this.burst(t, .15, { type: 'lowpass', f: 3500, fEnd: 300, vol: .4, dest: this.dist });
    this.note(880, t + .02, .1, { type: 'square', vol: .1, lp: 3000 });
    this.note(880, t + .18, .1, { type: 'square', vol: .1, lp: 3000 });
  },
  win() {
    if (!this.ok()) return; const t = this.now();
    const chord = (ms, t0, d, v) => ms.forEach(m => {
      [-6, 6].forEach(det => this.note(mtof(m), t0, d, { type: 'sawtooth', vol: v, lp: 3200, lpEnd: 900, attack: .01, detune: det, send: .3 }));
    });
    this.burst(t, .5, { type: 'bandpass', f: 300, fEnd: 5000, q: 2, vol: .18, attack: .45 });          // rising whoosh
    [0, .15, .30].forEach(dt => chord([67, 72, 76], t + dt + .1, .2, .06));                             // three stabs
    chord([48, 60, 64, 67, 72, 76], t + .6, 3.4, .06);                                                  // big C major
    this.note(110, t + .6, .8, { vol: .7, slideTo: 55 });                                               // timpani
    this.burst(t + .6, 2.6, { type: 'highpass', f: 5200, vol: .28, send: .3 });                         // cymbal
    [84, 88, 91, 96, 100, 103].forEach((m, i) => this.bellAt(mtof(m), t + .65 + i * .07, 1.8, .07));    // shimmer
  },
  boom() {
    if (!this.ok()) return; const t = this.now();
    this.burst(t, .12, { type: 'highpass', f: 900, vol: .8, attack: .001, dest: this.dist });                      // crack
    this.burst(t, 2.4, { type: 'lowpass', f: 9000, fEnd: 110, vol: .85, attack: .003, dest: this.dist, send: .5 }); // blast
    this.note(150, t, 2.2, { vol: .85, slideTo: 24, slideTime: 1.6, send: .2 });                                    // sub drop
    this.note(70, t, 1.4, { type: 'sawtooth', vol: .5, lp: 420, lpEnd: 60, slideTo: 30 });                         // body
    this.burst(t + .1, 3.6, { type: 'lowpass', f: 260, fEnd: 70, vol: .7, attack: .25, send: .4 });                // rumble
    for (let i = 0; i < 22; i++) {                                                                                 // debris
      const dt = .12 + Math.pow(Math.random(), 1.6) * 2.4;
      this.burst(t + dt, .03 + Math.random() * .07, { type: 'bandpass', f: 1200 + Math.random() * 5000, q: 2, vol: .3 * (1 - dt / 3) + .04, send: .3 });
    }
    this.note(3150, t + .2, 3, { vol: .05, attack: .4, send: .2 });                                                // ringing ears
    this.sting(t + 1.5);
  },
  sting(t) {                                                      // slow descending minor motif after the blast
    [[329.6, 0], [261.6, .55], [220, 1.1]].forEach(([f, dt]) => {
      this.note(f, t + dt, .6, { type: 'sawtooth', vol: .17, lp: 1400, lpEnd: 300, send: .5, attack: .02 });
      this.note(f / 2, t + dt, .6, { type: 'triangle', vol: .2 });
    });
    this.note(110, t + 1.7, 2.6, { type: 'sawtooth', vol: .2, lp: 900, lpEnd: 120, slideTo: 73, slideTime: 2.4, send: .6, attack: .05 });
    this.note(55, t + 1.7, 2.6, { vol: .3, slideTo: 36, slideTime: 2.4 });
  }
};

/* ---------------------------------------------------------------------
   Adaptive music. Intensity (0..1) follows the clock and the strikes.
   It sets the tempo (78 to 150 bpm) and brings layers in one by one:
     0.00  pad and sparse bells (chill)
     0.15  bass            0.28  arpeggio        0.35  kick
     0.45  off-beat hats   0.60  snare           0.70  16th hats, driving bass
     0.80  lead stabs      last 12 s: noise riser
   --------------------------------------------------------------------- */
const music = {
  on: false, timer: 0, step: 0, next: 0, I: 0, target: 0, riser: false,
  bus: null, duck: null, send: null,
  PROG: [
    { root: 45, ch: [57, 60, 64] },   // Am
    { root: 41, ch: [53, 57, 60] },   // F
    { root: 38, ch: [50, 53, 57] },   // Dm
    { root: 40, ch: [52, 56, 59] }    // E
  ],
  level() { return sfx.musicMuted ? 0 : settings.music; },

  start() {
    const c = sfx.ctx;
    if (!c || this.on) return;
    this.on = true; this.step = 0; this.I = .04; this.target = .04; this.riser = false;
    this.next = c.currentTime + .15;
    this.bus = c.createGain();
    this.bus.gain.setValueAtTime(.0001, c.currentTime);
    this.bus.gain.linearRampToValueAtTime(Math.max(this.level(), .0001), c.currentTime + 2.5);
    this.bus.connect(sfx.master);
    this.duck = c.createGain(); this.duck.connect(this.bus);       // pumps under the kick
    this.send = c.createGain(); this.send.gain.value = sfx.musicMuted ? 0 : 1; this.send.connect(sfx.rev);   // reverb send for music (muted with it)
    this.timer = setInterval(() => this.pump(), 25);
  },
  stop(fade = .5) {
    if (!this.on) return;
    this.on = false; clearInterval(this.timer);
    const c = sfx.ctx, t = c.currentTime, bus = this.bus, send = this.send, duck = this.duck;
    [bus.gain, send.gain].forEach(p => {
      p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); p.linearRampToValueAtTime(0, t + fade);
    });
    setTimeout(() => { try { bus.disconnect(); send.disconnect(); duck.disconnect(); } catch (e) {} }, fade * 1000 + 300);
  },
  update(left, total, strikes) {
    if (!this.on) return;
    const p = 1 - left / total;
    this.target = clamp01(.04 + .6 * p + (left < 45000 ? .34 * (1 - left / 45000) : 0) + .07 * strikes);
    if (left < 12000 && !this.riser) {
      this.riser = true;
      const d = Math.max(2, left / 1000 * .85);
      sfx.burst(sfx.ctx.currentTime, d, { type: 'bandpass', f: 400, fEnd: 8000, q: 2, vol: .2, attack: d - .05, dest: this.bus });
    }
  },
  hit() {                                   // dip the music when a strike lands
    if (!this.on) return;
    const g = this.bus.gain, t = sfx.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(.08, t + .04);
    g.linearRampToValueAtTime(Math.max(this.level(), .0001), t + 1.1);
  },

  pump() {
    const c = sfx.ctx;
    if (!c || !this.on) return;
    this.I += (this.target - this.I) * .012;
    if (this.next < c.currentTime - .1) this.next = c.currentTime + .05;   // tab was throttled: skip, don't burst
    while (this.next < c.currentTime + .14) {
      if (!sfx.musicMuted) this.play(this.step, this.next);
      this.next += 60 / (78 + 72 * this.I) / 4;
      this.step++;
    }
  },

  play(n, t) {
    const I = this.I, s = n % 16, ch = this.PROG[Math.floor(n / 16) % 4];
    const sd = 60 / (78 + 72 * I) / 4, barDur = sd * 16;
    const bus = this.bus, duck = this.duck, send = this.send;

    if (s === 0) {                                                     // pad + sub drone
      const cut = 450 + 2600 * I, att = Math.min(.9, barDur * .4);
      [...ch.ch, ch.ch[0] + 12].forEach(m => [-7, 7].forEach(det =>
        sfx.note(mtof(m), t, barDur * 1.05, { type: 'sawtooth', vol: .028 + .008 * I, attack: att, hold: barDur * .35, lp: cut, lpEnd: cut * .6, detune: det, dest: duck, send: .5, sendDest: send })));
      sfx.note(mtof(ch.root - 12), t, barDur * 1.05, { vol: .13, attack: att, hold: barDur * .35, dest: bus });
    }

    const w = clamp01(1 - (I - .25) / .35);                             // sparse bells fade out as it builds
    if (w > .05) {
      const chance = { 0: 1, 6: .5, 10: .6, 14: .3 }[s];
      if (chance && Math.random() < chance) {
        const m = ch.ch[Math.floor(Math.random() * 3)] + (Math.random() < .5 ? 12 : 24);
        sfx.note(mtof(m), t, 1.4, { vol: .07 * w, send: .7, sendDest: send, dest: duck });
        sfx.note(mtof(m) * 2.76, t, .5, { vol: .02 * w, dest: duck });
      }
    }

    if (I > .15) {                                                      // bass
      const lvl = I < .4 ? 0 : I < .65 ? 1 : 2;
      let on, oct = 0;
      if (lvl === 0) on = s === 0 || s === 8;
      else if (lvl === 1) on = s % 2 === 0;
      else { on = true; if (s % 4 === 3) oct = 12; }
      if (on) sfx.note(mtof(ch.root + oct), t, lvl === 0 ? sd * 7 : sd * (lvl === 1 ? 1.6 : .9),
        { type: lvl ? 'sawtooth' : 'triangle', vol: lvl ? .11 : .16, lp: 200 + I * 1400, lpEnd: 140, dest: bus });
    }

    if (I > .35) {                                                      // kick (with pad pump)
      const kicks = [0, 4, 8, 12]; if (I > .72) kicks.push(10); if (I > .85) kicks.push(14);
      if (kicks.includes(s)) {
        sfx.note(150, t, .3, { vol: .6, slideTo: 42, slideTime: .14, dest: bus });
        sfx.burst(t, .02, { type: 'lowpass', f: 2000, vol: .15, dest: bus });
        if (I > .5) { const g = duck.gain; g.cancelScheduledValues(t); g.setValueAtTime(.35, t); g.linearRampToValueAtTime(1, t + .22); }
      }
    }

    if (I > .45) {                                                      // hats
      const off = s % 4 === 2, on = I > .7 || off;
      if (on) sfx.burst(t, s === 14 && I > .6 ? .18 : .04, { type: 'highpass', f: 7500, vol: off ? .07 : .04, dest: bus });
    }

    if (I > .6 && (s === 4 || s === 12)) {                              // snare
      sfx.burst(t, .16, { type: 'bandpass', f: 1900, q: .8, vol: .2, dest: bus, send: .2, sendDest: send });
      sfx.note(190, t, .1, { type: 'triangle', vol: .14, slideTo: 120, dest: bus });
    }

    if (I > .28) {                                                      // arpeggio
      const fast = I > .55;
      if (fast || s % 2 === 0) {
        const pat = [0, 1, 2, 1, 0, 2, 1, 2];
        const m = ch.ch[pat[(fast ? s : s / 2) % 8]] + 12 + (I > .78 && s % 8 >= 4 ? 12 : 0);
        sfx.note(mtof(m), t, sd * (fast ? 1.2 : 2.2),
          { type: I > .5 ? 'sawtooth' : 'triangle', vol: .055, lp: 900 + I * 4200, lpEnd: 500, dest: duck, send: .25, sendDest: send });
      }
    }

    if (I > .8 && [0, 3, 6, 10, 12].includes(s)) {                      // lead stabs
      sfx.note(mtof(ch.ch[0] + 24), t, sd * 1.4, { type: 'square', vol: .035, lp: 3200, dest: bus });
    }
  }
};

/* =====================================================================
   2. MODULE REGISTRY
   ---------------------------------------------------------------------
   A module is a plain object. The game never needs to know what's in it.

   Modules.register({
     id:     'unique-id',
     title:  'Shown on the bomb and in the manual',
     difficulty: 'easy',               // 'easy', 'medium' or 'hard'
     max:    1,                        // optional: at most N per bomb
     needs:  ['lever'],                // optional: parts the bomb must have ('lever', 'encoders')
     create(bomb, r) { return {...} }, // roll the random puzzle data
     mount(root, state, ctl) { ... },  // build the DOM inside `root`
                                       // may return a cleanup function
     manual() { return '<p>HTML</p>' }, // the expert's pages for this module
     // optional: a rear plate. It shows on the back of the bomb, mirrored
     // behind the module. Leave these out and that spot stays a blank panel.
     mountBack(root, state, ctl) { ... },
     manualBack() { return '<p>HTML</p>' }
   });

   `bomb` : serial, serialOdd, serialVowel, batteries, indicators,
            coins, coinVolts, encoders, encSum(), leverUp(), hasLit('CAR'), strikes
   `r`    : seeded rng  -> r.int(n)  r.pick(arr)  r.shuffle(arr)  r()
   `ctl`  : ctl.solve()            mark this module defused
            ctl.strike('reason')   add a strike to the bomb
            ctl.isSolved()         true once solved
            ctl.timeText()         clock as shown, e.g. "04:12" or "37.80"
            ctl.bomb, ctl.sfx      (sfx: click press release snip bell step)
   Style hooks: the plate, header and status light are added for you.
   Use the CSS variables --cyan --amber --red --mint for your own widgets.
   ===================================================================== */
const Modules = {
  list: [],
  register(def) { this.list.push(def); }
};

/* ---------------------------------------------------------------------
   MODULE: Wires
   Rules are data: the same list drives the solver and the manual.
   Each rule = [text for manual, test(w, count, bomb), index to cut]
   --------------------------------------------------------------------- */
const WIRE_HEX = { red: '#e5412d', blue: '#2f6bff', yellow: '#f2c230', white: '#f4f4ef', black: '#1b1f22' };
const WIRE_GLOW = { red: '#ff4a4a', blue: '#3d7bff', yellow: '#ffd23d', white: '#d6eef3', black: '#4fa6c4' };
const WIRE_RULES = {
  3: [
    ['If there are no red wires, cut the second wire.', (w, n) => !n('red'), () => 1],
    ['Otherwise, if the last wire is white, cut the last wire.', w => w[2] === 'white', () => 2],
    ['Otherwise, if there is more than one blue wire, cut the last blue wire.', (w, n) => n('blue') > 1, w => w.lastIndexOf('blue')],
    ['Otherwise, cut the last wire.', () => true, () => 2]
  ],
  4: [
    ['If the encoders add up to 12 or more and the last wire is red, cut the last wire.', (w, n, b) => b.encSum() >= 12 && w[3] === 'red', () => 3],
    ['Otherwise, if there is more than one red wire and the last digit of the serial number is odd, cut the last red wire.', (w, n, b) => n('red') > 1 && b.serialOdd, w => w.lastIndexOf('red')],
    ['Otherwise, if the last wire is yellow and there are no red wires, cut the first wire.', (w, n) => w[3] === 'yellow' && !n('red'), () => 0],
    ['Otherwise, if there is exactly one blue wire, cut the first wire.', (w, n) => n('blue') === 1, () => 0],
    ['Otherwise, if there is more than one yellow wire, cut the last wire.', (w, n) => n('yellow') > 1, () => 3],
    ['Otherwise, cut the second wire.', () => true, () => 1]
  ],
  5: [
    ['If the last wire is black and the last digit of the serial number is odd, cut the fourth wire.', (w, n, b) => w[4] === 'black' && b.serialOdd, () => 3],
    ['Otherwise, if there is exactly one red wire and more than one yellow wire, cut the first wire.', (w, n) => n('red') === 1 && n('yellow') > 1, () => 0],
    ['Otherwise, if there are two coin cells, cut the third wire.', (w, n, b) => b.coins.length === 2, () => 2],
    ['Otherwise, if there are no black wires, cut the second wire.', (w, n) => !n('black'), () => 1],
    ['Otherwise, cut the first wire.', () => true, () => 0]
  ],
  6: [
    ['If there are no yellow wires and the last digit of the serial number is odd, cut the third wire.', (w, n, b) => !n('yellow') && b.serialOdd, () => 2],
    ['Otherwise, if there is exactly one yellow wire and more than one white wire, cut the fourth wire.', (w, n) => n('yellow') === 1 && n('white') > 1, () => 3],
    ['Otherwise, if there are no red wires, cut the last wire.', (w, n) => !n('red'), () => 5],
    ['Otherwise, if the coin cells add up to 3 volts or more, cut the second wire.', (w, n, b) => b.coinVolts >= 3, () => 1],
    ['Otherwise, cut the fourth wire.', () => true, () => 3]
  ]
};
function wireAnswer(w, b) {
  const n = c => w.filter(x => x === c).length;
  const rule = WIRE_RULES[w.length].find(r => r[1](w, n, b));
  return rule[2](w, n, b);
}

Modules.register({
  id: 'wires',
  title: 'Wires',
  difficulty: 'easy',
  create(bomb, r) {
    const wires = Array.from({ length: 3 + r.int(4) }, () => r.pick(Object.keys(WIRE_HEX)));
    return { wires, answer: wireAnswer(wires, bomb) };
  },
  mount(root, s, ctl) {
    const peg = () => h('i', { class: 'peg' }, h('i', { class: 'p1' }), h('i', { class: 'p2' }), h('i', { class: 'p3' }));
    const seg = side => h('span', { class: 'seg ' + side }, tube(4.5, 14, 5.5), h('i', { class: 'disc' }));
    const box = h('div', { class: 'wires' });
    s.wires.forEach((c, i) => {
      const w = h('div', { class: 'wire', style: `--c:${WIRE_HEX[c]};--g:${WIRE_GLOW[c]}` },
        h('i', { class: 'shd' }), h('i', { class: 'glow' }), peg(), seg('l'), h('span', { class: 'gap' }), seg('r'), peg(), h('b', { class: 'spark' }));
      activate(w, () => {
        if (w.classList.contains('cut') || ctl.isSolved()) return;
        w.classList.add('cut'); ctl.sfx.snip();
        if (i === wireAnswer(s.wires, ctl.bomb)) ctl.solve();   // read live: the encoders can be turned
        else ctl.strike(`Cut the wrong wire (${c}, position ${i + 1}).`);
      }, `${c} wire, position ${i + 1}`);
      box.append(w);
    });
    root.append(box);
  },
  mountBack(root, s, ctl) {
    const pins = Number(ctl.bomb.serial.slice(-1));
    root.append(h('div', { class: 'plug3d' }, h('small', {}, 'harness plug'),
      h('div', { class: 'plug' }, Array.from({ length: 10 }, (_, k) => h('i', { class: k < pins ? 'pin' : 'hole' }))),
      h('div', { class: 'loom' }, h('i'), h('i'), h('i'))));
  },
  manual() {
    return '<p>Cut exactly one wire. Count wires from the top. Use the section that matches the number of wires and take the first rule that applies.</p>' +
      [3, 4, 5, 6].map(n => `<h3>${n} wires</h3><ol>${WIRE_RULES[n].map(r => `<li>${r[0]}</li>`).join('')}</ol>`).join('');
  },
  manualBack() {
    return '<p>The rear plate is the harness plug the wires run into. It has as many brass pins as the last digit of the serial number: an odd number of pins means the last digit is odd. An empty plug means the digit is 0, which is even. It saves searching the sides of the bomb for the serial.</p>';
  }
});

/* ---------------------------------------------------------------------
   MODULE: Button
   --------------------------------------------------------------------- */
const BTN_HEX = { red: '#e5412d', blue: '#2f6bff', yellow: '#f2c230', white: '#f4f4ef' };
const BTN_RULES = [
  ['If the button is blue and the label says ABORT, hold it.', s => s.color === 'blue' && s.label === 'ABORT', 'hold'],
  ['If there is more than one battery and the label says DETONATE, press and immediately release it.', (s, b) => b.batteries > 1 && s.label === 'DETONATE', 'tap'],
  ['If the button is white and there is a lit indicator labeled CAR, hold it.', (s, b) => s.color === 'white' && b.hasLit('CAR'), 'hold'],
  ['If there are more than two batteries and there is a lit indicator labeled FRK, press and immediately release it.', (s, b) => b.batteries > 2 && b.hasLit('FRK'), 'tap'],
  ['If the button is yellow, hold it.', s => s.color === 'yellow', 'hold'],
  ['If there is a coin cell marked CR2016, press and immediately release it.', (s, b) => b.coins.some(c => c.model === 'CR2016'), 'tap'],
  ['If the button is red and the label says HOLD, press and immediately release it.', s => s.color === 'red' && s.label === 'HOLD', 'tap'],
  ['If the encoders add up to an odd number and the label says PRESS, press and immediately release it.', (s, b) => b.encSum() % 2 === 1 && s.label === 'PRESS', 'tap'],
  ['Otherwise, hold it.', () => true, 'hold']
];
const BTN_RELEASE = { blue: '4', white: '1', yellow: '5', red: '1' };

Modules.register({
  id: 'button',
  title: 'Button',
  difficulty: 'easy',
  create(bomb, r) {
    return {
      color: r.pick(Object.keys(BTN_HEX)),
      label: r.pick(['ABORT', 'DETONATE', 'HOLD', 'PRESS']),
      strip: r.pick(Object.keys(BTN_RELEASE))
    };
  },
  mount(root, s, ctl) {
    let action = 'hold';
    const decide = () => BTN_RULES.find(r => r[1](s, ctl.bomb))[2];   // read live: the encoders can be turned
    const dark = s.color === 'white' || s.color === 'yellow';
    const strip = cuboid(5, '', 'strip');
    strip.style.setProperty('--sc', BTN_HEX[s.strip]);
    const cap = h('div', { class: 'cap3' },
      Array.from({ length: 15 }, (_, k) => h('i', { style: `--k:${k}` })),
      h('i', { class: 'top', style: '--k:15' }, s.label));
    const btn = h('div', { class: 'bigbtn', role: 'button', tabindex: '0', 'aria-label': `${s.color} button labeled ${s.label}`, style: `--bc:${BTN_HEX[s.color]};--bt:${dark ? '#161c1f' : '#fff'}` }, cap);
    let t0 = 0, timer = 0, down = false;

    const press = () => {
      if (down || ctl.isSolved()) return;
      down = true; t0 = performance.now(); action = decide();
      btn.classList.add('down'); ctl.sfx.press();
      timer = setTimeout(() => strip.classList.add('on'), 400);
    };
    const release = () => {
      if (!down) return;
      down = false; clearTimeout(timer);
      btn.classList.remove('down'); strip.classList.remove('on'); ctl.sfx.release();
      if (ctl.isSolved()) return;
      const held = performance.now() - t0;
      if (held < 400) {
        action === 'tap' ? ctl.solve() : ctl.strike('Tapped a button that should have been held.');
      } else if (action === 'tap') {
        ctl.strike('Held a button that should have been tapped.');
      } else {
        const d = BTN_RELEASE[s.strip];
        ctl.timeText().replace(/\D/g, '').includes(d) ? ctl.solve() : ctl.strike(`Released the button without a ${d} on the timer.`);
      }
    };
    btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.setPointerCapture(e.pointerId); press(); });
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('contextmenu', e => e.preventDefault());
    btn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(); } });
    btn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); release(); } });
    root.append(h('div', { class: 'btnmod' }, h('div', { class: 'socket' }, h('div', { class: 'well' }), h('i', { class: 'ring r1' }), h('i', { class: 'ring r2' }), btn), strip));
    return () => clearTimeout(timer);
  },
  manual() {
    return `<p>Tell the defuser to hold the button or tap it. Take the first rule that applies.</p>
      <ol>${BTN_RULES.map(r => `<li>${r[0]}</li>`).join('')}</ol>
      <h3>Holding the button</h3>
      <p>A colored light bar glows beside the button once it is held. Check its color, then tell the defuser to release when the countdown timer shows the matching digit in <em>any</em> position.</p>
      <table class="tbl"><tr><th>Light bar color</th><th>Release when the timer shows</th></tr>
      ${['blue', 'white', 'yellow'].map(c => `<tr><td>${chip(c)}</td><td>${BTN_RELEASE[c]}</td></tr>`).join('')}
      <tr><td>Any other color</td><td>${BTN_RELEASE.red}</td></tr></table>
      <p>"Press and immediately release" means a quick tap, well under half a second.</p>`;
  }
});

/* ---------------------------------------------------------------------
   MODULE: Glyphs
   --------------------------------------------------------------------- */
const GLYPHS = [
  'M12 3 L21 20 L3 20 Z',
  'M12 3 L21 12 L12 21 L3 12 Z',
  'M4 4 L20 20 M20 4 L4 20',
  'M12 3 V21 M3 12 H21',
  'M5 5 H19 V19 H5 Z M9 9 H15 V15 H9 Z',
  'M3 12 A9 9 0 1 0 21 12 A9 9 0 1 0 3 12 M12 7 V17',
  'M4 20 L12 4 L20 20 M7.5 14 H16.5',
  'M4 6 H20 M4 12 H14 M4 18 H20',
  'M6 4 L18 12 L6 20 Z M19 4 V20',
  'M3 12 Q12 3 21 12 Q12 21 3 12 M12 10 V14',
  'M5 4 V20 M19 4 V20 M5 12 H19',
  'M12 3 V21 M5 8 L12 3 L19 8 M5 16 L12 21 L19 16',
  'M5 5 H19 L5 19 H19',
  'M7 4 H17 L21 12 L17 20 H7 L3 12 Z M12 9 V15'
];
const GLYPH_COLS = [
  [0, 3, 5, 8, 10, 12, 1],
  [2, 0, 9, 13, 7, 5, 11],
  [4, 11, 6, 1, 13, 9, 3],
  [12, 7, 10, 2, 6, 8, 4]
];
const glyphSVG = id => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${GLYPHS[id]}"/></svg>`;

Modules.register({
  id: 'glyphs',
  title: 'Glyphs',
  difficulty: 'easy',
  create(bomb, r) {
    const colIdx = r.int(4), col = GLYPH_COLS[colIdx];
    const chosen = r.shuffle(col).slice(0, 4);
    const order = chosen.slice().sort((a, b) => col.indexOf(a) - col.indexOf(b));
    return { order, shown: r.shuffle(order), colIdx };
  },
  mount(root, s, ctl) {
    let next = 0;
    const grid = h('div', { class: 'keys' });
    s.shown.forEach(g => {
      const key = h('div', { class: 'key' }, button3d(html('span', { class: 'gl' }, glyphSVG(g))));
      activate(key, () => {
        if (key.classList.contains('ok') || ctl.isSolved()) return;
        if (g === s.order[next]) {
          key.classList.add('ok'); next++; ctl.sfx.step(next - 1);
          if (next === s.order.length) ctl.solve();
        } else {
          key.classList.add('bad'); setTimeout(() => key.classList.remove('bad'), 400);
          ctl.strike('Pressed a glyph out of order.');
        }
      }, 'Glyph');
      grid.append(key);
    });
    root.append(grid);
  },
  mountBack(root, s) {
    root.append(h('div', { class: 'series3d' }, h('small', {}, 'series'),
      h('div', { class: 'series' }, ['I', 'II', 'III', 'IV'].map((t, i) =>
        h('div', { class: 'ser' + (i === s.colIdx ? ' on' : '') }, cuboid(i === s.colIdx ? 9 : 1, t, 'fill'))))));
  },
  manual() {
    return `<p>The four glyphs on the module all appear in exactly one of the columns below. Press them in the order they appear in that column, top to bottom. A wrong press is a strike; glyphs already pressed stay lit.</p>
      <div class="gcols">${GLYPH_COLS.map((c, i) => `<div class="gcol"><b>${['I', 'II', 'III', 'IV'][i]}</b>${c.map(glyphSVG).join('')}</div>`).join('')}</div>`;
  },
  manualBack() {
    return '<p>The rear plate is stamped with four numerals, I to IV. One is raised and amber: that is the column to use, counted left to right in the table above. It saves you searching all four columns.</p>';
  }
});

/* ---------------------------------------------------------------------
   MODULE: Simon
   --------------------------------------------------------------------- */
const SIMON_NAMES = ['red', 'blue', 'green', 'yellow'];
const SIMON_HEX = ['#e5412d', '#2f6bff', '#2fbf63', '#f2c230'];
const SIMON_FREQ = [392, 330, 262, 494];
const SIMON_ARC = [[270, 360], [0, 90], [90, 180], [180, 270]];   // red top-left, blue top-right, green bottom-right, yellow bottom-left
// SIMON_MAP[vowel|none][strikes][flashing color] -> color to press (indexes into SIMON_NAMES)
const SIMON_MAP = {
  vowel: [[1, 0, 3, 2], [3, 2, 1, 0], [2, 0, 3, 1]],
  none:  [[1, 3, 2, 0], [0, 1, 3, 2], [3, 2, 1, 0]]
};

Modules.register({
  id: 'simon',
  title: 'Simon',
  difficulty: 'medium',
  max: 1,
  create(bomb, r) {
    return { seq: Array.from({ length: 3 + r.int(3) }, () => r.int(4)) };
  },
  mount(root, s, ctl) {
    let stage = 1, pos = 0, timers = [], dead = false;
    const LAYERS = 10, TOP = LAYERS - 1;
    const pol = (rad, a) => { const t = a * Math.PI / 180; return [(100 + rad * Math.sin(t)).toFixed(2), (100 - rad * Math.cos(t)).toFixed(2)]; };
    const arc = (a0, a1) => {
      const R = 94, r = 47, g = 2.2;
      const p1 = pol(R, a0 + g), p2 = pol(R, a1 - g), p3 = pol(r, a1 - g * 2), p4 = pol(r, a0 + g * 2);
      return `M${p1[0]} ${p1[1]}A${R} ${R} 0 0 1 ${p2[0]} ${p2[1]}L${p3[0]} ${p3[1]}A${r} ${r} 0 0 0 ${p4[0]} ${p4[1]}Z`;
    };
    const n = s.seq.length;
    const dots = Array.from({ length: n }, (_, i) => { const p = pol(22, i / n * 360); return `<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="3.4"/>`; }).join('');
    const pads = k => SIMON_NAMES.map((nm, i) =>
      `<path class="pad"${k === TOP ? ` tabindex="0" role="button" aria-label="${nm}"` : ''} style="--pc:${SIMON_HEX[i]}" d="${arc(...SIMON_ARC[i])}"/>`).join('');
    const wrap = h('div', { class: 'simon3d' });
    const layers = [];
    for (let k = 0; k < LAYERS; k++) {
      const base = k === 0 ? `<circle class="sring" cx="100" cy="100" r="98"/><circle class="core" cx="100" cy="100" r="40"/>${dots}` : '';
      const el = html('div', {}, `<svg class="sl${k === TOP ? ' top' : ''}" viewBox="0 0 200 200" style="--k:${k}">${base}${pads(k)}</svg>`).firstElementChild;
      layers.push(el); wrap.append(el);
    }
    const padSets = layers.map(l => [...l.querySelectorAll('.pad')]);
    const dotEls = [...layers[0].querySelectorAll('.dot')];

    const flash = (i, ms = 380) => {
      padSets.forEach(ps => ps[i].classList.add('lit'));
      ctl.sfx.bell(SIMON_FREQ[i], ms / 1000 + .5, .12);
      setTimeout(() => padSets.forEach(ps => ps[i].classList.remove('lit')), ms);
    };
    const clear = () => { timers.forEach(clearTimeout); timers = []; };
    const play = () => {
      if (dead) return;
      clear(); pos = 0;
      for (let i = 0; i < stage; i++) timers.push(setTimeout(() => flash(s.seq[i]), 500 + i * 750));
      timers.push(setTimeout(play, 500 + stage * 750 + 3500));
    };
    const idle = ms => { if (dead) return; clear(); timers.push(setTimeout(play, ms)); };
    const expected = c => SIMON_MAP[ctl.bomb.serialVowel ? 'vowel' : 'none'][Math.min(ctl.bomb.strikes, 2)][c];
    const mark = () => dotEls.forEach((d, i) => d.classList.toggle('done', i < stage - 1));

    function input(i) {
      if (ctl.isSolved()) return;
      flash(i, 200);
      if (i === expected(s.seq[pos])) {
        pos++;
        if (pos === stage) {
          if (stage === s.seq.length) { clear(); dotEls.forEach(d => d.classList.add('done')); layers[0].classList.add('solved'); ctl.solve(); return; }
          stage++; mark(); idle(1400);
        } else idle(5000);
      } else {
        pos = 0; ctl.strike('Wrong color in the Simon sequence.'); idle(1600);
      }
    }
    padSets[TOP].forEach((p, i) => {
      p.addEventListener('click', () => input(i));
      p.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input(i); } });
    });
    root.append(wrap);
    idle(1200);
    return () => { dead = true; clear(); };
  },
  mountBack(root, s, ctl) {
    const vowels = [...ctl.bomb.serial].filter(c => 'AEIOU'.includes(c)).join('');
    root.append(h('div', { class: 'speaker3d' }, h('small', {}, 'speaker'),
      h('div', { class: 'speaker' }, h('div', { class: 'cone' }, h('b', { class: 'cone-lbl' }, vowels || '\u2014')))));
  },
  manual() {
    const row = (set, k) => SIMON_MAP[set][k].map(c => `<td>${chip(SIMON_NAMES[c])}</td>`).join('');
    const table = set => `<table class="tbl"><tr><th>Strikes</th>${SIMON_NAMES.map(n => `<th>${n} flashes</th>`).join('')}</tr>
      ${[0, 1, 2].map(k => `<tr><td>${k}</td>${row(set, k)}</tr>`).join('')}</table>`;
    return `<p>The ring flashes a growing sequence of colors. The defuser does <em>not</em> repeat the flashes: for each flash, press the color shown in the table instead. The table depends on the serial number and the current number of strikes.</p>
      <p>After each correct stage the sequence grows by one flash and replays from the start. Press the translated colors for the whole sequence each time. If the defuser pauses, the sequence repeats. The dots in the center fill in as stages are completed.</p>
      <h3>Serial number contains a vowel (A, E, I, O, U)</h3>${table('vowel')}
      <h3>Serial number has no vowel</h3>${table('none')}`;
  },
  manualBack() {
    return '<p>The rear plate is the back of the toy: a round speaker grille with a label on the cone. The label lists the vowels in the serial number, or shows a dash when there are none, which picks the table above.</p>';
  }
});

/* ---------------------------------------------------------------------
   MODULE: Password
   --------------------------------------------------------------------- */
const WORDS = ['about','after','again','below','could','every','first','found','great','house','large','learn','never','other','place','plant','point','right','small','sound','spell','still','study','their','there','these','thing','think','three','water','where','which','world','would','write'];
const ARROW_UP = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 11 L8 5 L13 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ARROW_DN = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5 L8 11 L13 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

Modules.register({
  id: 'password',
  title: 'Password',
  difficulty: 'medium',
  create(bomb, r) {
    for (;;) {
      const ans = r.pick(WORDS);
      const cols = [...ans].map(ch => {
        const set = new Set([ch]);
        while (set.size < 6) set.add(String.fromCharCode(97 + r.int(26)));
        return r.shuffle([...set]);
      });
      const fits = WORDS.filter(w => [...w].every((c, i) => cols[i].includes(c)));
      const startsSolved = cols.every((c, i) => c[0] === ans[i]);
      if (fits.length === 1 && !startsSolved) return { ans, cols };
    }
  },
  mount(root, s, ctl) {
    const idx = s.cols.map(() => 0);
    const wrap = h('div', { class: 'pw' });
    s.cols.forEach((c, i) => {
      const lcd = h('div', { class: 'lcd' }, h('span', {}, c[0].toUpperCase()));
      const move = d => () => {
        if (ctl.isSolved()) return;
        idx[i] = (idx[i] + d + c.length) % c.length;
        lcd.replaceChildren(h('span', { class: 'roll' }, c[idx[i]].toUpperCase())); ctl.sfx.click();
      };
      const up = activate(h('div', { class: 'arr' }, button3d(html('span', {}, ARROW_UP), '', 6)), move(-1), 'Previous letter');
      const dn = activate(h('div', { class: 'arr' }, button3d(html('span', {}, ARROW_DN), '', 6)), move(1), 'Next letter');
      wrap.append(h('div', { class: 'col' }, up, lcd, dn));
    });
    const go = activate(h('div', { class: 'go' }, button3d('SUBMIT', '', 10)), () => {
      if (ctl.isSolved()) return;
      const word = idx.map((k, i) => s.cols[i][k]).join('');
      word === s.ans ? ctl.solve() : ctl.strike(`Submitted "${word.toUpperCase()}".`);
    }, 'Submit');
    root.append(wrap, go);
  },
  manual() {
    return `<p>The module shows five columns of letters. Ask the defuser to read out the six letters available in each column (use the arrow keys to cycle through them). Exactly one word from the list below can be spelled using one letter from each column in order. Tell the defuser which word to spell, then press Submit.</p>
      <div class="words">${WORDS.map(w => `<div>${w}</div>`).join('')}</div>`;
  }
});

/* ---------------------------------------------------------------------
   MODULE: Switches
   Five toggles and five lamps. Each switch's target is "up if its lamp is lit",
   flipped by a condition on the bomb: serial, indicators, batteries, coin cells, encoders.
   --------------------------------------------------------------------- */
const TOGGLE_RULES = [
  ['Switch 1: flip it if the last digit of the serial number is odd.', b => b.serialOdd],
  ['Switch 2: flip it if any indicator is lit.', b => b.indicators.some(i => i.lit)],
  ['Switch 3: flip it if there are two or more batteries (the AA and D cells, not coin cells).', b => b.batteries >= 2],
  ['Switch 4: flip it if there is at least one coin cell.', b => b.coins.length > 0],
  ['Switch 5: flip it if the encoders add up to an odd number. With no encoders the sum is 0, which counts as even.', b => b.encSum() % 2 === 1]
];

Modules.register({
  id: 'switches',
  title: 'Switches',
  difficulty: 'medium',
  create(bomb, r) {
    return { lamps: Array.from({ length: 5 }, () => r() < .5), pos: Array.from({ length: 5 }, () => r() < .5) };
  },
  mount(root, s, ctl) {
    const pos = s.pos.slice();
    const cols = h('div', { class: 'tgrow' });
    s.lamps.forEach((on, i) => {
      const tg = h('div', { class: 'tg ' + (pos[i] ? 'up' : 'dn') },
        cuboid(4, h('div', { class: 'well' }, h('div', { class: 'stick' }, cuboid(26, '', 'fill'))), 'bz fill'));
      activate(tg, () => {
        if (ctl.isSolved()) return;
        pos[i] = !pos[i]; tg.classList.toggle('up', pos[i]); tg.classList.toggle('dn', !pos[i]); ctl.sfx.click();
      }, `Switch ${i + 1}`);
      cols.append(h('div', { class: 'tgcol' }, led('#43dfff', on, 'lg'), tg, h('small', {}, String(i + 1))));
    });
    const go = activate(h('div', { class: 'go' }, button3d('CONFIRM', '', 8)), () => {
      if (ctl.isSolved()) return;
      const want = s.lamps.map((on, k) => on !== TOGGLE_RULES[k][1](ctl.bomb));
      want.every((v, k) => v === pos[k]) ? ctl.solve() : ctl.strike('The switches are not set correctly.');
    }, 'Confirm switches');
    root.append(cols, go);
  },
  mountBack(root, s, ctl) {
    const fitted = ctl.bomb.coins.length > 0;
    root.append(h('div', { class: 'backup3d' }, h('small', {}, 'memory backup'),
      h('div', { class: 'backup-win' + (fitted ? ' fitted' : '') }, h('b', { class: 'backup' }, fitted ? 'BACKUP FITTED' : 'BACKUP EMPTY')),
      h('div', { class: 'hazard sm' })));
  },
  manual() {
    return `<p>Each switch has a lamp above it. A switch should be <b>up</b> (tilted toward the top of the module) when its lamp is lit and <b>down</b> when it is dark, but some switches are reversed. Work out each switch from the list below, tell the defuser which ones to set up, then have them press Confirm.</p>
      <ol>${TOGGLE_RULES.map(r => `<li>${r[0]}</li>`).join('')}</ol>
      <p>"Flip it" means the opposite of the lamp: dark means up, lit means down. Rule 5 reads the encoders as they are at the moment of pressing Confirm.</p>`;
  },
  manualBack() {

/* ---------------------------------------------------------------------

const MORSE = { a: '.-', b: '-...', c: '-.-.', d: '-..', e: '.', f: '..-.', g: '--.', h: '....', i: '..', j: '.---', k: '-.-', l: '.-..', m: '--', n: '-.', o: '---', p: '.--.', q: '--.-', r: '.-.', s: '...', t: '-', u: '..-', v: '...-', w: '.--', x: '-..-', y: '-.--', z: '--..' };
const MORSE_CHANNELS = ['3.502', '3.505', '3.510', '3.515', '3.522', '3.525', '3.532', '3.535', '3.540', '3.542', '3.545', '3.552'];
const MORSE_WORDS = [['fuse', '3.505'], ['volt', '3.515'], ['coil', '3.522'], ['bolt', '3.532'], ['grid', '3.535'], ['relay', '3.542'], ['laser', '3.545'], ['diode', '3.552']];
const ARROW_L = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 3 L5 8 L11 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ARROW_R = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3 L11 8 L5 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

Modules.register({
  id: 'morse',
  title: 'Morse',
  difficulty: 'medium',
  create(bomb, r) {
    return { word: r.pick(MORSE_WORDS), start: r.int(MORSE_CHANNELS.length) };
  },
  mount(root, s, ctl) {
    const seq = [];
    [...s.word[0]].forEach(ch => {
      [...MORSE[ch]].forEach(sym => { seq.push([true, sym === '.' ? 250 : 750]); seq.push([false, 250]); });
      seq[seq.length - 1][1] = 750;
    });
    seq[seq.length - 1][1] = 2600;
    const lamp = led('#ffb224', false, 'xl');
    let idx = 0, timer = 0, dead = false, ci = s.start;
    const step = () => {
      if (dead) return;
      const [on, ms] = seq[idx];
      lamp.classList.toggle('off', !on);
      if (on) ctl.sfx.beep(660, Math.min(.24, ms / 1000));
      idx = (idx + 1) % seq.length;
      timer = setTimeout(step, ms);
    };
    timer = setTimeout(step, 900);
    const lcd = h('div', { class: 'mini-lcd sm' }, MORSE_CHANNELS[ci] + ' MHz');
    const move = d => () => { if (ctl.isSolved()) return; ci = (ci + d + MORSE_CHANNELS.length) % MORSE_CHANNELS.length; lcd.textContent = MORSE_CHANNELS[ci] + ' MHz'; ctl.sfx.click(); };
    const left = activate(h('div', { class: 'sk' }, button3d(html('span', {}, ARROW_L), '', 6)), move(-1), 'Lower frequency');
    const right = activate(h('div', { class: 'sk' }, button3d(html('span', {}, ARROW_R), '', 6)), move(1), 'Higher frequency');
    const tx = activate(h('div', { class: 'go' }, button3d('TRANSMIT', '', 9)), () => {
      if (ctl.isSolved()) return;
      MORSE_CHANNELS[ci] === s.word[1] ? ctl.solve() : ctl.strike(`Transmitted on ${MORSE_CHANNELS[ci]} MHz.`);
    }, 'Transmit');
    root.append(h('div', { class: 'morse' }, h('div', { class: 'lampwrap' }, lamp), h('div', { class: 'freqrow' }, left, lcd, right), tx));
    return () => { dead = true; clearTimeout(timer); };
  },
  manual() {
    const chart = Object.keys(MORSE).map(k => `<div><b>${k.toUpperCase()}</b> ${MORSE[k].replace(/\./g, '\u00b7').replace(/-/g, '\u2212')}</div>`).join('');
    return `<p>The lamp flashes a word in Morse code, then pauses and repeats. A short flash is a dot, a long flash is a dash, and a longer dark gap separates letters. Decode the word with the chart, find its frequency in the table, tell the defuser to tune to it with the arrow keys and press Transmit.</p>
      <div class="mchart">${chart}</div>
      <table class="tbl"><tr><th>Word</th><th>Frequency (MHz)</th></tr>${MORSE_WORDS.map(w => `<tr><td>${w[0]}</td><td>${w[1]}</td></tr>`).join('')}</table>`;
  }
});

   MODULE: Memory
   Five stages. Each stage the display shows 1 to 4 and the keys carry shuffled labels.
   --------------------------------------------------------------------- */
const MEM_TABLE = [
  [{ k: 'pos', n: 2 }, { k: 'pos', n: 1 }, { k: 'pos', n: 4 }, { k: 'pos', n: 3 }],
  [{ k: 'label', n: 3 }, { k: 'samePos', s: 1 }, { k: 'pos', n: 1 }, { k: 'sameLabel', s: 1 }],
  [{ k: 'sameLabel', s: 2 }, { k: 'pos', n: 4 }, { k: 'samePos', s: 1 }, { k: 'label', n: 1 }],
  [{ k: 'pos', n: 3 }, { k: 'sameLabel', s: 3 }, { k: 'samePos', s: 2 }, { k: 'label', n: 2 }],
  [{ k: 'samePos', s: 4 }, { k: 'sameLabel', s: 1 }, { k: 'sameLabel', s: 4 }, { k: 'samePos', s: 3 }]
];
const memText = u => u.k === 'pos' ? `press the key in position ${u.n}`
  : u.k === 'label' ? `press the key labeled ${u.n}`
  : u.k === 'samePos' ? `press the key in the same position as in stage ${u.s}`
  : `press the key with the same label as in stage ${u.s}`;

Modules.register({
  id: 'memory',
  title: 'Memory',
  difficulty: 'hard',
  create(bomb, r) { return { seed: r.int(1e9) }; },
  mount(root, s, ctl) {
    const rr = rng(s.seed);
    const shuffle = () => { const a = [1, 2, 3, 4]; for (let i = 3; i > 0; i--) { const j = rr.int(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    let stage = 0, hist = [], disp = 1, labels = [1, 2, 3, 4];
    const lcd = h('div', { class: 'mini-lcd' });
    const lamps = Array.from({ length: 5 }, () => led('#43dfff', false));
    const keyEls = [0, 1, 2, 3].map(i => {
      const k = h('div', { class: 'mk' }, button3d('', '', 8));
      activate(k, () => press(i), `Key ${i + 1}`);
      return k;
    });
    const round = () => {
      disp = 1 + rr.int(4); labels = shuffle();
      lcd.textContent = disp;
      keyEls.forEach((k, i) => { k.querySelector('.cap2>.t').textContent = labels[i]; });
      lamps.forEach((l, i) => l.classList.toggle('off', i >= stage));
    };
    const press = i => {
      if (ctl.isSolved()) return;
      const u = MEM_TABLE[stage][disp - 1];
      const want = u.k === 'pos' ? u.n : u.k === 'label' ? labels.indexOf(u.n) + 1
        : u.k === 'samePos' ? hist[u.s - 1].pos : labels.indexOf(hist[u.s - 1].label) + 1;
      if (i + 1 === want) {
        hist.push({ pos: i + 1, label: labels[i] }); stage++; ctl.sfx.step(stage - 1);
        if (stage === 5) { lamps.forEach(l => l.classList.remove('off')); ctl.solve(); return; }
        round();
      } else {
        const at = stage + 1; stage = 0; hist = []; ctl.strike(`Wrong key at stage ${at}.`); round();
      }
    };
    round();
    root.append(h('div', { class: 'stack' }, lcd, h('div', { class: 'lamprow' }, lamps), h('div', { class: 'memkeys' }, keyEls)));
  },
  manual() {
    return `<p>Five stages. Each stage the display shows a number from 1 to 4 and the four keys carry the labels 1 to 4 in a new order. Positions are counted left to right. Look up the stage and the displayed number below and tell the defuser which key to press. <b>Write down the position and the label of every key pressed</b>, because later stages refer back to them. A wrong press is a strike and sends the module back to stage 1.</p>
      <table class="tbl"><tr><th>Stage</th><th>Shows 1</th><th>Shows 2</th><th>Shows 3</th><th>Shows 4</th></tr>
      ${MEM_TABLE.map((row, i) => `<tr><td>${i + 1}</td>${row.map(u => `<td>${memText(u)}</td>`).join('')}</tr>`).join('')}</table>`;
  }
});

/* =====================================================================
   3. BOMB GENERATION
   ===================================================================== */
const INDICATOR_LABELS = ['CAR', 'FRK', 'SND', 'CLR', 'IND', 'SIG', 'NSA', 'TRN'];

const COIN_MODELS = [
  { model: 'CR2032', volts: 3, d: 72, t: 11.5 },
  { model: 'CR2025', volts: 3, d: 72, t: 9 },
  { model: 'CR2016', volts: 3, d: 72, t: 5.8 },
  { model: 'LR44', volts: 1.5, d: 44, t: 19.5 }
];
const ENC_CAPS = ['red', 'blue', 'yellow', 'white'];
const makeEncoders = (r, n) => Array.from({ length: n }, (_, i) => ({ label: 'ABCD'[i], cap: ENC_CAPS[i], value: r.int(10) }));
const makeLever = r => ({ up: r() < .5 });

function makeBomb(r, totalMs) {
  const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  const serial = r.pick(L) + r.int(10) + r.pick(L) + r.pick(L) + r.int(10) + r.int(10);
  const indicators = r.shuffle(INDICATOR_LABELS).slice(0, r.int(4)).map(label => ({ label, lit: r() < .5 }));
  const coins = Array.from({ length: [0, 0, 1, 1, 1, 2][r.int(6)] }, () => ({ ...r.pick(COIN_MODELS) }));
  const bomb = {
    serial,
    serialOdd: Number(serial.slice(-1)) % 2 === 1,
    serialVowel: /[AEIOU]/.test(serial),
    batteries: r.int(5),
    indicators,
    coins,
    coinVolts: coins.reduce((a, c) => a + c.volts, 0),
    encoders: makeEncoders(r, [0, 0, 1, 2, 3, 3][r.int(6)]),     // optional rotary encoders, readings 0 to 9
    lever: r() < .25 ? makeLever(r) : null,                      // junction-box lever: a decoy unless Breaker is on the bomb
    hasLit: l => indicators.some(i => i.label === l && i.lit),
    strikes: 0, total: totalMs, left: totalMs
  };
  bomb.encSum = () => bomb.encoders.reduce((a, e) => a + e.value, 0);   // read live: encoders can be turned
  bomb.leverUp = () => !!(bomb.lever && bomb.lever.up);                 // read live: the lever can be moved
  return bomb;
}

// Modules that need parts get them fitted if the bomb doesn't have them yet.
function ensureNeeds(bomb, defs, r) {
  const need = k => defs.some(d => d.needs && d.needs.includes(k));
  if (need('lever') && !bomb.lever) bomb.lever = makeLever(r);
  if (need('encoders') && bomb.encoders.length < 3) {
    const have = bomb.encoders.length;
    bomb.encoders.push(...makeEncoders(r, 3).slice(have));
  }
}

// Deals `count` modules at random. Modules of the chosen difficulty are three times as likely as the others; each module
// is dealt once before any repeats, and `max` caps repeats.
function pickModules(r, count, difficulty = 'medium') {
  const weight = d => d.difficulty === difficulty ? 3 : 1;
  const draw = pool => {
    let x = r() * pool.reduce((a, d) => a + weight(d), 0);
    return pool.find(d => (x -= weight(d)) < 0) || pool[pool.length - 1];
  };
  const fresh = Modules.list.slice(), used = {}, out = [];
  let guard = 0;
  while (out.length < count && guard++ < 200) {
    const cand = fresh.length ? fresh.splice(fresh.indexOf(draw(fresh)), 1)[0] : draw(Modules.list);
    if (cand.max && (used[cand.id] || 0) >= cand.max) continue;
    used[cand.id] = (used[cand.id] || 0) + 1;
    out.push(cand);
  }
  return out;
}

/* =====================================================================
   3b. LOGO
   A countdown ring (the last stretch already burnt) around a slashed zero,
   inside a broken hexagon frame. `burn` is the burnt share of the ring.
   ===================================================================== */
function logoMark(size = 96, o = {}) {
  const burn = o.burn ?? .25, N = 60, lit = Math.round(N * (1 - burn));
  let ticks = '';
  for (let i = 0; i < N; i++) {
    const a = i * 6 * Math.PI / 180, sn = Math.sin(a), cs = -Math.cos(a);
    const major = i % 5 === 0, r1 = major ? 32 : 37, r2 = 45, on = i < lit;
    ticks += `<line x1="${(60 + r1 * sn).toFixed(2)}" y1="${(60 + r1 * cs).toFixed(2)}" x2="${(60 + r2 * sn).toFixed(2)}" y2="${(60 + r2 * cs).toFixed(2)}" ` +
      `stroke="${on ? '#43dfff' : '#ff3b5c'}" stroke-opacity="${on ? 1 : .8}" stroke-width="${major ? 2.8 : 1.8}" stroke-linecap="round"` +
      (o.sweep ? ` class="tk" style="animation-delay:${i * 16}ms"` : '') + '/>';
  }
  return `<svg class="logo-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="${size}" height="${size}" fill="none" role="img" aria-label="Zero Hour logo">` +
    `<path d="M60 3 L109 31.5 V88.5 L60 117 L11 88.5 V31.5 Z" stroke="#43dfff" stroke-opacity=".6" stroke-width="1.6" stroke-dasharray="66 9"/>` +
    ticks +
    `<path d="M53.500 6 H66.500 L60 17 Z" fill="#ffb224"/>` +
    `<ellipse cx="60" cy="61" rx="12" ry="19" stroke="#d6eef3" stroke-width="5"/>` +
    `<path d="M50.500 74 L69.500 48" stroke="#ffb224" stroke-width="3.6" stroke-linecap="round"/></svg>`;
}

function barcode(text) {
  let x = 0, bars = '';
  for (const ch of text) {
    const c = ch.charCodeAt(0);
    for (let b = 0; b < 6; b++) { const w = (c >> b) & 1 ? 2.4 : 1.2; bars += `<rect x="${x.toFixed(1)}" y="0" width="${w}" height="14"/>`; x += w + 1.3; }
  }
  return `<svg class="bar-code" viewBox="0 0 ${x.toFixed(1)} 14" preserveAspectRatio="none" fill="currentColor" aria-hidden="true">${bars}</svg>`;
}

/* =====================================================================
   4. THE 3D CASE
   Faces: front (clock + modules), back (modules), left, right, top, bottom
   (serial number, battery holders and indicators in random spots).
   ===================================================================== */
function layoutFor(vw) {
  const cols = vw < 820 ? 2 : 3, rows = cols === 3 ? 2 : 3;
  const SW = 244, SH = 272, GAP = 14, P = 22, TB = 136, D = 210;
  const W = P * 2 + cols * SW + (cols - 1) * GAP + 10;
  const H = P * 2 + TB + GAP + rows * SH + (rows - 1) * GAP + 10;
  return { cols, rows, SW, SH, GAP, P, TB, D, W, H, wr: Math.floor((H - 42) / 170), wc: Math.floor((W - 42) / 160) };
}

// ---- coin cells: sizes follow the real cells (CR2032 20 x 3.2 mm, LR44 11.6 x 5.4 mm) ----
function coinCellEl(c) {
  const R = c.d / 2, N = 30, side = 2 * R * Math.sin(Math.PI / N) * 1.06, apo = R * Math.cos(Math.PI / N);
  const coin = h('div', { class: 'coin' + (c.d < 60 ? ' sm' : ''), style: `width:${c.d}px;height:${c.d}px;left:50%;top:50%;margin:${-R}px 0 0 ${-R}px` });
  for (let k = 0; k < N; k++) {                       // the steel can wall, as a many-sided ring
    const phi = k * 360 / N, rad = phi * Math.PI / 180;
    const b = Math.max(0, -.55 * Math.sin(rad) + .8 * Math.cos(rad));
    coin.append(h('i', {
      class: 'cf',
      style: `width:${side.toFixed(2)}px;height:${c.t}px;left:calc(50% - ${(side / 2).toFixed(2)}px);top:calc(50% - ${c.t / 2}px);` +

// A solid upright cylinder (axis along z) built from facets and closed by a top disc, drawn around a zero-size anchor.

// A turned part (a handle) built from short cylinders along +x. profile = [[length, radius, colour, optional class], ...]

// Plain name plates for the bottom: they carry no information.
function nameplateEl(variant) {

  return cuboid(2, [h('b', {}, t[0]), h('span', {}, t[1]), h('span', {}, t[2])], 'w-np');

// Modules all sit on the front. Decide which bays hold them and where each hint widget sits.
// Left, right and top take any component. The bottom only ever takes plates (the serial plate and plain name plates).
function planCase(r, bomb, L, count) {
  const bays = r.shuffle(Array.from({ length: L.cols * L.rows }, (_, i) => ({ i }))).slice(0, count);
  const range = n => Array.from({ length: n }, (_, i) => i);
  const free = { left: range(L.wr), right: range(L.wr), top: range(L.wc), bottom: range(L.wc) };
  const SIDES = ['left', 'right', 'top'];
  const widgets = [];
  const take = (faces, span = 1) => {                       // claim `span` neighbouring free cells on one of `faces`
    const cand = [];
    faces.forEach(f => free[f].forEach(i => { if (range(span).every(k => free[f].includes(i + k))) cand.push({ face: f, i, span }); }));
    if (!cand.length) return null;
    const at = r.pick(cand);
    range(span).forEach(k => free[at.face].splice(free[at.face].indexOf(at.i + k), 1));
    return at;
  };
  const place = (w, faces, span = 1) => {
    w.at = take(faces, span) || take(SIDES, span) || take(['bottom'], span);
    if (w.at) widgets.push(w);
  };
  if (bomb.lever) place({ kind: 'lever' }, ['left', 'right'], 2);        // tall: takes two cells of a side panel
  const b = bomb.batteries;
  const holders = b === 0 ? [] : b === 1 ? [1] : b === 2 ? (r() < .5 ? [2] : [1, 1]) : b === 3 ? [2, 1] : [2, 2];
  holders.forEach(n => place({ kind: 'batt', n }, SIDES));
  bomb.indicators.forEach(ind => place({ kind: 'ind', ind }, SIDES));
  bomb.coins.forEach(cell => place({ kind: 'coin', cell }, SIDES));
  bomb.encoders.forEach(enc => place({ kind: 'enc', enc }, SIDES));
  place({ kind: 'serial' }, r() < .6 ? ['bottom'] : [...SIDES, 'bottom']);
  for (let k = 0, n = r.int(3); k < n; k++) {                              // plain plates on the bottom, if there is room
    const at = take(['bottom']);
    if (at) widgets.push({ kind: 'plate', variant: k, at });
  }
  return { bays, widgets };
}

function widgetEl(w, bomb) {
  if (w.kind === 'serial') {
    return cuboid(3, [h('small', {}, 'serial no.'), h('b', {}, bomb.serial), html('div', { class: 'bc' }, barcode(bomb.serial))], 'w-serial');
  }
  if (w.kind === 'batt') {
    const single = w.n === 1;   // one big D cell, or a pair of AA cells
    const e = cuboid(5, Array.from({ length: w.n }, () => single ? batteryCell(112, 22) : batteryCell(112, 16)), 'w-batt');
    e.style.width = '162px';
    e.setAttribute('aria-label', `battery holder with ${w.n} ${w.n === 1 ? 'cell' : 'cells'}`);
    return e;
  }
  if (w.kind === 'coin') return coinHolder(w.cell);
  if (w.kind === 'lever') return junctionEl(bomb);
  if (w.kind === 'enc') return encoderEl(w.enc);
  if (w.kind === 'plate') return nameplateEl(w.variant);
  const i = w.ind;
  const e = cuboid(6, [html('i', { class: 'lens' }, '<i></i><i></i><i></i><i></i><i></i><i></i>'), h('b', {}, i.label)], 'w-ind' + (i.lit ? ' lit' : ''));
  e.setAttribute('aria-label', `indicator ${i.label}, ${i.lit ? 'lit' : 'unlit'}`);
  return e;
}

const LOCK = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 4 L41 14 V34 L24 44 L7 34 V14 Z" opacity=".5"/><rect x="16" y="22" width="16" height="12" rx="2"/><path d="M19 22 V18 a5 5 0 0 1 10 0 V22"/></svg>';

function scrambled(t) {
  let seed = 7;
  for (const ch of t) seed = (seed * 31 + ch.charCodeAt(0)) | 0;
  const r = rng(seed);
  let a = [...t];
  for (let i = 0; i < 12; i++) { a = r.shuffle(a); if (a.join('') !== t) break; }
  const out = a.join('');
  return out.charAt(0).toUpperCase() + out.slice(1).toLowerCase();

function assembleCase(bomb, L, plan, fillBay, fillRear) {
  const bomb3d = h('div', {
    class: 'bomb3d',
    style: `--W:${L.W}px;--H:${L.H}px;--D:${L.D}px;--P:${L.P}px;--TB:${L.TB}px;--SW:${L.SW}px;--SH:${L.SH}px;--cols:${L.cols};--rows:${L.rows};--wr:${L.wr};--wc:${L.wc}`
  });
  const faces = {};
  ['front', 'back', 'left', 'right', 'top', 'bottom'].forEach(n => {
    faces[n] = h('div', { class: 'face f-' + n, role: 'group', 'aria-label': n + ' side of the bomb' });
    bomb3d.append(faces[n]);
  });
  // Seen from behind, left and right swap: a rear plate sits mirrored behind its module.
  const mirror = i => Math.floor(i / L.cols) * L.cols + (L.cols - 1 - i % L.cols);
  const front = {}, back = {};
  plan.bays.forEach((p, k) => {
    front[p.i] = fillBay(k);
    const rear = fillRear && fillRear(k);
    if (rear) back[mirror(p.i)] = rear;
  });
  const bays = map => {
    const g = h('div', { class: 'bays' });
    for (let i = 0; i < L.cols * L.rows; i++) g.append(h('div', { class: 'bay' }, map[i] || blankBay()));
    return g;
  };

  const live = h('span', { class: 'live' }), ghost = h('span', { class: 'ghost' });
  const clock = h('div', { class: 'clock' }, ghost, live);
  const bar = h('div', { class: 'bar' }, h('i'));
  const pips = [0, 1, 2].map(() => h('div', { class: 'strike' }, cuboid(5, '\u00d7', 'fill')));
  faces.front.append(h('div', { class: 'fi' },
    h('div', { class: 'band' }, h('div', { class: 'screen' }, clock, bar), h('div', { class: 'strikecol', 'aria-label': 'Strikes' }, pips)),
    bays(front)));

  faces.back.append(h('div', { class: 'fi' },
    h('div', { class: 'band service' },
      html('div', {}, logoMark(64, { burn: .25 })),
      h('div', { class: 'svc-txt' }, h('b', {}, 'Service hatch'), h('span', {}, 'Rear plates sit behind their modules, mirrored.')),
      h('div', { class: 'hazard' })),
    bays(back)));

  const side = (face, n, dir) => {
    const g = h('div', { class: 'side ' + dir });
    const covered = new Set();                                   // cells swallowed by a tall widget (the lever)
    plan.widgets.filter(x => x.at.face === face && x.at.span > 1).forEach(x => { for (let k = 1; k < x.at.span; k++) covered.add(x.at.i + k); });
    for (let i = 0; i < n; i++) {
      if (covered.has(i)) continue;
      const w = plan.widgets.find(x => x.at.face === face && x.at.i === i);
      const cell = h('div', { class: 'cell' + (w ? '' : ' empty d' + ((i + face.length) % 3)) }, w ? widgetEl(w, bomb) : null);
      if (w && w.at.span > 1) cell.style.gridRow = `span ${w.at.span}`;
      g.append(cell);
    }
    return g;
  };
  faces.left.append(side('left', L.wr, 'v'));
  faces.right.append(side('right', L.wr, 'v'));
  faces.top.append(side('top', L.wc, 'hz'));
  faces.bottom.append(side('bottom', L.wc, 'hz'));

  return { bomb3d, faces, refs: { live, ghost, clock, bar, pips } };
}

/* ---------------------------------------------------------------------
   Rotation rig: drag (with momentum), arrow keys, wheel zoom,
   animated jumps to a face, and per-face lighting that follows the view.
   --------------------------------------------------------------------- */
function createRig(stage, bomb3d, faces, L, init = {}) {
  const ac = new AbortController(), sig = { signal: ac.signal };
  const st = { yaw: init.yaw ?? -16, pitch: init.pitch ?? -10, zoom: init.zoom ?? 1 };   // what is on screen now
  const goal = { ...st };                                                                  // where the view is heading
  const HOME = { yaw: -16, pitch: -10, zoom: 1 };
  const FACE_N = { front: [0, 0, 1], back: [0, 0, -1], right: [1, 0, 0], left: [-1, 0, 0], top: [0, -1, 0], bottom: [0, 1, 0] };
  const VIEWS = { front: [0, 0, 1], back: [180, 0, 1], left: [90, 0, .74], right: [-90, 0, .74], top: [0, -80, .95], bottom: [0, 80, .95] };   // yaw, pitch, zoom (side faces sit closer to the camera)
  const LIGHT = (() => { const v = [-.35, -.55, .75], m = Math.hypot(...v); return v.map(x => x / m); })();
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const FOLLOW = 20, DECAY = 3.4;          // follow speed and momentum decay, both per second
  const narrow = L.cols === 2;
  let api = null, fitScale = 1, facing = '', raf = 0, last = 0, anim = null, drag = null;
  const pend = { x: 0, y: 0 }, vel = { yaw: 0, pitch: 0 }, lastDim = {};
  stage.classList.toggle('narrow', narrow);

  function shade() {
    const ya = st.yaw * Math.PI / 180, pa = st.pitch * Math.PI / 180;
    const cy = Math.cos(ya), sy = Math.sin(ya), cp = Math.cos(pa), sp = Math.sin(pa);
    let best = '', bz = -9;
    for (const name in FACE_N) {
      const n = FACE_N[name];
      const x = n[0] * cy + n[2] * sy, z = -n[0] * sy + n[2] * cy;
      const y2 = n[1] * cp - z * sp, z2 = n[1] * sp + z * cp;
      const b = Math.max(0, x * LIGHT[0] + y2 * LIGHT[1] + z2 * LIGHT[2]);
      const dim = (1 - Math.min(1, .38 + .8 * b)) * .8;
      if (Math.abs(dim - (lastDim[name] ?? -1)) > .004) { lastDim[name] = dim; faces[name].style.setProperty('--dim', dim.toFixed(3)); }   // only touch the DOM when it changed
      if (z2 > bz) { bz = z2; best = name; }
    }
    if (best !== facing) { facing = best; api && api.onFacing && api.onFacing(best); }
  }
  function apply() {
    const s = (fitScale * st.zoom).toFixed(4);
    bomb3d.style.transform = `scale3d(${s},${s},${s}) rotateX(${st.pitch.toFixed(2)}deg) rotateY(${st.yaw.toFixed(2)}deg)`;
    shade();
  }
  function fit() {
    const w = stage.clientWidth, hgt = stage.clientHeight;
    if (!w) return;
    if (narrow) {
      fitScale = Math.min(1.1, (w - 16) / (L.W + L.D * .45));
      stage.style.flex = 'none';
      stage.style.height = Math.round((L.H + L.D * .3) * fitScale + 116) + 'px';
    } else {
      fitScale = Math.max(.2, Math.min(1.25, (w - 24) / (L.W + L.D * .45), (hgt - 136) / (L.H + L.D * .3)));
    }
    apply();
  }

  /* One render loop, locked to the display refresh (requestAnimationFrame). Input only records
     what the user did; the view moves once per frame, using the frame's own timestamp, so speed
     doesn't depend on the mouse polling rate or the frame rate. It sleeps when nothing moves. */
  const wake = () => { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } };
  function tick(now) {
    raf = 0;
    const dt = last ? Math.min((now - last) / 1000, .05) : 1 / 60;
    last = now;
    let busy = false;
    if (anim) {                                              // an animated jump (face buttons, intro, victory spin)
      const p = clamp((now - anim.t0) / anim.ms, 0, 1), e = ease(p);
      for (const k in anim.to) st[k] = anim.from[k] + (anim.to[k] - anim.from[k]) * e;
      Object.assign(goal, st);
      if (p >= 1) anim = null; else busy = true;
    } else {
      if (drag && (pend.x || pend.y)) {                      // all pointer movement since the last frame, applied at once
        const dyaw = pend.x * .32 * settings.sens, dpitch = -pend.y * .32 * settings.sens;
        pend.x = pend.y = 0;
        goal.yaw += dyaw; goal.pitch = clamp(goal.pitch + dpitch, -90, 90);
        api && api.onTurn && api.onTurn(goal.yaw, goal.pitch);
        const a = 1 - Math.exp(-dt * 25);                    // smoothed velocity in degrees per second
        vel.yaw += (dyaw / dt - vel.yaw) * a; vel.pitch += (dpitch / dt - vel.pitch) * a;
      } else if (drag) {                                     // held still: a pause before letting go shouldn't fling it
        const f = Math.exp(-dt * 12); vel.yaw *= f; vel.pitch *= f;
      } else if (Math.abs(vel.yaw) > 2 || Math.abs(vel.pitch) > 2) {   // momentum after letting go
        goal.yaw += vel.yaw * dt; goal.pitch = clamp(goal.pitch + vel.pitch * dt, -90, 90);
        api && api.onTurn && api.onTurn(goal.yaw, goal.pitch);
        const f = Math.exp(-dt * DECAY); vel.yaw *= f; vel.pitch *= f;
      } else vel.yaw = vel.pitch = 0;
      const k = 1 - Math.exp(-dt * FOLLOW);                  // ease the picture toward the goal
      st.yaw += (goal.yaw - st.yaw) * k; st.pitch += (goal.pitch - st.pitch) * k; st.zoom += (goal.zoom - st.zoom) * k;
      busy = !!drag || !!vel.yaw || !!vel.pitch || Math.abs(goal.yaw - st.yaw) > .01 || Math.abs(goal.pitch - st.pitch) > .01 || Math.abs(goal.zoom - st.zoom) > .0005;
      if (!busy) Object.assign(st, goal);
    }
    apply();
    if (busy) raf = requestAnimationFrame(tick);
  }
  function animateTo(t, ms = 700) {
    Object.assign(goal, st); vel.yaw = vel.pitch = 0;
    const from = { yaw: st.yaw, pitch: st.pitch, zoom: st.zoom };
    anim = { from, to: { ...from, ...t }, t0: performance.now(), ms };
    wake();
  }
  const settleHere = () => { anim = null; Object.assign(goal, st); vel.yaw = vel.pitch = 0; };   // take over from whatever was moving

  stage.addEventListener('pointerdown', e => {
    if (e.button > 0 || e.target.closest('button,[role=button],.nodrag,input,a')) return;
    settleHere();
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
    pend.x = pend.y = 0;
    stage.classList.add('drag');
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    wake();
  }, sig);
  stage.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    pend.x += e.clientX - drag.x; pend.y += e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    wake();
  }, sig);
  const end = e => {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    drag = null; stage.classList.remove('drag');
    if (!settings.momentum || Math.hypot(vel.yaw, vel.pitch) < 8) vel.yaw = vel.pitch = 0;
    wake();
  };
  stage.addEventListener('pointerup', end, sig);
  stage.addEventListener('pointercancel', end, sig);
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    if (anim) settleHere();
    goal.zoom = clamp(goal.zoom * Math.exp(-e.deltaY * .0012), .6, 2.2);
    wake();
  }, { passive: false, signal: ac.signal });

  const ro = new ResizeObserver(fit);
  ro.observe(stage);
  fit();

  api = {
    st, onFacing: init.onFacing || null, onTurn: null,
    turnTo(yaw, pitch) {                                   // follow another view (module viewer link)
      anim = null; vel.yaw = vel.pitch = 0;
      goal.yaw = yaw + 360 * Math.round((st.yaw - yaw) / 360); goal.pitch = pitch;
      wake();
    },
    refresh() { facing = ''; shade(); },
    animateTo,
    goTo(face) {
      const [yb, pb, zb] = VIEWS[face];
      animateTo({ yaw: yb + 360 * Math.round((st.yaw - yb) / 360), pitch: pb, zoom: zb }, 750);
    },
    home() { animateTo({ yaw: HOME.yaw + 360 * Math.round((st.yaw - HOME.yaw) / 360), pitch: HOME.pitch, zoom: 1 }, 750); },
    nudge(dyaw, dpitch) { const b = anim ? anim.to : goal; animateTo({ yaw: b.yaw + dyaw, pitch: clamp(b.pitch + dpitch, -90, 90), zoom: b.zoom }, 200); },
    zoomBy(d) { const b = anim ? anim.to : goal; animateTo({ yaw: b.yaw, pitch: b.pitch, zoom: clamp(b.zoom + d, .6, 2.2) }, 200); },
    getView: () => ({ yaw: st.yaw, pitch: st.pitch, zoom: st.zoom }),
    blast() { bomb3d.classList.add('blast'); animateTo({ zoom: st.zoom * 1.6 }, 520); },
    destroy() { ac.abort(); cancelAnimationFrame(raf); raf = 0; ro.disconnect(); }
  };
  return api;
}

/* ---- schematics for the Bomb basics appendix ----
   Line drawings in currentColor, so they read on the dark screen and on paper alike; accents use the parts' own colours. */
function schematic(w, hgt, label, body, caption) {
  return `<figure class="schem"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${hgt}" width="${w}" height="${hgt}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" font-family="Chakra Petch, sans-serif" font-size="11" role="img" aria-label="${label}">${body}</svg><figcaption>${caption}</figcaption></figure>`;
}
const sT = (x, y, t, o = '') => `<text x="${x}" y="${y}" fill="currentColor" stroke="none" ${o}>${t}</text>`;
const sMid = (x, y, t, o = '') => sT(x, y, t, 'text-anchor="middle" ' + o);
const SCH_MONO = 'font-family="Share Tech Mono, DejaVu Sans Mono, monospace"';

function schemEncoder() {
  const cx = 150, cy = 122, at = (r, k) => { const a = k * 36 * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };
  let dial = '';
  for (let k = 0; k < 10; k++) {
    const [x1, y1] = at(60, k), [x2, y2] = at(66, k), [tx, ty] = at(80, k);
    dial += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>` + sMid(tx.toFixed(1), (ty + 4).toFixed(1), k, 'font-size="12"');
  }
  const [px, py] = at(36, 3);
  return schematic(300, 260, 'Rotary encoder A reading 3',
    `<rect x="40" y="10" width="220" height="240" rx="4"/><circle cx="56" cy="27" r="5" fill="#e5412d" stroke="none"/>` + sT(66, 32, 'A', 'font-size="14" font-weight="600"') +
    dial + `<circle cx="${cx}" cy="${cy}" r="42"/><circle cx="${cx}" cy="${cy}" r="37" stroke-dasharray="2 3" stroke-opacity=".6"/>` +
    `<line x1="${cx}" y1="${cy}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="#e5412d" stroke-width="3.5"/><circle cx="${cx}" cy="${cy}" r="5" fill="#e5412d" stroke="none"/>` +
    `<line x1="${cx}" y1="${cy - 50}" x2="${cx}" y2="${cy + 50}" stroke-dasharray="4 3" stroke-opacity=".5"/>` +
    sMid(105, 236, '◀ left half: −1', 'font-size="10"') + sMid(195, 236, 'right half: +1 ▶', 'font-size="10"'),
    'Rotary encoder A, reading 3: the red pointer aims at the reading. Clicking the right half of the knob raises the reading by one, the left half lowers it.');
}

function schemKnife() {
  const sw = (x0, up) => {
    const jaws = y => `<rect x="${x0 + 22}" y="${y}" width="16" height="26" rx="1"/><rect x="${x0 + 62}" y="${y}" width="16" height="26" rx="1"/>`;
    const tip = up ? 66 : 234, bar = up ? 36 : 254, grip = up ? 4 : 264;
    const lamp = (cy, color, on) => `<circle cx="${x0 - 16}" cy="${cy}" r="7" ${on ? `fill="${color}" stroke="${color}"` : 'stroke-opacity=".5"'}/>`;
    return `<rect x="${x0}" y="50" width="100" height="200" rx="3"/>` + jaws(62) + jaws(212) +
      `<rect x="${x0 + 14}" y="140" width="72" height="20" rx="2"/>` +
      `<rect x="${x0 + 26}" y="${Math.min(tip, 150)}" width="8" height="${Math.abs(150 - tip)}" fill="currentColor" fill-opacity=".15"/>` +
      `<rect x="${x0 + 66}" y="${Math.min(tip, 150)}" width="8" height="${Math.abs(150 - tip)}" fill="currentColor" fill-opacity=".15"/>` +
      `<rect x="${x0 + 20}" y="${bar}" width="60" height="10" rx="2"/>` +
      `<rect x="${x0 + 44}" y="${grip}" width="12" height="32" rx="3" fill="currentColor"/><rect x="${x0 + 42}" y="${up ? 30 : 264}" width="16" height="6" fill="#ffb224" stroke="#ffb224"/>` +
      lamp(64, '#2fbf63', up) + sMid(x0 - 16, 88, 'ON', 'font-size="9"') + lamp(236, '#e5412d', !up) + sMid(x0 - 16, 222, 'OFF', 'font-size="9"') +
      sMid(x0 + 50, 316, up ? 'ON: thrown up' : 'OFF: thrown down', 'font-size="11" font-weight="600"');
  };
  return schematic(360, 326, 'Knife switch ON and OFF', sw(60, true) + sw(230, false),
    'The knife switch. ON: thrown up, blades in the top contacts, handle above the base, green lamp lit. OFF: thrown a half turn down, blades in the bottom contacts, handle below the base, red lamp lit.');
}

function schemModule() {
  const hex = (cx, cy, fill) => `<path d="M${cx} ${cy - 6} L${cx + 5.2} ${cy - 3} V${cy + 3} L${cx} ${cy + 6} L${cx - 5.2} ${cy + 3} V${cy - 3} Z" fill="${fill}" stroke="none"/>`;
  const card = (x, rear) => `<path d="M${x} 20 H${x + 210} V208 L${x + 198} 220 H${x} Z"/>` + hex(x + 16, 38, rear ? 'currentColor' : '#43dfff') +
    sT(x + 28, 43, 'Wires', 'font-size="13" font-weight="600"') + sT(x + 180, 42, rear ? 'rear' : 'armed', `text-anchor="end" font-size="10"${rear ? '' : ' fill="#e0951a"'}`) +
    `<circle cx="${x + 192}" cy="38" r="5" fill="#ffb224" stroke="#e0951a"/>`;
  return schematic(520, 250, 'A module and its rear plate',
    card(20, false) + `<rect x="32" y="56" width="186" height="140" stroke-dasharray="4 3" stroke-opacity=".5"/>` +
