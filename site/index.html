// The music preview runs a track from calm to its climax in about 20 seconds, then holds there.
let previewTimer = 0;
function startPreview() {
  stopPreview();
  music.start(); music.step = 0; music.I = music.target = .05;
  previewTimer = setInterval(() => { music.target = Math.min(1, music.target + .02); }, 400);
}
function stopPreview() {
  clearInterval(previewTimer); previewTimer = 0;
  if (music.on) music.stop(.4);
  if (!G) setTimeout(startMenuMusic, 600);                 // back to the start screen's own music
}
// The start screen plays the chosen track at its calm level. Browsers only allow sound after a click or a key press,
// so it starts with the first one (or straight away when the audio is already unlocked).
function startMenuMusic() {
  if (G || previewTimer || music.on || !$('.start')) return;
  sfx.init();
  if (!sfx.ctx) return;
  if (sfx.ctx.state === 'running') { music.start(); music.I = music.target = .06; }
  else sfx.ctx.resume().then(() => { if (sfx.ctx.state === 'running') startMenuMusic(); }).catch(() => { /* not allowed yet: the next click tries again */ });
}

function openSettings() {
  if ($('.settings')) return;
  const pct = v => Math.round(v * 100) + '%', mult = v => v.toFixed(1) + '\u00d7';
  const close = () => { if (!G && music.on) music.stop(.4); wrap.remove(); window.removeEventListener('keydown', onKey, true); };
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  const slider = (key, min, max, step, fmt, after) => {
    const out = h('output', {}, fmt(settings[key]));
    const inp = h('input', { type: 'range', min, max, step, value: settings[key], 'aria-label': key });
    inp.addEventListener('input', () => { settings[key] = +inp.value; out.textContent = fmt(settings[key]); save(); after && after(); });
    return h('div', { class: 'slider' }, inp, out);
  };
  const toggle = (on, fn) => seg([[true, 'On'], [false, 'Off']], on, fn);
  const row = (label, ...ctl) => h('div', { class: 'srow' }, h('b', {}, label), h('div', { class: 'sctl' }, ctl));
  const reset = () => {
    RESETTABLE.forEach(k => { settings[k] = DEFAULTS[k]; });
    save(); sfx.setMuted(!settings.fxOn); sfx.setMusicMuted(!settings.musicOn); sfx.applyVolumes(); refreshSoundButtons();
    close(); openSettings();
  };
  let preview = null;
  if (!G) {                                                         // on the main screen you can hear the music while you set it up
    preview = h('button', { class: 'tbtn', type: 'button' }, music.on ? 'Stop preview' : 'Play preview');
    preview.addEventListener('click', () => {
      sfx.init(); if (!sfx.ctx) return;
      if (music.on) { stopPreview(); preview.textContent = 'Play preview'; }
      else { startPreview(); preview.textContent = 'Stop preview'; }
    });
  }
  const trackRow = seg(MUSIC_TRACKS.map((tr, k) => [k + 1, `${k + 1} ${tr.name}`]), settings.musicTrack, v => {
    settings.musicTrack = v; save();
    if (music.on && !G) startPreview();                             // hear the new track from its calm start
  });
  const panel = h('div', { class: 'sp', role: 'dialog', 'aria-label': 'Settings' },
    h('div', { class: 'sp-head' }, h('b', {}, 'SETTINGS'), h('button', { class: 'tbtn', type: 'button', onclick: close }, 'Close')),
    h('h4', {}, 'Sound'),
    row('Master volume', slider('master', 0, 1, .01, pct, () => sfx.applyVolumes())),
    row('Music', toggle(settings.musicOn, v => setSound('music', v)), slider('music', 0, 1, .01, pct, () => sfx.applyVolumes())),
    row('Effects', toggle(settings.fxOn, v => setSound('fx', v)), slider('fx', 0, 1, .01, pct, () => { sfx.init(); sfx.applyVolumes(); sfx.click(); })),
    row('Warning beep', seg([['off', 'Off'], ['60', 'Every minute'], ['30', 'Every 30 s'], ['dynamic', 'Speeds up']], settings.beep, v => { settings.beep = v; save(); if (v !== 'off') { sfx.init(); sfx.warn(); } })),
    row('Music track', trackRow),
    preview && row('Music preview', preview),
    h('h4', {}, 'Controls'),
    row('Turning speed', slider('sens', .4, 2.5, .1, mult)),
    row('Momentum when you let go', toggle(settings.momentum, v => { settings.momentum = v; save(); })),
    row('Start zoom', seg([[1, 'Closer'], [.85, 'Default'], [.7, 'Farther']], settings.startZoom, v => { settings.startZoom = v; save(); })),
    row('Spin-in when a game starts', toggle(settings.intro, v => { settings.intro = v; save(); })),
    h('div', { class: 'sp-foot' }, h('small', {}, 'Saved automatically in this browser.'), h('button', { class: 'tbtn', type: 'button', onclick: reset }, 'Reset sound and controls')));
  const wrap = h('div', { class: 'settings', onclick: e => { if (e.target === wrap) close(); } }, panel);
  document.body.append(wrap);
  window.addEventListener('keydown', onKey, true);
}

/* ---- start page: the hero is the case itself, already draggable ---- */
function destroyDemo() { if (demo) { demo.rig.destroy(); demo = null; } }
// The start screen shows the case up to 110 %, smaller when its stage is too narrow for that.
const demoZoom = host => Math.min(1.1, (host.clientWidth || 900) / (layoutFor(window.innerWidth, opts.count).W * 1.12));
function mountDemo(host, view) {
  const keep = view || (demo && demo.rig.getView()) || { yaw: -20, pitch: -12, zoom: demoZoom(host) };
  destroyDemo();
  const L = layoutFor(window.innerWidth, opts.count), r = rng(20261025);
  const bomb = makeBomb(r, opts.minutes * 60000);
  bomb.difficulty = opts.difficulty;
  const defs = pickModules(r, Math.min(opts.count, L.cols * L.rows), opts.difficulty, opts.modules);
  const rears = defs.map(d => rearFor(r, d, opts.modules));
  ensureNeeds(bomb, defs, r);
  const plan = planCase(r, bomb, L, defs.length);
  const asm = assembleCase(bomb, L, plan, k => sealedCard(defs[k], false), k => rears[k] ? sealedCard(defs[k], true) : null);
  const t = fmt(opts.minutes * 60000);
  asm.refs.live.textContent = t; asm.refs.ghost.textContent = t.replace(/\d/g, '8');
  host.replaceChildren(h('div', { class: 'floor' }), h('div', { class: 'pool' }), asm.bomb3d, h('span', { class: 'demo-cap' }, 'Drag the case to turn it'));
  demo = { rig: createRig(host, asm.bomb3d, asm.faces, L, { ...keep, spin: 6 }) };
}

function showStart() {
  endGame(); destroyDemo();
  const arm = h('button', { class: 'arm diff-' + opts.difficulty, onclick: () => play() }, 'ARM THE BOMB');
  const host = h('div', { class: 'stage demo' });
  const remount = () => mountDemo(host);
  const seedIn = h('input', { class: 'seedin', type: 'text', value: settings.seed, placeholder: 'empty = a new random bomb', maxlength: '24', spellcheck: 'false', autocomplete: 'off', 'aria-label': 'Seed' });
  const setSeed = v => { seedIn.value = v; settings.seed = v; save(); };
  seedIn.addEventListener('input', () => { settings.seed = seedIn.value; save(); });
  seedIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); play(); } });
  const seedRow = h('div', { class: 'seedrow' }, seedIn,
    h('button', { class: 'tbtn', type: 'button', onclick: () => setSeed(String(randomSeed())) }, 'Roll'),
    h('button', { class: 'tbtn', type: 'button', onclick: () => setSeed('') }, 'Clear'));
  const last = settings.lastSeed
    ? h('div', { class: 'seedlast' }, h('span', {}, 'Last bomb: ', h('b', {}, settings.lastSeed)), h('button', { class: 'tbtn', type: 'button', onclick: () => setSeed(settings.lastSeed) }, 'Use it'))
    : null;
  app.replaceChildren(h('div', { class: 'start' },
    h('div', {},
      html('div', { class: 'lockup' }, logoMark(104, { sweep: true }) + '<div class="word"><b>ZERO</b><span>HOUR</span></div>'),
      h('p', { class: 'tagline' }, 'One team. One bomb. One manual.'),
      h('p', {}, 'One player defuses the bomb on this screen. The other reads the manual and can\u2019t see the bomb.'),
      h('p', {}, 'Inspect the case. Every side of it has something to tell you, and not all of it is on the front. Read what you find, trust your partner, and keep talking. Whatever the clock does, keep your cool.'),
      h('div', { class: 'opts' },
        h('div', { class: 'opt' }, h('b', {}, 'Time on the clock'), seg([[3, '3 min'], [5, '5 min'], [8, '8 min'], [12, '12 min']], opts.minutes, v => { opts.minutes = v; save(); remount(); })),
        h('div', { class: 'opt' }, h('b', {}, 'Modules on the bomb'), seg([2, 3, 4, 5, 6, 7, 8, 9].map(n => [n, String(n)]), opts.count, v => { opts.count = v; save(); remount(); })),
        h('div', { class: 'opt' }, h('b', {}, 'Difficulty'), (w => { [...w.children].forEach((b, i) => b.classList.add('diff-' + DIFFICULTIES[i])); return w; })(seg([['easy', 'Easy'], ['medium', 'Medium'], ['hard', 'Hard']], opts.difficulty, v => { opts.difficulty = v; arm.className = 'arm diff-' + v; save(); remount(); }))),
        h('div', { class: 'opt' }, h('b', {}, 'Seed'), seedRow,
          h('small', { class: 'seedhint' }, 'The same seed with the same time, module count, difficulty, module choices and screen size gives the same bomb. Numbers and words both work.'), last)),
      h('div', { class: 'startrow' }, arm,
        h('button', { class: 'tbtn setbtn', type: 'button', onclick: openSettings }, 'Settings'),
        h('button', { class: 'tbtn setbtn', type: 'button', onclick: () => drawer.classList.add('open') }, 'Manual'),
        h('button', { class: 'tbtn setbtn', type: 'button', onclick: openExplorer }, 'Modules'))),
    host));
  const zoom = demoZoom(host);
  mountDemo(host, { yaw: -70, pitch: -24, zoom: zoom * .8 });
  if (sfx.ctx) startMenuMusic();                           // audio already unlocked (back from a game)
  const unlock = () => { startMenuMusic(); if (music.on || G) ['pointerdown', 'keydown'].forEach(t => document.removeEventListener(t, unlock, true)); };
  ['pointerdown', 'keydown'].forEach(t => document.addEventListener(t, unlock, true));
  demo.rig.animateTo({ yaw: -20, pitch: -12, zoom }, 1600);
}


/* ---- the game ---- */
function endGame() {
  clearInterval(previewTimer); previewTimer = 0;           // a music preview from the settings must not steer the game's music
  music.stop(.4);
  if (!G) return;
  cancelAnimationFrame(G.raf);
  window.removeEventListener('keydown', G.onKey);
  G.rig && G.rig.destroy();
  G.mods.forEach(m => { try { m.cleanup && m.cleanup(); } catch (e) { console.error(e); } });
  document.querySelectorAll('.overlay').forEach(o => o.remove());
  G = null;
}

// o.seed replays a seed, o.fresh forces a new random one. Otherwise the seed field on the main screen is used (empty = random).
function play(o = {}) {
  endGame(); destroyDemo(); sfx.init();
  const typed = o.fresh ? null : seedFrom(settings.seed);
  const seed = o.seed || (typed !== null ? { num: typed, label: settings.seed.trim() } : (n => ({ num: n, label: String(n) }))(randomSeed()));
  settings.lastSeed = seed.label; save();
  const r = rng(seed.num);
  const bomb = makeBomb(r, opts.minutes * 60000);
  bomb.difficulty = opts.difficulty;
  const L = layoutFor(window.innerWidth, opts.count);
  const defs = pickModules(r, Math.min(opts.count, L.cols * L.rows), opts.difficulty, opts.modules);
  const rears = defs.map(d => rearFor(r, d, opts.modules));
  ensureNeeds(bomb, defs, r);
  const plan = planCase(r, bomb, L, defs.length);
  G = { bomb, seed, over: false, mods: [], last: performance.now(), lastSec: -1, raf: 0, L };

  const cards = defs.map((def, k) => {
    const m = { def, solved: false, cleanup: null };
    G.mods.push(m);
    const card = moduleCard(def);
    const rear = rears[k] ? rearCard(def) : null;
    m.el = card.el; m.rearEl = rear && rear.el;
    const mark = cls => { m.el.classList.add(cls); m.rearEl && m.rearEl.classList.add(cls); };
    const unmark = cls => { m.el.classList.remove(cls); m.rearEl && m.rearEl.classList.remove(cls); };
    const ctl = {
      bomb, sfx,
      isSolved: () => m.solved,
      timeText: () => fmt(bomb.left),
      solve() {
        if (m.solved || G.over) return;
        m.solved = true; mark('solved'); sfx.solve();
        if (G.mods.every(x => x.solved || x.def.needy)) defuse();
      },
      strike(why) {
        if (G.over) return;
        mark('err'); setTimeout(() => unmark('err'), 600);
        addStrike(why);
      }
    };
    m.state = def.create(bomb, r);
    const c1 = def.mount(card.body, m.state, ctl) || null;
    const c2 = rear ? (def.mountBack(rear.body, m.state, ctl) || null) : null;
    m.cleanup = () => { c1 && c1(); c2 && c2(); };
    return { front: card.el, rear: rear && rear.el };
  });
  const asm = assembleCase(bomb, L, plan, k => cards[k].front, k => cards[k].rear);

  const stage = h('div', { class: 'stage' }, h('div', { class: 'floor' }), h('div', { class: 'pool' }), asm.bomb3d);

  const hudT = h('div', { class: 't' });
  const hudPips = [0, 1, 2].map(() => h('i'));
  const hud = h('div', { class: 'hud', role: 'timer', 'aria-label': 'Time and strikes' }, hudT, h('div', { class: 's' }, hudPips));
  const fxBtn = h('button', { class: 'tbtn', 'data-snd': 'fx', onclick: () => setSound('fx', !settings.fxOn) });
  const musicBtn = h('button', { class: 'tbtn', 'data-snd': 'music', onclick: () => setSound('music', !settings.musicOn) });
  const seedBtn = h('button', { class: 'tbtn seedchip', title: 'Click to copy the seed', onclick: () => {
    try { navigator.clipboard.writeText(seed.label).catch(() => {}); } catch (e) { /* clipboard may be blocked */ }
    seedBtn.textContent = 'Seed copied'; setTimeout(() => { seedBtn.textContent = 'Seed ' + seed.label; }, 1000);
  } }, 'Seed ' + seed.label);
  const top = h('div', { class: 'top' },
    h('div', { class: 'brand' }, html('span', {}, logoMark(28, { burn: .25 })), 'ZERO HOUR'),
    hud, seedBtn,
    h('button', { class: 'tbtn', onclick: () => drawer.classList.toggle('open') }, 'Manual'),
    h('button', { class: 'tbtn', onclick: openSettings }, 'Settings'),
    musicBtn, fxBtn,
    h('button', { class: 'tbtn', onclick: askAbort }, 'Abort'));

  app.replaceChildren(h('div', { class: 'game' }, top, stage));
  refreshSoundButtons();

  const z0 = settings.startZoom;
  const rig = createRig(stage, asm.bomb3d, asm.faces, L, settings.intro ? { yaw: -80, pitch: -28, zoom: z0 - .23 } : { yaw: -16, pitch: -10, zoom: z0 });
  const FACES = [['front', 'Front'], ['back', 'Back'], ['left', 'Left'], ['right', 'Right'], ['top', 'Top'], ['bottom', 'Bottom']];
  const faceBtns = FACES.map(([f, label]) => h('button', { 'data-face': f, 'aria-pressed': 'false', onclick: () => { rig.goTo(f); sfx.turn(); } }, label));
  stage.append(h('div', { class: 'dock nodrag' },
    h('span', { class: 'hint' }, 'Drag to turn'),
    faceBtns,
    h('i', { class: 'sep' }),
    h('button', { 'aria-label': 'Zoom out', onclick: () => rig.zoomBy(-.15) }, '\u2212'),
    h('button', { 'aria-label': 'Zoom in', onclick: () => rig.zoomBy(.15) }, '+')));
  rig.onFacing = f => faceBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.face === f)));
  rig.refresh();
  if (settings.intro) rig.animateTo({ yaw: -16, pitch: -10, zoom: z0 }, 1500);

  G.onKey = e => {
    if (!G || G.over || $('.settings') || (e.target && e.target.closest && e.target.closest('input,select,textarea'))) return;
    const d = { ArrowLeft: [-15, 0], ArrowRight: [15, 0], ArrowUp: [0, 15], ArrowDown: [0, -15] }[e.key];
    if (d) { e.preventDefault(); rig.nudge(d[0], d[1]); }
  };
  window.addEventListener('keydown', G.onKey);

  G.rig = rig;
  G.refs = { ...asm.refs, stage, hudT, hudPips };
  paint();
  music.start();
  G.raf = requestAnimationFrame(frame);
}

function paint() {
  const { bomb, refs } = G;
  const t = fmt(bomb.left), low = bomb.left < 60000, w = (bomb.left / bomb.total * 100).toFixed(1);
  if (refs.shown !== t) {                                 // write to the page only when a value changed
    refs.shown = t;
    refs.live.textContent = t;
    refs.ghost.textContent = t.replace(/\d/g, '8');
    refs.hudT.textContent = t;
  }
  if (refs.wasLow !== low) {
    refs.wasLow = low;
    refs.clock.classList.toggle('low', low);
    refs.bar.classList.toggle('low-bar', low);
    refs.hudT.classList.toggle('low', low);
  }
  if (refs.barW !== w) { refs.barW = w; refs.bar.firstChild.style.width = w + '%'; }
}

function frame(now) {
  if (!G || G.over) return;
  const dt = Math.max(0, Math.min(now - G.last, 250));   // rAF timestamps are locked to the display refresh
  G.last = now;
  const before = G.bomb.left;
  G.bomb.left -= dt * (1 + 0.25 * G.bomb.strikes);
  if (beepDue(before, G.bomb.left, settings.beep)) sfx.warn();
  if (G.bomb.left <= 0) { G.bomb.left = 0; paint(); explode('The clock ran out.'); return; }
  const sec = Math.ceil(G.bomb.left / 1000);
  if (sec !== G.lastSec) { G.lastSec = sec; sfx.tick(G.bomb.left < 10000 ? 2 : G.bomb.left < 30000 ? 1 : 0); }
  music.update(G.bomb.left, G.bomb.total, G.bomb.strikes);
  paint();
  G.raf = requestAnimationFrame(frame);
}

function addStrike(why) {
  const b = G.bomb;
  b.strikes++;
  [...G.refs.pips, ...G.refs.hudPips].forEach((p, i) => p.classList.toggle('on', (i % 3) < b.strikes));
  if (b.strikes >= 3) { explode('Third strike. ' + why); return; }
  sfx.strike(); music.hit();
  document.body.classList.remove('hit'); void document.body.offsetWidth; document.body.classList.add('hit');
}

function finish(kind, title, text, delay) {
  G.over = true;
  if (confirmDialog.close) confirmDialog.close();         // an open abort dialog makes no sense once the bomb is over
  cancelAnimationFrame(G.raf);
  G.mods.forEach(m => { try { m.cleanup && m.cleanup(); } catch (e) { console.error(e); } });
  const token = G;
  setTimeout(() => {
    if (G !== token) return;
    const again = h('button', { onclick: () => play({ fresh: true }) }, 'Arm another bomb');
    const replay = h('button', { onclick: () => play({ seed: token.seed }) }, 'Replay this seed');
    const back = h('button', { onclick: showStart }, 'Change settings');
    document.body.append(h('div', { class: 'overlay ' + kind, role: 'alert' },
      h('div', {}, html('div', {}, logoMark(120, { burn: kind === 'boom' ? 1 : 0 })), h('h2', {}, title), h('p', {}, text),
        h('p', { class: 'seedline' }, 'Seed ', h('b', {}, token.seed.label)), h('div', { class: 'row' }, again, replay, back))));
    again.focus();
  }, delay);
}
function explode(reason) {
  if (!G || G.over) return;
  music.stop(.04);
  sfx.boom();
  G.refs.stage.classList.add('shake');
  G.rig.blast();
  finish('boom', 'Detonated', reason, 420);
}
function defuse() {
  const b = G.bomb;
  music.stop(1.6);
  sfx.win();
  G.rig.animateTo({ yaw: G.rig.st.yaw + 360, pitch: -10, zoom: 1.06 }, 1800);
  finish('win', 'Defused', `${fmt(b.left)} left on the clock, ${b.strikes} ${b.strikes === 1 ? 'strike' : 'strikes'}.`, 1100);
}

/* =====================================================================
   7. BOOT
   ===================================================================== */
window.__zh = { manualHTML, manualFingerprint };   // used by build-manual-pdf.mjs
// Belt and braces: block selecting and dragging text or pictures anywhere except the stand-alone manual page.
['selectstart', 'dragstart'].forEach(ev => document.addEventListener(ev, e => {
  const el = e.target && (e.target.nodeType === 1 ? e.target : e.target.parentElement);
  if (el && el.closest('input,textarea')) return;                       // text fields stay selectable
  if (!document.body.classList.contains('manual-page')) e.preventDefault();
}));
sfx.muted = !settings.fxOn; sfx.musicMuted = !settings.musicOn;
if (new URLSearchParams(location.search).has('manual')) {
  document.body.className = 'manual-page';
  document.title = 'Zero Hour: defusal manual';
  document.body.innerHTML = manualHTML();
  document.addEventListener('click', manualClick);
} else {
  buildDrawer();
  showStart();
}
})();
</script>
