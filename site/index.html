function assembleCase(bomb, L, plan, fillBay, fillRear) {
  const bomb3d = h('div', {
    class: 'bomb3d',
    style: `--W:${L.W}px;--H:${L.H}px;--D:${L.D}px;--P:${L.P}px;--TB:${L.TB}px;--SW:${L.SW}px;--SH:${L.SH}px;--cols:${L.cols};--rows:${L.rows};--wr:${L.wr};--wc:${L.wc}`
  });
  const faces = {};
  ['front', 'back', 'left', 'right', 'top', 'bottom'].forEach(n => {
    faces[n] = h('div', { class: 'face f-' + n, role: 'group', 'aria-label': n + ' side of the bomb' });
    bomb3d.append(faces[n]);
  });
  // Seen from behind, left and right swap: a rear plate sits mirrored behind its module.
  const mirror = i => Math.floor(i / L.cols) * L.cols + (L.cols - 1 - i % L.cols);
  const front = {}, back = {};
  plan.bays.forEach((p, k) => {
    front[p.i] = fillBay(k);
    const rear = fillRear && fillRear(k);
    if (rear) back[mirror(p.i)] = rear;
  });
  const bays = map => {
    const g = h('div', { class: 'bays' });
    for (let i = 0; i < L.cols * L.rows; i++) g.append(h('div', { class: 'bay' }, map[i] || blankBay()));
    return g;
  };

  const live = h('span', { class: 'live' }), ghost = h('span', { class: 'ghost' });
  const clock = h('div', { class: 'clock' }, ghost, live);
  const bar = h('div', { class: 'bar' }, h('i'));
  const pips = [0, 1, 2].map(() => h('div', { class: 'strike' }, cuboid(5, '\u00d7', 'fill')));
  const diff = bomb.difficulty || 'medium';
  const diffPlate = h('div', { class: 'diff-plate diff-' + diff, 'aria-label': diff + ' difficulty' }, led({ easy: '#4dffb0', medium: '#ffb224', hard: '#ff3b5c' }[diff], true, 'lg'), h('b', {}, diff.toUpperCase()));
  faces.front.append(h('div', { class: 'fi' },
    h('div', { class: 'band' }, h('div', { class: 'screen' }, clock, bar), h('div', { class: 'strikecol', 'aria-label': 'Strikes' }, pips), diffPlate),
    bays(front)));

  faces.back.append(h('div', { class: 'fi' },
    h('div', { class: 'band service' },
      html('div', {}, logoMark(64, { burn: .25 })),
      h('div', { class: 'svc-txt' }, h('b', {}, 'Service hatch'), h('span', {}, 'Rear plates sit behind their modules, mirrored.')),
      h('div', { class: 'hazard' })),
    bays(back)));

  const side = (face, n, dir) => {
    const g = h('div', { class: 'side ' + dir });
    const covered = new Set();                                   // cells swallowed by a tall widget (the lever)
    plan.widgets.filter(x => x.at.face === face && x.at.span > 1).forEach(x => { for (let k = 1; k < x.at.span; k++) covered.add(x.at.i + k); });
    for (let i = 0; i < n; i++) {
      if (covered.has(i)) continue;
      const w = plan.widgets.find(x => x.at.face === face && x.at.i === i);
      const cell = h('div', { class: 'cell' + (w ? '' : ' empty d' + ((i + face.length) % 3)) }, w ? widgetEl(w, bomb) : null);
      if (w && w.at.span > 1) cell.style.gridRow = `span ${w.at.span}`;
      g.append(cell);
    }
    return g;
  };
  faces.left.append(side('left', L.wr, 'v'));
  faces.right.append(side('right', L.wr, 'v'));
  faces.top.append(side('top', L.wc, 'hz'));
  faces.bottom.append(side('bottom', L.wc, 'hz'));

  return { bomb3d, faces, refs: { live, ghost, clock, bar, pips } };
}

/* ---------------------------------------------------------------------
   Rotation rig: drag (with momentum), arrow keys, wheel zoom,
   animated jumps to a face, and per-face lighting that follows the view.
   --------------------------------------------------------------------- */
function createRig(stage, bomb3d, faces, L, init = {}) {
  const ac = new AbortController(), sig = { signal: ac.signal };
  const st = { yaw: init.yaw ?? -16, pitch: init.pitch ?? -10, zoom: init.zoom ?? 1 };   // what is on screen now
  const goal = { ...st };                                                                  // where the view is heading
  const HOME = { yaw: -16, pitch: -10, zoom: 1 };
  const FACE_N = { front: [0, 0, 1], back: [0, 0, -1], right: [1, 0, 0], left: [-1, 0, 0], top: [0, -1, 0], bottom: [0, 1, 0] };
  const VIEWS = { front: [0, 0, 1], back: [180, 0, 1], left: [90, 0, .74], right: [-90, 0, .74], top: [0, -80, .95], bottom: [0, 80, .95] };   // yaw, pitch, zoom (side faces sit closer to the camera)
  const LIGHT = (() => { const v = [-.35, -.55, .75], m = Math.hypot(...v); return v.map(x => x / m); })();
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const FOLLOW = 20, DECAY = 3.4;          // follow speed and momentum decay, both per second
  const narrow = window.innerWidth < 820;                  // phones: the case fits the width and the page scrolls
  let api = null, fitScale = 1, facing = '', raf = 0, last = 0, anim = null, drag = null, lastInput = 0;
  // init.spin: a slow turn in degrees per second while nobody touches the case (start screen); off for reduced motion
  const spin = init.spin && !matchMedia('(prefers-reduced-motion: reduce)').matches ? init.spin : 0;
  const idle = now => spin && !drag && now - lastInput > 2500;
  const pend = { x: 0, y: 0 }, vel = { yaw: 0, pitch: 0 }, lastDim = {};
  stage.classList.toggle('narrow', narrow);

  function shade() {
    const ya = st.yaw * Math.PI / 180, pa = st.pitch * Math.PI / 180;
    const cy = Math.cos(ya), sy = Math.sin(ya), cp = Math.cos(pa), sp = Math.sin(pa);
    let best = '', bz = -9;
    for (const name in FACE_N) {
      const n = FACE_N[name];
      const x = n[0] * cy + n[2] * sy, z = -n[0] * sy + n[2] * cy;
      const y2 = n[1] * cp - z * sp, z2 = n[1] * sp + z * cp;
      const b = Math.max(0, x * LIGHT[0] + y2 * LIGHT[1] + z2 * LIGHT[2]);
      const dim = (1 - Math.min(1, .38 + .8 * b)) * .8;
      if (Math.abs(dim - (lastDim[name] ?? -1)) > .004) { lastDim[name] = dim; faces[name].style.setProperty('--dim', dim.toFixed(3)); }   // only touch the DOM when it changed
      if (z2 > bz) { bz = z2; best = name; }
    }
    if (best !== facing) { facing = best; api && api.onFacing && api.onFacing(best); }
  }
  function apply() {
    const s = (fitScale * st.zoom).toFixed(4);
    bomb3d.style.transform = `scale3d(${s},${s},${s}) rotateX(${st.pitch.toFixed(2)}deg) rotateY(${st.yaw.toFixed(2)}deg)`;
    shade();
  }
  function fit() {
    const w = stage.clientWidth, hgt = stage.clientHeight;
    if (!w) return;
    if (narrow) {
      fitScale = Math.min(1.1, (w - 16) / (L.W + L.D * .45));
      stage.style.flex = 'none';
      stage.style.height = Math.round((L.H + L.D * .3) * fitScale + 116) + 'px';
    } else {
      fitScale = Math.max(.2, Math.min(1.25, (w - 24) / (L.W + L.D * .45), (hgt - 136) / (L.H + L.D * .3)));
    }
    apply();
  }

  /* One render loop, locked to the display refresh (requestAnimationFrame). Input only records
     what the user did; the view moves once per frame, using the frame's own timestamp, so speed
     doesn't depend on the mouse polling rate or the frame rate. It sleeps when nothing moves. */
  const wake = () => { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } };
  function tick(now) {
    raf = 0;
    const dt = last ? Math.min((now - last) / 1000, .05) : 1 / 60;
    last = now;
    let busy = false;
    if (anim) {                                              // an animated jump (face buttons, intro, victory spin)
      const p = clamp((now - anim.t0) / anim.ms, 0, 1), e = ease(p);
      for (const k in anim.to) st[k] = anim.from[k] + (anim.to[k] - anim.from[k]) * e;
      Object.assign(goal, st);
      if (p >= 1) { anim = null; busy = !!spin; } else busy = true;
    } else {
      if (drag && (pend.x || pend.y)) {                      // all pointer movement since the last frame, applied at once
        const dyaw = pend.x * .32 * settings.sens, dpitch = -pend.y * .32 * settings.sens;
        pend.x = pend.y = 0;
        goal.yaw += dyaw; goal.pitch = clamp(goal.pitch + dpitch, -90, 90);
        api && api.onTurn && api.onTurn(goal.yaw, goal.pitch);
        const a = 1 - Math.exp(-dt * 25);                    // smoothed velocity in degrees per second
        vel.yaw += (dyaw / dt - vel.yaw) * a; vel.pitch += (dpitch / dt - vel.pitch) * a;
      } else if (drag) {                                     // held still: a pause before letting go shouldn't fling it
        const f = Math.exp(-dt * 12); vel.yaw *= f; vel.pitch *= f;
      } else if (Math.abs(vel.yaw) > 2 || Math.abs(vel.pitch) > 2) {   // momentum after letting go
        goal.yaw += vel.yaw * dt; goal.pitch = clamp(goal.pitch + vel.pitch * dt, -90, 90);
        api && api.onTurn && api.onTurn(goal.yaw, goal.pitch);
        const f = Math.exp(-dt * DECAY); vel.yaw *= f; vel.pitch *= f;
      } else {
        vel.yaw = vel.pitch = 0;
        if (idle(now)) goal.yaw += spin * dt;
      }
      const k = 1 - Math.exp(-dt * FOLLOW);                  // ease the picture toward the goal
      st.yaw += (goal.yaw - st.yaw) * k; st.pitch += (goal.pitch - st.pitch) * k; st.zoom += (goal.zoom - st.zoom) * k;
      busy = !!spin || !!drag || !!vel.yaw || !!vel.pitch || Math.abs(goal.yaw - st.yaw) > .01 || Math.abs(goal.pitch - st.pitch) > .01 || Math.abs(goal.zoom - st.zoom) > .0005;
      if (!busy) Object.assign(st, goal);
    }
    apply();
    if (busy) raf = requestAnimationFrame(tick);
  }
  function animateTo(t, ms = 700) {
    Object.assign(goal, st); vel.yaw = vel.pitch = 0;
    const from = { yaw: st.yaw, pitch: st.pitch, zoom: st.zoom };
    anim = { from, to: { ...from, ...t }, t0: performance.now(), ms };
    wake();
  }
  const settleHere = () => { anim = null; Object.assign(goal, st); vel.yaw = vel.pitch = 0; };   // take over from whatever was moving

  stage.addEventListener('pointerdown', e => {
    lastInput = performance.now();
    if (e.button > 0 || e.target.closest('button,[role=button],.nodrag,input,a')) return;
    settleHere();
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
    pend.x = pend.y = 0;
    stage.classList.add('drag');
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    wake();
  }, sig);
  stage.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    pend.x += e.clientX - drag.x; pend.y += e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    wake();
  }, sig);
  const end = e => {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    drag = null; stage.classList.remove('drag');
    if (!settings.momentum || Math.hypot(vel.yaw, vel.pitch) < 8) vel.yaw = vel.pitch = 0;
    wake();
  };
  stage.addEventListener('pointerup', end, sig);
  stage.addEventListener('pointercancel', end, sig);
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    if (anim) settleHere();
    goal.zoom = clamp(goal.zoom * Math.exp(-e.deltaY * .0012), .6, 2.2);
    lastInput = performance.now();
    wake();
    api && api.onZoom && api.onZoom(goal.zoom);
  }, { passive: false, signal: ac.signal });

  const ro = new ResizeObserver(fit);
  ro.observe(stage);
  fit();

  api = {
    st, onFacing: init.onFacing || null, onTurn: null, onZoom: null,
    zoomTo(z) { anim = null; goal.zoom = z; wake(); },     // follow another view's zoom (module explorer link)
    turnTo(yaw, pitch) {                                   // follow another view (module viewer link)
      anim = null; vel.yaw = vel.pitch = 0;
      goal.yaw = yaw + 360 * Math.round((st.yaw - yaw) / 360); goal.pitch = pitch;
      wake();
    },
    refresh() { facing = ''; shade(); },
    animateTo,
    goTo(face) {
      const [yb, pb, zb] = VIEWS[face];
      animateTo({ yaw: yb + 360 * Math.round((st.yaw - yb) / 360), pitch: pb, zoom: zb }, 750);
    },
    home() { animateTo({ yaw: HOME.yaw + 360 * Math.round((st.yaw - HOME.yaw) / 360), pitch: HOME.pitch, zoom: 1 }, 750); },
    nudge(dyaw, dpitch) { const b = anim ? anim.to : goal; animateTo({ yaw: b.yaw + dyaw, pitch: clamp(b.pitch + dpitch, -90, 90), zoom: b.zoom }, 200); },
    zoomBy(d) { const b = anim ? anim.to : goal; animateTo({ yaw: b.yaw, pitch: b.pitch, zoom: clamp(b.zoom + d, .6, 2.2) }, 200); },
    getView: () => ({ yaw: st.yaw, pitch: st.pitch, zoom: st.zoom }),
    blast() { bomb3d.classList.add('blast'); animateTo({ zoom: st.zoom * 1.6 }, 520); },
    destroy() { ac.abort(); cancelAnimationFrame(raf); raf = 0; ro.disconnect(); }
  };
  return api;
}

/* ---- schematics for the Bomb basics chapter ----
   Line drawings in currentColor, so they read on the dark screen and on paper alike; accents use the parts' own colours. */
function schematic(w, hgt, label, body, caption) {
  return `<figure class="schem"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${hgt}" width="${w}" height="${hgt}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" font-family="Chakra Petch, sans-serif" font-size="11" role="img" aria-label="${label}">${body}</svg><figcaption>${caption}</figcaption></figure>`;
}
const sT = (x, y, t, o = '') => `<text x="${x}" y="${y}" fill="currentColor" stroke="none" ${o}>${t}</text>`;
const sMid = (x, y, t, o = '') => sT(x, y, t, 'text-anchor="middle" ' + o);
const SCH_MONO = 'font-family="Share Tech Mono, DejaVu Sans Mono, monospace"';

    `<rect x="336" y="72" width="168" height="196"/><rect x="344" y="80" width="152" height="30"/>` +
    sT(352, 99, 'SERVICE HATCH', 'font-size="9" font-weight="600"') + hazard(440, 90, 48) +

    sMid(420, 60, 'rear plates, columns swapped', 'font-size="9"') +
    // the bottom: plates only
    `<rect x="84" y="268" width="168" height="72"/><rect x="94" y="276" width="62" height="24" rx="1"/>` + sT(98, 285, 'serial no.', 'font-size="6"') + barcode +
    `<rect x="164" y="276" width="62" height="24" rx="1"/>` + sT(168, 286, 'MODEL ZH-07', SCH_MONO + ' font-size="6"') + sT(168, 295, 'REV B', SCH_MONO + ' font-size="6"') +

    `<rect x="450" y="190" width="44" height="8"/>` + [0, 1, 2, 3, 4, 5].map(k => `<line x1="${452 + k * 7}" y1="198" x2="${458 + k * 7}" y2="190"/>`).join('') +

function schemEncoder() {
  const cx = 150, cy = 120, at = (r, k) => { const a = k * 36 * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };
  let dial = '', knurl = '';
  for (let k = 0; k < 10; k++) {
    const [x1, y1] = at(60, k), [x2, y2] = at(66, k), [tx, ty] = at(78, k);
    dial += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>` + sMid(tx.toFixed(1), (ty + 4).toFixed(1), k, 'font-size="12"');
  }
  for (let k = 0; k < 36; k++) { const [x1, y1] = at(37, k / 3.6), [x2, y2] = at(42, k / 3.6); knurl += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke-width=".8"/>`; }
  const [px, py] = at(30, 3);
  return schematic(300, 262, 'Rotary encoder A reading 3',
    `<rect x="40" y="8" width="220" height="246" rx="4"/><circle cx="58" cy="26" r="5" fill="#e5412d" stroke="none"/>` + sT(68, 31, 'A', 'font-size="14" font-weight="600"') +
    dial + `<circle cx="${cx}" cy="${cy}" r="42"/>` + knurl + `<circle cx="${cx}" cy="${cy}" r="37"/>` +
    `<circle cx="${cx}" cy="${cy}" r="18" fill="#e5412d" fill-opacity=".25" stroke="#e5412d"/>` +
    `<line x1="${cx}" y1="${cy}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="#e5412d" stroke-width="3.5"/><circle cx="${cx}" cy="${cy}" r="3" fill="#e5412d" stroke="none"/>` +
    `<line x1="${cx}" y1="${cy - 48}" x2="${cx}" y2="${cy + 48}" stroke-dasharray="4 3" stroke-opacity=".5"/>` +
    sMid(cx, 222, '◀ turn ▶', 'font-size="10"') +
    sMid(95, 244, 'left half: −1', 'font-size="10"') + sMid(205, 244, 'right half: +1', 'font-size="10"'),
    'Rotary encoder A, reading 3: a knurled knob with a coloured cap; the red pointer line aims at the reading. Clicking the right half of the knob raises the reading by one, the left half lowers it.');
}

function schemKnife() {
  const sw = (x0, up) => {
    const screw = (x, y) => `<circle cx="${x}" cy="${y}" r="3"/><line x1="${x - 2}" y1="${y}" x2="${x + 2}" y2="${y}"/>`;
    const contacts = y => `<rect x="${x0 + 30}" y="${y}" width="14" height="26" rx="1"/><rect x="${x0 + 60}" y="${y}" width="14" height="26" rx="1"/>` +
      `<rect x="${x0 + 46}" y="${y + 4}" width="12" height="18" rx="1"/>` + screw(x0 + 52, y + 13);
    const tip = up ? 66 : 234, bar = up ? 34 : 256, gripY = up ? 0 : 266, collar = up ? 28 : 264;
    const lamp = (cy, color, on) => `<circle cx="${x0 + 13}" cy="${cy}" r="5" ${on ? `fill="${color}" stroke="${color}"` : 'stroke-opacity=".5"'}/>`;
    let ribs = '';
    for (let k = 0; k < 6; k++) ribs += `<line x1="${x0 + 44}" y1="${gripY + 4 + k * 4.4}" x2="${x0 + 56}" y2="${gripY + 4 + k * 4.4}" stroke="#fff" stroke-opacity=".5" stroke-width=".8"/>`;
    return `<rect x="${x0}" y="50" width="100" height="200" rx="3"/>` + contacts(60) + contacts(214) +
      lamp(62, '#2fbf63', up) + sT(x0 + 6, 80, 'ON', 'font-size="8"') + lamp(238, '#e5412d', !up) + sT(x0 + 4, 228, 'OFF', 'font-size="8"') +
      `<rect x="${x0 + 26}" y="142" width="52" height="16" rx="2"/><circle cx="${x0 + 37}" cy="150" r="3"/><circle cx="${x0 + 67}" cy="150" r="3"/>` +
      `<rect x="${x0 + 34}" y="${Math.min(tip, 150)}" width="6" height="${Math.abs(150 - tip)}" fill="currentColor" fill-opacity=".2"/>` +
      `<rect x="${x0 + 64}" y="${Math.min(tip, 150)}" width="6" height="${Math.abs(150 - tip)}" fill="currentColor" fill-opacity=".2"/>` +
      `<line x1="${x0 + 37}" y1="${tip}" x2="${x0 + 37}" y2="${bar + 5}"/><line x1="${x0 + 67}" y1="${tip}" x2="${x0 + 67}" y2="${bar + 5}"/>` +
      `<rect x="${x0 + 28}" y="${bar}" width="48" height="10" rx="2"/>` +
      `<rect x="${x0 + 42}" y="${gripY}" width="16" height="30" rx="4" fill="currentColor"/>` + ribs +
      `<rect x="${x0 + 40}" y="${collar}" width="20" height="6" fill="#ffb224" stroke="#e0951a"/>` +
      sMid(x0 + 50, 318, up ? 'ON: thrown up' : 'OFF: thrown down', 'font-size="11" font-weight="600"');
  };
  return schematic(320, 328, 'Knife switch ON and OFF', sw(40, true) + sw(190, false),
    'The knife switch. ON: thrown up, blades in the top contacts, handle above the base, green lamp lit. OFF: thrown a half turn down, blades in the bottom contacts, handle below the base, red lamp lit.');
}

function schemModule() {
  const hex = (cx, cy, fill) => `<path d="M${cx} ${cy - 6} L${cx + 5.2} ${cy - 3} V${cy + 3} L${cx} ${cy + 6} L${cx - 5.2} ${cy + 3} V${cy - 3} Z" fill="${fill}" stroke="none"/>`;
  const card = (x, title, status, color) => `<path d="M${x} 20 H${x + 156} V188 L${x + 146} 198 H${x} Z"/>` + hex(x + 14, 37, color === 'rear' ? 'currentColor' : '#43dfff') +
    sT(x + 25, 42, title, 'font-size="12" font-weight="600"') + sT(x + 138, 41, status, `text-anchor="end" font-size="9"${color === 'rear' ? '' : ' fill="#e0951a"'}`) +
    `<circle cx="${x + 146}" cy="37" r="4.5" fill="#ffb224" stroke="#e0951a"/>`;
  const note = (x, lines) => lines.map((t, k) => sMid(x + 78, 112 + k * 13, t, 'font-size="9.5"')).join('');
  return schematic(520, 240, 'A module, a needy module and a rear plate',
    card(10, 'Wires', 'armed') + `<rect x="20" y="56" width="136" height="124" stroke-dasharray="4 3" stroke-opacity=".5"/>` +
    note(10, ['status light: amber', 'while armed, green', 'once defused']) + `<path d="M120 100 L152 44" stroke-opacity=".7"/>` +
    card(182, 'Breaker', 'needy') + `<rect x="${182 + 74}" y="30" width="26" height="14" rx="1"/>` + sMid(182 + 87, 41, '0:25', SCH_MONO + ' font-size="8" fill="#ff8a3d"') +
    `<rect x="192" y="56" width="136" height="124" stroke-dasharray="4 3" stroke-opacity=".5"/>` +
    note(182, ['countdown while awake:', 'handle it before it', 'runs out; never defused']) + `<path d="M268 100 L270 48" stroke-opacity=".7"/>` +
    card(354, 'Wires', 'rear', 'rear') + `<circle cx="364" cy="188" r="3"/><circle cx="496" cy="188" r="3"/>` +
    note(354, ['a value found nowhere', 'else on the bomb; some', 'plates only on some bombs']) +
    sMid(88, 222, 'FRONT: a module', 'font-size="11" font-weight="600"') + sMid(260, 222, 'FRONT: a needy module', 'font-size="11" font-weight="600"') +
    sMid(432, 222, 'BACK: a rear plate', 'font-size="11" font-weight="600"'),
    'A module and a needy module on the front, and a rear plate on the back, directly behind its module. A module without a rear plate has a blank panel behind it.');
}

// The manual for the modules that are switched on; `config` is settings.modules (an empty one gives the full manual,
// which is what the built PDF and its fingerprint cover).
function manualHTML(config = {}) {
  const mods = Modules.list.filter(m => !(config[m.id] && config[m.id].off));
  return `<div class="manual">
    <div class="mh">${logoMark(46, { burn: .25 })}<h1>Defusal manual</h1></div>
    <p>The defuser describes what they see. You find the matching rule and say what to do. Don't look at the bomb.</p>
    <p>New to the bomb? Start with Bomb basics: it shows how the case is built and what its parts look like.</p>
    ${mods.length < Modules.list.length ? `<p>This copy covers ${mods.length} of the ${Modules.list.length} modules: the others are switched off in the module explorer.</p>` : ''}
    <div class="mact no-print"><button class="mbtn" data-act="pdf-open">Open PDF</button><button class="mbtn" data-act="pdf-download">Download PDF</button></div>
    <nav><a href="#man-basics">Bomb basics</a>${mods.map(m => `<a href="#man-${m.id}">${m.title}</a>`).join('')}</nav>
    <section id="man-basics"><h2>Bomb basics</h2>
      <h3>The case</h3>
      ${schemCase()}
      <ul>
        <li><b>Case sizes.</b> The case comes in three sizes: 2 × 2 bays for up to four modules, two rows of three for five or six, and 3 × 3 for seven to nine. Bays without a module are blank.</li>
        <li><b>Rotate the case.</b> Modules sit on the front. Everything else is on the other sides, and the positions change on every bomb. The left, right and top panels can carry any component. The bottom only ever carries plates: the serial number plate, and sometimes plain name plates (model or rating) that mean nothing. If a rule needs a component, ask the defuser to turn the bomb and look.</li>
        <li><b>Rear plates.</b> Some modules have a steel rear plate on the back of the bomb, directly behind the module. Seen from behind, left and right swap: a module in the left column on the front has its plate in the right column on the back. Some rear plates are on every bomb, and their module cannot be solved without them. Others are not on every bomb: when one is there, it changes its module's rule, so always check the back. Every plate shows something found nowhere else on the bomb. A module without a rear plate has a blank panel behind it. Each module's section says what its plate shows.</li>
      </ul>
      <h3>Parts on the side panels</h3>
      ${schemParts()}
      <ul>
        <li><b>Serial number.</b> A white steel plate with a barcode. Rules refer to the last digit (odd or even) and to whether the serial contains a vowel: A, E, I, O or U.</li>
        <li><b>Batteries.</b> Count the individual cells in all battery holders (a single large D cell, or a pair of AA cells). There may be none at all. Coin cells are not batteries.</li>
        <li><b>Coin cells.</b> Flat silver discs in small black holders with a steel clip. The model is stamped on top: CR2032, CR2025 and CR2016 are 3 volt lithium cells (in that order they get thinner), and LR44 is a small, thick 1.5 volt alkaline cell. A bomb can have none, one or two.</li>
        <li><b>Indicators.</b> Small labeled plates with a lens. A lit indicator has a glowing lens and bright text. An unlit one is dark.</li>
      </ul>
      <h3>Rotary encoders</h3>
      ${schemEncoder()}
      <ul>
        <li><b>Rotary encoders.</b> Some bombs have up to three: a knurled aluminium knob on a dial numbered 0 to 9, with a letter (A, B, C) and a colored cap. The reading is the digit the red pointer line aims at, and the digits are printed around the knob. Click the right half of a knob to turn it one step clockwise (the reading goes up, 9 wraps to 0) or the left half to turn it back one step. The mouse wheel and right-click also turn it. Rules read the encoders as they are at the moment you act, so turning one changes the answer. "The encoders add up" means the sum of all readings, and a bomb without encoders adds up to 0. A bomb can carry encoders that no rule uses.</li>
      </ul>
      <h3>Knife switch</h3>
      ${schemKnife()}
      <ul>
        <li><b>Knife switch.</b> Some bombs have a double-throw knife switch on the left or right panel: a dark graphite base with two silver blades on a centre hinge, silver contacts and terminal blocks with socket-head screws at the top and the bottom, and a ribbed black handle with an orange collar. Thrown up, with the blades in the top contacts and the handle above the base, it is ON. Thrown a full half turn down, with the blades in the bottom contacts and the handle below the base, it is OFF. A green lamp at the top and a red lamp at the bottom show which. Drag the handle up or down, or click it to throw it. Only the Breaker module reads it; on any other bomb it is a decoy.</li>
      </ul>
      <h3>Modules and strikes</h3>
      ${schemModule()}
      <ul>
        <li><b>Modules.</b> Each module is independent. Defuse them all before the clock reaches zero. A module's status light turns green when it is safe.</li>
        <li><b>Needy modules.</b> Some modules are never defused. They sleep, then wake with a small countdown in their corner and need attention before it runs out, again and again. Their plate says <em>needy</em> instead of armed. The bomb is defused once every other module is safe.</li>
        <li><b>Strikes.</b> Every mistake is a strike, and each strike makes the clock run 25% faster. The third strike detonates the bomb.</li>
      </ul>
    </section>
    ${mods.map(m => `<section id="man-${m.id}"><h2>${m.title}</h2>${m.manual()}${m.manualBack ? `<h3>${m.rearOptional ? 'Rear plate (not on every bomb)' : 'Rear plate'}</h3>${m.manualBack()}` : ''}</section>`).join('')}
  </div>`;
}

const app = $('#app');
const opts = settings;   // time and module count are remembered with the other settings
let G = null, demo = null;
const drawer = h('aside', { class: 'drawer', 'aria-label': 'Defusal manual' });

// Turns the manual's HTML into plain data for the Typst template (site/manual.typ), both when the build typesets the PDF
// and when the page typesets one itself: text becomes a string, an element becomes { t: tag, c: class, k: children }, and
// an SVG keeps its markup in `svg`. Whitespace between block elements is dropped, as the browser does when it lays them out.
function manualTree(html = manualHTML()) {
  const blocks = new Set(['div', 'section', 'nav', 'ul', 'ol', 'table', 'tbody', 'thead', 'tr']);
  const walk = n => {
    if (n.nodeType === Node.TEXT_NODE) return n.data.replace(/\s+/g, ' ');
    if (n.nodeType !== Node.ELEMENT_NODE) return null;
    const t = n.localName;

  const seed = o.seed || (typed !== null ? { num: typed, label: settings.seed.trim() } : (n => ({ num: n, label: String(n) }))(randomSeed()));

    const m = { def, solved: false, cleanup: null };
    G.mods.push(m);
    const card = moduleCard(def);

    m.el = card.el; m.rearEl = rear && rear.el;
    const mark = cls => { m.el.classList.add(cls); m.rearEl && m.rearEl.classList.add(cls); };
    const unmark = cls => { m.el.classList.remove(cls); m.rearEl && m.rearEl.classList.remove(cls); };

function paint() {
  const { bomb, refs } = G;
  const t = fmt(bomb.left), low = bomb.left < 60000, w = (bomb.left / bomb.total * 100).toFixed(1);
  if (refs.shown !== t) {                                 // write to the page only when a value changed
    refs.shown = t;
    refs.live.textContent = t;
    refs.ghost.textContent = t.replace(/\d/g, '8');
    refs.hudT.textContent = t;
  }
  if (refs.wasLow !== low) {
    refs.wasLow = low;
    refs.clock.classList.toggle('low', low);
    refs.bar.classList.toggle('low-bar', low);
    refs.hudT.classList.toggle('low', low);
  }
  if (refs.barW !== w) { refs.barW = w; refs.bar.firstChild.style.width = w + '%'; }
}

function frame(now) {
  if (!G || G.over) return;
  const dt = Math.max(0, Math.min(now - G.last, 250));   // rAF timestamps are locked to the display refresh
  G.last = now;
  const before = G.bomb.left;
  G.bomb.left -= dt * (1 + 0.25 * G.bomb.strikes);
  if (beepDue(before, G.bomb.left, settings.beep)) sfx.warn();
  if (G.bomb.left <= 0) { G.bomb.left = 0; paint(); explode('The clock ran out.'); return; }
  const sec = Math.ceil(G.bomb.left / 1000);
  if (sec !== G.lastSec) { G.lastSec = sec; sfx.tick(G.bomb.left < 10000 ? 2 : G.bomb.left < 30000 ? 1 : 0); }
  music.update(G.bomb.left, G.bomb.total, G.bomb.strikes);
  paint();
  G.raf = requestAnimationFrame(frame);
}

function addStrike(why) {
  const b = G.bomb;
  b.strikes++;
  [...G.refs.pips, ...G.refs.hudPips].forEach((p, i) => p.classList.toggle('on', (i % 3) < b.strikes));
  if (b.strikes >= 3) { explode('Third strike. ' + why); return; }
  sfx.strike(); music.hit();
  document.body.classList.remove('hit'); void document.body.offsetWidth; document.body.classList.add('hit');
}

function finish(kind, title, text, delay) {
  G.over = true;
  if (confirmDialog.close) confirmDialog.close();         // an open abort dialog makes no sense once the bomb is over
  cancelAnimationFrame(G.raf);
  G.mods.forEach(m => { try { m.cleanup && m.cleanup(); } catch (e) { console.error(e); } });
  const token = G;
  setTimeout(() => {
    if (G !== token) return;
    const again = h('button', { onclick: () => play({ fresh: true }) }, 'Arm another bomb');
    const replay = h('button', { onclick: () => play({ seed: token.seed }) }, 'Replay this seed');
    const back = h('button', { onclick: showStart }, 'Change settings');
    document.body.append(h('div', { class: 'overlay ' + kind, role: 'alert' },
      h('div', {}, html('div', {}, logoMark(120, { burn: kind === 'boom' ? 1 : 0 })), h('h2', {}, title), h('p', {}, text),
        h('p', { class: 'seedline' }, 'Seed ', h('b', {}, token.seed.label)), h('div', { class: 'row' }, again, replay, back))));
    again.focus();
  }, delay);
}
function explode(reason) {
  if (!G || G.over) return;
  music.stop(.04);
  sfx.boom();
  G.refs.stage.classList.add('shake');
  G.rig.blast();
  finish('boom', 'Detonated', reason, 420);
}
function defuse() {
  const b = G.bomb;
  music.stop(1.6);
  sfx.win();
  G.rig.animateTo({ yaw: G.rig.st.yaw + 360, pitch: -10, zoom: 1.06 }, 1800);
  finish('win', 'Defused', `${fmt(b.left)} left on the clock, ${b.strikes} ${b.strikes === 1 ? 'strike' : 'strikes'}.`, 1100);
}

/* =====================================================================
   7. BOOT
   ===================================================================== */
window.__zh = { manualHTML, manualFingerprint, manualTree, manualPdf };   // used by build-manual-pdf.mjs and the tests
// Belt and braces: block selecting and dragging text or pictures anywhere except the stand-alone manual page.
['selectstart', 'dragstart'].forEach(ev => document.addEventListener(ev, e => {
  const el = e.target && (e.target.nodeType === 1 ? e.target : e.target.parentElement);
  if (el && el.closest('input,textarea')) return;                       // text fields stay selectable
  if (!document.body.classList.contains('manual-page')) e.preventDefault();
}));
sfx.muted = !settings.fxOn; sfx.musicMuted = !settings.musicOn;
if (new URLSearchParams(location.search).has('manual')) {
  document.body.className = 'manual-page';
  document.title = 'Zero Hour: defusal manual';
  document.body.innerHTML = manualHTML(settings.modules);
  document.addEventListener('click', manualClick);
} else {
  buildDrawer();
  showStart();
}
})();
</script>
