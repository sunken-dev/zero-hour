    root.append(h('div', { class: 'gyro3d' }, h('small', {}, 'gyro'),
      h('div', { class: 'gyro' }, h('div', { class: 'gy' },
        cylZ(52, 10, 48, { color: '#8d9ca4' }), cylZ(48, 3, 48, { z: 10, color: '#c9d3d8', knurl: true }),
        h('i', { class: 'gy-face' }),
        h('div', { class: 'gy-rotor' }, cylZ(30, 6, 36, { color: '#c9a36a' }), h('i', { class: 'gy-disc' }), cylZ(6, 4, 14, { z: 6, color: '#4a5860' })),
        h('i', { class: 'gy-index' }))),
      h('b', { class: 'gyro-lbl' }, MAZE_ROT[s.rot])));
  },
  manual() {
    return `<p>The module shows a 6×6 grid with two green rings, the defuser's white square and a red goal. The walls are invisible. Guide the square to the goal with the four arrows; walking into a wall is a strike and the square stays put.</p>
      <ol>
        <li>Ask for the gyro plate on the back. It reads ROTATED 0°, 90° CW, 180° or 270° CW: the maze is mounted turned that far clockwise, as seen from the front.</li>
        <li>Turn this page the same way (clockwise by that angle). Now the mazes below look exactly like the module.</li>
        <li>Find the maze whose two green rings sit where the defuser sees them, then talk the square to the goal: up, down, left and right are the defuser's.</li>
      </ol>
      ${mazesFigure()}
      <table class="tbl"><tr><th>Gyro</th><th>Defuser's ring at column c, row r is on the unturned map at</th></tr>
        <tr><td>0°</td><td>column c, row r</td></tr><tr><td>90° CW</td><td>column r, row 7 − c</td></tr>
        <tr><td>180°</td><td>column 7 − c, row 7 − r</td></tr><tr><td>270° CW</td><td>column 7 − r, row c</td></tr></table>
      <p>Columns count from the left and rows from the top, 1 to 6, as the defuser sees them.</p>`;
  },

  }
});

/* ---------------------------------------------------------------------

const cipherEncode = (word, shifts) => [...word].map((c, i) => String.fromCharCode((c.charCodeAt(0) - 65 + shifts[i]) % 26 + 65)).join('');

/* ---------------------------------------------------------------------
   MODULE: Resistors
   Three colour-banded resistors on the front; how they are wired is drawn on the back.
   --------------------------------------------------------------------- */
const RES_VALUES = [10, 15, 22, 33, 47, 68, 100, 150, 220, 330, 470, 680];
const BAND_COLORS = ['black', 'brown', 'red', 'orange', 'yellow', 'green', 'blue', 'violet', 'grey', 'white'];
const BAND_HEX = { black: '#111417', brown: '#7a4a24', red: '#e5412d', orange: '#f08a24', yellow: '#f2c230', green: '#2fbf63', blue: '#2f6bff', violet: '#8e5bd8', grey: '#8a949a', white: '#f4f4ef' };
const resBands = v => { const m = v >= 100 ? 10 : 1, d = v / m; return [BAND_COLORS[Math.floor(d / 10)], BAND_COLORS[d % 10], m === 10 ? 'brown' : 'black']; };
const resTotal = s => s.wiring === 'series' ? s.r[0] + s.r[1] + s.r[2] : s.r[0] + s.r[1] / 2;

function resWiringSVG(s) {
  const box = (x, y, t) => `<rect x="${x}" y="${y - 9}" width="44" height="18" rx="3" fill="#e9eef0" stroke="#1b262c" stroke-width="2"/><text x="${x + 22}" y="${y + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#1b262c">${t}</text>`;
  const wires = d => `<path d="${d}" fill="none" stroke="#1b262c" stroke-width="2.2"/>`;
  const end = (x, y) => `<circle cx="${x}" cy="${y}" r="4" fill="#1b262c"/>`;
  const body = s.wiring === 'series'
    ? wires('M14 70 H24 M68 70 H92 M136 70 H160 M204 70 H216') + box(24, 70, 'R1') + box(92, 70, 'R2') + box(160, 70, 'R3') + end(14, 70) + end(216, 70)
    : wires('M14 70 H34 M78 70 H110 V44 H130 M110 70 V96 H130 M174 44 H194 V96 H174 M194 70 H216') + box(34, 70, 'R1') + box(130, 44, 'R2') + box(130, 96, 'R3') + end(14, 70) + end(216, 70);
  return `<svg viewBox="0 0 230 140" aria-hidden="true">${body}</svg>`;
}

    }, 'Measure');
    root.append(h('div', { class: 'stack resm' }, h('div', { class: 'res-row' }, s.r.map(resistor)),
      h('div', { class: 'res-dial' }, digits, h('span', { class: 'ohm' }, 'Ω')), measure));
  },
  mountBack(root, s) {
    root.append(html('div', { class: 'wiring', 'data-kind': s.wiring }, resWiringSVG(s)));
  },
  manual() {
    return `<p>Three resistors, R1 to R3, each with three colour bands read from the left: two digits, then a multiplier. Ignore the silver band at the right end. Black multiplies by 1, brown by 10. The wiring is drawn on the back of the bomb. Work out the total resistance in ohms, have the defuser dial it in on the three wheels (hundreds, tens, ones) and press Measure. A wrong total is a strike.</p>
      <table class="tbl"><tr><th>Colour</th><th>Digit</th><th>As multiplier</th></tr>${BAND_COLORS.map((c, k) => `<tr><td>${c}</td><td>${k}</td><td>${k === 0 ? '×1' : k === 1 ? '×10' : ''}</td></tr>`).join('')}</table>
      <ol>
        <li>All three in a row (in series): add them up. R1 + R2 + R3.</li>
        <li>R1, then R2 and R3 side by side (in parallel): R2 and R3 are always equal, and together they count half of one. R1 + R2 ÷ 2.</li>
      </ol>
      <p>Example: red, red, brown is 22 × 10 = 220 ohms.</p>`;
  },
  manualBack() {
    return '<p>The rear plate is the wiring diagram: either R1, R2 and R3 in one row, or R1 followed by R2 and R3 side by side.</p>';
  }
});

/* ---------------------------------------------------------------------
   MODULE: Signal
   An oscilloscope trace and three knobs to match it.
   --------------------------------------------------------------------- */
const SIGNAL_WAVES = ['sine', 'square', 'saw', 'triangle'];
const SIGNAL_AMP = { sine: 3, square: 5, saw: 2, triangle: 4 };
const SIGNAL_PHASE = [[0, 90], [180, 270]];   // [serial last digit odd][has a coin cell]
const signalWant = (s, b) => ({
  freq: Math.min(5, s.peaks + b.indicators.filter(i => i.lit).length),
  amp: SIGNAL_AMP[s.wave],
  phase: SIGNAL_PHASE[b.serialOdd ? 1 : 0][b.coins.length ? 1 : 0]
});
function wavePath(wave, peaks, w = 200, hgt = 70) {
  const n = 200, mid = hgt / 2, amp = hgt * .38, pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n * peaks * .999, f = t - Math.floor(t);   // stop just short of the next cycle: no extra peak at the right edge
    const y = wave === 'sine' ? Math.sin(t * 2 * Math.PI)
      : wave === 'square' ? (f < .5 ? 1 : -1)
      : wave === 'saw' ? 1 - 2 * f
      : (f < .25 ? 4 * f : f < .75 ? 2 - 4 * f : 4 * f - 4);
    pts.push(`${(i / n * w).toFixed(1)},${(mid - y * amp).toFixed(1)}`);
  }
  return `M${pts.join(' L')}`;
}

Modules.register({
  id: 'signal',
  title: 'Signal',
  difficulty: 'hard',
  description: 'An oscilloscope shows a waveform. Name its shape and count its peaks; the manual turns that and a few facts about the bomb into three knob settings to lock in.',
  create(bomb, r) {
    return { wave: r.pick(SIGNAL_WAVES), peaks: 1 + r.int(4), start: [1 + r.int(5), 1 + r.int(5), r.int(4) * 90] };
  },
  mount(root, s, ctl) {
    const vals = { freq: s.start[0], amp: s.start[1], phase: s.start[2] };
    const next = { freq: v => v % 5 + 1, amp: v => v % 5 + 1, phase: v => (v + 90) % 360 };
    // a knurled aluminium knob on a dark skirt, its pointer turning over a ring of tick marks
    const angle = (k, v) => k === 'phase' ? v * .75 - 112.5 : (v - 3) * 56;
    const steps = { freq: [1, 2, 3, 4, 5], amp: [1, 2, 3, 4, 5], phase: [0, 90, 180, 270] };
    const knob = (k, label) => {
      const out = h('b', {}, String(vals[k]));
      const top = h('i', { class: 'sk-top', style: `--ang:${angle(k, vals[k])}deg` });
      const body = h('div', { class: 'sk-body' },
        steps[k].map(v => h('i', { class: 'sk-tick', style: `--a:${angle(k, v)}deg` })),
        cylZ(16, 3, 28, { color: '#2b3438' }), cylZ(13, 11, 32, { z: 3, color: '#d3dce1', knurl: true }), h('div', { class: 'sk-cap' }, top));
      const well = h('div', { class: 'sk-well' }, body);
      const paint = () => { out.textContent = String(vals[k]); top.style.setProperty('--ang', angle(k, vals[k]) + 'deg'); };
      const el = activate(h('div', { class: 'sknob k-' + k }, h('small', {}, label), well, out), () => {
        if (ctl.isSolved()) return;
        vals[k] = next[k](vals[k]); paint(); ctl.sfx.click();
      }, `${label}: click to step it, or drag it round`);
      const span = angle(k, steps[k][1]) - angle(k, steps[k][0]);
      dragTurn(el, { center: well, detent: span,
        show: d => { const a = Math.max(angle(k, steps[k][0]), Math.min(angle(k, steps[k][steps[k].length - 1]), angle(k, vals[k]) + d)); top.style.setProperty('--ang', a + 'deg'); },
        commit: n => {
          if (ctl.isSolved()) return paint();
          const i = Math.max(0, Math.min(steps[k].length - 1, steps[k].indexOf(vals[k]) + n));
          if (steps[k][i] !== vals[k]) { vals[k] = steps[k][i]; ctl.sfx.click(); }
          paint();
        } });
      return el;
    };
    const scope = html('div', { class: 'scope' }, `<svg viewBox="0 0 200 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 35 H200 M50 0 V70 M100 0 V70 M150 0 V70" class="grid"/><path d="${wavePath(s.wave, s.peaks)}" class="trace" pathLength="1"/></svg>`);
    const lock = activate(h('div', { class: 'go' }, button3d('LOCK', '', 9)), () => {
      if (ctl.isSolved()) return;
      const w = signalWant(s, ctl.bomb);
      w.freq === vals.freq && w.amp === vals.amp && w.phase === vals.phase ? ctl.solve() : ctl.strike(`Locked FREQ ${vals.freq}, AMP ${vals.amp}, PHASE ${vals.phase}.`);
    }, 'Lock');
    root.append(h('div', { class: 'stack sig' }, scope, h('div', { class: 'sknobs' }, knob('freq', 'FREQ'), knob('amp', 'AMP'), knob('phase', 'PHASE')), lock));
    // the trace draws itself in, redraws when a knob moves, and now and then the signal glitches for a moment
    const redraw = () => { scope.classList.remove('redraw'); void scope.offsetWidth; scope.classList.add('redraw'); };
    root.addEventListener('click', e => { if (e.target.closest('.sknob')) redraw(); });
    root.addEventListener('pointerup', e => { if (e.target.closest('.sknob')) redraw(); });
    redraw();
    let glitchTimer = 0;
    const glitch = () => { scope.classList.remove('glitch'); void scope.offsetWidth; scope.classList.add('glitch'); glitchTimer = setTimeout(glitch, 6000 + Math.random() * 4000); };
    glitchTimer = setTimeout(glitch, 3000 + Math.random() * 3000);
    return () => clearTimeout(glitchTimer);
  },
  manual() {
    return `<p>An oscilloscope shows one of four waveforms, repeated one to four times. Ask the defuser for its shape and how many peaks (highest points) it has, then work out the three knob settings below. Each click on a knob steps it; Lock checks all three. Any wrong setting is a strike.</p>
      <table class="tbl"><tr><th>Shape</th><th>Looks like</th><th>AMP</th></tr>
        <tr><td>sine</td><td>smooth waves</td><td>${SIGNAL_AMP.sine}</td></tr>
        <tr><td>square</td><td>flat tops and bottoms with straight jumps</td><td>${SIGNAL_AMP.square}</td></tr>
        <tr><td>saw</td><td>falls in a straight line, then jumps back up</td><td>${SIGNAL_AMP.saw}</td></tr>
        <tr><td>triangle</td><td>straight lines up and down to sharp points</td><td>${SIGNAL_AMP.triangle}</td></tr></table>
      <ol>
        <li>FREQ: the number of peaks plus the number of lit indicators. If that is above 5, use 5.</li>
        <li>AMP: from the table above.</li>

        <tr><td>even</td><td>0</td><td>90</td></tr><tr><td>odd</td><td>180</td><td>270</td></tr></table>`;
  }
});

/* =====================================================================
   3. BOMB GENERATION
   ===================================================================== */
const INDICATOR_LABELS = ['CAR', 'FRK', 'SND', 'CLR', 'IND', 'SIG', 'NSA', 'TRN'];

const COIN_MODELS = [
  { model: 'CR2032', volts: 3, d: 72, t: 11.5 },
  { model: 'CR2025', volts: 3, d: 72, t: 9 },
  { model: 'CR2016', volts: 3, d: 72, t: 5.8 },
  { model: 'LR44', volts: 1.5, d: 44, t: 19.5 }
];
const ENC_CAPS = ['red', 'blue', 'yellow', 'white'];
const makeEncoders = (r, n) => Array.from({ length: n }, (_, i) => ({ label: 'ABCD'[i], cap: ENC_CAPS[i], value: r.int(10) }));
const makeLever = r => ({ up: r() < .5 });

function makeBomb(r, totalMs) {
  const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  const serial = r.pick(L) + r.int(10) + r.pick(L) + r.pick(L) + r.int(10) + r.int(10);
  const indicators = r.shuffle(INDICATOR_LABELS).slice(0, r.int(4)).map(label => ({ label, lit: r() < .5 }));
  const coins = Array.from({ length: [0, 0, 1, 1, 1, 2][r.int(6)] }, () => ({ ...r.pick(COIN_MODELS) }));
  const bomb = {
    serial,
    serialOdd: Number(serial.slice(-1)) % 2 === 1,
    serialVowel: /[AEIOU]/.test(serial),
    batteries: r.int(5),
    indicators,
    coins,
    coinVolts: coins.reduce((a, c) => a + c.volts, 0),
    encoders: makeEncoders(r, [0, 0, 1, 2, 3, 3][r.int(6)]),     // optional rotary encoders, readings 0 to 9
    lever: r() < .25 ? makeLever(r) : null,                      // junction-box lever: a decoy unless Breaker is on the bomb
    hasLit: l => indicators.some(i => i.label === l && i.lit),
    strikes: 0, total: totalMs, left: totalMs
  };
  bomb.encSum = () => bomb.encoders.reduce((a, e) => a + e.value, 0);   // read live: encoders can be turned
  bomb.leverUp = () => !!(bomb.lever && bomb.lever.up);                 // read live: the lever can be moved
  return bomb;
}

// Modules that need parts get them fitted if the bomb doesn't have them yet.
function ensureNeeds(bomb, defs, r) {
  const need = k => defs.some(d => d.needs && d.needs.includes(k));
  if (need('lever') && !bomb.lever) bomb.lever = makeLever(r);
  if (need('encoders') && bomb.encoders.length < 3) {
    const have = bomb.encoders.length;
    bomb.encoders.push(...makeEncoders(r, 3).slice(have));
  }
}

// Deals `count` modules at random, weighted by how close each module's difficulty is to the chosen one: the same 3,
// one step away 1, two steps away 0.3. Nothing is excluded. Each module is dealt once before any repeats; `max` caps repeats.
// `config` is settings.modules: switched-off modules are left out.
function pickModules(r, count, difficulty = 'medium', config = {}) {
  const weight = d => [3, 1, .3][Math.abs(DIFFICULTIES.indexOf(d.difficulty) - DIFFICULTIES.indexOf(difficulty))];
  const draw = pool => {
    let x = r() * pool.reduce((a, d) => a + weight(d), 0);
    return pool.find(d => (x -= weight(d)) < 0) || pool[pool.length - 1];
  };
  const pool = Modules.list.filter(d => !(config[d.id] && config[d.id].off));
  const fresh = pool.slice(), used = {}, out = [];
  // Needy modules: none on a 2-module bomb, one up to 5 modules or on Easy, two on 6; each one at most once.
  const maxNeedy = count <= 2 ? 0 : (difficulty === 'easy' || count < 6) ? 1 : 2;
  let needy = 0, guard = 0;
  const ok = d => !(d.max && (used[d.id] || 0) >= d.max) && !(d.needy && (used[d.id] || needy >= maxNeedy));
  while (out.length < count && guard++ < 200) {
    const src = fresh.some(ok) ? fresh.filter(ok) : pool.filter(ok);
    if (!src.length) break;
    const cand = draw(src);
    if (fresh.includes(cand)) fresh.splice(fresh.indexOf(cand), 1);
    used[cand.id] = (used[cand.id] || 0) + 1;
    if (cand.needy) needy++;
    out.push(cand);
  }
  return out;
}

// Whether a dealt module gets its rear plate: required plates always; optional ones per the player's setting.
function rearFor(r, def, config = {}) {
  if (!def.mountBack) return false;
  if (!def.rearOptional) return true;
  const mode = (config[def.id] && config[def.id].rear) || 'always';
  return mode === 'always' || (mode === 'sometimes' && r() < .5);
}

/* =====================================================================
   3b. LOGO
   A countdown ring (the last stretch already burnt) around a slashed zero,
   inside a broken hexagon frame. `burn` is the burnt share of the ring.
   ===================================================================== */
function logoMark(size = 96, o = {}) {
  const burn = o.burn ?? .25, N = 60, lit = Math.round(N * (1 - burn));
  let ticks = '';
  for (let i = 0; i < N; i++) {
    const a = i * 6 * Math.PI / 180, sn = Math.sin(a), cs = -Math.cos(a);
    const major = i % 5 === 0, r1 = major ? 32 : 37, r2 = 45, on = i < lit;
    ticks += `<line x1="${(60 + r1 * sn).toFixed(2)}" y1="${(60 + r1 * cs).toFixed(2)}" x2="${(60 + r2 * sn).toFixed(2)}" y2="${(60 + r2 * cs).toFixed(2)}" ` +
      `stroke="${on ? '#43dfff' : '#ff3b5c'}" stroke-opacity="${on ? 1 : .8}" stroke-width="${major ? 2.8 : 1.8}" stroke-linecap="round"` +
      (o.sweep ? ` class="tk" style="animation-delay:${i * 16}ms"` : '') + '/>';
  }
  return `<svg class="logo-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="${size}" height="${size}" fill="none" role="img" aria-label="Zero Hour logo">` +
    `<path d="M60 3 L109 31.5 V88.5 L60 117 L11 88.5 V31.5 Z" stroke="#43dfff" stroke-opacity=".6" stroke-width="1.6" stroke-dasharray="66 9"/>` +
    ticks +
    `<path d="M53.500 6 H66.500 L60 17 Z" fill="#ffb224"/>` +
    `<ellipse cx="60" cy="61" rx="12" ry="19" stroke="#d6eef3" stroke-width="5"/>` +
    `<path d="M50.500 74 L69.500 48" stroke="#ffb224" stroke-width="3.6" stroke-linecap="round"/></svg>`;
}

function barcode(text) {
  let x = 0, bars = '';
  for (const ch of text) {
    const c = ch.charCodeAt(0);
    for (let b = 0; b < 6; b++) { const w = (c >> b) & 1 ? 2.4 : 1.2; bars += `<rect x="${x.toFixed(1)}" y="0" width="${w}" height="14"/>`; x += w + 1.3; }
  }
  return `<svg class="bar-code" viewBox="0 0 ${x.toFixed(1)} 14" preserveAspectRatio="none" fill="currentColor" aria-hidden="true">${bars}</svg>`;
}

/* =====================================================================
   4. THE 3D CASE
   Faces: front (clock + modules), back (modules), left, right, top, bottom
   (serial number, battery holders and indicators in random spots).
   ===================================================================== */
function layoutFor(vw) {
  const cols = vw < 820 ? 2 : 3, rows = cols === 3 ? 2 : 3;
  const SW = 244, SH = 272, GAP = 14, P = 22, TB = 136, D = 210;
  const W = P * 2 + cols * SW + (cols - 1) * GAP + 10;
  const H = P * 2 + TB + GAP + rows * SH + (rows - 1) * GAP + 10;
  return { cols, rows, SW, SH, GAP, P, TB, D, W, H, wr: Math.floor((H - 42) / 170), wc: Math.floor((W - 42) / 160) };
}

// ---- coin cells: sizes follow the real cells (CR2032 20 x 3.2 mm, LR44 11.6 x 5.4 mm) ----
function coinCellEl(c) {
  const R = c.d / 2, N = 30, side = 2 * R * Math.sin(Math.PI / N) * 1.06, apo = R * Math.cos(Math.PI / N);
  const coin = h('div', { class: 'coin' + (c.d < 60 ? ' sm' : ''), style: `width:${c.d}px;height:${c.d}px;left:50%;top:50%;margin:${-R}px 0 0 ${-R}px` });
  for (let k = 0; k < N; k++) {                       // the steel can wall, as a many-sided ring
    const phi = k * 360 / N, rad = phi * Math.PI / 180;
    const b = Math.max(0, -.55 * Math.sin(rad) + .8 * Math.cos(rad));
    coin.append(h('i', {
      class: 'cf',
      style: `width:${side.toFixed(2)}px;height:${c.t}px;left:calc(50% - ${(side / 2).toFixed(2)}px);top:calc(50% - ${c.t / 2}px);` +
        `transform:translateZ(${c.t / 2}px) rotateZ(${phi.toFixed(1)}deg) translateY(${(-apo).toFixed(2)}px) rotateX(90deg);--b:${b.toFixed(3)}`
    }));
  }
  coin.append(
    h('i', { class: 'lip', style: `transform:translateZ(${(c.t - .5).toFixed(2)}px)` }),
    h('i', { class: 'cap', style: `transform:translateZ(${c.t.toFixed(2)}px)` }, h('b', {}, '+'), h('span', {}, c.model), h('span', {}, c.volts + 'V')));
  return coin;
}

// A coin cell in a black holder with a steel retaining clip over the rim and a contact tab underneath.
function coinHolder(c) {
  const R = c.d / 2, W = c.d + 44, span = R * 1.05, step = c.t + 2;
  const at = (x, y, w, hgt, extra = '') => `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${hgt}px;${extra}`;
  const parts = [
    h('i', { class: 'seat', style: at(W / 2 - R - 4, W / 2 - R - 4, c.d + 8, c.d + 8) }),
    coinCellEl(c),
    h('div', { style: at(W / 2 - span / 2 - 3, W / 2 - R - 14, 7, 7) }, cuboid(step, '', 'fill mclip')),
    h('div', { style: at(W / 2 + span / 2 - 4, W / 2 - R - 14, 7, 7) }, cuboid(step, '', 'fill mclip')),
    h('div', { style: at(W / 2 - span / 2 - 3, W / 2 - R - 8, span + 7, 11, `transform:translateZ(${step}px)`) }, cuboid(2, '', 'fill mclip')),
    h('i', { class: 'tab', style: `left:${W / 2 - 13}px;bottom:7px;width:26px` }),
    h('i', { class: 'plus', style: `left:${W / 2 + span / 2 + 12}px;top:${W / 2 - R - 20}px;font-style:normal` }, '+')
  ];
  const e = cuboid(5, h('div', { style: `position:relative;width:${W}px;height:${W}px` }, parts), 'w-coin');
  e.setAttribute('aria-label', `coin cell ${c.model}, ${c.volts} volts`);
  return e;
}

// A solid upright cylinder (axis along z) built from facets and closed by a top disc, drawn around a zero-size anchor.
function cylZ(R, hgt, n, { z = 0, color = '#cfd8dd', knurl = false, hex = false } = {}) {
  const side = 2 * R * Math.sin(Math.PI / n) * 1.05, apo = R * Math.cos(Math.PI / n);
  const e = h('div', { class: 'cz', style: `transform:translateZ(${z + .03}px);--fc:${color}` });   // a hair above z: stacked parts never share a plane
  for (let k = 0; k < n; k++) {
    const phi = k * 360 / n, rad = phi * Math.PI / 180;
    const lit = Math.max(0, -.55 * Math.sin(rad) + .8 * Math.cos(rad));
    const b = Math.min(1, .5 * lit + (knurl ? (k % 2 ? .3 : .02) : .22) + .1);     // knurling: alternate bright and dark ridges
    e.append(h('i', {
      class: 'fz',
      style: `width:${side.toFixed(2)}px;height:${hgt}px;left:${(-side / 2).toFixed(2)}px;top:${-hgt / 2}px;` +
        `transform:translateZ(${hgt / 2}px) rotateZ(${phi}deg) translateY(${(-apo).toFixed(2)}px) rotateX(90deg);--b:${b.toFixed(3)}`
    }));
  }
  e.append(h('i', { class: 'cz-top' + (hex ? ' hex' : ''), style: `width:${2 * R}px;height:${2 * R}px;left:${-R}px;top:${-R}px;transform:translateZ(${hgt}px)` }));
  return e;
}

// A round ring (a torus) lying in the plane, built from short tube segments: radius R, tube radius r, centred on its anchor.
function torus(R, r, segs, color, n = 12) {
  const e = h('div', { class: 'torus', style: `--c:${color}` }), len = 2 * Math.PI * R / segs * 1.08;
  for (let k = 0; k < segs; k++) {
    const t = tube(r, n, 0);
    t.style.cssText += `;position:absolute;left:${(-len / 2).toFixed(2)}px;top:${-r}px;width:${len.toFixed(2)}px`;
    e.append(h('div', { class: 'torus-seg', style: `transform:rotateZ(${(k * 360 / segs).toFixed(2)}deg) translateY(${-R}px)` }, t));
  }
  return e;
}

// ---- rotary encoder: knurled aluminium knob on a numbered dial, ten detents ----
const ENC_HEX = { red: '#e5412d', blue: '#2f6bff', yellow: '#f2c230', white: '#eef3f5' };
function encoderEl(enc) {
  let ang = enc.value * 36;
  const top = h('div', { class: 'enc-top', style: `--ang:${ang}deg;--cc:${ENC_HEX[enc.cap]}` });
  const hit = h('div', { class: 'enc-hit', role: 'button', tabindex: '0' });
  const label = () => hit.setAttribute('aria-label', `rotary encoder ${enc.label}, reading ${enc.value}`);
  const turn = d => {
    enc.value = (enc.value + d + 10) % 10; ang += d * 36;
    top.style.setProperty('--ang', ang + 'deg'); sfx.detent(); label();
  };
  hit.addEventListener('click', e => turn((e.offsetX != null ? e.offsetX : e.clientX - hit.getBoundingClientRect().x) < hit.offsetWidth / 2 ? -1 : 1));
  hit.addEventListener('contextmenu', e => { e.preventDefault(); turn(-1); });
  hit.addEventListener('wheel', e => { e.preventDefault(); e.stopPropagation(); turn(e.deltaY > 0 ? 1 : -1); }, { passive: false });
  hit.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); turn(e.shiftKey ? -1 : 1); } });
  dragTurn(hit, { detent: 36,
    show: d => top.style.setProperty('--ang', ang + d + 'deg'),
    commit: n => { if (n) for (let k = 0; k < Math.abs(n); k++) turn(Math.sign(n)); else top.style.setProperty('--ang', ang + 'deg'); } });
  label();
  const dial = [];
  for (let k = 0; k < 10; k++) dial.push(h('div', { class: 'dg', style: `--a:${k * 36}deg` }, h('span', {}, String(k)), h('i')));
  return cuboid(4, [
    h('div', { class: 'enc-ctr' },
      dial,

  const take = (faces, span = 1) => {                       // claim `span` neighbouring free cells on one of `faces`
    const cand = [];
    faces.forEach(f => free[f].forEach(i => { if (range(span).every(k => free[f].includes(i + k))) cand.push({ face: f, i, span }); }));
    if (!cand.length) return null;

    return at;

    e.preventDefault();
    if (anim) settleHere();
    goal.zoom = clamp(goal.zoom * Math.exp(-e.deltaY * .0012), .6, 2.2);
    lastInput = performance.now();
    wake();
    api && api.onZoom && api.onZoom(goal.zoom);
  }, { passive: false, signal: ac.signal });

  const ro = new ResizeObserver(fit);
  ro.observe(stage);
  fit();

  api = {
    st, onFacing: init.onFacing || null, onTurn: null, onZoom: null,
    zoomTo(z) { anim = null; goal.zoom = z; wake(); },     // follow another view's zoom (module explorer link)
    turnTo(yaw, pitch) {                                   // follow another view (module viewer link)
      anim = null; vel.yaw = vel.pitch = 0;
      goal.yaw = yaw + 360 * Math.round((st.yaw - yaw) / 360); goal.pitch = pitch;
      wake();
    },
    refresh() { facing = ''; shade(); },
    animateTo,
    goTo(face) {
      const [yb, pb, zb] = VIEWS[face];
      animateTo({ yaw: yb + 360 * Math.round((st.yaw - yb) / 360), pitch: pb, zoom: zb }, 750);
    },
    home() { animateTo({ yaw: HOME.yaw + 360 * Math.round((st.yaw - HOME.yaw) / 360), pitch: HOME.pitch, zoom: 1 }, 750); },
    nudge(dyaw, dpitch) { const b = anim ? anim.to : goal; animateTo({ yaw: b.yaw + dyaw, pitch: clamp(b.pitch + dpitch, -90, 90), zoom: b.zoom }, 200); },
    zoomBy(d) { const b = anim ? anim.to : goal; animateTo({ yaw: b.yaw, pitch: b.pitch, zoom: clamp(b.zoom + d, .6, 2.2) }, 200); },
    getView: () => ({ yaw: st.yaw, pitch: st.pitch, zoom: st.zoom }),
    blast() { bomb3d.classList.add('blast'); animateTo({ zoom: st.zoom * 1.6 }, 520); },
    destroy() { ac.abort(); cancelAnimationFrame(raf); raf = 0; ro.disconnect(); }
  };
  return api;
}

function schemEncoder() {
  const cx = 150, cy = 122, at = (r, k) => { const a = k * 36 * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };
  let dial = '';
  for (let k = 0; k < 10; k++) {
    const [x1, y1] = at(60, k), [x2, y2] = at(66, k), [tx, ty] = at(80, k);
    dial += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>` + sMid(tx.toFixed(1), (ty + 4).toFixed(1), k, 'font-size="12"');
  }
  const [px, py] = at(36, 3);
  return schematic(300, 260, 'Rotary encoder A reading 3',
    `<rect x="40" y="10" width="220" height="240" rx="4"/><circle cx="56" cy="27" r="5" fill="#e5412d" stroke="none"/>` + sT(66, 32, 'A', 'font-size="14" font-weight="600"') +
    dial + `<circle cx="${cx}" cy="${cy}" r="42"/><circle cx="${cx}" cy="${cy}" r="37" stroke-dasharray="2 3" stroke-opacity=".6"/>` +
    `<line x1="${cx}" y1="${cy}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="#e5412d" stroke-width="3.5"/><circle cx="${cx}" cy="${cy}" r="5" fill="#e5412d" stroke="none"/>` +
    `<line x1="${cx}" y1="${cy - 50}" x2="${cx}" y2="${cy + 50}" stroke-dasharray="4 3" stroke-opacity=".5"/>` +
    sMid(105, 236, '◀ left half: −1', 'font-size="10"') + sMid(195, 236, 'right half: +1 ▶', 'font-size="10"'),
    'Rotary encoder A, reading 3: the red pointer aims at the reading. Clicking the right half of the knob raises the reading by one, the left half lowers it.');
}

function schemKnife() {
  const sw = (x0, up) => {
    const jaws = y => `<rect x="${x0 + 22}" y="${y}" width="16" height="26" rx="1"/><rect x="${x0 + 62}" y="${y}" width="16" height="26" rx="1"/>`;
    const tip = up ? 66 : 234, bar = up ? 36 : 254, grip = up ? 4 : 264;
    const lamp = (cy, color, on) => `<circle cx="${x0 - 16}" cy="${cy}" r="7" ${on ? `fill="${color}" stroke="${color}"` : 'stroke-opacity=".5"'}/>`;
    return `<rect x="${x0}" y="50" width="100" height="200" rx="3"/>` + jaws(62) + jaws(212) +
      `<rect x="${x0 + 14}" y="140" width="72" height="20" rx="2"/>` +
      `<rect x="${x0 + 26}" y="${Math.min(tip, 150)}" width="8" height="${Math.abs(150 - tip)}" fill="currentColor" fill-opacity=".15"/>` +
      `<rect x="${x0 + 66}" y="${Math.min(tip, 150)}" width="8" height="${Math.abs(150 - tip)}" fill="currentColor" fill-opacity=".15"/>` +
      `<rect x="${x0 + 20}" y="${bar}" width="60" height="10" rx="2"/>` +

  return schematic(360, 326, 'Knife switch ON and OFF', sw(60, true) + sw(230, false),
    'The knife switch. ON: thrown up, blades in the top contacts, handle above the base, green lamp lit. OFF: thrown a half turn down, blades in the bottom contacts, handle below the base, red lamp lit.');
}

function schemModule() {
  const hex = (cx, cy, fill) => `<path d="M${cx} ${cy - 6} L${cx + 5.2} ${cy - 3} V${cy + 3} L${cx} ${cy + 6} L${cx - 5.2} ${cy + 3} V${cy - 3} Z" fill="${fill}" stroke="none"/>`;

    sT(x + 28, 43, 'Wires', 'font-size="13" font-weight="600"') + sT(x + 180, 42, rear ? 'rear' : 'armed', `text-anchor="end" font-size="10"${rear ? '' : ' fill="#e0951a"'}`) +

    sMid(395, 120, 'a clue from elsewhere,', 'font-size="10"') + sMid(395, 134, 'or a working part of the puzzle', 'font-size="10"') +
    sMid(125, 242, 'FRONT: the module', 'font-size="11" font-weight="600"') + sMid(395, 242, 'BACK: its rear plate', 'font-size="11" font-weight="600"'),
    'A module on the front and its rear plate on the back. Some modules have no rear plate; then the panel behind them is blank.');

function manualHTML() {
  return `<div class="manual">
    <div class="mh">${logoMark(46, { burn: .25 })}<h1>Defusal manual</h1></div>
    <p>The defuser describes what they see. You find the matching rule and say what to do. Don't look at the bomb.</p>
    <p>New to the bomb? Bomb basics, at the end, shows how the case is built and what its parts look like.</p>
    <div class="mact no-print"><button class="mbtn" data-act="pdf-open">Open PDF</button><button class="mbtn" data-act="pdf-download">Download PDF</button></div>
    <nav>${Modules.list.map(m => `<a href="#man-${m.id}">${m.title}</a>`).join('')}<a href="#man-basics">Bomb basics</a></nav>
    ${Modules.list.map(m => `<section id="man-${m.id}"><h2>${m.title}</h2>${m.manual()}${m.manualBack ? `<h3>${m.rearOptional ? 'Rear plate (not on every bomb)' : 'Rear plate'}</h3>${m.manualBack()}` : ''}</section>`).join('')}
    <section id="man-basics" class="appendix"><h2>Bomb basics</h2>
      <h3>The case</h3>
      ${schemCase()}
      <ul>
        <li><b>Rotate the case.</b> Modules sit on the front. Everything else is on the other sides, and the positions change on every bomb. The left, right and top panels can carry any component. The bottom only ever carries plates: the serial number plate, and sometimes plain name plates (model or rating) that mean nothing. If a rule needs a component, ask the defuser to turn the bomb and look.</li>
        <li><b>Rear plates.</b> Some modules have a steel rear plate on the back of the bomb, directly behind the module. Seen from behind, left and right swap: a module in the left column on the front has its plate in the right column on the back. Some rear plates repeat a clue from elsewhere on the bomb; others are part of the puzzle, and their module cannot be solved without them. A module without a rear plate has a blank panel behind it. Each module's section says what its plate shows.</li>
      </ul>
      <h3>Parts on the side panels</h3>
      ${schemParts()}
      <ul>
        <li><b>Serial number.</b> A white steel plate with a barcode. Rules refer to the last digit (odd or even) and to whether the serial contains a vowel: A, E, I, O or U.</li>
        <li><b>Batteries.</b> Count the individual cells in all battery holders (a single large D cell, or a pair of AA cells). There may be none at all. Coin cells are not batteries.</li>
        <li><b>Coin cells.</b> Flat silver discs in small black holders with a steel clip. The model is stamped on top: CR2032, CR2025 and CR2016 are 3 volt lithium cells (in that order they get thinner), and LR44 is a small, thick 1.5 volt alkaline cell. A bomb can have none, one or two.</li>
        <li><b>Indicators.</b> Small labeled plates with a lens. A lit indicator has a glowing lens and bright text. An unlit one is dark.</li>
      </ul>
      <h3>Rotary encoders</h3>
      ${schemEncoder()}
      <ul>
        <li><b>Rotary encoders.</b> Some bombs have up to three: a knurled aluminium knob on a dial numbered 0 to 9, with a letter (A, B, C) and a colored cap. The reading is the digit the red pointer line aims at, and the digits are printed around the knob. Click the right half of a knob to turn it one step clockwise (the reading goes up, 9 wraps to 0) or the left half to turn it back one step. The mouse wheel and right-click also turn it. Rules read the encoders as they are at the moment you act, so turning one changes the answer. "The encoders add up" means the sum of all readings, and a bomb without encoders adds up to 0. A bomb can carry encoders that no rule uses.</li>
      </ul>
      <h3>Knife switch</h3>
      ${schemKnife()}
      <ul>
        <li><b>Knife switch.</b> Some bombs have a double-throw knife switch on the left or right panel: a dark graphite base with two silver blades on a centre hinge, silver contacts and terminal blocks with socket-head screws at the top and the bottom, and a ribbed black handle with an orange collar. Thrown up, with the blades in the top contacts and the handle above the base, it is ON. Thrown a full half turn down, with the blades in the bottom contacts and the handle below the base, it is OFF. A green lamp at the top and a red lamp at the bottom show which. Drag the handle up or down, or click it to throw it. Only the Breaker module reads it; on any other bomb it is a decoy.</li>
      </ul>
      <h3>Modules and strikes</h3>
      ${schemModule()}
      <ul>
        <li><b>Modules.</b> Each module is independent. Defuse them all before the clock reaches zero. A module's status light turns green when it is safe.</li>
        <li><b>Needy modules.</b> Some modules are never defused. They sleep, then wake with a small countdown in their corner and need attention before it runs out, again and again. Their plate says <em>needy</em> instead of armed. The bomb is defused once every other module is safe.</li>
        <li><b>Strikes.</b> Every mistake is a strike, and each strike makes the clock run 25% faster. The third strike detonates the bomb.</li>
      </ul>
    </section>
  </div>`;
}

const app = $('#app');
const opts = settings;   // time and module count are remembered with the other settings
let G = null, demo = null;
const drawer = h('aside', { class: 'drawer', 'aria-label': 'Defusal manual' });

/* ---- PDF of the manual ----
   The PDF is typeset from manualHTML(), the same source as the on-screen manual (see build-manual-pdf.mjs),
   and stored inside this file. It is only offered while it still matches the manual's fingerprint; if the
   manual has changed since it was built, a fresh one is printed straight from the live manual instead. */
function manualFingerprint() {
  const t = manualHTML();
  let x = 2166136261;
  for (let i = 0; i < t.length; i++) { x ^= t.charCodeAt(i); x = Math.imul(x, 16777619); }
  return (x >>> 0).toString(16);
}
let pdfUrl = null;
function manualPdfUrl() {
  if (pdfUrl) return pdfUrl;
  if (!pdfNode || !pdfNode.textContent.trim() || pdfNode.dataset.hash !== manualFingerprint()) return null;   // missing, or out of date
  const bin = atob(pdfNode.textContent.trim()), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return pdfUrl = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
}
function manualAction(act, win = window) {
  if (act !== 'pdf-open' && act !== 'pdf-download') return;
  const url = manualPdfUrl();
  if (!url) { popOut(true); return; }                         // no matching PDF: print a fresh one (choose "Save as PDF")
  if (act === 'pdf-open') win.open(url, '_blank');
  else { const a = win.document.createElement('a'); a.href = url; a.download = 'zero-hour-manual.pdf'; win.document.body.append(a); a.click(); a.remove(); }
}
const manualClick = e => { const b = e.target.closest && e.target.closest('[data-act]'); if (b) manualAction(b.dataset.act, e.view || window); };

function buildDrawer() {
  const pop = h('button', { onclick: () => popOut() }, 'Pop out');
  const close = h('button', { onclick: () => drawer.classList.remove('open') }, 'Close');
  const body = h('div'); body.innerHTML = manualHTML();
  drawer.replaceChildren(h('div', { class: 'dhead' }, h('b', {}, 'MANUAL'), pop, close), body);
  drawer.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#man-"]');
    if (!a) return;
    e.preventDefault();
    const t = drawer.querySelector(a.getAttribute('href'));
    if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  drawer.addEventListener('click', manualClick);
  document.body.append(drawer);
}
function popOut(print = false) {
  const w = window.open('', 'zero-hour-manual', 'width=640,height=880');
  if (!w) { alert('The browser blocked the pop-up. Use the side panel, or open this page again with ?manual on the end of the address.'); return; }
  w.document.write('<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manual</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">' +
    '<style>' + $('#css').textContent + '</style><body class="manual-page">' + manualHTML());
  w.document.close();
  w.document.addEventListener('click', manualClick);
  drawer.classList.remove('open');
  if (print) setTimeout(() => { w.focus(); w.print(); }, 500);
}

function seg(options, value, onPick) {
  const wrap = h('div', { class: 'seg-ctl', role: 'group' });
  options.forEach(([val, label]) => {
    const b = h('button', { type: 'button', 'aria-pressed': String(val === value) }, label);
    b.addEventListener('click', () => {
      [...wrap.children].forEach(c => c.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true'); onPick(val);
    });
    wrap.append(b);
  });
  return wrap;
}

/* ---- sound switches (top bar and settings stay in step) ---- */
function setSound(which, on) {
  if (which === 'music') { settings.musicOn = on; sfx.setMusicMuted(!on); }
  else { settings.fxOn = on; sfx.setMuted(!on); }
  save(); refreshSoundButtons();
}
function refreshSoundButtons() {
  document.querySelectorAll('[data-snd]').forEach(b => {
    const m = b.dataset.snd === 'music';
    b.textContent = (m ? 'Music ' : 'Effects ') + ((m ? settings.musicOn : settings.fxOn) ? 'on' : 'off');
  });
}

/* ---- confirmation dialog (Escape, a click outside, or the first button all mean "no") ---- */
function confirmDialog({ title, text, yes = 'OK', no = 'Cancel', danger = false }) {
  return new Promise(resolve => {
    const done = v => { confirmDialog.close = null; wrap.remove(); window.removeEventListener('keydown', onKey, true); resolve(v); };
    confirmDialog.close = () => done(false);                // lets the game close the dialog if it ends in the meantime
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); done(false); } };
    const noBtn = h('button', { class: 'tbtn', type: 'button', onclick: () => done(false) }, no);
    const yesBtn = h('button', { class: 'tbtn' + (danger ? ' danger' : ''), type: 'button', onclick: () => done(true) }, yes);
    const wrap = h('div', { class: 'settings confirm', role: 'alertdialog', 'aria-label': title, onclick: e => { if (e.target === wrap) done(false); } },

/* ---- the game ---- */
function endGame() {

  window.removeEventListener('keydown', G.onKey);

  G.mods.forEach(m => { try { m.cleanup && m.cleanup(); } catch (e) { console.error(e); } });
  document.querySelectorAll('.overlay').forEach(o => o.remove());
  G = null;
}

// o.seed replays a seed, o.fresh forces a new random one. Otherwise the seed field on the main screen is used (empty = random).
function play(o = {}) {
  endGame(); destroyDemo(); sfx.init();
  const typed = o.fresh ? null : seedFrom(settings.seed);
  const seed = o.seed || (typed !== null ? { num: typed, label: settings.seed.trim() } : (n => ({ num: n, label: String(n) }))(randomSeed()));
  settings.lastSeed = seed.label; save();
  const r = rng(seed.num);
  const bomb = makeBomb(r, opts.minutes * 60000);
  bomb.difficulty = opts.difficulty;
  const L = layoutFor(window.innerWidth);
  const defs = pickModules(r, Math.min(opts.count, L.cols * L.rows), opts.difficulty, opts.modules);
  const rears = defs.map(d => rearFor(r, d, opts.modules));
  ensureNeeds(bomb, defs, r);
  const plan = planCase(r, bomb, L, defs.length);
  G = { bomb, seed, over: false, mods: [], last: performance.now(), lastSec: -1, raf: 0, L };

  const cards = defs.map((def, k) => {
    const m = { def, solved: false, cleanup: null };
    G.mods.push(m);
    const card = moduleCard(def);
    const rear = rears[k] ? rearCard(def) : null;
    m.el = card.el; m.rearEl = rear && rear.el;
    const mark = cls => { m.el.classList.add(cls); m.rearEl && m.rearEl.classList.add(cls); };
    const unmark = cls => { m.el.classList.remove(cls); m.rearEl && m.rearEl.classList.remove(cls); };
    const ctl = {
      bomb, sfx,
      isSolved: () => m.solved,
      timeText: () => fmt(bomb.left),
      solve() {
        if (m.solved || G.over) return;
        m.solved = true; mark('solved'); sfx.solve();
        if (G.mods.every(x => x.solved || x.def.needy)) defuse();
      },
      strike(why) {
        if (G.over) return;
        mark('err'); setTimeout(() => unmark('err'), 600);
        addStrike(why);
      }
    };
    m.state = def.create(bomb, r);
    const c1 = def.mount(card.body, m.state, ctl) || null;
    const c2 = rear ? (def.mountBack(rear.body, m.state, ctl) || null) : null;
    m.cleanup = () => { c1 && c1(); c2 && c2(); };
    return { front: card.el, rear: rear && rear.el };
  });
  const asm = assembleCase(bomb, L, plan, k => cards[k].front, k => cards[k].rear);

  const stage = h('div', { class: 'stage' }, h('div', { class: 'floor' }), h('div', { class: 'pool' }), asm.bomb3d);

  const hudT = h('div', { class: 't' });
  const hudPips = [0, 1, 2].map(() => h('i'));
  const hud = h('div', { class: 'hud', role: 'timer', 'aria-label': 'Time and strikes' }, hudT, h('div', { class: 's' }, hudPips));
  const fxBtn = h('button', { class: 'tbtn', 'data-snd': 'fx', onclick: () => setSound('fx', !settings.fxOn) });
  const musicBtn = h('button', { class: 'tbtn', 'data-snd': 'music', onclick: () => setSound('music', !settings.musicOn) });
  const seedBtn = h('button', { class: 'tbtn seedchip', title: 'Click to copy the seed', onclick: () => {
    try { navigator.clipboard.writeText(seed.label).catch(() => {}); } catch (e) { /* clipboard may be blocked */ }
    seedBtn.textContent = 'Seed copied'; setTimeout(() => { seedBtn.textContent = 'Seed ' + seed.label; }, 1000);
  } }, 'Seed ' + seed.label);
  const top = h('div', { class: 'top' },
    h('div', { class: 'brand' }, html('span', {}, logoMark(28, { burn: .25 })), 'ZERO HOUR'),
    hud, seedBtn,
    h('button', { class: 'tbtn', onclick: () => drawer.classList.toggle('open') }, 'Manual'),
    h('button', { class: 'tbtn', onclick: openSettings }, 'Settings'),
    musicBtn, fxBtn,
    h('button', { class: 'tbtn', onclick: askAbort }, 'Abort'));

  app.replaceChildren(h('div', { class: 'game' }, top, stage));
  refreshSoundButtons();

  const z0 = settings.startZoom;
  const rig = createRig(stage, asm.bomb3d, asm.faces, L, settings.intro ? { yaw: -80, pitch: -28, zoom: z0 - .23 } : { yaw: -16, pitch: -10, zoom: z0 });
  const FACES = [['front', 'Front'], ['back', 'Back'], ['left', 'Left'], ['right', 'Right'], ['top', 'Top'], ['bottom', 'Bottom']];
  const faceBtns = FACES.map(([f, label]) => h('button', { 'data-face': f, 'aria-pressed': 'false', onclick: () => { rig.goTo(f); sfx.turn(); } }, label));
  stage.append(h('div', { class: 'dock nodrag' },
    h('span', { class: 'hint' }, 'Drag to turn'),
    faceBtns,
    h('i', { class: 'sep' }),
    h('button', { 'aria-label': 'Zoom out', onclick: () => rig.zoomBy(-.15) }, '\u2212'),
    h('button', { 'aria-label': 'Zoom in', onclick: () => rig.zoomBy(.15) }, '+')));
  rig.onFacing = f => faceBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.face === f)));
  rig.refresh();
  if (settings.intro) rig.animateTo({ yaw: -16, pitch: -10, zoom: z0 }, 1500);

  G.onKey = e => {
    if (!G || G.over || $('.settings') || (e.target && e.target.closest && e.target.closest('input,select,textarea'))) return;
    const d = { ArrowLeft: [-15, 0], ArrowRight: [15, 0], ArrowUp: [0, 15], ArrowDown: [0, -15] }[e.key];
    if (d) { e.preventDefault(); rig.nudge(d[0], d[1]); }
  };
  window.addEventListener('keydown', G.onKey);

  G.rig = rig;
  G.refs = { ...asm.refs, stage, hudT, hudPips };
  paint();
  music.start();
  G.raf = requestAnimationFrame(frame);
}

function paint() {
  const { bomb, refs } = G;
  const t = fmt(bomb.left), low = bomb.left < 60000, w = (bomb.left / bomb.total * 100).toFixed(1);
  if (refs.shown !== t) {                                 // write to the page only when a value changed
    refs.shown = t;
    refs.live.textContent = t;
    refs.ghost.textContent = t.replace(/\d/g, '8');
    refs.hudT.textContent = t;
  }
  if (refs.wasLow !== low) {
    refs.wasLow = low;
    refs.clock.classList.toggle('low', low);
    refs.bar.classList.toggle('low-bar', low);
    refs.hudT.classList.toggle('low', low);
  }
  if (refs.barW !== w) { refs.barW = w; refs.bar.firstChild.style.width = w + '%'; }
}

function frame(now) {
  if (!G || G.over) return;
  const dt = Math.max(0, Math.min(now - G.last, 250));   // rAF timestamps are locked to the display refresh
  G.last = now;
  const before = G.bomb.left;
  G.bomb.left -= dt * (1 + 0.25 * G.bomb.strikes);
  if (beepDue(before, G.bomb.left, settings.beep)) sfx.warn();
  if (G.bomb.left <= 0) { G.bomb.left = 0; paint(); explode('The clock ran out.'); return; }
  const sec = Math.ceil(G.bomb.left / 1000);
  if (sec !== G.lastSec) { G.lastSec = sec; sfx.tick(G.bomb.left < 10000 ? 2 : G.bomb.left < 30000 ? 1 : 0); }
  music.update(G.bomb.left, G.bomb.total, G.bomb.strikes);
  paint();
  G.raf = requestAnimationFrame(frame);
}

function addStrike(why) {
  const b = G.bomb;
  b.strikes++;
  [...G.refs.pips, ...G.refs.hudPips].forEach((p, i) => p.classList.toggle('on', (i % 3) < b.strikes));
  if (b.strikes >= 3) { explode('Third strike. ' + why); return; }
  sfx.strike(); music.hit();
  document.body.classList.remove('hit'); void document.body.offsetWidth; document.body.classList.add('hit');
}

function finish(kind, title, text, delay) {
  G.over = true;
  if (confirmDialog.close) confirmDialog.close();         // an open abort dialog makes no sense once the bomb is over
  cancelAnimationFrame(G.raf);
  G.mods.forEach(m => { try { m.cleanup && m.cleanup(); } catch (e) { console.error(e); } });
  const token = G;
  setTimeout(() => {
    if (G !== token) return;
    const again = h('button', { onclick: () => play({ fresh: true }) }, 'Arm another bomb');
    const replay = h('button', { onclick: () => play({ seed: token.seed }) }, 'Replay this seed');
    const back = h('button', { onclick: showStart }, 'Change settings');
    document.body.append(h('div', { class: 'overlay ' + kind, role: 'alert' },
      h('div', {}, html('div', {}, logoMark(120, { burn: kind === 'boom' ? 1 : 0 })), h('h2', {}, title), h('p', {}, text),
        h('p', { class: 'seedline' }, 'Seed ', h('b', {}, token.seed.label)), h('div', { class: 'row' }, again, replay, back))));
    again.focus();
  }, delay);
}
function explode(reason) {
  if (!G || G.over) return;
  music.stop(.04);
  sfx.boom();
  G.refs.stage.classList.add('shake');
  G.rig.blast();
  finish('boom', 'Detonated', reason, 420);
}
function defuse() {
  const b = G.bomb;
  music.stop(1.6);
  sfx.win();
  G.rig.animateTo({ yaw: G.rig.st.yaw + 360, pitch: -10, zoom: 1.06 }, 1800);
  finish('win', 'Defused', `${fmt(b.left)} left on the clock, ${b.strikes} ${b.strikes === 1 ? 'strike' : 'strikes'}.`, 1100);
}

/* =====================================================================
   7. BOOT
   ===================================================================== */
window.__zh = { manualHTML, manualFingerprint };   // used by build-manual-pdf.mjs
// Belt and braces: block selecting and dragging text or pictures anywhere except the stand-alone manual page.
['selectstart', 'dragstart'].forEach(ev => document.addEventListener(ev, e => {
  const el = e.target && (e.target.nodeType === 1 ? e.target : e.target.parentElement);
  if (el && el.closest('input,textarea')) return;                       // text fields stay selectable
  if (!document.body.classList.contains('manual-page')) e.preventDefault();
}));
sfx.muted = !settings.fxOn; sfx.musicMuted = !settings.musicOn;
if (new URLSearchParams(location.search).has('manual')) {
  document.body.className = 'manual-page';
  document.title = 'Zero Hour: defusal manual';
  document.body.innerHTML = manualHTML();
  document.addEventListener('click', manualClick);
} else {
  buildDrawer();
  showStart();
}
})();
</script>
