/* ---------------------------------------------------------------------
   MODULE: Button
   --------------------------------------------------------------------- */
const BTN_HEX = { red: '#e5412d', blue: '#2f6bff', yellow: '#f2c230', white: '#f4f4ef' };
const BTN_RULES = [
  ['If the button is blue and the label says ABORT, hold it.', s => s.color === 'blue' && s.label === 'ABORT', 'hold'],
  ['If there is more than one battery and the label says DETONATE, press and immediately release it.', (s, b) => b.batteries > 1 && s.label === 'DETONATE', 'tap'],
  ['If the button is white and there is a lit indicator labeled CAR, hold it.', (s, b) => s.color === 'white' && b.hasLit('CAR'), 'hold'],
  ['If there are more than two batteries and there is a lit indicator labeled FRK, press and immediately release it.', (s, b) => b.batteries > 2 && b.hasLit('FRK'), 'tap'],
  ['If the button is yellow, hold it.', s => s.color === 'yellow', 'hold'],
  ['If there is a coin cell marked CR2016, press and immediately release it.', (s, b) => b.coins.some(c => c.model === 'CR2016'), 'tap'],
  ['If the button is red and the label says HOLD, press and immediately release it.', s => s.color === 'red' && s.label === 'HOLD', 'tap'],
  ['If the encoders add up to an odd number and the label says PRESS, press and immediately release it.', (s, b) => b.encSum() % 2 === 1 && s.label === 'PRESS', 'tap'],
  ['Otherwise, hold it.', () => true, 'hold']
];
const BTN_RELEASE = { blue: '4', white: '1', yellow: '5', red: '1' };

Modules.register({
  id: 'button',
  title: 'Button',
  difficulty: 'easy',
  description: 'One big button with a label. The expert decides whether to tap it or hold it, and when to let go, by watching the colour of the light bar that appears.',
  create(bomb, r) {
    return {
      color: r.pick(Object.keys(BTN_HEX)),
      label: r.pick(['ABORT', 'DETONATE', 'HOLD', 'PRESS']),
      strip: r.pick(Object.keys(BTN_RELEASE))
    };
  },
  mount(root, s, ctl) {
    let action = 'hold';
    const decide = () => BTN_RULES.find(r => r[1](s, ctl.bomb))[2];   // read live: the encoders can be turned
    const dark = s.color === 'white' || s.color === 'yellow';
    const strip = cuboid(5, '', 'strip');
    strip.style.setProperty('--sc', BTN_HEX[s.strip]);
    const cap = h('div', { class: 'cap3' },
      Array.from({ length: 15 }, (_, k) => h('i', { style: `--k:${k}` })),
      h('i', { class: 'top', style: '--k:15' }, s.label));
    const btn = h('div', { class: 'bigbtn', role: 'button', tabindex: '0', 'aria-label': `${s.color} button labeled ${s.label}`, style: `--bc:${BTN_HEX[s.color]};--bt:${dark ? '#161c1f' : '#fff'}` }, cap);
    let t0 = 0, timer = 0, down = false;

    const press = () => {
      if (down || ctl.isSolved()) return;
      down = true; t0 = performance.now(); action = decide();
      btn.classList.add('down'); ctl.sfx.press();
      timer = setTimeout(() => strip.classList.add('on'), 400);
    };
    const release = () => {
      if (!down) return;
      down = false; clearTimeout(timer);
      btn.classList.remove('down'); strip.classList.remove('on'); ctl.sfx.release();
      if (ctl.isSolved()) return;
      const held = performance.now() - t0;
      if (held < 400) {
        action === 'tap' ? ctl.solve() : ctl.strike('Tapped a button that should have been held.');
      } else if (action === 'tap') {
        ctl.strike('Held a button that should have been tapped.');
      } else {
        const d = BTN_RELEASE[s.strip];
        ctl.timeText().replace(/\D/g, '').includes(d) ? ctl.solve() : ctl.strike(`Released the button without a ${d} on the timer.`);
      }
    };
    btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.setPointerCapture(e.pointerId); press(); });
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('contextmenu', e => e.preventDefault());
    btn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(); } });
    btn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); release(); } });
    root.append(h('div', { class: 'btnmod' }, h('div', { class: 'socket' }, h('div', { class: 'well' }), h('i', { class: 'ring r1' }), h('i', { class: 'ring r2' }), btn), strip));
    return () => clearTimeout(timer);
  },
  manual() {
    return `<p>Tell the defuser to hold the button or tap it. Take the first rule that applies.</p>
      <ol>${BTN_RULES.map(r => `<li>${r[0]}</li>`).join('')}</ol>
      <h3>Holding the button</h3>
      <p>A colored light bar glows beside the button once it is held. Check its color, then tell the defuser to release when the countdown timer shows the matching digit in <em>any</em> position.</p>
      <table class="tbl"><tr><th>Light bar color</th><th>Release when the timer shows</th></tr>
      ${['blue', 'white', 'yellow'].map(c => `<tr><td>${chip(c)}</td><td>${BTN_RELEASE[c]}</td></tr>`).join('')}
      <tr><td>Any other color</td><td>${BTN_RELEASE.red}</td></tr></table>
      <p>"Press and immediately release" means a quick tap, well under half a second.</p>`;
  }
});

/* ---------------------------------------------------------------------
   MODULE: Simon
   --------------------------------------------------------------------- */
const SIMON_NAMES = ['red', 'blue', 'green', 'yellow'];
const SIMON_HEX = ['#e5412d', '#2f6bff', '#2fbf63', '#f2c230'];
const SIMON_FREQ = [392, 330, 262, 494];
const SIMON_ARC = [[270, 360], [0, 90], [90, 180], [180, 270]];   // red top-left, blue top-right, green bottom-right, yellow bottom-left
// SIMON_MAP[vowel|none][strikes][flashing color] -> color to press (indexes into SIMON_NAMES)
const SIMON_MAP = {
  vowel: [[1, 0, 3, 2], [3, 2, 1, 0], [2, 0, 3, 1]],
  none:  [[1, 3, 2, 0], [0, 1, 3, 2], [3, 2, 1, 0]]
};

Modules.register({
  id: 'simon',
  title: 'Simon',
  difficulty: 'medium',
  rearOptional: true,
  description: 'A ring of four coloured pads flashes a growing sequence. The defuser answers with translated colours, not the ones that flash; the translation depends on the serial number and the strikes.',
  max: 1,
  create(bomb, r) {
    return { seq: Array.from({ length: 3 + r.int(3) }, () => r.int(4)) };
  },
  mount(root, s, ctl) {
    let stage = 1, pos = 0, timers = [], dead = false;
    const LAYERS = 10, TOP = LAYERS - 1;
    const pol = (rad, a) => { const t = a * Math.PI / 180; return [(100 + rad * Math.sin(t)).toFixed(2), (100 - rad * Math.cos(t)).toFixed(2)]; };
    const arc = (a0, a1) => {
      const R = 94, r = 47, g = 2.2;
      const p1 = pol(R, a0 + g), p2 = pol(R, a1 - g), p3 = pol(r, a1 - g * 2), p4 = pol(r, a0 + g * 2);
      return `M${p1[0]} ${p1[1]}A${R} ${R} 0 0 1 ${p2[0]} ${p2[1]}L${p3[0]} ${p3[1]}A${r} ${r} 0 0 0 ${p4[0]} ${p4[1]}Z`;
    };
    const n = s.seq.length;
    const dots = Array.from({ length: n }, (_, i) => { const p = pol(22, i / n * 360); return `<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="3.4"/>`; }).join('');
    const pads = k => SIMON_NAMES.map((nm, i) =>
      `<path class="pad"${k === TOP ? ` tabindex="0" role="button" aria-label="${nm}"` : ''} style="--pc:${SIMON_HEX[i]}" d="${arc(...SIMON_ARC[i])}"/>`).join('');
    const wrap = h('div', { class: 'simon3d' });
    const layers = [];
    for (let k = 0; k < LAYERS; k++) {
      const base = k === 0 ? `<circle class="sring" cx="100" cy="100" r="98"/><circle class="core" cx="100" cy="100" r="40"/>${dots}` : '';
      const el = html('div', {}, `<svg class="sl${k === TOP ? ' top' : ''}" viewBox="0 0 200 200" style="--k:${k}">${base}${pads(k)}</svg>`).firstElementChild;
      layers.push(el); wrap.append(el);
    }
    const padSets = layers.map(l => [...l.querySelectorAll('.pad')]);
    const dotEls = [...layers[0].querySelectorAll('.dot')];

    const flash = (i, ms = 380) => {
      padSets.forEach(ps => ps[i].classList.add('lit'));
      ctl.sfx.bell(SIMON_FREQ[i], ms / 1000 + .5, .12);
      setTimeout(() => padSets.forEach(ps => ps[i].classList.remove('lit')), ms);
    };
    const clear = () => { timers.forEach(clearTimeout); timers = []; };
    const play = () => {
      if (dead) return;
      clear(); pos = 0;
      for (let i = 0; i < stage; i++) timers.push(setTimeout(() => flash(s.seq[i]), 500 + i * 750));
      timers.push(setTimeout(play, 500 + stage * 750 + 3500));
    };
    const idle = ms => { if (dead) return; clear(); timers.push(setTimeout(play, ms)); };
    const expected = c => SIMON_MAP[ctl.bomb.serialVowel ? 'vowel' : 'none'][Math.min(ctl.bomb.strikes, 2)][c];
    const mark = () => dotEls.forEach((d, i) => d.classList.toggle('done', i < stage - 1));

    function input(i) {
      if (ctl.isSolved()) return;
      flash(i, 200);
      if (i === expected(s.seq[pos])) {
        pos++;
        if (pos === stage) {
          if (stage === s.seq.length) { clear(); dotEls.forEach(d => d.classList.add('done')); layers[0].classList.add('solved'); ctl.solve(); return; }
          stage++; mark(); idle(1400);
        } else idle(5000);
      } else {
        pos = 0; ctl.strike('Wrong color in the Simon sequence.'); idle(1600);
      }
    }
    padSets[TOP].forEach((p, i) => {
      p.addEventListener('click', () => input(i));
      p.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input(i); } });
    });
    root.append(wrap);
    idle(1200);
    return () => { dead = true; clear(); };
  },
  mountBack(root, s, ctl) {
    const vowels = [...ctl.bomb.serial].filter(c => 'AEIOU'.includes(c)).join('');
    root.append(h('div', { class: 'speaker3d' }, h('small', {}, 'speaker'),
      h('div', { class: 'speaker' }, h('div', { class: 'spk' },
        cylZ(74, 5, 48, { color: '#8d9ca4' }),                                          // the steel basket rim
        [45, 135, 225, 315].map(a => { const c = cylZ(4.5, 2.5, 6, { z: 5, color: '#c9d3d8', hex: true }); c.style.cssText += `;left:${(66 * Math.sin(a * Math.PI / 180)).toFixed(1)}px;top:${(-66 * Math.cos(a * Math.PI / 180)).toFixed(1)}px`; return c; }),
        h('i', { class: 'spk-grille' }),
        cylZ(38, 4, 36, { z: 5, color: '#22282c' }),                                      // rubber surround
        h('div', { class: 'spk-dome' }, [0, 1, 2, 3, 4, 5].map(k => h('i', { style: `--k:${k}` })),
          h('i', { class: 'top', style: '--k:6' }, h('b', { class: 'cone-lbl' }, vowels || '\u2014')))))));
  },
  manual() {
    const row = (set, k) => SIMON_MAP[set][k].map(c => `<td>${chip(SIMON_NAMES[c])}</td>`).join('');
    const table = set => `<table class="tbl"><tr><th>Strikes</th>${SIMON_NAMES.map(n => `<th>${n} flashes</th>`).join('')}</tr>
      ${[0, 1, 2].map(k => `<tr><td>${k}</td>${row(set, k)}</tr>`).join('')}</table>`;
    return `<p>The ring flashes a growing sequence of colors. The defuser does <em>not</em> repeat the flashes: for each flash, press the color shown in the table instead. The table depends on the serial number and the current number of strikes.</p>
      <p>After each correct stage the sequence grows by one flash and replays from the start. Press the translated colors for the whole sequence each time. If the defuser pauses, the sequence repeats. The dots in the center fill in as stages are completed.</p>
      <h3>Serial number contains a vowel (A, E, I, O, U)</h3>${table('vowel')}
      <h3>Serial number has no vowel</h3>${table('none')}`;
  },
  manualBack() {
    return '<p>The rear plate is the back of the toy: a round speaker grille with a label on the cone. The label lists the vowels in the serial number, or shows a dash when there are none, which picks the table above.</p>';
  }
});

/* ---------------------------------------------------------------------
   MODULE: Password
   --------------------------------------------------------------------- */
const WORDS = ['about','after','again','below','could','every','first','found','great','house','large','learn','never','other','place','plant','point','right','small','sound','spell','still','study','their','there','these','thing','think','three','water','where','which','world','would','write'];
const ARROW_UP = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 11 L8 5 L13 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ARROW_DN = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5 L8 11 L13 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

Modules.register({
  id: 'password',
  title: 'Password',
  difficulty: 'medium',
  description: 'Five columns of letters to cycle through. Exactly one word from the list in the manual can be spelled with one letter from each column.',
  create(bomb, r) {
    for (;;) {
      const ans = r.pick(WORDS);
      const cols = [...ans].map(ch => {
        const set = new Set([ch]);
        while (set.size < 6) set.add(String.fromCharCode(97 + r.int(26)));
        return r.shuffle([...set]);
      });
      const fits = WORDS.filter(w => [...w].every((c, i) => cols[i].includes(c)));
      const startsSolved = cols.every((c, i) => c[0] === ans[i]);
      if (fits.length === 1 && !startsSolved) return { ans, cols };
    }
  },
  mount(root, s, ctl) {
    const idx = s.cols.map(() => 0);
    const wrap = h('div', { class: 'pw' });
    s.cols.forEach((c, i) => {
      const lcd = h('div', { class: 'lcd' }, h('span', {}, c[0].toUpperCase()));
      const move = d => () => {
        if (ctl.isSolved()) return;
        idx[i] = (idx[i] + d + c.length) % c.length;
        lcd.replaceChildren(h('span', { class: 'roll' }, c[idx[i]].toUpperCase())); ctl.sfx.click();
      };
      const up = activate(h('div', { class: 'arr' }, button3d(html('span', {}, ARROW_UP), '', 6)), move(-1), 'Previous letter');

const TOGGLE_RULES = [

  ['Switch 2: flip it if any indicator is lit.', b => b.indicators.some(i => i.lit)],
  ['Switch 3: flip it if there are two or more batteries (the AA and D cells, not coin cells).', b => b.batteries >= 2],
  ['Switch 4: flip it if there is at least one coin cell.', b => b.coins.length > 0],
  ['Switch 5: flip it if the encoders add up to an odd number. With no encoders the sum is 0, which counts as even.', b => b.encSum() % 2 === 1]
];

Modules.register({
  id: 'switches',

      <ol>${TOGGLE_RULES.map(r => `<li>${r[0]}</li>`).join('')}</ol>
      <p>"Flip it" means the opposite of the lamp: dark means up, lit means down. Rule 5 reads the encoders as they are at the moment of pressing Confirm.</p>`;
  },

/* ---------------------------------------------------------------------
   MODULE: Morse
   --------------------------------------------------------------------- */
const MORSE = { a: '.-', b: '-...', c: '-.-.', d: '-..', e: '.', f: '..-.', g: '--.', h: '....', i: '..', j: '.---', k: '-.-', l: '.-..', m: '--', n: '-.', o: '---', p: '.--.', q: '--.-', r: '.-.', s: '...', t: '-', u: '..-', v: '...-', w: '.--', x: '-..-', y: '-.--', z: '--..' };
const MORSE_CHANNELS = ['3.502', '3.505', '3.510', '3.515', '3.522', '3.525', '3.532', '3.535', '3.540', '3.542', '3.545', '3.552'];
const MORSE_WORDS = [['fuse', '3.505'], ['volt', '3.515'], ['coil', '3.522'], ['bolt', '3.532'], ['grid', '3.535'], ['relay', '3.542'], ['laser', '3.545'], ['diode', '3.552']];
const ARROW_L = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 3 L5 8 L11 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ARROW_R = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3 L11 8 L5 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

Modules.register({
  id: 'morse',
  title: 'Morse',
  difficulty: 'medium',
  description: 'A lamp blinks a word in Morse code. Decode it, look up its frequency and tune the radio to it.',
  create(bomb, r) {
    return { word: r.pick(MORSE_WORDS), start: r.int(MORSE_CHANNELS.length) };
  },
  mount(root, s, ctl) {
    const seq = [];
    [...s.word[0]].forEach(ch => {
      [...MORSE[ch]].forEach(sym => { seq.push([true, sym === '.' ? 250 : 750]); seq.push([false, 250]); });
      seq[seq.length - 1][1] = 750;
    });
    seq[seq.length - 1][1] = 2600;
    const lamp = led('#ffb224', false, 'xl');
    let idx = 0, timer = 0, dead = false, ci = s.start;
    const step = () => {
      if (dead) return;
      const [on, ms] = seq[idx];
      lamp.classList.toggle('off', !on);
      if (on) ctl.sfx.beep(660, Math.min(.24, ms / 1000));
      idx = (idx + 1) % seq.length;
      timer = setTimeout(step, ms);
    };
    timer = setTimeout(step, 900);
    const lcd = h('div', { class: 'mini-lcd sm' }, MORSE_CHANNELS[ci] + ' MHz');
    const move = d => () => { if (ctl.isSolved()) return; ci = (ci + d + MORSE_CHANNELS.length) % MORSE_CHANNELS.length; lcd.textContent = MORSE_CHANNELS[ci] + ' MHz'; ctl.sfx.click(); };
    const left = activate(h('div', { class: 'sk' }, button3d(html('span', {}, ARROW_L), '', 6)), move(-1), 'Lower frequency');
    const right = activate(h('div', { class: 'sk' }, button3d(html('span', {}, ARROW_R), '', 6)), move(1), 'Higher frequency');
    const tx = activate(h('div', { class: 'go' }, button3d('TRANSMIT', '', 9)), () => {
      if (ctl.isSolved()) return;
      MORSE_CHANNELS[ci] === s.word[1] ? ctl.solve() : ctl.strike(`Transmitted on ${MORSE_CHANNELS[ci]} MHz.`);
    }, 'Transmit');
    root.append(h('div', { class: 'morse' }, h('div', { class: 'lampwrap' }, lamp), h('div', { class: 'freqrow' }, left, lcd, right), tx));
    return () => { dead = true; clearTimeout(timer); };
  },
  manual() {
    const chart = Object.keys(MORSE).map(k => `<div><b>${k.toUpperCase()}</b> ${MORSE[k].replace(/\./g, '\u00b7').replace(/-/g, '\u2212')}</div>`).join('');
    return `<p>The lamp flashes a word in Morse code, then pauses and repeats. A short flash is a dot, a long flash is a dash, and a longer dark gap separates letters. Decode the word with the chart, find its frequency in the table, tell the defuser to tune to it with the arrow keys and press Transmit.</p>
      <div class="mchart">${chart}</div>
      <table class="tbl"><tr><th>Word</th><th>Frequency (MHz)</th></tr>${MORSE_WORDS.map(w => `<tr><td>${w[0]}</td><td>${w[1]}</td></tr>`).join('')}</table>`;
  }
});

/* ---------------------------------------------------------------------
   MODULE: Memory
   Five stages. Each stage the display shows 1 to 4 and the keys carry shuffled labels.
   --------------------------------------------------------------------- */
const MEM_TABLE = [
  [{ k: 'pos', n: 2 }, { k: 'pos', n: 1 }, { k: 'pos', n: 4 }, { k: 'pos', n: 3 }],
  [{ k: 'label', n: 3 }, { k: 'samePos', s: 1 }, { k: 'pos', n: 1 }, { k: 'sameLabel', s: 1 }],
  [{ k: 'sameLabel', s: 2 }, { k: 'pos', n: 4 }, { k: 'samePos', s: 1 }, { k: 'label', n: 1 }],
  [{ k: 'pos', n: 3 }, { k: 'sameLabel', s: 3 }, { k: 'samePos', s: 2 }, { k: 'label', n: 2 }],
  [{ k: 'samePos', s: 4 }, { k: 'sameLabel', s: 1 }, { k: 'sameLabel', s: 4 }, { k: 'samePos', s: 3 }]
];
const memText = u => u.k === 'pos' ? `press the key in position ${u.n}`
  : u.k === 'label' ? `press the key labeled ${u.n}`
  : u.k === 'samePos' ? `press the key in the same position as in stage ${u.s}`
  : `press the key with the same label as in stage ${u.s}`;

Modules.register({
  id: 'memory',
  title: 'Memory',
  difficulty: 'hard',
  description: 'Five stages of pressing keys, where later stages refer back to earlier ones. Keep notes: one wrong press sends the module back to the start.',
  create(bomb, r) { return { seed: r.int(1e9) }; },
  mount(root, s, ctl) {
    const rr = rng(s.seed);
    const shuffle = () => { const a = [1, 2, 3, 4]; for (let i = 3; i > 0; i--) { const j = rr.int(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    let stage = 0, hist = [], disp = 1, labels = [1, 2, 3, 4];
    const lcd = h('div', { class: 'mini-lcd' });
    const lamps = Array.from({ length: 5 }, () => led('#43dfff', false));
    const keyEls = [0, 1, 2, 3].map(i => {
      const k = h('div', { class: 'mk' }, button3d('', '', 8));
      activate(k, () => press(i), `Key ${i + 1}`);
      return k;
    });
    const round = () => {
      disp = 1 + rr.int(4); labels = shuffle();
      lcd.textContent = disp;
      keyEls.forEach((k, i) => { k.querySelector('.cap2>.t').textContent = labels[i]; });
      lamps.forEach((l, i) => l.classList.toggle('off', i >= stage));
    };
    const press = i => {
      if (ctl.isSolved()) return;
      const u = MEM_TABLE[stage][disp - 1];
      const want = u.k === 'pos' ? u.n : u.k === 'label' ? labels.indexOf(u.n) + 1
        : u.k === 'samePos' ? hist[u.s - 1].pos : labels.indexOf(hist[u.s - 1].label) + 1;
      if (i + 1 === want) {
        hist.push({ pos: i + 1, label: labels[i] }); stage++; ctl.sfx.step(stage - 1);
        if (stage === 5) { lamps.forEach(l => l.classList.remove('off')); ctl.solve(); return; }
        round();
      } else {
        const at = stage + 1; stage = 0; hist = []; ctl.strike(`Wrong key at stage ${at}.`); round();
      }
    };
    round();
    root.append(h('div', { class: 'stack' }, lcd, h('div', { class: 'lamprow' }, lamps), h('div', { class: 'memkeys' }, keyEls)));
  },
  manual() {
    return `<p>Five stages. Each stage the display shows a number from 1 to 4 and the four keys carry the labels 1 to 4 in a new order. Positions are counted left to right. Look up the stage and the displayed number below and tell the defuser which key to press. <b>Write down the position and the label of every key pressed</b>, because later stages refer back to them. A wrong press is a strike and sends the module back to stage 1.</p>
      <table class="tbl"><tr><th>Stage</th><th>Shows 1</th><th>Shows 2</th><th>Shows 3</th><th>Shows 4</th></tr>
      ${MEM_TABLE.map((row, i) => `<tr><td>${i + 1}</td>${row.map(u => `<td>${memText(u)}</td>`).join('')}</tr>`).join('')}</table>`;
  }
});

/* ---------------------------------------------------------------------
   MODULE: Knob
   --------------------------------------------------------------------- */
const KNOB_TABLE = [['100110', 'up'], ['011001', 'up'], ['110011', 'right'], ['001100', 'right'], ['101010', 'down'], ['010101', 'down'], ['111000', 'left'], ['000111', 'left']];
const KNOB_DIRS = ['up', 'right', 'down', 'left'];

Modules.register({
  id: 'knob',
  title: 'Knob',
  difficulty: 'easy',
  needy: true,
  description: 'A needy module: every so often six lamps light up in a pattern, and the knob has to be turned to the matching direction and locked before its countdown runs out.',
  create(bomb, r) {
    return { seed: r.int(1e9) };   // each wake draws a new pattern from this
  },
  mount(root, s, ctl) {
    const r = rng(s.seed);
    let turns = 0, want = -1;
    const lamps = Array.from({ length: 6 }, () => led('#43dfff', false, 'lg'));
    const kn = h('div', { class: 'kn', style: '--ang:0deg' },
      Array.from({ length: 10 }, (_, k) => h('i', { style: `--k:${k}` })), h('i', { class: 'top', style: '--k:10' }));
    const wrap = h('div', { class: 'kwrap' },
      h('div', { class: 'kring' }), [0, 90, 180, 270].map(a => h('i', { class: 'ktick', style: `--a:${a}deg` })), kn);
    const cycle = needyCycle(root, ctl, {
      window: 25,
      onWake() {
        const e = r.pick(KNOB_TABLE);
        want = KNOB_DIRS.indexOf(e[1]);
        [...e[0]].forEach((c, k) => lamps[k].classList.toggle('off', c !== '1'));
        if (mod(turns, 4) === want) { turns++; kn.style.setProperty('--ang', turns * 90 + 'deg'); }
      },
      onSleep() { lamps.forEach(l => l.classList.add('off')); }
    });
    activate(wrap, () => {
      turns++; kn.style.setProperty('--ang', turns * 90 + 'deg'); ctl.sfx.click();
    }, 'Knob: click to turn it a quarter clockwise, or drag it round');
    dragTurn(wrap, { detent: 90,
      show: d => kn.style.setProperty('--ang', turns * 90 + d + 'deg'),
      commit: n => { turns += n; kn.style.setProperty('--ang', turns * 90 + 'deg'); if (n) ctl.sfx.click(); } });
    const lock = activate(h('div', { class: 'go' }, button3d('LOCK', '', 8)), () => {
      if (!cycle.isAwake()) return;
      if (mod(turns, 4) === want) { ctl.sfx.click(); cycle.handled(); }
      else { ctl.strike(`Locked the knob pointing ${KNOB_DIRS[mod(turns, 4)]}.`); cycle.handled(); }
    }, 'Lock the knob');
    root.append(h('div', { class: 'stack' }, h('div', { class: 'knobmod' }, h('div', { class: 'pat' }, lamps), wrap), lock));
    return () => cycle.stop();
  },
  manual() {
    const dots = p => `${[...p.slice(0, 3)].map(c => c === '1' ? '●' : '○').join(' ')}<br>${[...p.slice(3)].map(c => c === '1' ? '●' : '○').join(' ')}`;
    return `<p><b>Needy.</b> This module is never defused. Every so often its six lamps (two rows of three) light up in a pattern and its countdown starts. Find the pattern in the table to learn where the red notch of the knob must point, then tell the defuser to click the knob round (each click turns it a quarter clockwise) and press Lock before the countdown runs out. Filled circles are lit lamps. "Up" is the top of the module.</p>
      <table class="tbl"><tr><th>Pattern</th><th>Notch points</th></tr>${KNOB_TABLE.map(e => `<tr><td class="pat-c">${dots(e[0])}</td><td>${e[1]}</td></tr>`).join('')}</table>
      <p>Locking the wrong way is a strike, and so is a countdown that runs out. Either way the lamps go dark until the next time.</p>`;
  }
});

/* ---------------------------------------------------------------------
   MODULE: Breaker

   --------------------------------------------------------------------- */
const BREAKER_RULES = [

const breakerWantUp = (s, b) => {

  return up;
};

Modules.register({

/* ---------------------------------------------------------------------
   MODULE: Gears
   A crank on the front, the gear train to the winch drum on the back. Neighbouring gears turn opposite ways.
   --------------------------------------------------------------------- */
const gearsWant = s => {
  const drum = s.load === 'LIFT' ? 'cw' : 'ccw';
  return { dir: s.gears % 2 ? drum : (drum === 'cw' ? 'ccw' : 'cw'), turns: s.dots.length };
};
// The turn counter counts clockwise turns up and anticlockwise turns down; Release wants it at this number.
const gearsCount = s => (gearsWant(s).dir === 'cw' ? 1 : -1) * s.dots.length;
const signed = n => n < 0 ? '\u2212' + -n : String(n);
const CW_ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.3 17.7 A8 8 0 1 1 17.7 17.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M14.4 20.8 L20.4 20.4 L15.2 15.2 Z" fill="currentColor"/></svg>';
const CCW_ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 17.7 A8 8 0 1 0 6.3 17.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M9.6 20.8 L3.6 20.4 L8.8 15.2 Z" fill="currentColor"/></svg>';

// A spur gear standing on the plate: a steel disc with box teeth round the rim, a raised hub and a dark bore.
function gear3d(R, { drum = false } = {}) {
  const teeth = Math.round(R * .62), e = h('div', { class: 'gear3d' });
  e.append(h('i', { class: 'g-shadow', style: `width:${2 * R + 6}px;height:${2 * R + 6}px;left:${-R - 3}px;top:${-R - 1}px` }));
  e.append(cylZ(R - 2.5, 5, 32, { color: '#aab8c0' }));
  for (let k = 0; k < teeth; k++) e.append(h('div', { class: 'g-tooth', style: `transform:rotateZ(${k * 360 / teeth}deg) translateY(${-R + 2}px)` }, cuboid(4.6, '', 'fill')));   // a little lower than the disc, so their tops never meet
  e.append(cylZ(R * .42, 7.5, 20, { color: '#d3dce1' }));
  e.append(h('i', { class: 'g-bore', style: `width:${R * .32}px;height:${R * .32}px;left:${-R * .16}px;top:${-R * .16}px` }));
  if (drum) e.append(cylZ(R * .62, 15, 24, { z: 7.5, color: '#8a5a1c' }), h('i', { class: 'g-rope', style: `width:${R * 1.24}px;height:${R * 1.24}px;left:${-R * .62}px;top:${-R * .62}px` }));
  return e;
}
// The gear train behind the crank, crank gear on the right (it is seen from behind) and the drum on the left. It does not move.
function gearTrain3d(s) {
  const R = [20, 13], el = h('div', { class: 'train3d' }), xs = [];
  let x = 0;
  for (let k = 0; k < s.gears; k++) { if (k) x -= R[k % 2] + R[(k - 1) % 2] + 1; xs.push(x); }
  const left = xs[xs.length - 1] - R[(s.gears - 1) % 2], shift = 115 - (left + R[0]) / 2;   // centre the chain on the plate
  xs.forEach((x0, k) => {
    const r = R[k % 2], g = gear3d(r, { drum: k === s.gears - 1 });
    if (s.dots.includes(k)) {
      const d = cylZ(3.8, 2, 14, { z: 5, color: '#e5412d' });
      d.style.cssText += `;left:${(r * .5).toFixed(1)}px;top:${(-r * .45).toFixed(1)}px`;   // on the gear face, not the hub
      g.append(d);
    }
    el.append(h('div', { class: 'gear' + (s.dots.includes(k) ? ' dot' : ''), style: `left:${x0 + shift}px;top:${76 + (k % 2 ? 7 : 0)}px` }, g));
  });
  el.append(h('b', { class: 'train-lbl', style: `left:${xs[0] + shift}px` }, 'crank'), h('b', { class: 'train-lbl', style: `left:${xs[xs.length - 1] + shift}px` }, 'drum'));
  return el;
}

/* ---------------------------------------------------------------------
   MODULE: Relay logic
   Three jumpers on the front; the relay board's schematic, two unnamed logic gates, on the back.
   --------------------------------------------------------------------- */
const GATES = {
  AND: (a, b) => a & b,
  OR: (a, b) => a | b,
  NAND: (a, b) => 1 - (a & b),
  NOR: (a, b) => 1 - (a | b)
};
const GATE_RULES = {
  AND: '1 only when both inputs are 1.',
  OR: '1 when either input is 1.',
  NAND: '0 only when both inputs are 1.',
  NOR: '1 only when both inputs are 0.'
};
// inv: an inverter bubble on input line A, B or C flips that input before it reaches its gate
const relaySolutions = (g1, g2, want, inv = [0, 0, 0]) => [0, 1, 2, 3, 4, 5, 6, 7].map(n => [n >> 2 & 1, n >> 1 & 1, n & 1])
  .filter(([a, b, c]) => GATES[g2](GATES[g1](a ^ inv[0], b ^ inv[1]), c ^ inv[2]) === want);
const relayAnswer = s => relaySolutions(s.g1, s.g2, s.want, s.inv)[0];
// The standard symbols, inputs at the left (y 12 and 28), output at the right (y 20). 60 x 40 units.
const GATE_PATHS = {
  AND: 'M4 12 H14 M4 28 H14 M14 4 H30 A16 16 0 0 1 30 36 H14 Z M46 20 H56',
  OR: 'M4 12 H16 M4 28 H16 M12 4 Q22 20 12 36 Q38 36 50 20 Q38 4 12 4 Z M50 20 H56',
  NAND: 'M4 12 H14 M4 28 H14 M14 4 H28 A16 16 0 0 1 28 36 H14 Z M50 20 H56 M50 20 A3 3 0 1 0 44 20 A3 3 0 1 0 50 20',
  NOR: 'M4 12 H16 M4 28 H16 M10 4 Q20 20 10 36 Q34 36 46 20 Q34 4 10 4 Z M52 20 H56 M52 20 A3 3 0 1 0 46 20 A3 3 0 1 0 52 20'
};
const gateSVG = name => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="60" height="40" aria-hidden="true"><path d="${GATE_PATHS[name]}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;

function relayBoardSVG(s) {
  const gate = (name, x, y) => `<svg x="${x}" y="${y}" width="72" height="48" viewBox="0 0 60 40"><path d="${GATE_PATHS[name]}" fill="none" stroke="#1b262c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  const t = (x, y, txt) => `<text x="${x}" y="${y}" font-size="12" font-weight="700" fill="#1b262c" text-anchor="middle">${txt}</text>`;
  const bubble = (x, y, on) => on ? `<circle cx="${x}" cy="${y}" r="3.6" fill="#f2f6f8" stroke="#1b262c" stroke-width="1.8"/>` : '';
  return `<svg viewBox="0 0 230 140" class="relay-board" aria-hidden="true"><g fill="none" stroke="#1b262c" stroke-width="2.2" stroke-linecap="round">` +
    `<path d="M22 31 H35 M22 50 H35 M22 98 H120 V79 H128 M97 40 H112 V60 H128 M190 70 H204"/></g>` +
    bubble(28, 31, s.inv[0]) + bubble(28, 50, s.inv[1]) + bubble(60, 98, s.inv[2]) +
    t(12, 35, 'A') + t(12, 54, 'B') + t(12, 102, 'C') +
    gate(s.g1, 30, 16) + gate(s.g2, 123, 46) +
    `<circle cx="212" cy="70" r="8" fill="#f2f6f8" stroke="#1b262c" stroke-width="2.2"/><path d="M206 64 L218 76 M218 64 L206 76" stroke="#1b262c" stroke-width="1.6"/></svg>`;
}

/* ---------------------------------------------------------------------
   MODULE: Coolant
   The gauge is on the front, the valve on the back: set it behind, watch it in front. Both share the state.
   --------------------------------------------------------------------- */
function coolantTarget(s, b) {
  const raw = Math.max(1, Math.min(9, s.demand + b.indicators.filter(i => i.lit).length - b.batteries));
  return raw > s.relief ? s.relief - 1 : raw;
}
const gaugeAngle = p => -120 + p * 240 / 9;   // 0 bar points down-left, 9 bar down-right
const coolantSlips = new WeakMap();             // state -> repaint of its rear valve, for when the valve slips on the front's wake

Modules.register({

  },
  manualBack() {
    return '<p>The rear plate is the coolant valve: a red hand wheel on a scale from 0 to 9, and the relief tag. Clicking the right half of the wheel opens the valve one step, the left half closes it. The pointer on the wheel shows the setting.</p>';
  }
});

/* ---------------------------------------------------------------------
   MODULE: Throttle
   One lever with five positions and a coloured grip.
   --------------------------------------------------------------------- */
const THROTTLE_GRIPS = ['red', 'blue', 'yellow', 'white', 'black'];
const THROTTLE_POS = { red: 2, blue: 4, yellow: 1, white: 5, black: 3 };
const GRIP_HEX = { red: '#e5412d', blue: '#2f6bff', yellow: '#f2c230', white: '#eef3f5', black: '#2a2f33' };
const throttleWant = (s, b) => b.batteries > 2 ? Math.max(1, THROTTLE_POS[s.grip] - 1) : THROTTLE_POS[s.grip];

Modules.register({
  id: 'throttle',
  title: 'Throttle',
  difficulty: 'easy',
  description: 'A lever with five positions and a coloured grip. The grip colour gives the position, the batteries may knock it down a notch; set the lever and engage.',
  create(bomb, r) {
    const grip = r.pick(THROTTLE_GRIPS), want = throttleWant({ grip }, bomb), start = 1 + r.int(4);
    return { grip, start: start >= want ? start + 1 : start };
  },
  mount(root, s, ctl) {
    let pos = s.start;
    // the lever: a steel shaft standing out of the slot, with a T-grip in the grip colour on top
    const grip = lathe([[4, 4.5, '#aab8c0'], [6, 8.5, GRIP_HEX[s.grip]], [26, 7.5, GRIP_HEX[s.grip], 'rib'], [6, 8.5, GRIP_HEX[s.grip]], [4, 4.5, '#aab8c0']], 18);
    const lever = h('div', { class: 'thr-lever' }, cylZ(5, 30, 16, { color: '#c9d3d8' }), cylZ(9, 3, 20, { color: '#4a5860' }), h('div', { class: 'thr-grip' }, grip));
    const slot = h('div', { class: 'thr-gate' }, cuboid(5, h('div', { class: 'thr-slot' },
      [1, 2, 3, 4, 5].map(n => h('i', { class: 'thr-det', style: `--n:${n}` }))), 'fill'), lever);
    const place = () => { slot.style.setProperty('--pos', pos); slot.style.removeProperty('--drag'); };
    // the lever can be dragged along the slot; it follows the pointer and snaps to the nearest position on release
    slot.classList.add('nodrag');
    let drag = null;
    const posAt = e => { const r = slot.getBoundingClientRect(); return Math.max(1, Math.min(5, 1 + (r.bottom - 13 - e.clientY) / ((r.height - 26) / 4))); };
    slot.addEventListener('pointerdown', e => {
      if (e.button > 0 || ctl.isSolved()) return;
      drag = { id: e.pointerId }; slot.classList.add('turning');
      try { slot.setPointerCapture(e.pointerId); } catch (_) { /* capture is only a nicety */ }
      slot.style.setProperty('--drag', posAt(e));
    });
    slot.addEventListener('pointermove', e => { if (drag && e.pointerId === drag.id) slot.style.setProperty('--drag', posAt(e)); });
    const drop = e => {
      if (!drag || e.pointerId !== drag.id) return;
      drag = null; slot.classList.remove('turning');
      const n = Math.round(posAt(e));
      if (n !== pos) { pos = n; ctl.sfx.click(); }
      place();
    };
    slot.addEventListener('pointerup', drop);
    slot.addEventListener('pointercancel', drop);
    const notches = [1, 2, 3, 4, 5].map(n => activate(h('div', { class: 'notch sk' }, button3d(String(n), '', 5)), () => {
      if (ctl.isSolved() || pos === n) return;
      pos = n; place(); ctl.sfx.click();
    }, `Move the lever to position ${n}`));
    place();
    const engage = activate(h('div', { class: 'go' }, button3d('ENGAGE', '', 9)), () => {
      if (ctl.isSolved()) return;
      pos === throttleWant(s, ctl.bomb) ? ctl.solve() : ctl.strike(`Engaged at position ${pos}.`);
    }, 'Engage');
    root.append(h('div', { class: 'stack' }, h('div', { class: 'thr' }, slot, h('div', { class: 'notches' }, notches.reverse())), engage));
  },
  manual() {
    return `<p>A lever with positions 1 (bottom) to 5 (top) and a coloured grip. Set the lever, then press Engage. Engaging at the wrong position is a strike.</p>
      <table class="tbl"><tr><th>Grip colour</th><th>Position</th></tr>${THROTTLE_GRIPS.map(c => `<tr><td>${chip(c)}</td><td>${THROTTLE_POS[c]}</td></tr>`).join('')}</table>
      <p>If there are more than two batteries (the AA and D cells, not coin cells), use one position lower, but never below 1.</p>`;
  }
});

/* ---------------------------------------------------------------------
   MODULE: Maze
   Nine 6x6 mazes, the same in the game and the manual. The module is mounted turned by 0, 90, 180 or 270 degrees
   clockwise (seen from the front); the gyro plate on the back says which. Positions and moves are in front coordinates.
   --------------------------------------------------------------------- */
const MAZE_DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];   // up, right, down, left; passage bits 1, 2, 4, 8
function makeMaze(r) {
  const cells = Array(36).fill(0), seen = new Set([0]), stack = [0];
  while (stack.length) {
    const i = stack[stack.length - 1], x = i % 6, y = Math.floor(i / 6);
    const next = r.shuffle([0, 1, 2, 3]).find(d => { const nx = x + MAZE_DIRS[d][0], ny = y + MAZE_DIRS[d][1]; return nx >= 0 && nx < 6 && ny >= 0 && ny < 6 && !seen.has(ny * 6 + nx); });
    if (next === undefined) { stack.pop(); continue; }
    const j = (y + MAZE_DIRS[next][1]) * 6 + x + MAZE_DIRS[next][0];
    cells[i] |= 1 << next; cells[j] |= 1 << ((next + 2) % 4); seen.add(j); stack.push(j);
  }
  return cells;
}
const MAZE_MARKERS = [[[0, 1], [5, 2]], [[4, 1], [1, 3]], [[3, 3], [5, 3]], [[0, 0], [0, 3]], [[4, 2], [3, 5]], [[4, 0], [2, 4]], [[1, 0], [1, 5]], [[3, 0], [2, 3]], [[2, 1], [0, 4]]];
const MAZES = MAZE_MARKERS.map((markers, k) => ({ cells: makeMaze(rng(7001 + k)), markers }));
const MAZE_ROT = ['ROTATED 0°', 'ROTATED 90° CW', 'ROTATED 180°', 'ROTATED 270° CW'];
const turnCW = ([x, y]) => [5 - y, x];
const toFront = (p, rot) => { for (let k = 0; k < rot; k++) p = turnCW(p); return p; };
const toMap = (p, rot) => toFront(p, (4 - rot) % 4);
function mazeCanMove(s, p, dir) {
  const [x, y] = toMap(p, s.rot), d = (dir - s.rot + 4) % 4;
  return !!(MAZES[s.maze].cells[y * 6 + x] & (1 << d));
}
// The manual's figure: all nine mazes as drawn, unturned, with their green rings.
function mazesFigure() {
  let body = '';
  MAZES.forEach((m, k) => {
    const x0 = 22 + (k % 3) * 170, y0 = 34 + Math.floor(k / 3) * 172, c = 22;
    body += sT(x0, y0 - 9, `Maze ${k + 1}`, 'font-size="12" font-weight="600"') + `<rect x="${x0}" y="${y0}" width="${6 * c}" height="${6 * c}" stroke-width="2"/>`;
    m.cells.forEach((bits, i) => {
      const x = i % 6, y = Math.floor(i / 6), px = x0 + x * c, py = y0 + y * c;
      body += `<circle cx="${px + c / 2}" cy="${py + c / 2}" r="1.3" fill="currentColor" stroke="none"/>`;
      if (x < 5 && !(bits & 2)) body += `<line x1="${px + c}" y1="${py}" x2="${px + c}" y2="${py + c}" stroke-width="2"/>`;
      if (y < 5 && !(bits & 4)) body += `<line x1="${px}" y1="${py + c}" x2="${px + c}" y2="${py + c}" stroke-width="2"/>`;
    });
    m.markers.forEach(([x, y]) => { body += `<circle cx="${x0 + x * c + c / 2}" cy="${y0 + y * c + c / 2}" r="7" stroke="#2fbf63" stroke-width="2.4"/>`; });
  });
  return schematic(520, 540, 'The nine mazes', body, 'The nine mazes, drawn unturned. Green rings mark how to tell them apart.');
}

Modules.register({
  id: 'maze',
  title: 'Maze',
  difficulty: 'hard',
  description: 'A 6×6 grid with two green rings, your square and a goal, but no visible walls. The expert finds the maze by its rings, turns the map by the gyro plate on the back, and guides the square home.',
  create(bomb, r) {
    const maze = r.int(9), rot = r.int(4), s = { maze, rot };
    const dist = from => {   // moves from `from` to every cell, in front coordinates
      const d = { [from.join()]: 0 }, queue = [from];
      while (queue.length) {
        const p = queue.shift();
        for (let k = 0; k < 4; k++) if (mazeCanMove(s, p, k)) { const q = [p[0] + MAZE_DIRS[k][0], p[1] + MAZE_DIRS[k][1]]; if (d[q.join()] === undefined) { d[q.join()] = d[p.join()] + 1; queue.push(q); } }
      }
      return d;
    };
    const rings = MAZES[maze].markers.map(p => toFront(p, rot).join());   // start and goal never hide a ring
    const free = Array.from({ length: 36 }, (_, i) => [i % 6, Math.floor(i / 6)]).filter(p => !rings.includes(p.join()));
    const start = r.pick(free), far = free.filter(p => dist(start)[p.join()] >= 4);
    return { maze, rot, start, goal: r.pick(far) };
  },
  mount(root, s, ctl) {
    let me = s.start.slice();
    const rings = MAZES[s.maze].markers.map(p => toFront(p, s.rot).join());
    const grid = h('div', { class: 'mz-grid' });
    const paint = () => grid.replaceChildren(...Array.from({ length: 36 }, (_, i) => {
      const p = [i % 6, Math.floor(i / 6)], k = p.join();
      return h('div', { class: 'mz-cell' },
        rings.includes(k) ? h('i', { class: 'mz-ring' }) : h('i', { class: 'mz-dot' }),
        k === s.goal.join() ? h('i', { class: 'mz-goal', 'data-x': s.goal[0], 'data-y': s.goal[1] }) : null,
        k === me.join() ? h('i', { class: 'mz-me', 'data-x': me[0], 'data-y': me[1] }) : null);
    }));
    const move = d => () => {
      if (ctl.isSolved()) return;
      if (!mazeCanMove(s, me, d)) { ctl.strike(`Walked into a wall going ${['up', 'right', 'down', 'left'][d]}.`); return; }
      me = [me[0] + MAZE_DIRS[d][0], me[1] + MAZE_DIRS[d][1]]; paint(); ctl.sfx.click();
      if (me.join() === s.goal.join()) ctl.solve();
    };
    const arrow = (cls, svg, d, label) => activate(h('div', { class: 'sk ' + cls }, button3d(html('span', {}, svg), '', 5)), move(d), label);
    paint();
    // the arrows sit on the side of the grid they move towards
    root.append(h('div', { class: 'mz' }, arrow('mz-up', ARROW_UP, 0, 'Up'), arrow('mz-left', ARROW_L, 3, 'Left'), grid,
      arrow('mz-right', ARROW_R, 1, 'Right'), arrow('mz-down', ARROW_DN, 2, 'Down')));
  },
  mountBack(root, s) {
    // the gyro: a steel housing with a knurled bezel, a dark recessed face with a fixed index line, and a heavy
    // brass rotor turning slowly inside
    root.append(h('div', { class: 'gyro3d' }, h('small', {}, 'gyro'),
      h('div', { class: 'gyro' }, h('div', { class: 'gy' },
        cylZ(52, 10, 48, { color: '#8d9ca4' }), cylZ(48, 3, 48, { z: 10, color: '#c9d3d8', knurl: true }),
        h('i', { class: 'gy-face' }),
        h('div', { class: 'gy-rotor' }, cylZ(30, 6, 36, { color: '#c9a36a' }), h('i', { class: 'gy-disc' }), cylZ(6, 4, 14, { z: 6, color: '#4a5860' })),
        h('i', { class: 'gy-index' }))),
      h('b', { class: 'gyro-lbl' }, MAZE_ROT[s.rot])));
  },
  manual() {
    return `<p>The module shows a 6×6 grid with two green rings, the defuser's white square and a red goal. The walls are invisible. Guide the square to the goal with the four arrows; walking into a wall is a strike and the square stays put.</p>
      <ol>
        <li>Ask for the gyro plate on the back. It reads ROTATED 0°, 90° CW, 180° or 270° CW: the maze is mounted turned that far clockwise, as seen from the front.</li>
        <li>Turn this page the same way (clockwise by that angle). Now the mazes below look exactly like the module.</li>
        <li>Find the maze whose two green rings sit where the defuser sees them, then talk the square to the goal: up, down, left and right are the defuser's.</li>
      </ol>
      ${mazesFigure()}
      <table class="tbl"><tr><th>Gyro</th><th>Defuser's ring at column c, row r is on the unturned map at</th></tr>
        <tr><td>0°</td><td>column c, row r</td></tr><tr><td>90° CW</td><td>column r, row 7 − c</td></tr>
        <tr><td>180°</td><td>column 7 − c, row 7 − r</td></tr><tr><td>270° CW</td><td>column 7 − r, row c</td></tr></table>
      <p>Columns count from the left and rows from the top, 1 to 6, as the defuser sees them.</p>`;
  },
  manualBack() {
    return '<p>The rear plate is the gyro mount. Its stamped text says how far the maze is turned clockwise, seen from the front. Read the text, not the plate\'s orientation: seen from behind, left and right swap.</p>';
  }
});

/* ---------------------------------------------------------------------
   MODULE: Cipher

const CIPHER_WORDS = ['ALARM', 'BLAST', 'CABLE', 'DELTA', 'EMBER', 'FLARE', 'GHOST', 'HAVOC', 'LASER', 'NERVE', 'OMEGA', 'PANIC', 'QUAKE', 'RADAR', 'SHOCK', 'TIMER', 'VAULT', 'WATCH'];
const cipherEncode = (word, shifts) => [...word].map((c, i) => String.fromCharCode((c.charCodeAt(0) - 65 + shifts[i]) % 26 + 65)).join('');

Modules.register({

  title: 'Cipher',

      <p>The rotors are on the back, so their order is mirrored: the first digit from the right on the back belongs to the first letter on the front.</p>
      <table class="tbl"><tr>${strip.slice(0, 13).join('')}</tr><tr>${strip.slice(13).join('')}</tr></table>
      <p>The word is always one of these:</p>

  },
  manualBack() {

  }
});

/* ---------------------------------------------------------------------
   MODULE: Resistors
   Three colour-banded resistors on the front; how they are wired is drawn on the back.
   --------------------------------------------------------------------- */
const RES_VALUES = [10, 15, 22, 33, 47, 68, 100, 150, 220, 330, 470, 680];
const BAND_COLORS = ['black', 'brown', 'red', 'orange', 'yellow', 'green', 'blue', 'violet', 'grey', 'white'];
const BAND_HEX = { black: '#111417', brown: '#7a4a24', red: '#e5412d', orange: '#f08a24', yellow: '#f2c230', green: '#2fbf63', blue: '#2f6bff', violet: '#8e5bd8', grey: '#8a949a', white: '#f4f4ef' };
const resBands = v => { const m = v >= 100 ? 10 : 1, d = v / m; return [BAND_COLORS[Math.floor(d / 10)], BAND_COLORS[d % 10], m === 10 ? 'brown' : 'black']; };
const resTotal = s => s.wiring === 'series' ? s.r[0] + s.r[1] + s.r[2] : s.r[0] + s.r[1] / 2;

function resWiringSVG(s) {
  const box = (x, y, t) => `<rect x="${x}" y="${y - 9}" width="44" height="18" rx="3" fill="#e9eef0" stroke="#1b262c" stroke-width="2"/><text x="${x + 22}" y="${y + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#1b262c">${t}</text>`;
  const wires = d => `<path d="${d}" fill="none" stroke="#1b262c" stroke-width="2.2"/>`;
  const end = (x, y) => `<circle cx="${x}" cy="${y}" r="4" fill="#1b262c"/>`;
  const body = s.wiring === 'series'
    ? wires('M14 70 H24 M68 70 H92 M136 70 H160 M204 70 H216') + box(24, 70, 'R1') + box(92, 70, 'R2') + box(160, 70, 'R3') + end(14, 70) + end(216, 70)
    : wires('M14 70 H34 M78 70 H110 V44 H130 M110 70 V96 H130 M174 44 H194 V96 H174 M194 70 H216') + box(34, 70, 'R1') + box(130, 44, 'R2') + box(130, 96, 'R3') + end(14, 70) + end(216, 70);
  return `<svg viewBox="0 0 230 140" aria-hidden="true">${body}</svg>`;
}

Modules.register({
  id: 'resistors',
  title: 'Resistors',
  difficulty: 'hard',
  description: 'Three resistors with colour bands and three digit wheels. Read the bands, check on the back how the resistors are wired, and dial in the total resistance.',
  create(bomb, r) {

      const wiring = r.pick(['series', 'mixed']), a = r.pick(RES_VALUES), b = r.pick(RES_VALUES);
      const s = { wiring, r: [a, b, wiring === 'mixed' ? b : r.pick(RES_VALUES)] };

    const resistor = (v, k) => {

    };
    const digits = at.map((v, i) => {

        activate(h('div', { class: 'sk dn' }, button3d(html('span', {}, ARROW_DN), '', 5)), step(-1), `Digit ${i + 1} down`));
    });
    const measure = activate(h('div', { class: 'go' }, button3d('MEASURE', '', 9)), () => {
      if (ctl.isSolved()) return;
      const v = at[0] * 100 + at[1] * 10 + at[2];

    }, 'Measure');
    root.append(h('div', { class: 'stack resm' }, h('div', { class: 'res-row' }, s.r.map(resistor)),
      h('div', { class: 'res-dial' }, digits, h('span', { class: 'ohm' }, 'Ω')), measure));
  },
  mountBack(root, s) {
    root.append(html('div', { class: 'wiring', 'data-kind': s.wiring }, resWiringSVG(s)));
  },
  manual() {
    return `<p>Three resistors, R1 to R3, each with three colour bands read from the left: two digits, then a multiplier. Ignore the silver band at the right end. Black multiplies by 1, brown by 10. The wiring is drawn on the back of the bomb. Work out the total resistance in ohms, have the defuser dial it in on the three wheels (hundreds, tens, ones) and press Measure. A wrong total is a strike.</p>
      <table class="tbl"><tr><th>Colour</th><th>Digit</th><th>As multiplier</th></tr>${BAND_COLORS.map((c, k) => `<tr><td>${c}</td><td>${k}</td><td>${k === 0 ? '×1' : k === 1 ? '×10' : ''}</td></tr>`).join('')}</table>
      <ol>
        <li>All three in a row (in series): add them up. R1 + R2 + R3.</li>
        <li>R1, then R2 and R3 side by side (in parallel): R2 and R3 are always equal, and together they count half of one. R1 + R2 ÷ 2.</li>
      </ol>
      <p>Example: red, red, brown is 22 × 10 = 220 ohms.</p>`;

/* ---------------------------------------------------------------------
   MODULE: Signal
   An oscilloscope trace and three knobs to match it.
   --------------------------------------------------------------------- */
const SIGNAL_WAVES = ['sine', 'square', 'saw', 'triangle'];
const SIGNAL_AMP = { sine: 3, square: 5, saw: 2, triangle: 4 };
const SIGNAL_PHASE = [[0, 90], [180, 270]];   // [serial last digit odd][has a coin cell]
const signalWant = (s, b) => ({
  freq: Math.min(5, s.peaks + b.indicators.filter(i => i.lit).length),
  amp: SIGNAL_AMP[s.wave],
  phase: SIGNAL_PHASE[b.serialOdd ? 1 : 0][b.coins.length ? 1 : 0]
});
function wavePath(wave, peaks, w = 200, hgt = 70) {
  const n = 200, mid = hgt / 2, amp = hgt * .38, pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n * peaks * .999, f = t - Math.floor(t);   // stop just short of the next cycle: no extra peak at the right edge
    const y = wave === 'sine' ? Math.sin(t * 2 * Math.PI)
      : wave === 'square' ? (f < .5 ? 1 : -1)
      : wave === 'saw' ? 1 - 2 * f
      : (f < .25 ? 4 * f : f < .75 ? 2 - 4 * f : 4 * f - 4);
    pts.push(`${(i / n * w).toFixed(1)},${(mid - y * amp).toFixed(1)}`);
  }
  return `M${pts.join(' L')}`;
}

/* ---------------------------------------------------------------------
   MODULE: Multimeter
   Six jacks, two probes and a needle meter. Patch a cable across the one pair that reads the target voltage.
   --------------------------------------------------------------------- */
const METER_JACKS = ['#e5412d', '#1b1f22', '#f2c230', '#2f6bff', '#2fbf71', '#eef3f5'];   // insulator colours of jacks A to F
const meterTarget = b => b.coinVolts || b.batteries * 1.5 || 12;
function meterPair(s, b) {
  const t = meterTarget(b);
  for (let i = 0; i < 6; i++) for (let j = i + 1; j < 6; j++) if (Math.abs(s.volts[i] - s.volts[j]) === t) return [i, j];
}

/* ---------------------------------------------------------------------
   MODULE: Semaphore
   A signaller shows four flag letters; one of them is not in the serial number.
   Arm angles are degrees clockwise from straight down, as seen on the module (and drawn the same in the manual).
   --------------------------------------------------------------------- */
const SEMAPHORE = {
  A: [0, 45], B: [0, 90], C: [0, 135], D: [0, 180], E: [0, 225], F: [0, 270], G: [0, 315],
  H: [45, 90], I: [45, 135], K: [45, 180], L: [45, 225], M: [45, 270], N: [45, 315],
  O: [90, 135], P: [90, 180], Q: [90, 225], R: [90, 270], S: [90, 315],
  T: [135, 180], U: [135, 225], Y: [135, 270], J: [180, 270], V: [180, 315], W: [225, 270], X: [225, 315], Z: [270, 315]
};
const serialLetters = b => [...b.serial].filter(c => /[A-Z]/.test(c));
// Which shoulder holds which arm: positions out to the viewer's left (up to straight up) belong to the left shoulder,
// the rest (and straight down) to the right; when both lie on one side, one arm crosses the body.
function semArms(c) {
  const [a, b] = SEMAPHORE[c], left = x => x > 0 && x <= 180;
  if (left(a) !== left(b)) return left(a) ? [[-11, a], [11, b]] : [[-11, b], [11, a]];
  return left(a) ? [[11, a], [-11, b]] : [[-11, a], [11, b]];
}
const semaphoreOdd = (s, b) => s.seq.findIndex(c => !serialLetters(b).includes(c));

// The manual's chart: one small signaller per letter, arms at the same angles as on the module.
function semaphoreChart() {
  const letters = Object.keys(SEMAPHORE).sort(), at = (cx, cy, a, l) => [cx - l * Math.sin(a * Math.PI / 180), cy + l * Math.cos(a * Math.PI / 180)];
  const body = letters.map((c, k) => {
    const cx = 37 + (k % 7) * 74, cy = 34 + Math.floor(k / 7) * 86;
    const arms = semArms(c).map(([dx, a]) => {
      const sx = cx + dx / 2.2, [x, y] = at(sx, cy, a, 22), [fx, fy] = at(sx, cy, a, 30);
      return `<line x1="${sx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke-width="2.6"/>` +
        `<rect x="${(fx - 5).toFixed(1)}" y="${(fy - 5).toFixed(1)}" width="10" height="10" fill="#e5412d" stroke="#f2c230" stroke-width="1.6" transform="rotate(${a} ${fx.toFixed(1)} ${fy.toFixed(1)})"/>`;
    }).join('');
    return `<circle cx="${cx}" cy="${cy - 9}" r="5"/><rect x="${cx - 5}" y="${cy - 3}" width="10" height="19" rx="2" stroke-width="2"/>${arms}` + sMid(cx, cy + 46, c, 'font-size="14" font-weight="700"');
  }).join('');
  return schematic(520, 350, 'Semaphore letters', body, 'The semaphore letters, as seen from the front. The flags are red and yellow.');
}

function signaller() {
  const arm = side => h('div', { class: 'sem-arm', style: `left:${side}px` }, h('div', { class: 'sem-limb' }, cuboid(6, '', 'fill')), h('div', { class: 'sem-flag' }, cuboid(1.5, '', 'fill')), h('div', { class: 'sem-hand' }, cylZ(3.5, 5, 10, { color: '#d8b48a' })));
  const a = arm(-11), b = arm(11);
  const fig = h('div', { class: 'sem-fig' },
    h('div', { class: 'sem-torso' }, cuboid(10, '', 'fill')), h('div', { class: 'sem-head' }, cylZ(9, 9, 20, { color: '#d8b48a' }), cylZ(10, 3, 20, { z: 9, color: '#22384a' })),
    h('div', { class: 'sem-shoulder' }, a, b));
  // arm a always hangs from the left shoulder, arm b from the right
  return { fig, show: c => { const arms = Object.fromEntries(semArms(c).map(([dx, ang]) => [dx, ang])); a.style.setProperty('--a', arms[-11] + 'deg'); b.style.setProperty('--a', arms[11] + 'deg'); } };
}

      if (ctl.isSolved()) return;
      const want = dipPattern(dipCode(ctl.bomb));
      want.every((v, k) => v === pos[k]) ? ctl.solve() : ctl.strike('Applied the wrong switch pattern.');
    }, 'Apply');
    root.append(h('div', { class: 'stack' }, h('div', { class: 'dip' }, block), apply));
  },
  mountBack(root, s, ctl) {
    root.append(h('div', { class: 'dipb3d' }, h('div', { class: 'dipb' }, h('small', {}, 'code base'),
      h('b', { class: 'dip-base' }, String(ctl.bomb.batteries + ctl.bomb.indicators.filter(i => i.lit).length)),
      h('span', {}, 'batteries + lit indicators'))));
  },
  manual() {
    const arrow = on => on ? '▲' : '▼';
    return `<p>Four slide switches, numbered 1 to 4 from the left. Add up the number of batteries (the AA and D cells, not coin cells), the number of lit indicators and the last digit of the serial number. If the total is 16 or more, take away 16. Look it up below, have the defuser set the switches (▲ up, ▼ down) and press Apply. A wrong pattern is a strike.</p>
      <table class="tbl"><tr><th>Total</th><th>Switches 1 2 3 4</th><th>Total</th><th>Switches 1 2 3 4</th></tr>
      ${Array.from({ length: 8 }, (_, k) => `<tr><td>${k}</td><td>${dipPattern(k).map(arrow).join(' ')}</td><td>${k + 8}</td><td>${dipPattern(k + 8).map(arrow).join(' ')}</td></tr>`).join('')}</table>`;
  },
  manualBack() {
    return '<p>The rear plate is stamped with the code base: the number of batteries plus the number of lit indicators. Only the serial number\'s last digit is left to add.</p>';
  }
});

/* ---------------------------------------------------------------------
   MODULE: Safe
   A combination dial from 0 to 39, three tumbler lamps and a pull handle. Clockwise raises the number at the mark.
   --------------------------------------------------------------------- */
const serialDigitSum = b => [...b.serial].filter(c => /\d/.test(c)).reduce((a, c) => a + +c, 0);
function safeCombo(b) {
  const first = serialDigitSum(b) * 2 % 40, second = (first + 13 * (b.batteries + 1)) % 40;
  return [first, second, (second + 7 * (b.indicators.filter(i => i.lit).length + 1)) % 40];
}
// lock = { pos, dir, run, entries }: a number is entered where the dial changes direction (the first one only after
// clockwise turning); a full turn in one direction clears the entries.
function safeTurn(lock, d) {
  if (lock.dir && d !== lock.dir && (lock.entries.length || lock.dir > 0)) lock.entries.push({ at: lock.pos, dir: lock.dir });
  lock.run = d === lock.dir ? lock.run + 1 : 1;
  lock.dir = d; lock.pos = mod(lock.pos + d, 40);
  if (lock.run >= 40) { lock.entries = []; lock.run = 0; }
}
const safeOpens = (lock, [a, b, c]) => lock.entries.length === 2 && lock.entries[0].at === a && lock.entries[0].dir > 0 &&
  lock.entries[1].at === b && lock.entries[1].dir < 0 && lock.dir > 0 && lock.pos === c;

Modules.register({
  id: 'safe',
  title: 'Safe',
  difficulty: 'hard',
  rearOptional: true,
  description: 'A safe door with a combination dial. Work out three numbers from the case, turn the dial right, left and right again to enter them, then pull the handle.',
  create(bomb, r) {
    return { start: (safeCombo(bomb)[0] + 5 + r.int(30)) % 40 };
  },
  mount(root, s, ctl) {
    const lock = { pos: s.start, dir: 0, run: 0, entries: [] };
    let ang = s.start * 9;
    const face = html('div', { class: 'sf-face' }, `<svg viewBox="-56 -56 112 112" aria-hidden="true">${Array.from({ length: 40 }, (_, k) =>
      `<g transform="rotate(${-k * 9})"><line x1="0" y1="-53" x2="0" y2="${k % 5 ? -48 : -45}"/>${k % 5 ? '' : `<text x="0" y="-35">${k}</text>`}</g>`).join('')}</svg>`);
    const wheel = h('div', { class: 'sf-wheel', style: `--ang:${ang}deg` },
      cylZ(54, 7, 40, { z: 3, color: '#2b3136', knurl: true }), face,
      cylZ(19, 11, 24, { z: 10, color: '#3a4248', knurl: true }), h('i', { class: 'sf-cap' }));
    const dial = h('div', { class: 'sf-dial', 'data-at': String(s.start) },
      cylZ(62, 3, 48, { color: '#aebcc4' }), h('i', { class: 'sf-index' }), wheel);
    const lamps = [0, 1, 2].map(() => led('#ffb224', false));
    const show = () => {
      dial.dataset.at = String(lock.pos); wheel.style.setProperty('--ang', ang + 'deg');
      lamps.forEach((l, k) => l.classList.toggle('off', k >= Math.min(2, lock.entries.length)));
    };
    const step = d => {
      if (ctl.isSolved()) return;
      const n = lock.entries.length;
      safeTurn(lock, d); ang += d * 9; show();
      lock.entries.length > n ? ctl.sfx.click() : ctl.sfx.detent();
    };
    const ccw = activate(h('div', { class: 'sf-ccw' }), () => step(-1), 'Turn the dial anticlockwise');
    const cw = activate(h('div', { class: 'sf-cw' }), () => step(1), 'Turn the dial clockwise');
    const hit = h('div', { class: 'sf-hit' }, ccw, cw);
    hit.addEventListener('wheel', e => { e.preventDefault(); e.stopPropagation(); step(e.deltaY > 0 ? 1 : -1); }, { passive: false });
    let applied = 0;                                  // steps already taken during the current drag
    dragTurn(hit, { center: dial, detent: 9,
      show: d => {
        const n = Math.round(d / 9);
        while (applied < n) { step(1); applied++; }
        while (applied > n) { step(-1); applied--; }
        wheel.style.setProperty('--ang', ang - applied * 9 + d + 'deg');
      },
      commit: () => { applied = 0; show(); } });
    dial.append(hit);
    const handle = h('div', { class: 'sf-handle' },
      h('div', { class: 'sf-post', style: 'left:0' }, cuboid(14, '', 'fill')), h('div', { class: 'sf-post', style: 'right:0' }, cuboid(14, '', 'fill')),
      h('div', { class: 'sf-bar' }, lathe([[120, 5, '#c9d3d8']], 16)));
    activate(handle, () => {
      if (ctl.isSolved()) return;
      handle.classList.remove('pull'); void handle.offsetWidth; handle.classList.add('pull');
      if (safeOpens(lock, safeCombo(ctl.bomb))) { lamps.forEach(l => l.classList.remove('off')); handle.classList.add('open'); ctl.solve(); return; }
      Object.assign(lock, { dir: 0, run: 0, entries: [] }); show();
      ctl.strike('Pulled the handle with the wrong combination.');
    }, 'Pull the handle');
    root.append(h('div', { class: 'stack sf' },
      h('div', { class: 'sf-door' }, dial, h('div', { class: 'sf-lamps' }, lamps.map((l, k) => h('div', {}, l, h('small', {}, ['I', 'II', 'III'][k]))))),
      handle));
  },
  mountBack(root, s, ctl) {
    root.append(h('div', { class: 'sf-plate3d' }, h('div', { class: 'sf-plate' }, h('small', {}, 'Zero Hour Safe Co.'),
      h('span', {}, 'serial digit sum'), h('b', { class: 'sf-sum' }, String(serialDigitSum(ctl.bomb))))));
  },
  manual() {
    return `<p>A combination dial numbered 0 to 39 with a mark at the top, three tumbler lamps and a handle. Turning the dial clockwise raises the number at the mark, anticlockwise lowers it. The defuser turns it by dragging, by clicking its right half (clockwise) or left half (anticlockwise), or with the mouse wheel.</p>
      <p>Work out the combination. "Take away 40" means as often as needed, until the number is below 40.</p>
      <ol>
        <li>First number: the sum of the serial number's digits, times 2. Take away 40.</li>
        <li>Second number: the first number plus 13 times (the number of batteries + 1). Take away 40.</li>
        <li>Third number: the second number plus 7 times (the number of lit indicators + 1). Take away 40.</li>
      </ol>
      <p>Enter it: turn clockwise to the first number, then anticlockwise to the second, then clockwise to the third, and pull the handle. A number is entered where the dial changes direction, and a lamp lights for each of the first two; the lamps do not say whether a number is right. Turning anticlockwise before the first number does not count. To start again, turn the dial a full turn in one direction: the lamps go out.</p>
      <p>Pulling the handle with a wrong combination is a strike and clears the lamps.</p>`;
  },
  manualBack() {
    return '<p>The rear plate is the maker\'s plate, stamped with the sum of the serial number\'s digits.</p>';
  }
});

/* =====================================================================
   3. BOMB GENERATION
   ===================================================================== */
const INDICATOR_LABELS = ['CAR', 'FRK', 'SND', 'CLR', 'IND', 'SIG', 'NSA', 'TRN'];

const COIN_MODELS = [
  { model: 'CR2032', volts: 3, d: 72, t: 11.5 },
  { model: 'CR2025', volts: 3, d: 72, t: 9 },
  { model: 'CR2016', volts: 3, d: 72, t: 5.8 },
  { model: 'LR44', volts: 1.5, d: 44, t: 19.5 }
];
const ENC_CAPS = ['red', 'blue', 'yellow', 'white'];
const makeEncoders = (r, n) => Array.from({ length: n }, (_, i) => ({ label: 'ABCD'[i], cap: ENC_CAPS[i], value: r.int(10) }));
const makeLever = r => ({ up: r() < .5 });

function makeBomb(r, totalMs) {
  const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  const serial = r.pick(L) + r.int(10) + r.pick(L) + r.pick(L) + r.int(10) + r.int(10);
  const indicators = r.shuffle(INDICATOR_LABELS).slice(0, r.int(4)).map(label => ({ label, lit: r() < .5 }));
  const coins = Array.from({ length: [0, 0, 1, 1, 1, 2][r.int(6)] }, () => ({ ...r.pick(COIN_MODELS) }));
  const bomb = {
    serial,
    serialOdd: Number(serial.slice(-1)) % 2 === 1,
    serialVowel: /[AEIOU]/.test(serial),
    batteries: r.int(5),
    indicators,
    coins,
    coinVolts: coins.reduce((a, c) => a + c.volts, 0),
    encoders: makeEncoders(r, [0, 0, 1, 2, 3, 3][r.int(6)]),     // optional rotary encoders, readings 0 to 9
    lever: r() < .25 ? makeLever(r) : null,                      // junction-box lever: a decoy unless Breaker is on the bomb
    hasLit: l => indicators.some(i => i.label === l && i.lit),
    strikes: 0, total: totalMs, left: totalMs
  };
  bomb.encSum = () => bomb.encoders.reduce((a, e) => a + e.value, 0);   // read live: encoders can be turned
  bomb.leverUp = () => !!(bomb.lever && bomb.lever.up);                 // read live: the lever can be moved
  return bomb;
}

// Modules that need parts get them fitted if the bomb doesn't have them yet.
function ensureNeeds(bomb, defs, r) {
  const need = k => defs.some(d => d.needs && d.needs.includes(k));
  if (need('lever') && !bomb.lever) bomb.lever = makeLever(r);
  if (need('encoders') && bomb.encoders.length < 3) {
    const have = bomb.encoders.length;
    bomb.encoders.push(...makeEncoders(r, 3).slice(have));
  }
}

// Deals `count` modules at random, weighted by how close each module's difficulty is to the chosen one: the same 3,
// one step away 1, two steps away 0.3. Nothing is excluded. Each module is dealt once before any repeats; `max` caps repeats.
// `config` is settings.modules: switched-off modules are left out.
function pickModules(r, count, difficulty = 'medium', config = {}) {
  const weight = d => [3, 1, .3][Math.abs(DIFFICULTIES.indexOf(d.difficulty) - DIFFICULTIES.indexOf(difficulty))];
  const draw = pool => {
    let x = r() * pool.reduce((a, d) => a + weight(d), 0);
    return pool.find(d => (x -= weight(d)) < 0) || pool[pool.length - 1];
  };
  const pool = Modules.list.filter(d => !(config[d.id] && config[d.id].off));
  const fresh = pool.slice(), used = {}, out = [];
  // Needy modules: none on a 2-module bomb, one up to 5 modules or on Easy, two from 6; each one at most once.
  const maxNeedy = count <= 2 ? 0 : (difficulty === 'easy' || count < 6) ? 1 : 2;
  let needy = 0, guard = 0;
  const ok = d => !(d.max && (used[d.id] || 0) >= d.max) && !(d.needy && (used[d.id] || needy >= maxNeedy));
  while (out.length < count && guard++ < 200) {
    const src = fresh.some(ok) ? fresh.filter(ok) : pool.filter(ok);
    if (!src.length) break;
    const cand = draw(src);
    if (fresh.includes(cand)) fresh.splice(fresh.indexOf(cand), 1);
    used[cand.id] = (used[cand.id] || 0) + 1;
    if (cand.needy) needy++;
    out.push(cand);
  }
  return out;
}

// Whether a dealt module gets its rear plate: required plates always; optional ones per the player's setting.
function rearFor(r, def, config = {}) {
  if (!def.mountBack) return false;
  if (!def.rearOptional) return true;
  const mode = (config[def.id] && config[def.id].rear) || 'always';
  return mode === 'always' || (mode === 'sometimes' && r() < .5);
}

/* =====================================================================
   3b. LOGO
   A countdown ring (the last stretch already burnt) around a slashed zero,
   inside a broken hexagon frame. `burn` is the burnt share of the ring.
   ===================================================================== */
function logoMark(size = 96, o = {}) {
  const burn = o.burn ?? .25, N = 60, lit = Math.round(N * (1 - burn));
  let ticks = '';
  for (let i = 0; i < N; i++) {
    const a = i * 6 * Math.PI / 180, sn = Math.sin(a), cs = -Math.cos(a);
    const major = i % 5 === 0, r1 = major ? 32 : 37, r2 = 45, on = i < lit;
    ticks += `<line x1="${(60 + r1 * sn).toFixed(2)}" y1="${(60 + r1 * cs).toFixed(2)}" x2="${(60 + r2 * sn).toFixed(2)}" y2="${(60 + r2 * cs).toFixed(2)}" ` +
      `stroke="${on ? '#43dfff' : '#ff3b5c'}" stroke-opacity="${on ? 1 : .8}" stroke-width="${major ? 2.8 : 1.8}" stroke-linecap="round"` +
      (o.sweep ? ` class="tk" style="animation-delay:${i * 16}ms"` : '') + '/>';
  }
  return `<svg class="logo-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="${size}" height="${size}" fill="none" role="img" aria-label="Zero Hour logo">` +
    `<path d="M60 3 L109 31.5 V88.5 L60 117 L11 88.5 V31.5 Z" stroke="#43dfff" stroke-opacity=".6" stroke-width="1.6" stroke-dasharray="66 9"/>` +
    ticks +
    `<path d="M53.500 6 H66.500 L60 17 Z" fill="#ffb224"/>` +
    `<ellipse cx="60" cy="61" rx="12" ry="19" stroke="#d6eef3" stroke-width="5"/>` +
    `<path d="M50.500 74 L69.500 48" stroke="#ffb224" stroke-width="3.6" stroke-linecap="round"/></svg>`;
}

function barcode(text) {
  let x = 0, bars = '';
  for (const ch of text) {
    const c = ch.charCodeAt(0);
    for (let b = 0; b < 6; b++) { const w = (c >> b) & 1 ? 2.4 : 1.2; bars += `<rect x="${x.toFixed(1)}" y="0" width="${w}" height="14"/>`; x += w + 1.3; }
  }
  return `<svg class="bar-code" viewBox="0 0 ${x.toFixed(1)} 14" preserveAspectRatio="none" fill="currentColor" aria-hidden="true">${bars}</svg>`;
}

/* =====================================================================
   4. THE 3D CASE
   Faces: front (clock + modules), back (modules), left, right, top, bottom
   (serial number, battery holders and indicators in random spots).
   ===================================================================== */
// The case's bays: three columns (two on narrow screens). Three columns have two rows, and a third for 7 to 9 modules.
function layoutFor(vw, count = 6) {
  const cols = vw < 820 ? 2 : 3, rows = cols === 3 ? (count > 6 ? 3 : 2) : Math.max(3, Math.ceil(count / 2));
  const SW = 244, SH = 272, GAP = 14, P = 22, TB = 136, D = 210;
  const W = P * 2 + cols * SW + (cols - 1) * GAP + 10;
  const H = P * 2 + TB + GAP + rows * SH + (rows - 1) * GAP + 10;
  return { cols, rows, SW, SH, GAP, P, TB, D, W, H, wr: Math.floor((H - 42) / 170), wc: Math.floor((W - 42) / 160) };
}

// ---- coin cells: sizes follow the real cells (CR2032 20 x 3.2 mm, LR44 11.6 x 5.4 mm) ----
function coinCellEl(c) {
  const R = c.d / 2, N = 30, side = 2 * R * Math.sin(Math.PI / N) * 1.06, apo = R * Math.cos(Math.PI / N);
  const coin = h('div', { class: 'coin' + (c.d < 60 ? ' sm' : ''), style: `width:${c.d}px;height:${c.d}px;left:50%;top:50%;margin:${-R}px 0 0 ${-R}px` });
  for (let k = 0; k < N; k++) {                       // the steel can wall, as a many-sided ring
    const phi = k * 360 / N, rad = phi * Math.PI / 180;
    const b = Math.max(0, -.55 * Math.sin(rad) + .8 * Math.cos(rad));
    coin.append(h('i', {
      class: 'cf',
      style: `width:${side.toFixed(2)}px;height:${c.t}px;left:calc(50% - ${(side / 2).toFixed(2)}px);top:calc(50% - ${c.t / 2}px);` +
        `transform:translateZ(${c.t / 2}px) rotateZ(${phi.toFixed(1)}deg) translateY(${(-apo).toFixed(2)}px) rotateX(90deg);--b:${b.toFixed(3)}`
    }));
  }
  coin.append(
    h('i', { class: 'lip', style: `transform:translateZ(${(c.t - .5).toFixed(2)}px)` }),
    h('i', { class: 'cap', style: `transform:translateZ(${c.t.toFixed(2)}px)` }, h('b', {}, '+'), h('span', {}, c.model), h('span', {}, c.volts + 'V')));
  return coin;
}

// A coin cell in a black holder with a steel retaining clip over the rim and a contact tab underneath.
function coinHolder(c) {
  const R = c.d / 2, W = c.d + 44, span = R * 1.05, step = c.t + 2;
  const at = (x, y, w, hgt, extra = '') => `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${hgt}px;${extra}`;
  const parts = [
    h('i', { class: 'seat', style: at(W / 2 - R - 4, W / 2 - R - 4, c.d + 8, c.d + 8) }),
    coinCellEl(c),
    h('div', { style: at(W / 2 - span / 2 - 3, W / 2 - R - 14, 7, 7) }, cuboid(step, '', 'fill mclip')),
    h('div', { style: at(W / 2 + span / 2 - 4, W / 2 - R - 14, 7, 7) }, cuboid(step, '', 'fill mclip')),
    h('div', { style: at(W / 2 - span / 2 - 3, W / 2 - R - 8, span + 7, 11, `transform:translateZ(${step}px)`) }, cuboid(2, '', 'fill mclip')),
    h('i', { class: 'tab', style: `left:${W / 2 - 13}px;bottom:7px;width:26px` }),
    h('i', { class: 'plus', style: `left:${W / 2 + span / 2 + 12}px;top:${W / 2 - R - 20}px;font-style:normal` }, '+')
  ];
  const e = cuboid(5, h('div', { style: `position:relative;width:${W}px;height:${W}px` }, parts), 'w-coin');
  e.setAttribute('aria-label', `coin cell ${c.model}, ${c.volts} volts`);
  return e;
}

// A solid upright cylinder (axis along z) built from facets and closed by a top disc, drawn around a zero-size anchor.
function cylZ(R, hgt, n, { z = 0, color = '#cfd8dd', knurl = false, hex = false } = {}) {
  const side = 2 * R * Math.sin(Math.PI / n) * 1.05, apo = R * Math.cos(Math.PI / n);
  const e = h('div', { class: 'cz', style: `transform:translateZ(${z + .03}px);--fc:${color}` });   // a hair above z: stacked parts never share a plane
  for (let k = 0; k < n; k++) {
    const phi = k * 360 / n, rad = phi * Math.PI / 180;
    const lit = Math.max(0, -.55 * Math.sin(rad) + .8 * Math.cos(rad));
    const b = Math.min(1, .5 * lit + (knurl ? (k % 2 ? .3 : .02) : .22) + .1);     // knurling: alternate bright and dark ridges
    e.append(h('i', {
      class: 'fz',
      style: `width:${side.toFixed(2)}px;height:${hgt}px;left:${(-side / 2).toFixed(2)}px;top:${-hgt / 2}px;` +
        `transform:translateZ(${hgt / 2}px) rotateZ(${phi}deg) translateY(${(-apo).toFixed(2)}px) rotateX(90deg);--b:${b.toFixed(3)}`
    }));
  }
  e.append(h('i', { class: 'cz-top' + (hex ? ' hex' : ''), style: `width:${2 * R}px;height:${2 * R}px;left:${-R}px;top:${-R}px;transform:translateZ(${hgt}px)` }));
  return e;
}

// A round ring (a torus) lying in the plane, built from short tube segments: radius R, tube radius r, centred on its anchor.
function torus(R, r, segs, color, n = 12) {
  const e = h('div', { class: 'torus', style: `--c:${color}` }), len = 2 * Math.PI * R / segs * 1.08;
  for (let k = 0; k < segs; k++) {
    const t = tube(r, n, 0);
    t.style.cssText += `;position:absolute;left:${(-len / 2).toFixed(2)}px;top:${-r}px;width:${len.toFixed(2)}px`;
    e.append(h('div', { class: 'torus-seg', style: `transform:rotateZ(${(k * 360 / segs).toFixed(2)}deg) translateY(${-R}px)` }, t));
  }
  return e;
}

// ---- rotary encoder: knurled aluminium knob on a numbered dial, ten detents ----
const ENC_HEX = { red: '#e5412d', blue: '#2f6bff', yellow: '#f2c230', white: '#eef3f5' };
function encoderEl(enc) {
  let ang = enc.value * 36;
  const top = h('div', { class: 'enc-top', style: `--ang:${ang}deg;--cc:${ENC_HEX[enc.cap]}` });
  const hit = h('div', { class: 'enc-hit', role: 'button', tabindex: '0' });
  const label = () => hit.setAttribute('aria-label', `rotary encoder ${enc.label}, reading ${enc.value}`);
  const turn = d => {
    enc.value = (enc.value + d + 10) % 10; ang += d * 36;
    top.style.setProperty('--ang', ang + 'deg'); sfx.detent(); label();
  };
  hit.addEventListener('click', e => turn((e.offsetX != null ? e.offsetX : e.clientX - hit.getBoundingClientRect().x) < hit.offsetWidth / 2 ? -1 : 1));
  hit.addEventListener('contextmenu', e => { e.preventDefault(); turn(-1); });
  hit.addEventListener('wheel', e => { e.preventDefault(); e.stopPropagation(); turn(e.deltaY > 0 ? 1 : -1); }, { passive: false });
  hit.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); turn(e.shiftKey ? -1 : 1); } });
  dragTurn(hit, { detent: 36,
    show: d => top.style.setProperty('--ang', ang + d + 'deg'),
    commit: n => { if (n) for (let k = 0; k < Math.abs(n); k++) turn(Math.sign(n)); else top.style.setProperty('--ang', ang + 'deg'); } });
  label();
  const dial = [];
  for (let k = 0; k < 10; k++) dial.push(h('div', { class: 'dg', style: `--a:${k * 36}deg` }, h('span', {}, String(k)), h('i')));
  return cuboid(4, [
    h('div', { class: 'enc-ctr' },
      dial,
      cylZ(26, 1.6, 32, { color: '#7f8d96' }),                    // lock washer

    const cand = [];

    if (!cand.length) return null;

  stage.addEventListener('wheel', e => {
    e.preventDefault();
    if (anim) settleHere();
    goal.zoom = clamp(goal.zoom * Math.exp(-e.deltaY * .0012), .6, 2.2);
    lastInput = performance.now();
    wake();
    api && api.onZoom && api.onZoom(goal.zoom);
  }, { passive: false, signal: ac.signal });

  const ro = new ResizeObserver(fit);
  ro.observe(stage);
  fit();

  api = {
    st, onFacing: init.onFacing || null, onTurn: null, onZoom: null,
    zoomTo(z) { anim = null; goal.zoom = z; wake(); },     // follow another view's zoom (module explorer link)
    turnTo(yaw, pitch) {                                   // follow another view (module viewer link)
      anim = null; vel.yaw = vel.pitch = 0;
      goal.yaw = yaw + 360 * Math.round((st.yaw - yaw) / 360); goal.pitch = pitch;
      wake();
    },
    refresh() { facing = ''; shade(); },
    animateTo,
    goTo(face) {
      const [yb, pb, zb] = VIEWS[face];
      animateTo({ yaw: yb + 360 * Math.round((st.yaw - yb) / 360), pitch: pb, zoom: zb }, 750);
    },
    home() { animateTo({ yaw: HOME.yaw + 360 * Math.round((st.yaw - HOME.yaw) / 360), pitch: HOME.pitch, zoom: 1 }, 750); },
    nudge(dyaw, dpitch) { const b = anim ? anim.to : goal; animateTo({ yaw: b.yaw + dyaw, pitch: clamp(b.pitch + dpitch, -90, 90), zoom: b.zoom }, 200); },
    zoomBy(d) { const b = anim ? anim.to : goal; animateTo({ yaw: b.yaw, pitch: b.pitch, zoom: clamp(b.zoom + d, .6, 2.2) }, 200); },
    getView: () => ({ yaw: st.yaw, pitch: st.pitch, zoom: st.zoom }),
    blast() { bomb3d.classList.add('blast'); animateTo({ zoom: st.zoom * 1.6 }, 520); },
    destroy() { ac.abort(); cancelAnimationFrame(raf); raf = 0; ro.disconnect(); }
  };
  return api;
}
