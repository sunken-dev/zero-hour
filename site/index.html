/* ---------------------------------------------------------------------
   MODULE: Semaphore
   A signaller shows four flag letters; one of them is not in the serial number.
   Arm angles are degrees clockwise from straight down, as seen on the module (and drawn the same in the manual).
   --------------------------------------------------------------------- */
const SEMAPHORE = {
  A: [0, 45], B: [0, 90], C: [0, 135], D: [0, 180], E: [0, 225], F: [0, 270], G: [0, 315],
  H: [45, 90], I: [45, 135], K: [45, 180], L: [45, 225], M: [45, 270], N: [45, 315],
  O: [90, 135], P: [90, 180], Q: [90, 225], R: [90, 270], S: [90, 315],
  T: [135, 180], U: [135, 225], Y: [135, 270], J: [180, 270], V: [180, 315], W: [225, 270], X: [225, 315], Z: [270, 315]
};
const serialLetters = b => [...b.serial].filter(c => /[A-Z]/.test(c));
// Which shoulder holds which arm: positions out to the viewer's left (up to straight up) belong to the left shoulder,
// the rest (and straight down) to the right; when both lie on one side, one arm crosses the body.
function semArms(c) {
  const [a, b] = SEMAPHORE[c], left = x => x > 0 && x <= 180;
  if (left(a) !== left(b)) return left(a) ? [[-11, a], [11, b]] : [[-11, b], [11, a]];
  return left(a) ? [[11, a], [-11, b]] : [[-11, a], [11, b]];
}
const semaphoreOdd = (s, b) => s.seq.findIndex(c => !serialLetters(b).includes(c));

// The manual's chart: one small signaller per letter, arms at the same angles as on the module.
function semaphoreChart() {
  const letters = Object.keys(SEMAPHORE).sort(), at = (cx, cy, a, l) => [cx - l * Math.sin(a * Math.PI / 180), cy + l * Math.cos(a * Math.PI / 180)];
  const body = letters.map((c, k) => {
    const cx = 37 + (k % 7) * 74, cy = 34 + Math.floor(k / 7) * 86;
    const arms = semArms(c).map(([dx, a]) => {
      const sx = cx + dx / 2.2, [x, y] = at(sx, cy, a, 22), [fx, fy] = at(sx, cy, a, 30);
      return `<line x1="${sx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke-width="2.6"/>` +
        `<rect x="${(fx - 5).toFixed(1)}" y="${(fy - 5).toFixed(1)}" width="10" height="10" fill="#e5412d" stroke="#f2c230" stroke-width="1.6" transform="rotate(${a} ${fx.toFixed(1)} ${fy.toFixed(1)})"/>`;
    }).join('');
    return `<circle cx="${cx}" cy="${cy - 9}" r="5"/><rect x="${cx - 5}" y="${cy - 3}" width="10" height="19" rx="2" stroke-width="2"/>${arms}` + sMid(cx, cy + 46, c, 'font-size="14" font-weight="700"');
  }).join('');
  return schematic(520, 350, 'Semaphore letters', body, 'The semaphore letters, as seen from the front. The flags are red and yellow.');
}

function signaller() {
  const arm = side => h('div', { class: 'sem-arm', style: `left:${side}px` }, h('div', { class: 'sem-limb' }, cuboid(6, '', 'fill')), h('div', { class: 'sem-flag' }, cuboid(1.5, '', 'fill')), h('div', { class: 'sem-hand' }, cylZ(3.5, 5, 10, { color: '#d8b48a' })));
  const a = arm(-11), b = arm(11);
  const fig = h('div', { class: 'sem-fig' },
    h('div', { class: 'sem-torso' }, cuboid(10, '', 'fill')), h('div', { class: 'sem-head' }, cylZ(9, 9, 20, { color: '#d8b48a' }), cylZ(10, 3, 20, { z: 9, color: '#22384a' })),
    h('div', { class: 'sem-shoulder' }, a, b));
  // arm a always hangs from the left shoulder, arm b from the right
  return { fig, show: c => { const arms = Object.fromEntries(semArms(c).map(([dx, ang]) => [dx, ang])); a.style.setProperty('--a', arms[-11] + 'deg'); b.style.setProperty('--a', arms[11] + 'deg'); } };
}

/* =====================================================================
   3. BOMB GENERATION
   ===================================================================== */
const INDICATOR_LABELS = ['CAR', 'FRK', 'SND', 'CLR', 'IND', 'SIG', 'NSA', 'TRN'];

const COIN_MODELS = [
  { model: 'CR2032', volts: 3, d: 72, t: 11.5 },
  { model: 'CR2025', volts: 3, d: 72, t: 9 },
  { model: 'CR2016', volts: 3, d: 72, t: 5.8 },
  { model: 'LR44', volts: 1.5, d: 44, t: 19.5 }
];
const ENC_CAPS = ['red', 'blue', 'yellow', 'white'];
const makeEncoders = (r, n) => Array.from({ length: n }, (_, i) => ({ label: 'ABCD'[i], cap: ENC_CAPS[i], value: r.int(10) }));
const makeLever = r => ({ up: r() < .5 });

function makeBomb(r, totalMs) {
  const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  const serial = r.pick(L) + r.int(10) + r.pick(L) + r.pick(L) + r.int(10) + r.int(10);
  const indicators = r.shuffle(INDICATOR_LABELS).slice(0, r.int(4)).map(label => ({ label, lit: r() < .5 }));
  const coins = Array.from({ length: [0, 0, 1, 1, 1, 2][r.int(6)] }, () => ({ ...r.pick(COIN_MODELS) }));
  const bomb = {
    serial,
    serialOdd: Number(serial.slice(-1)) % 2 === 1,
    serialVowel: /[AEIOU]/.test(serial),
    batteries: r.int(5),
    indicators,
    coins,
    coinVolts: coins.reduce((a, c) => a + c.volts, 0),
    encoders: makeEncoders(r, [0, 0, 1, 2, 3, 3][r.int(6)]),     // optional rotary encoders, readings 0 to 9
    lever: r() < .25 ? makeLever(r) : null,                      // junction-box lever: a decoy unless Breaker is on the bomb
    hasLit: l => indicators.some(i => i.label === l && i.lit),
    strikes: 0, total: totalMs, left: totalMs
  };
  bomb.encSum = () => bomb.encoders.reduce((a, e) => a + e.value, 0);   // read live: encoders can be turned
  bomb.leverUp = () => !!(bomb.lever && bomb.lever.up);                 // read live: the lever can be moved
  return bomb;
}

// Modules that need parts get them fitted if the bomb doesn't have them yet.
function ensureNeeds(bomb, defs, r) {
  const need = k => defs.some(d => d.needs && d.needs.includes(k));
  if (need('lever') && !bomb.lever) bomb.lever = makeLever(r);
  if (need('encoders') && bomb.encoders.length < 3) {
    const have = bomb.encoders.length;
    bomb.encoders.push(...makeEncoders(r, 3).slice(have));
  }
}

// Deals `count` modules at random, weighted by how close each module's difficulty is to the chosen one: the same 3,
// one step away 1, two steps away 0.3. Nothing is excluded. Each module is dealt once before any repeats; `max` caps repeats.
// `config` is settings.modules: switched-off modules are left out.
function pickModules(r, count, difficulty = 'medium', config = {}) {
  const weight = d => [3, 1, .3][Math.abs(DIFFICULTIES.indexOf(d.difficulty) - DIFFICULTIES.indexOf(difficulty))];
  const draw = pool => {
    let x = r() * pool.reduce((a, d) => a + weight(d), 0);
    return pool.find(d => (x -= weight(d)) < 0) || pool[pool.length - 1];
  };
  const pool = Modules.list.filter(d => !(config[d.id] && config[d.id].off));
  const fresh = pool.slice(), used = {}, out = [];
  // Needy modules: none on a 2-module bomb, one up to 5 modules or on Easy, two from 6; each one at most once.
  const maxNeedy = count <= 2 ? 0 : (difficulty === 'easy' || count < 6) ? 1 : 2;
  let needy = 0, guard = 0;
  const ok = d => !(d.max && (used[d.id] || 0) >= d.max) && !(d.needy && (used[d.id] || needy >= maxNeedy));
  while (out.length < count && guard++ < 200) {
    const src = fresh.some(ok) ? fresh.filter(ok) : pool.filter(ok);
    if (!src.length) break;
    const cand = draw(src);
    if (fresh.includes(cand)) fresh.splice(fresh.indexOf(cand), 1);
    used[cand.id] = (used[cand.id] || 0) + 1;
    if (cand.needy) needy++;
    out.push(cand);
  }
  return out;
}

// Whether a dealt module gets its rear plate: required plates always; optional ones per the player's setting.
function rearFor(r, def, config = {}) {
  if (!def.mountBack) return false;
  if (!def.rearOptional) return true;
  const mode = (config[def.id] && config[def.id].rear) || 'always';
  return mode === 'always' || (mode === 'sometimes' && r() < .5);
}

/* =====================================================================
   3b. LOGO
   A countdown ring (the last stretch already burnt) around a slashed zero,
   inside a broken hexagon frame. `burn` is the burnt share of the ring.
   ===================================================================== */
function logoMark(size = 96, o = {}) {
  const burn = o.burn ?? .25, N = 60, lit = Math.round(N * (1 - burn));
  let ticks = '';
  for (let i = 0; i < N; i++) {
    const a = i * 6 * Math.PI / 180, sn = Math.sin(a), cs = -Math.cos(a);
    const major = i % 5 === 0, r1 = major ? 32 : 37, r2 = 45, on = i < lit;
    ticks += `<line x1="${(60 + r1 * sn).toFixed(2)}" y1="${(60 + r1 * cs).toFixed(2)}" x2="${(60 + r2 * sn).toFixed(2)}" y2="${(60 + r2 * cs).toFixed(2)}" ` +
      `stroke="${on ? '#43dfff' : '#ff3b5c'}" stroke-opacity="${on ? 1 : .8}" stroke-width="${major ? 2.8 : 1.8}" stroke-linecap="round"` +
      (o.sweep ? ` class="tk" style="animation-delay:${i * 16}ms"` : '') + '/>';
  }
  return `<svg class="logo-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="${size}" height="${size}" fill="none" role="img" aria-label="Zero Hour logo">` +
    `<path d="M60 3 L109 31.5 V88.5 L60 117 L11 88.5 V31.5 Z" stroke="#43dfff" stroke-opacity=".6" stroke-width="1.6" stroke-dasharray="66 9"/>` +
    ticks +
    `<path d="M53.500 6 H66.500 L60 17 Z" fill="#ffb224"/>` +
    `<ellipse cx="60" cy="61" rx="12" ry="19" stroke="#d6eef3" stroke-width="5"/>` +
    `<path d="M50.500 74 L69.500 48" stroke="#ffb224" stroke-width="3.6" stroke-linecap="round"/></svg>`;
}

function barcode(text) {
  let x = 0, bars = '';
  for (const ch of text) {
    const c = ch.charCodeAt(0);
    for (let b = 0; b < 6; b++) { const w = (c >> b) & 1 ? 2.4 : 1.2; bars += `<rect x="${x.toFixed(1)}" y="0" width="${w}" height="14"/>`; x += w + 1.3; }
  }
  return `<svg class="bar-code" viewBox="0 0 ${x.toFixed(1)} 14" preserveAspectRatio="none" fill="currentColor" aria-hidden="true">${bars}</svg>`;
}

/* =====================================================================
   4. THE 3D CASE
   Faces: front (clock + modules), back (modules), left, right, top, bottom
   (serial number, battery holders and indicators in random spots).
   ===================================================================== */
// The case's bays: three columns (two on narrow screens). Three columns have two rows, and a third for 7 to 9 modules.
function layoutFor(vw, count = 6) {
  const cols = vw < 820 ? 2 : 3, rows = cols === 3 ? (count > 6 ? 3 : 2) : Math.max(3, Math.ceil(count / 2));
  const SW = 244, SH = 272, GAP = 14, P = 22, TB = 136, D = 210;
  const W = P * 2 + cols * SW + (cols - 1) * GAP + 10;
  const H = P * 2 + TB + GAP + rows * SH + (rows - 1) * GAP + 10;
  return { cols, rows, SW, SH, GAP, P, TB, D, W, H, wr: Math.floor((H - 42) / 170), wc: Math.floor((W - 42) / 160) };
}

// ---- coin cells: sizes follow the real cells (CR2032 20 x 3.2 mm, LR44 11.6 x 5.4 mm) ----
function coinCellEl(c) {
  const R = c.d / 2, N = 30, side = 2 * R * Math.sin(Math.PI / N) * 1.06, apo = R * Math.cos(Math.PI / N);
  const coin = h('div', { class: 'coin' + (c.d < 60 ? ' sm' : ''), style: `width:${c.d}px;height:${c.d}px;left:50%;top:50%;margin:${-R}px 0 0 ${-R}px` });
  for (let k = 0; k < N; k++) {                       // the steel can wall, as a many-sided ring
    const phi = k * 360 / N, rad = phi * Math.PI / 180;
    const b = Math.max(0, -.55 * Math.sin(rad) + .8 * Math.cos(rad));
    coin.append(h('i', {
      class: 'cf',
      style: `width:${side.toFixed(2)}px;height:${c.t}px;left:calc(50% - ${(side / 2).toFixed(2)}px);top:calc(50% - ${c.t / 2}px);` +
        `transform:translateZ(${c.t / 2}px) rotateZ(${phi.toFixed(1)}deg) translateY(${(-apo).toFixed(2)}px) rotateX(90deg);--b:${b.toFixed(3)}`
    }));
  }
  coin.append(
    h('i', { class: 'lip', style: `transform:translateZ(${(c.t - .5).toFixed(2)}px)` }),
    h('i', { class: 'cap', style: `transform:translateZ(${c.t.toFixed(2)}px)` }, h('b', {}, '+'), h('span', {}, c.model), h('span', {}, c.volts + 'V')));
  return coin;
}

// A coin cell in a black holder with a steel retaining clip over the rim and a contact tab underneath.
function coinHolder(c) {
  const R = c.d / 2, W = c.d + 44, span = R * 1.05, step = c.t + 2;
  const at = (x, y, w, hgt, extra = '') => `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${hgt}px;${extra}`;
  const parts = [
    h('i', { class: 'seat', style: at(W / 2 - R - 4, W / 2 - R - 4, c.d + 8, c.d + 8) }),

    h('div', { style: at(W / 2 - span / 2 - 3, W / 2 - R - 14, 7, 7) }, cuboid(step, '', 'fill mclip')),
    h('div', { style: at(W / 2 + span / 2 - 4, W / 2 - R - 14, 7, 7) }, cuboid(step, '', 'fill mclip')),
    h('div', { style: at(W / 2 - span / 2 - 3, W / 2 - R - 8, span + 7, 11, `transform:translateZ(${step}px)`) }, cuboid(2, '', 'fill mclip')),
    h('i', { class: 'tab', style: `left:${W / 2 - 13}px;bottom:7px;width:26px` }),

  ];

  e.setAttribute('aria-label', `coin cell ${c.model}, ${c.volts} volts`);
  return e;
}

// A solid upright cylinder (axis along z) built from facets and closed by a top disc, drawn around a zero-size anchor.
function cylZ(R, hgt, n, { z = 0, color = '#cfd8dd', knurl = false, hex = false } = {}) {
  const side = 2 * R * Math.sin(Math.PI / n) * 1.05, apo = R * Math.cos(Math.PI / n);
  const e = h('div', { class: 'cz', style: `transform:translateZ(${z + .03}px);--fc:${color}` });   // a hair above z: stacked parts never share a plane
  for (let k = 0; k < n; k++) {
    const phi = k * 360 / n, rad = phi * Math.PI / 180;
    const lit = Math.max(0, -.55 * Math.sin(rad) + .8 * Math.cos(rad));
    const b = Math.min(1, .5 * lit + (knurl ? (k % 2 ? .3 : .02) : .22) + .1);     // knurling: alternate bright and dark ridges
    e.append(h('i', {
      class: 'fz',
      style: `width:${side.toFixed(2)}px;height:${hgt}px;left:${(-side / 2).toFixed(2)}px;top:${-hgt / 2}px;` +
        `transform:translateZ(${hgt / 2}px) rotateZ(${phi}deg) translateY(${(-apo).toFixed(2)}px) rotateX(90deg);--b:${b.toFixed(3)}`
    }));
  }
  e.append(h('i', { class: 'cz-top' + (hex ? ' hex' : ''), style: `width:${2 * R}px;height:${2 * R}px;left:${-R}px;top:${-R}px;transform:translateZ(${hgt}px)` }));
  return e;
}

// A round ring (a torus) lying in the plane, built from short tube segments: radius R, tube radius r, centred on its anchor.
function torus(R, r, segs, color, n = 12) {
  const e = h('div', { class: 'torus', style: `--c:${color}` }), len = 2 * Math.PI * R / segs * 1.08;
  for (let k = 0; k < segs; k++) {
    const t = tube(r, n, 0);
    t.style.cssText += `;position:absolute;left:${(-len / 2).toFixed(2)}px;top:${-r}px;width:${len.toFixed(2)}px`;
    e.append(h('div', { class: 'torus-seg', style: `transform:rotateZ(${(k * 360 / segs).toFixed(2)}deg) translateY(${-R}px)` }, t));
  }
  return e;
}

// ---- rotary encoder: knurled aluminium knob on a numbered dial, ten detents ----
const ENC_HEX = { red: '#e5412d', blue: '#2f6bff', yellow: '#f2c230', white: '#eef3f5' };
function encoderEl(enc) {
  let ang = enc.value * 36;
  const top = h('div', { class: 'enc-top', style: `--ang:${ang}deg;--cc:${ENC_HEX[enc.cap]}` });
  const hit = h('div', { class: 'enc-hit', role: 'button', tabindex: '0' });
  const label = () => hit.setAttribute('aria-label', `rotary encoder ${enc.label}, reading ${enc.value}`);
  const turn = d => {
    enc.value = (enc.value + d + 10) % 10; ang += d * 36;
    top.style.setProperty('--ang', ang + 'deg'); sfx.detent(); label();
  };
  hit.addEventListener('click', e => turn((e.offsetX != null ? e.offsetX : e.clientX - hit.getBoundingClientRect().x) < hit.offsetWidth / 2 ? -1 : 1));
  hit.addEventListener('contextmenu', e => { e.preventDefault(); turn(-1); });
  hit.addEventListener('wheel', e => { e.preventDefault(); e.stopPropagation(); turn(e.deltaY > 0 ? 1 : -1); }, { passive: false });
  hit.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); turn(e.shiftKey ? -1 : 1); } });
  dragTurn(hit, { detent: 36,
    show: d => top.style.setProperty('--ang', ang + d + 'deg'),
    commit: n => { if (n) for (let k = 0; k < Math.abs(n); k++) turn(Math.sign(n)); else top.style.setProperty('--ang', ang + 'deg'); } });
  label();
  const dial = [];
  for (let k = 0; k < 10; k++) dial.push(h('div', { class: 'dg', style: `--a:${k * 36}deg` }, h('span', {}, String(k)), h('i')));
  return cuboid(4, [
    h('div', { class: 'enc-ctr' },
      dial,
      cylZ(26, 1.6, 32, { color: '#7f8d96' }),                    // lock washer
      cylZ(23, 4.5, 6, { z: 1.6, color: '#aebcc4', hex: true }),   // hex nut
      cylZ(17, 3, 28, { z: 6.1, color: '#c9d3d8' }),               // bushing
      h('div', { class: 'enc-knob' }, cylZ(20, 11, 36, { knurl: true, color: '#d3dce1' }), top, hit)),
    h('div', { class: 'enc-lbl', style: `--cc:${ENC_HEX[enc.cap]}` }, h('i', { class: 'enc-dot' }), enc.label),
    h('div', { class: 'enc-hint' }, '\u25c0 turn \u25b6')
  ], 'w-enc');
}

// A turned part (a handle) built from short cylinders along +x. profile = [[length, radius, colour, optional class], ...]
function lathe(profile, n = 16) {
  const e = h('div', { class: 'lathe' });
  let x = 0;
  profile.forEach(([len, r, col, cls]) => {
    const t = tube(r, n, 0);
    t.style.cssText += `;position:absolute;left:${x}px;top:${-r}px;width:${len + .6}px;--c:${col}`;
    if (cls) t.classList.add(cls);
    e.append(t); x += len;
  });
  const rEnd = profile[profile.length - 1][1];
  e.append(h('i', { class: 'jb-hcap', style: `left:${x - rEnd}px;top:${-rEnd}px;width:${2 * rEnd}px;height:${2 * rEnd}px;transform:rotateY(90deg)` }));
  return e;
}

// ---- double-throw knife switch, modern. Thrown up (blades in the top contacts, handle above the base) = ON.
//      Thrown a full half turn down (blades in the bottom contacts, handle below the base) = OFF.
//      Drag the handle up or down, or just click it. ----
function junctionEl(bomb) {
  const lv = bomb.lever;
  const BL = 100;                                            // blade length from the centre hinge
  const at = (x, y, w, hgt, extra = '') => `left:${x}px;top:${y}px;width:${w}px;height:${hgt}px;${extra}`;
  const block = (cls, x, y, w, hgt, depth, z = 0, full = false) =>
    h('div', { class: 'jb-metal ' + cls, style: at(x, y, w, hgt, z ? `transform:translateZ(${z}px)` : '') }, cuboid(depth, '', 'fill', full));
  const screw = (x, y, r = 8) => h('i', { class: 'jb-sc', style: at(x, y, r, r) });
  const terminal = (x, y, w, hgt) => [block('', x, y, w, hgt, 7), screw(x + (w - 8) / 2, y + 5), screw(x + (w - 8) / 2, y + hgt - 13)];
  const contact = (cx, y0) => [                              // a silver jaw with a spring lip either side of the blade
    block('jb-steel', cx - 14, y0, 28, 36, 7),
    h('i', { class: 'jb-slot', style: at(cx - 6, y0 + 6, 12, 24) }),
    block('jb-steel', cx - 10.5, y0 + 3, 4, 30, 16), block('jb-steel', cx + 6.5, y0 + 3, 4, 30, 16)];
  const handle = h('div', { class: 'jb-handle' }, lathe([
    [8, 5.5, '#aab8c0'], [5, 9.6, '#ffb224'], [34, 8.4, '#17191c', 'rib'], [5, 9, '#b9c6ce']]));
  const frame = h('div', { class: 'jb-frame' },
    block('jb-steel', 43, -BL, 10, BL, 6, -3, true), block('jb-steel', 99, -BL, 10, BL, 6, -3, true),
    block('jb-poly jb-cross', 36, -BL - 12, 80, 16, 8, -4, true),
    handle);
  const onLamp = led('#4dffb0', lv.up, 'lg'), offLamp = led('#ff3b5c', !lv.up, 'lg');
  const hit = h('div', { class: 'jb-hit', role: 'button', tabindex: '0' });
  const e = cuboid(9, [
    h('b', { class: 'jb-leg on' }, 'ON'), h('b', { class: 'jb-leg off' }, 'OFF'),
    h('div', { class: 'jb-lamp on' }, onLamp), h('div', { class: 'jb-lamp off' }, offLamp),
    [[6, 40], [6, 226], [124, 40], [124, 226]].map(([x, y]) => terminal(x, y, 22, 34)),
    [[28, 49], [28, 235], [118, 49], [118, 235]].map(([x, y]) => block('jb-steel', x, y, 6, 16, 3)),
    contact(48, 38), contact(104, 38), contact(48, 226), contact(104, 226),
    block('jb-poly', 28, 134, 96, 32, 10),
    h('div', { class: 'jb-rod', style: at(38, 142, 76, 16) }, tube(8, 14, 13)),
    screw(32, 142), screw(112, 142),
    [[10, 10], [134, 10], [10, 282], [134, 282]].map(([x, y]) => screw(x, y, 8)).slice(2),
    frame, hit], 'w-jb ' + (lv.up ? 'up' : 'dn'));
  const sync = () => {
    e.classList.toggle('up', lv.up); e.classList.toggle('dn', !lv.up);
    onLamp.classList.toggle('off', !lv.up); offLamp.classList.toggle('off', lv.up);
    hit.setAttribute('aria-label', `knife switch, ${lv.up ? 'thrown up, on' : 'thrown down, off'}`);
  };
  const set = up => { if (lv.up === up) return; lv.up = up; sfx.lever(); sync(); };
  let press = null;                                           // drag up for ON, down for OFF; a plain click throws it
  hit.addEventListener('pointerdown', e2 => { e2.preventDefault(); try { hit.setPointerCapture(e2.pointerId); } catch (_) {} press = { y: e2.clientY, moved: false }; });
  hit.addEventListener('pointermove', e2 => {
    if (!press || press.moved) return;
    const dy = e2.clientY - press.y;
    if (Math.abs(dy) > 14) { press.moved = true; set(dy < 0); }
  });
  hit.addEventListener('pointerup', () => { if (press && !press.moved) set(!lv.up); press = null; });
  hit.addEventListener('pointercancel', () => { press = null; });
  hit.addEventListener('keydown', e2 => { if (e2.key === 'Enter' || e2.key === ' ') { e2.preventDefault(); set(!lv.up); } });
  sync();
  return e;
}

// Plain name plates for the bottom: they carry no information.
function nameplateEl(variant) {
  const t = variant ? ['RATING', '24 V DC   3 A', 'DO NOT OPEN LIVE'] : ['MODEL ZH-07', 'CONTAINMENT UNIT', 'REV B'];
  return cuboid(2, [h('b', {}, t[0]), h('span', {}, t[1]), h('span', {}, t[2])], 'w-np');
}

// Modules all sit on the front. Decide which bays hold them and where each hint widget sits.
// Left, right and top take any component. The bottom only ever takes plates (the serial plate and plain name plates).
function planCase(r, bomb, L, count) {
  const bays = r.shuffle(Array.from({ length: L.cols * L.rows }, (_, i) => ({ i }))).slice(0, count);
  const range = n => Array.from({ length: n }, (_, i) => i);
  const free = { left: range(L.wr), right: range(L.wr), top: range(L.wc), bottom: range(L.wc) };
  const SIDES = ['left', 'right', 'top'];
  const widgets = [];
  const take = (faces, span = 1) => {                       // claim `span` neighbouring free cells on one of `faces`
    const cand = [];
    faces.forEach(f => free[f].forEach(i => { if (range(span).every(k => free[f].includes(i + k))) cand.push({ face: f, i, span }); }));
    if (!cand.length) return null;
    const at = r.pick(cand);
    range(span).forEach(k => free[at.face].splice(free[at.face].indexOf(at.i + k), 1));
    return at;
  };
  const place = (w, faces, span = 1) => {
    w.at = take(faces, span) || take(SIDES, span) || take(['bottom'], span);
    if (w.at) widgets.push(w);
  };
  if (bomb.lever) place({ kind: 'lever' }, ['left', 'right'], 2);        // tall: takes two cells of a side panel
  const b = bomb.batteries;
  const holders = b === 0 ? [] : b === 1 ? [1] : b === 2 ? (r() < .5 ? [2] : [1, 1]) : b === 3 ? [2, 1] : [2, 2];
  holders.forEach(n => place({ kind: 'batt', n }, SIDES));
  bomb.indicators.forEach(ind => place({ kind: 'ind', ind }, SIDES));
  bomb.coins.forEach(cell => place({ kind: 'coin', cell }, SIDES));
  bomb.encoders.forEach(enc => place({ kind: 'enc', enc }, SIDES));
  place({ kind: 'serial' }, r() < .6 ? ['bottom'] : [...SIDES, 'bottom']);
  for (let k = 0, n = r.int(3); k < n; k++) {                              // plain plates on the bottom, if there is room
    const at = take(['bottom']);
    if (at) widgets.push({ kind: 'plate', variant: k, at });
  }
  return { bays, widgets };
}

function widgetEl(w, bomb) {
  if (w.kind === 'serial') {
    return cuboid(3, [h('small', {}, 'serial no.'), h('b', {}, bomb.serial), html('div', { class: 'bc' }, barcode(bomb.serial))], 'w-serial');
  }
  if (w.kind === 'batt') {
    const single = w.n === 1;   // one big D cell, or a pair of AA cells
    const e = cuboid(5, Array.from({ length: w.n }, () => single ? batteryCell(112, 22) : batteryCell(112, 16)), 'w-batt');
    e.style.width = '162px';
    e.setAttribute('aria-label', `battery holder with ${w.n} ${w.n === 1 ? 'cell' : 'cells'}`);
    return e;
  }
  if (w.kind === 'coin') return coinHolder(w.cell);
  if (w.kind === 'lever') return junctionEl(bomb);
  if (w.kind === 'enc') return encoderEl(w.enc);
  if (w.kind === 'plate') return nameplateEl(w.variant);
  const i = w.ind;
  const e = cuboid(6, [html('i', { class: 'lens' }, '<i></i><i></i><i></i><i></i><i></i><i></i>'), h('b', {}, i.label)], 'w-ind' + (i.lit ? ' lit' : ''));
  e.setAttribute('aria-label', `indicator ${i.label}, ${i.lit ? 'lit' : 'unlit'}`);
  return e;
}

const blankBay = () => h('div', { class: 'blank' }, h('i'), h('i'), h('i'), h('i'));

// A module is a slab with a header; `rear` plates are the steel back of the same module.
function plateCard(def, rear, title = def.title) {

  const el = h('article', { class: 'mod' + (rear ? ' rear' : '') },
    h('i', { class: 'm-slab a' }), h('i', { class: 'm-slab b' }), h('div', { class: 'm-plate' }),
    h('div', { class: 'mod-3d' },
      h('header', {}, h('span', { class: 'hexico' }), h('h3', {}, title), status, html('span', { class: 'led' }, '<i></i><i></i><i></i><i></i><i></i>')),

const moduleCard = def => plateCard(def, false);

const LOCK = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 4 L41 14 V34 L24 44 L7 34 V14 Z" opacity=".5"/><rect x="16" y="22" width="16" height="12" rx="2"/><path d="M19 22 V18 a5 5 0 0 1 10 0 V22"/></svg>';
// The preview shows each module's name scrambled so it doesn't give the bomb away.
function scrambled(t) {
  let seed = 7;
  for (const ch of t) seed = (seed * 31 + ch.charCodeAt(0)) | 0;
  const r = rng(seed);
  let a = [...t];
  for (let i = 0; i < 12; i++) { a = r.shuffle(a); if (a.join('') !== t) break; }
  const out = a.join('');
  return out.charAt(0).toUpperCase() + out.slice(1).toLowerCase();
}
function sealedCard(def, rear) {
  const c = plateCard(def, rear, scrambled(def.title));
  c.body.append(html('div', { class: 'sealed' }, LOCK + '<span>sealed</span>'));
  return c.el;
}

function assembleCase(bomb, L, plan, fillBay, fillRear) {
  const bomb3d = h('div', {
    class: 'bomb3d',
    style: `--W:${L.W}px;--H:${L.H}px;--D:${L.D}px;--P:${L.P}px;--TB:${L.TB}px;--SW:${L.SW}px;--SH:${L.SH}px;--cols:${L.cols};--rows:${L.rows};--wr:${L.wr};--wc:${L.wc}`
  });
  const faces = {};
  ['front', 'back', 'left', 'right', 'top', 'bottom'].forEach(n => {
    faces[n] = h('div', { class: 'face f-' + n, role: 'group', 'aria-label': n + ' side of the bomb' });
    bomb3d.append(faces[n]);
  });
  // Seen from behind, left and right swap: a rear plate sits mirrored behind its module.
  const mirror = i => Math.floor(i / L.cols) * L.cols + (L.cols - 1 - i % L.cols);
  const front = {}, back = {};
  plan.bays.forEach((p, k) => {
    front[p.i] = fillBay(k);
    const rear = fillRear && fillRear(k);
    if (rear) back[mirror(p.i)] = rear;
  });
  const bays = map => {
    const g = h('div', { class: 'bays' });
    for (let i = 0; i < L.cols * L.rows; i++) g.append(h('div', { class: 'bay' }, map[i] || blankBay()));
    return g;
  };

  const live = h('span', { class: 'live' }), ghost = h('span', { class: 'ghost' });
  const clock = h('div', { class: 'clock' }, ghost, live);
  const bar = h('div', { class: 'bar' }, h('i'));
  const pips = [0, 1, 2].map(() => h('div', { class: 'strike' }, cuboid(5, '\u00d7', 'fill')));
  const diff = bomb.difficulty || 'medium';
  const diffPlate = h('div', { class: 'diff-plate diff-' + diff, 'aria-label': diff + ' difficulty' }, led({ easy: '#4dffb0', medium: '#ffb224', hard: '#ff3b5c' }[diff], true, 'lg'), h('b', {}, diff.toUpperCase()));
  faces.front.append(h('div', { class: 'fi' },
    h('div', { class: 'band' }, h('div', { class: 'screen' }, clock, bar), h('div', { class: 'strikecol', 'aria-label': 'Strikes' }, pips), diffPlate),
    bays(front)));

  faces.back.append(h('div', { class: 'fi' },
    h('div', { class: 'band service' },
      html('div', {}, logoMark(64, { burn: .25 })),
      h('div', { class: 'svc-txt' }, h('b', {}, 'Service hatch'), h('span', {}, 'Rear plates sit behind their modules, mirrored.')),
      h('div', { class: 'hazard' })),
    bays(back)));

  const side = (face, n, dir) => {
    const g = h('div', { class: 'side ' + dir });
    const covered = new Set();                                   // cells swallowed by a tall widget (the lever)
    plan.widgets.filter(x => x.at.face === face && x.at.span > 1).forEach(x => { for (let k = 1; k < x.at.span; k++) covered.add(x.at.i + k); });
    for (let i = 0; i < n; i++) {
      if (covered.has(i)) continue;
      const w = plan.widgets.find(x => x.at.face === face && x.at.i === i);
      const cell = h('div', { class: 'cell' + (w ? '' : ' empty d' + ((i + face.length) % 3)) }, w ? widgetEl(w, bomb) : null);
      if (w && w.at.span > 1) cell.style.gridRow = `span ${w.at.span}`;
      g.append(cell);
    }
    return g;
  };
  faces.left.append(side('left', L.wr, 'v'));
  faces.right.append(side('right', L.wr, 'v'));
  faces.top.append(side('top', L.wc, 'hz'));
  faces.bottom.append(side('bottom', L.wc, 'hz'));

  return { bomb3d, faces, refs: { live, ghost, clock, bar, pips } };
}

/* ---------------------------------------------------------------------
   Rotation rig: drag (with momentum), arrow keys, wheel zoom,
   animated jumps to a face, and per-face lighting that follows the view.
   --------------------------------------------------------------------- */
function createRig(stage, bomb3d, faces, L, init = {}) {
  const ac = new AbortController(), sig = { signal: ac.signal };
  const st = { yaw: init.yaw ?? -16, pitch: init.pitch ?? -10, zoom: init.zoom ?? 1 };   // what is on screen now
  const goal = { ...st };                                                                  // where the view is heading
  const HOME = { yaw: -16, pitch: -10, zoom: 1 };
  const FACE_N = { front: [0, 0, 1], back: [0, 0, -1], right: [1, 0, 0], left: [-1, 0, 0], top: [0, -1, 0], bottom: [0, 1, 0] };
  const VIEWS = { front: [0, 0, 1], back: [180, 0, 1], left: [90, 0, .74], right: [-90, 0, .74], top: [0, -80, .95], bottom: [0, 80, .95] };   // yaw, pitch, zoom (side faces sit closer to the camera)
  const LIGHT = (() => { const v = [-.35, -.55, .75], m = Math.hypot(...v); return v.map(x => x / m); })();
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const FOLLOW = 20, DECAY = 3.4;          // follow speed and momentum decay, both per second
  const narrow = L.cols === 2;
  let api = null, fitScale = 1, facing = '', raf = 0, last = 0, anim = null, drag = null, lastInput = 0;
  // init.spin: a slow turn in degrees per second while nobody touches the case (start screen); off for reduced motion
  const spin = init.spin && !matchMedia('(prefers-reduced-motion: reduce)').matches ? init.spin : 0;
  const idle = now => spin && !drag && now - lastInput > 2500;
  const pend = { x: 0, y: 0 }, vel = { yaw: 0, pitch: 0 }, lastDim = {};
  stage.classList.toggle('narrow', narrow);

  function shade() {
    const ya = st.yaw * Math.PI / 180, pa = st.pitch * Math.PI / 180;
    const cy = Math.cos(ya), sy = Math.sin(ya), cp = Math.cos(pa), sp = Math.sin(pa);
    let best = '', bz = -9;
    for (const name in FACE_N) {
      const n = FACE_N[name];
      const x = n[0] * cy + n[2] * sy, z = -n[0] * sy + n[2] * cy;
      const y2 = n[1] * cp - z * sp, z2 = n[1] * sp + z * cp;
      const b = Math.max(0, x * LIGHT[0] + y2 * LIGHT[1] + z2 * LIGHT[2]);
      const dim = (1 - Math.min(1, .38 + .8 * b)) * .8;
      if (Math.abs(dim - (lastDim[name] ?? -1)) > .004) { lastDim[name] = dim; faces[name].style.setProperty('--dim', dim.toFixed(3)); }   // only touch the DOM when it changed
      if (z2 > bz) { bz = z2; best = name; }
    }
    if (best !== facing) { facing = best; api && api.onFacing && api.onFacing(best); }
  }
  function apply() {
    const s = (fitScale * st.zoom).toFixed(4);
    bomb3d.style.transform = `scale3d(${s},${s},${s}) rotateX(${st.pitch.toFixed(2)}deg) rotateY(${st.yaw.toFixed(2)}deg)`;
    shade();
  }
  function fit() {
    const w = stage.clientWidth, hgt = stage.clientHeight;
    if (!w) return;
    if (narrow) {
      fitScale = Math.min(1.1, (w - 16) / (L.W + L.D * .45));
      stage.style.flex = 'none';
      stage.style.height = Math.round((L.H + L.D * .3) * fitScale + 116) + 'px';
    } else {
      fitScale = Math.max(.2, Math.min(1.25, (w - 24) / (L.W + L.D * .45), (hgt - 136) / (L.H + L.D * .3)));
    }
    apply();
  }

  /* One render loop, locked to the display refresh (requestAnimationFrame). Input only records
     what the user did; the view moves once per frame, using the frame's own timestamp, so speed
     doesn't depend on the mouse polling rate or the frame rate. It sleeps when nothing moves. */
  const wake = () => { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } };
  function tick(now) {
    raf = 0;
    const dt = last ? Math.min((now - last) / 1000, .05) : 1 / 60;
    last = now;
    let busy = false;
    if (anim) {                                              // an animated jump (face buttons, intro, victory spin)
      const p = clamp((now - anim.t0) / anim.ms, 0, 1), e = ease(p);
      for (const k in anim.to) st[k] = anim.from[k] + (anim.to[k] - anim.from[k]) * e;
      Object.assign(goal, st);
      if (p >= 1) { anim = null; busy = !!spin; } else busy = true;
    } else {
      if (drag && (pend.x || pend.y)) {                      // all pointer movement since the last frame, applied at once
        const dyaw = pend.x * .32 * settings.sens, dpitch = -pend.y * .32 * settings.sens;
        pend.x = pend.y = 0;
        goal.yaw += dyaw; goal.pitch = clamp(goal.pitch + dpitch, -90, 90);
        api && api.onTurn && api.onTurn(goal.yaw, goal.pitch);
        const a = 1 - Math.exp(-dt * 25);                    // smoothed velocity in degrees per second
        vel.yaw += (dyaw / dt - vel.yaw) * a; vel.pitch += (dpitch / dt - vel.pitch) * a;
      } else if (drag) {                                     // held still: a pause before letting go shouldn't fling it
        const f = Math.exp(-dt * 12); vel.yaw *= f; vel.pitch *= f;
      } else if (Math.abs(vel.yaw) > 2 || Math.abs(vel.pitch) > 2) {   // momentum after letting go
        goal.yaw += vel.yaw * dt; goal.pitch = clamp(goal.pitch + vel.pitch * dt, -90, 90);
        api && api.onTurn && api.onTurn(goal.yaw, goal.pitch);
        const f = Math.exp(-dt * DECAY); vel.yaw *= f; vel.pitch *= f;
      } else {
        vel.yaw = vel.pitch = 0;
        if (idle(now)) goal.yaw += spin * dt;
      }
      const k = 1 - Math.exp(-dt * FOLLOW);                  // ease the picture toward the goal
      st.yaw += (goal.yaw - st.yaw) * k; st.pitch += (goal.pitch - st.pitch) * k; st.zoom += (goal.zoom - st.zoom) * k;
      busy = !!spin || !!drag || !!vel.yaw || !!vel.pitch || Math.abs(goal.yaw - st.yaw) > .01 || Math.abs(goal.pitch - st.pitch) > .01 || Math.abs(goal.zoom - st.zoom) > .0005;
      if (!busy) Object.assign(st, goal);
    }
    apply();
    if (busy) raf = requestAnimationFrame(tick);
  }
  function animateTo(t, ms = 700) {
    Object.assign(goal, st); vel.yaw = vel.pitch = 0;
    const from = { yaw: st.yaw, pitch: st.pitch, zoom: st.zoom };
    anim = { from, to: { ...from, ...t }, t0: performance.now(), ms };
    wake();
  }
  const settleHere = () => { anim = null; Object.assign(goal, st); vel.yaw = vel.pitch = 0; };   // take over from whatever was moving

  stage.addEventListener('pointerdown', e => {
    lastInput = performance.now();
    if (e.button > 0 || e.target.closest('button,[role=button],.nodrag,input,a')) return;
    settleHere();
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
    pend.x = pend.y = 0;
    stage.classList.add('drag');
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    wake();
  }, sig);
  stage.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    pend.x += e.clientX - drag.x; pend.y += e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    wake();
  }, sig);
  const end = e => {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    drag = null; stage.classList.remove('drag');
    if (!settings.momentum || Math.hypot(vel.yaw, vel.pitch) < 8) vel.yaw = vel.pitch = 0;
    wake();
  };
  stage.addEventListener('pointerup', end, sig);
  stage.addEventListener('pointercancel', end, sig);
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    if (anim) settleHere();
    goal.zoom = clamp(goal.zoom * Math.exp(-e.deltaY * .0012), .6, 2.2);
    lastInput = performance.now();
    wake();
    api && api.onZoom && api.onZoom(goal.zoom);
  }, { passive: false, signal: ac.signal });

  const ro = new ResizeObserver(fit);
  ro.observe(stage);
  fit();

  api = {
    st, onFacing: init.onFacing || null, onTurn: null, onZoom: null,
    zoomTo(z) { anim = null; goal.zoom = z; wake(); },     // follow another view's zoom (module explorer link)
    turnTo(yaw, pitch) {                                   // follow another view (module viewer link)
      anim = null; vel.yaw = vel.pitch = 0;
      goal.yaw = yaw + 360 * Math.round((st.yaw - yaw) / 360); goal.pitch = pitch;
      wake();
    },
    refresh() { facing = ''; shade(); },
    animateTo,
    goTo(face) {
      const [yb, pb, zb] = VIEWS[face];
      animateTo({ yaw: yb + 360 * Math.round((st.yaw - yb) / 360), pitch: pb, zoom: zb }, 750);
    },
    home() { animateTo({ yaw: HOME.yaw + 360 * Math.round((st.yaw - HOME.yaw) / 360), pitch: HOME.pitch, zoom: 1 }, 750); },
    nudge(dyaw, dpitch) { const b = anim ? anim.to : goal; animateTo({ yaw: b.yaw + dyaw, pitch: clamp(b.pitch + dpitch, -90, 90), zoom: b.zoom }, 200); },
    zoomBy(d) { const b = anim ? anim.to : goal; animateTo({ yaw: b.yaw, pitch: b.pitch, zoom: clamp(b.zoom + d, .6, 2.2) }, 200); },
    getView: () => ({ yaw: st.yaw, pitch: st.pitch, zoom: st.zoom }),
    blast() { bomb3d.classList.add('blast'); animateTo({ zoom: st.zoom * 1.6 }, 520); },
    destroy() { ac.abort(); cancelAnimationFrame(raf); raf = 0; ro.disconnect(); }
  };
  return api;
}

/* ---- schematics for the Bomb basics appendix ----

function schematic(w, hgt, label, body, caption) {
  return `<figure class="schem"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${hgt}" width="${w}" height="${hgt}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" font-family="Chakra Petch, sans-serif" font-size="11" role="img" aria-label="${label}">${body}</svg><figcaption>${caption}</figcaption></figure>`;
}
const sT = (x, y, t, o = '') => `<text x="${x}" y="${y}" fill="currentColor" stroke="none" ${o}>${t}</text>`;
const sMid = (x, y, t, o = '') => sT(x, y, t, 'text-anchor="middle" ' + o);
const SCH_MONO = 'font-family="Share Tech Mono, DejaVu Sans Mono, monospace"';

function schemKnife() {
  const sw = (x0, up) => {
    const jaws = y => `<rect x="${x0 + 22}" y="${y}" width="16" height="26" rx="1"/><rect x="${x0 + 62}" y="${y}" width="16" height="26" rx="1"/>`;
    const tip = up ? 66 : 234, bar = up ? 36 : 254, grip = up ? 4 : 264;
    const lamp = (cy, color, on) => `<circle cx="${x0 - 16}" cy="${cy}" r="7" ${on ? `fill="${color}" stroke="${color}"` : 'stroke-opacity=".5"'}/>`;
    return `<rect x="${x0}" y="50" width="100" height="200" rx="3"/>` + jaws(62) + jaws(212) +
      `<rect x="${x0 + 14}" y="140" width="72" height="20" rx="2"/>` +
      `<rect x="${x0 + 26}" y="${Math.min(tip, 150)}" width="8" height="${Math.abs(150 - tip)}" fill="currentColor" fill-opacity=".15"/>` +
      `<rect x="${x0 + 66}" y="${Math.min(tip, 150)}" width="8" height="${Math.abs(150 - tip)}" fill="currentColor" fill-opacity=".15"/>` +
      `<rect x="${x0 + 20}" y="${bar}" width="60" height="10" rx="2"/>` +
      `<rect x="${x0 + 44}" y="${grip}" width="12" height="32" rx="3" fill="currentColor"/><rect x="${x0 + 42}" y="${up ? 30 : 264}" width="16" height="6" fill="#ffb224" stroke="#ffb224"/>` +
      lamp(64, '#2fbf63', up) + sMid(x0 - 16, 88, 'ON', 'font-size="9"') + lamp(236, '#e5412d', !up) + sMid(x0 - 16, 222, 'OFF', 'font-size="9"') +

  };

}

function schemModule() {

    `<circle cx="${x + 192}" cy="38" r="5" fill="#ffb224" stroke="#e0951a"/>`;
  return schematic(520, 250, 'A module and its rear plate',

    `<path d="M170 110 L205 50" stroke-opacity=".7"/><circle cx="205" cy="50" r="1.8" fill="currentColor"/>` +
    card(290, true) + `<circle cx="302" cy="208" r="3"/><circle cx="488" cy="208" r="3"/>` +

    sMid(125, 242, 'FRONT: the module', 'font-size="11" font-weight="600"') + sMid(395, 242, 'BACK: its rear plate', 'font-size="11" font-weight="600"'),

function manualHTML() {
  return `<div class="manual">
    <div class="mh">${logoMark(46, { burn: .25 })}<h1>Defusal manual</h1></div>
    <p>The defuser describes what they see. You find the matching rule and say what to do. Don't look at the bomb.</p>
    <p>New to the bomb? Bomb basics, at the end, shows how the case is built and what its parts look like.</p>
    <div class="mact no-print"><button class="mbtn" data-act="pdf-open">Open PDF</button><button class="mbtn" data-act="pdf-download">Download PDF</button></div>
    <nav>${Modules.list.map(m => `<a href="#man-${m.id}">${m.title}</a>`).join('')}<a href="#man-basics">Bomb basics</a></nav>
    ${Modules.list.map(m => `<section id="man-${m.id}"><h2>${m.title}</h2>${m.manual()}${m.manualBack ? `<h3>${m.rearOptional ? 'Rear plate (not on every bomb)' : 'Rear plate'}</h3>${m.manualBack()}` : ''}</section>`).join('')}
    <section id="man-basics" class="appendix"><h2>Bomb basics</h2>
      <h3>The case</h3>
      ${schemCase()}
      <ul>
        <li><b>Rotate the case.</b> Modules sit on the front. Everything else is on the other sides, and the positions change on every bomb. The left, right and top panels can carry any component. The bottom only ever carries plates: the serial number plate, and sometimes plain name plates (model or rating) that mean nothing. If a rule needs a component, ask the defuser to turn the bomb and look.</li>
        <li><b>Rear plates.</b> Some modules have a steel rear plate on the back of the bomb, directly behind the module. Seen from behind, left and right swap: a module in the left column on the front has its plate in the right column on the back. Some rear plates repeat a clue from elsewhere on the bomb; others are part of the puzzle, and their module cannot be solved without them. A module without a rear plate has a blank panel behind it. Each module's section says what its plate shows.</li>
      </ul>
      <h3>Parts on the side panels</h3>
      ${schemParts()}
      <ul>
        <li><b>Serial number.</b> A white steel plate with a barcode. Rules refer to the last digit (odd or even) and to whether the serial contains a vowel: A, E, I, O or U.</li>
        <li><b>Batteries.</b> Count the individual cells in all battery holders (a single large D cell, or a pair of AA cells). There may be none at all. Coin cells are not batteries.</li>
        <li><b>Coin cells.</b> Flat silver discs in small black holders with a steel clip. The model is stamped on top: CR2032, CR2025 and CR2016 are 3 volt lithium cells (in that order they get thinner), and LR44 is a small, thick 1.5 volt alkaline cell. A bomb can have none, one or two.</li>
        <li><b>Indicators.</b> Small labeled plates with a lens. A lit indicator has a glowing lens and bright text. An unlit one is dark.</li>
      </ul>
      <h3>Rotary encoders</h3>
      ${schemEncoder()}
      <ul>
        <li><b>Rotary encoders.</b> Some bombs have up to three: a knurled aluminium knob on a dial numbered 0 to 9, with a letter (A, B, C) and a colored cap. The reading is the digit the red pointer line aims at, and the digits are printed around the knob. Click the right half of a knob to turn it one step clockwise (the reading goes up, 9 wraps to 0) or the left half to turn it back one step. The mouse wheel and right-click also turn it. Rules read the encoders as they are at the moment you act, so turning one changes the answer. "The encoders add up" means the sum of all readings, and a bomb without encoders adds up to 0. A bomb can carry encoders that no rule uses.</li>
      </ul>
      <h3>Knife switch</h3>
      ${schemKnife()}
      <ul>
        <li><b>Knife switch.</b> Some bombs have a double-throw knife switch on the left or right panel: a dark graphite base with two silver blades on a centre hinge, silver contacts and terminal blocks with socket-head screws at the top and the bottom, and a ribbed black handle with an orange collar. Thrown up, with the blades in the top contacts and the handle above the base, it is ON. Thrown a full half turn down, with the blades in the bottom contacts and the handle below the base, it is OFF. A green lamp at the top and a red lamp at the bottom show which. Drag the handle up or down, or click it to throw it. Only the Breaker module reads it; on any other bomb it is a decoy.</li>
      </ul>
      <h3>Modules and strikes</h3>
      ${schemModule()}
      <ul>
        <li><b>Modules.</b> Each module is independent. Defuse them all before the clock reaches zero. A module's status light turns green when it is safe.</li>
        <li><b>Needy modules.</b> Some modules are never defused. They sleep, then wake with a small countdown in their corner and need attention before it runs out, again and again. Their plate says <em>needy</em> instead of armed. The bomb is defused once every other module is safe.</li>
        <li><b>Strikes.</b> Every mistake is a strike, and each strike makes the clock run 25% faster. The third strike detonates the bomb.</li>
      </ul>
    </section>
  </div>`;
}

const app = $('#app');

/* ---- PDF of the manual ----
   The PDF is typeset from manualHTML(), the same source as the on-screen manual (see build-manual-pdf.mjs),
   and stored inside this file. It is only offered while it still matches the manual's fingerprint; if the
   manual has changed since it was built, a fresh one is printed straight from the live manual instead. */
function manualFingerprint() {
  const t = manualHTML();
  let x = 2166136261;
  for (let i = 0; i < t.length; i++) { x ^= t.charCodeAt(i); x = Math.imul(x, 16777619); }
  return (x >>> 0).toString(16);
}
let pdfUrl = null;
function manualPdfUrl() {
  if (pdfUrl) return pdfUrl;
  if (!pdfNode || !pdfNode.textContent.trim() || pdfNode.dataset.hash !== manualFingerprint()) return null;   // missing, or out of date
  const bin = atob(pdfNode.textContent.trim()), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return pdfUrl = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
}
function manualAction(act, win = window) {
  if (act !== 'pdf-open' && act !== 'pdf-download') return;
  const url = manualPdfUrl();
  if (!url) { popOut(true); return; }                         // no matching PDF: print a fresh one (choose "Save as PDF")
  if (act === 'pdf-open') win.open(url, '_blank');
  else { const a = win.document.createElement('a'); a.href = url; a.download = 'zero-hour-manual.pdf'; win.document.body.append(a); a.click(); a.remove(); }
}
const manualClick = e => { const b = e.target.closest && e.target.closest('[data-act]'); if (b) manualAction(b.dataset.act, e.view || window); };

function buildDrawer() {
  const pop = h('button', { onclick: () => popOut() }, 'Pop out');
  const close = h('button', { onclick: () => drawer.classList.remove('open') }, 'Close');
  const body = h('div'); body.innerHTML = manualHTML();
  drawer.replaceChildren(h('div', { class: 'dhead' }, h('b', {}, 'MANUAL'), pop, close), body);
  drawer.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#man-"]');
    if (!a) return;
    e.preventDefault();
    const t = drawer.querySelector(a.getAttribute('href'));
    if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  drawer.addEventListener('click', manualClick);
  document.body.append(drawer);
}
function popOut(print = false) {
  const w = window.open('', 'zero-hour-manual', 'width=640,height=880');
  if (!w) { alert('The browser blocked the pop-up. Use the side panel, or open this page again with ?manual on the end of the address.'); return; }
  w.document.write('<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manual</title>' +

    '<style>' + $('#css').textContent + '</style><body class="manual-page">' + manualHTML());
  w.document.close();

function seg(options, value, onPick) {
  const wrap = h('div', { class: 'seg-ctl', role: 'group' });
  options.forEach(([val, label]) => {
    const b = h('button', { type: 'button', 'aria-pressed': String(val === value) }, label);
    b.addEventListener('click', () => {
      [...wrap.children].forEach(c => c.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true'); onPick(val);
    });
    wrap.append(b);
  });
  return wrap;
}

/* ---- sound switches (top bar and settings stay in step) ---- */
function setSound(which, on) {

  else { settings.fxOn = on; sfx.setMuted(!on); }

/* ---- confirmation dialog (Escape, a click outside, or the first button all mean "no") ---- */
function confirmDialog({ title, text, yes = 'OK', no = 'Cancel', danger = false }) {
  return new Promise(resolve => {
    const done = v => { confirmDialog.close = null; wrap.remove(); window.removeEventListener('keydown', onKey, true); resolve(v); };
    confirmDialog.close = () => done(false);                // lets the game close the dialog if it ends in the meantime
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); done(false); } };
    const noBtn = h('button', { class: 'tbtn', type: 'button', onclick: () => done(false) }, no);
    const yesBtn = h('button', { class: 'tbtn' + (danger ? ' danger' : ''), type: 'button', onclick: () => done(true) }, yes);
    const wrap = h('div', { class: 'settings confirm', role: 'alertdialog', 'aria-label': title, onclick: e => { if (e.target === wrap) done(false); } },
      h('div', { class: 'sp cf' }, h('div', { class: 'sp-head' }, h('b', {}, title.toUpperCase())), h('p', { class: 'cf-text' }, text), h('div', { class: 'cf-row' }, noBtn, yesBtn)));
    document.body.append(wrap);
    window.addEventListener('keydown', onKey, true);
    noBtn.focus();                                          // the safe choice has focus
  });
}
function askAbort() {
  if (!G || G.over) { showStart(); return; }
  confirmDialog({ title: 'Abort this game?', text: 'The bomb is abandoned. The clock keeps running while you decide. To play this bomb again, use the seed shown on the main screen under "Last bomb".', yes: 'Abort', no: 'Keep playing', danger: true })
    .then(ok => { if (ok && G) showStart(); });
}

/* ---- module viewer (debug): every module on its own, the front and the rear plate side by side, each one rotatable ---- */
// The module explorer: every module on its own, front and rear, with what it is and how to try it.
function openExplorer() {
  if ($('.bench')) return;
  sfx.init();
  const defs = sortModules(Modules.list);
  const base = layoutFor(1360), P = base.P, SW = base.SW, SH = base.SH;
  const SLAB = { W: SW + 2 * P + 10, H: SH + 2 * P + 10, D: 46, cols: 3, rows: 2 };
  let def = defs[0], seedNum = randomSeed(), rigs = [], cleanup = null;
  const cfg = d => settings.modules[d.id] || {};
  const setCfg = (d, patch) => {
    const c = { ...cfg(d), ...patch };
    if (!c.off) delete c.off;
    if (!c.rear || c.rear === 'always') delete c.rear;
    if (Object.keys(c).length) settings.modules[d.id] = c; else delete settings.modules[d.id];
    save(); paintBadges();
  };
  // At least one module that can be defused must stay on.
  const lastOn = d => !d.needy && !cfg(d).off && defs.filter(x => !x.needy && !cfg(x).off).length === 1;

  const badges = d => [
    h('span', { class: 'badge diff-' + d.difficulty }, d.difficulty),
    d.mountBack ? h('span', { class: 'badge rear' }, d.rearOptional ? 'rear optional' : 'rear') : null,
    d.needy ? h('span', { class: 'badge needy' }, 'needy') : null];
  const list = h('div', { class: 'bench-list' });
  const itemBtns = defs.map(d => {
    const b = h('button', { class: 'bench-item', type: 'button', 'aria-pressed': 'false' }, h('span', { class: 'ttl' }, d.title), h('span', { class: 'badges' }, badges(d)));
    b.classList.toggle('is-off', !!cfg(d).off);
    b.addEventListener('click', () => { def = d; load(); });
    list.append(b); return b;
  });
  function paintBadges() {
    itemBtns.forEach((b, i) => { b.querySelector('.badges').replaceChildren(...badges(defs[i]).filter(Boolean)); b.classList.toggle('is-off', !!cfg(defs[i]).off); });
    const title = side.querySelector('.bench-title .badges');
    if (title) title.replaceChildren(...badges(def).filter(Boolean));
  }
  function config(d) {
    const enabled = h('button', { class: 'tbtn cfg-enabled', type: 'button' });
    const paint = () => {
      enabled.textContent = cfg(d).off ? 'Off: bombs never have it' : 'On: bombs can have it';
      enabled.setAttribute('aria-pressed', String(!cfg(d).off));
      enabled.disabled = lastOn(d);
      enabled.title = enabled.disabled ? 'At least one module has to stay on' : '';
    };
    enabled.addEventListener('click', () => { setCfg(d, { off: !cfg(d).off }); paint(); });
    paint();
    const rows = [h('div', { class: 'bench-fact' }, h('span', {}, 'In bombs'), enabled)];
    if (d.rearOptional) {
      const rear = seg([['always', 'Always'], ['sometimes', 'Sometimes'], ['never', 'Never']], cfg(d).rear || 'always', v => setCfg(d, { rear: v }));
      rear.classList.add('cfg-rear');
      rows.push(h('div', { class: 'bench-fact' }, h('span', {}, 'Rear plate'), rear));
    }
    return h('section', { class: 'bench-box' }, h('h4', {}, 'Your bombs'), rows);
  }
  const stagesEl = h('div', { class: 'bench-stages' });
  const side = h('div', { class: 'bench-side' });
  const feedback = h('p', { class: 'bench-feedback', 'aria-live': 'polite' });
  const say = (msg, cls = '') => { feedback.textContent = msg; feedback.className = 'bench-feedback ' + cls; };

  const slab = card => {
    const bomb3d = h('div', { class: 'bomb3d', style: `--W:${SLAB.W}px;--H:${SLAB.H}px;--D:${SLAB.D}px;--P:${P}px` });
    const faces = {};
    ['front', 'back', 'left', 'right', 'top', 'bottom'].forEach(n => { faces[n] = h('div', { class: 'face f-' + n }); bomb3d.append(faces[n]); });
    faces.front.append(h('div', { class: 'fi' }, h('div', { class: 'bay', style: `width:${SW}px;height:${SH}px;margin:0 auto` }, card)));
    return { bomb3d, faces };
  };
  const stageFor = (caption, card) => {
    const s = slab(card);
    const stage = h('div', { class: 'stage bench-stage' }, h('div', { class: 'floor' }), h('div', { class: 'pool' }), s.bomb3d, h('span', { class: 'bench-cap' }, caption));
    return { stage, s };
  };

  // The parts of the practice bomb a module may ask about, in plain words. Encoders and the knife switch live on the
  // sides of a real bomb, so they get controls here.
  function practiceBomb(bomb) {
    const facts = [
      ['Serial number', bomb.serial],
      ['Batteries', String(bomb.batteries)],
      ['Coin cells', bomb.coins.length ? bomb.coins.map(c => c.model).join(', ') : 'none'],
      ['Indicators', bomb.indicators.length ? bomb.indicators.map(i => i.label + (i.lit ? ' (lit)' : '')).join(', ') : 'none']];
    const rows = facts.map(([k, v]) => h('div', { class: 'bench-fact' }, h('span', {}, k), h('b', {}, v)));
    if (bomb.encoders.length) rows.push(h('div', { class: 'bench-fact' }, h('span', {}, 'Encoders'), h('span', {}, bomb.encoders.map(e => {
      const out = h('b', {}, `${e.label} ${e.value}`);
      const step = d => () => { e.value = (e.value + d + 10) % 10; out.textContent = `${e.label} ${e.value}`; };
      return h('span', { class: 'bench-enc' }, h('button', { class: 'tbtn', type: 'button', 'aria-label': `Turn encoder ${e.label} down`, onclick: step(-1) }, '−'), out, h('button', { class: 'tbtn', type: 'button', 'aria-label': `Turn encoder ${e.label} up`, onclick: step(1) }, '+'));
    }))));
    if (bomb.lever) {
      const lb = h('button', { class: 'tbtn', type: 'button' });
      const paint = () => { lb.textContent = bomb.lever.up ? 'ON (thrown up)' : 'OFF (thrown down)'; };
      lb.addEventListener('click', () => { bomb.lever.up = !bomb.lever.up; paint(); });
      paint();
      rows.push(h('div', { class: 'bench-fact' }, h('span', {}, 'Knife switch'), lb));
    }
    return rows;
  }

  function load() {
    rigs.forEach(r => r.destroy()); rigs = []; cleanup && cleanup(); cleanup = null;
    itemBtns.forEach((b, i) => b.setAttribute('aria-pressed', String(defs[i] === def)));
    const r = rng(seedNum), bomb = makeBomb(r, 300000);
    ensureNeeds(bomb, [def], r);
    const state = def.create(bomb, r);
    const card = moduleCard(def), rear = def.mountBack ? rearCard(def) : null;
    let solved = false;
    const mark = (cls, on = true) => { [card.el, rear && rear.el].forEach(e => e && e.classList.toggle(cls, on)); };
    const ctl = {
      bomb, sfx, isSolved: () => solved, timeText: () => '04:12',
      timeScale: .25,                                         // needy modules wake sooner here, to try them
      solve() { if (solved) return; solved = true; mark('solved'); sfx.solve(); say('Defused. Well done.', 'ok'); },
      strike(why) { mark('err'); setTimeout(() => mark('err', false), 600); sfx.strike(); say('Strike: ' + why, 'bad'); }
    };
    const c1 = def.mount(card.body, state, ctl) || null;
    const c2 = rear ? (def.mountBack(rear.body, state, ctl) || null) : null;
    cleanup = () => { c1 && c1(); c2 && c2(); };
    const a = stageFor('FRONT', card.el);
    const b = stageFor(rear ? 'REAR PLATE (back of the bomb)' : 'REAR: this module has no rear plate', rear ? rear.el : blankBay());
    stagesEl.replaceChildren(a.stage, b.stage);
    rigs = [a, b].map(x => createRig(x.stage, x.s.bomb3d, x.s.faces, SLAB, { yaw: -18, pitch: -8, zoom: 1.25 }));
    rigs.forEach((r, i) => {                                // linked: turning or zooming one does the same to the other
      r.onTurn = (yaw, pitch) => { if (settings.benchLink) rigs[1 - i].turnTo(yaw, pitch); };
      r.onZoom = z => { if (settings.benchLink) rigs[1 - i].zoomTo(z); };

    const man = h('div', { class: 'manual' });
    man.innerHTML = def.manual() + (def.manualBack ? `<h3>${def.rearOptional ? 'Rear plate (not on every bomb)' : 'Rear plate'}</h3>` + def.manualBack() : '');
    side.replaceChildren(
      h('h3', { class: 'bench-title' }, def.title, h('span', { class: 'badges' }, badges(def))),
      h('p', { class: 'bench-desc' }, def.description),
      feedback,
      config(def),
      h('section', { class: 'bench-box' }, h('h4', {}, 'Practice bomb'), practiceBomb(bomb)),
      h('details', { class: 'bench-box', open: true }, h('summary', {}, 'Manual page'), man));
  }

  const view = (yaw, pitch) => () => rigs.forEach(r => r.animateTo({ yaw, pitch, zoom: 1.25 }, 600));
  const linkBtn = h('button', { class: 'tbtn', type: 'button', title: 'When on, turning or zooming the front does the same to the rear plate, and the other way round' });
  const paintLink = () => { linkBtn.textContent = 'Link views: ' + (settings.benchLink ? 'on' : 'off'); linkBtn.setAttribute('aria-pressed', String(settings.benchLink)); };
  linkBtn.addEventListener('click', () => {
    settings.benchLink = !settings.benchLink; save(); paintLink();
    if (settings.benchLink && rigs.length === 2) { const v = rigs[0].getView(); rigs[1].turnTo(v.yaw, v.pitch); rigs[1].zoomTo(v.zoom); }   // line the rear up with the front straight away
  });
  paintLink();
  const tools = h('div', { class: 'bench-tools' },
    linkBtn,
    h('button', { class: 'tbtn', type: 'button', onclick: view(0, 0) }, 'Flat'),
    h('button', { class: 'tbtn', type: 'button', onclick: view(-18, -8) }, 'Angled'),
    h('button', { class: 'tbtn', type: 'button', onclick: view(-62, -8) }, 'Side'),
    h('button', { class: 'tbtn', type: 'button', onclick: view(-18, -62) }, 'From above'),
    h('button', { class: 'tbtn', type: 'button', 'aria-label': 'Zoom out', onclick: () => rigs.forEach(r => r.zoomBy(-.15)) }, '−'),
    h('button', { class: 'tbtn', type: 'button', 'aria-label': 'Zoom in', onclick: () => rigs.forEach(r => r.zoomBy(.15)) }, '+'),
    h('span', { class: 'bench-sp' }),
    h('button', { class: 'tbtn', type: 'button', onclick: () => { seedNum = randomSeed(); load(); } }, 'Another one'));

  const close = () => { rigs.forEach(r => r.destroy()); cleanup && cleanup(); wrap.remove(); window.removeEventListener('keydown', onKey, true); };
  const onKey = e => { if (e.key === 'Escape' && !$('.confirm')) { e.stopPropagation(); close(); } };
  const wrap = h('div', { class: 'bench', role: 'dialog', 'aria-label': 'Modules' },
    h('div', { class: 'bench-head' }, h('b', {}, 'MODULES'), h('small', {}, 'Every module on its own. Drag a view to turn it, and try the controls.'), h('button', { class: 'tbtn', type: 'button', onclick: close }, 'Close')),
    h('div', { class: 'bench-body' }, list, h('div', { class: 'bench-main' }, tools, stagesEl), side));
  document.body.append(wrap);
  window.addEventListener('keydown', onKey, true);
  load();
}
